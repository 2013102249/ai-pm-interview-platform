n• 功能完成度高，用户觉得“一次用完”没有持续需求；\n\n• 用户忘了回来；\n\n• 没有个性化的提醒或更新。\n\n第四步：设计干预方案，可以结合AI能力。针对“用完即走”的问题，我会设计两个方向：\n\n1. 增加持续性价值：比如如果是图片工具，可以增加“每日灵感推送”或“历史作品回顾”，让用户有理由回来。\n\n2. AI个性化推荐：基于用户的使用行为，在用户离开后通过模板消息（在合规前提下）推送“为你推荐的新模板”或“你的作品还可以这样优化”。\n\n3. 优化核心体验：如果核心功能本身不好用，留存无从谈起，所以要先保证第一次使用体验。\n\n第五步：落地和验证。选择1-2个干预点，做灰度实验。核心指标是次日留存率和召回后的再次使用率。同时关注用户反馈，确保推送不引起反感。\n\n为什么这么做：\n\n工具类产品的留存核心是“让用户发现持续使用的理由”，而AI可以增强个性化推荐和自动化服务，提升用户粘性。但前提是先找到流失点，才能精准施策。","level":"高级","type":"方案设计","tags":["用户研究与体验","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 4 题"},{"id":"q216","src":"exp","srcName":"面经实战","no":216,"q":"之前你说你分析过XX产品，那你觉得它现在最大的短板是什么？如果让你接手，你会怎么改？","a":"我分析过“微信搜一搜” 这个产品。它的优势是背靠微信生态，拥有海量内容和用户关系链，但作为搜索产品，它有一个明显短板：结果呈现仍然偏传统，用户需要自己筛选信息，没有直接给出答案。\n\n短板具体表现：\n\n•用户搜“怎么办理护照”，搜一搜给出的是文章列表，而不是一个整合好的步骤指南。这导致用户需要点开多篇文章，体验碎片化。\n\n• 在问答类场景中，AI搜索产品（如元宝、Kimi）已经能做到“直接给答案+引用来源”，而搜一搜在智能化问答上还比较弱。\n\n如果让我接手，我会做以下改进：\n\n1. 在搜索结果顶部引入“AI摘要”模块。对于高频问答类query，调用大模型对搜索结果进行摘要，生成一份带引用来源的快速答案。用户不需要点开链接就能获得核心信息，同时保留“展开详细内容”的入口。\n\n2. 结合微信生态的特色数据。搜一搜的优势是能搜到公众号文章、视频号内容、小程序服务。我可以让AI不仅摘要网页，还能直接调用小程序服务。比如搜“附近美食”，直接展示一个小程序卡片，用户点击即可进入餐厅预定，形成“搜索-决策-服务” 的闭环。\n\n3. 设计可解释的答案呈现。AI埯西汉须标阳己田立酒 江用白能湖酒 同时 对王直风险颂城（加屋疗 牛律） 江罟低罟信府AI摘要必须标明引用来源，让用户能溯源。同时，对于高风险领域（如医疗、法律），设置低置信度时只展示链接，不生成摘要，避免误导。\n\n4. 灰度验证对留存的影响。先在高频query上灰度，看用户是否更愿意点击AI摘要，以及是否提升搜索使用时长和次日留存。如果数据正向，再逐步扩大范围。\n\n为什么这样改：因为搜索的本质是“获取信息或服务”，AI摘要能大幅提升效率，而微信生态的小程序连接能力能闭环服务。这既是技术升级，也是产品体验的进化。","level":"高级","type":"方案设计","tags":["市场与竞品分析","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 5 题"},{"id":"q217","src":"exp","srcName":"面经实战","no":217,"q":"如果你的方案被leader直接否定，而且没有给明确理由，你会怎么做？","a":"我会分四步处理：\n\n第一步：先接受，不情绪化。leader否定一个方案可能有多种原因，不一定是因为方案本身差，可能是资源、战略、风险等我不知道的背景。所以我会先说“好的，我理解”，然后请求一个明确的沟通时间。\n\n第二步：主动询问，但不纠缠。我会约leader简短沟通，比如：“您是否可以帮我理解一下，是方向不对，还是时机不合适？这样我下次可以更好地对齐。”如果leader不愿意说，我也不会硬逼，而是先停下来，自己重新审视。\n\n第三步：自己复盘，找可能的问题。我会从三个角度检查：\n\n• 我的方案是否真的解决了业务问题？\n\n• 我是否遗漏了成本、风险或合规？\n\n• 我是否有足够的数据支撑？如果发现问题，我会改进方案，等合适时机再提。\n\n第四步：找其他渠道验证。\n\n如果我认为方案仍有价值，我会找同事或之前信任的伙伴快速验证一下核心假设，用数据说话。如果数据支持，我会带着新证据再和leader沟通，但态度是“补充信息”，而不是“翻案”。\n\n核心原则：不因为一次否定就放弃，也不因为坚持而对抗。产品经理需要韧性，也需要尊重決策链条。我能做的是把功课做扎实，等待合适的窗口。","level":"中级","type":"观点判断","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 6 题"},{"id":"q218","src":"exp","srcName":"面经实战","no":218,"q":"你做过的产品相关的事里，有哪次结果是和你预期不一样的？你事后复盘过吗？","a":"有一次我负责一个内容产品的“分享红包”功能。我的预期是，通过红包激励用户分享，能带来大量新用户。我们设计了分享后双方都能获得现金红包的机制，我预测分享率会提升30%，拉新用户数翻倍。\n\n实际结果：分享率确实提升了，但新用户留存率极低，且带来了大量羊毛党，后续用户质量很差。拉新成本暴增，整体ROI为负。\n\n复盘：\n\n1. 我过度关注了分享率这个虚荣指标，没有把“有效分享带来的留存新用户”作为核心指标。\n\n2. 红包机制设计得太容易获利，没有门槛，导致激励被滥用。\n\n3. 没有提前做风险预判，没有设置防刷和用户质量监控。\n\n改进：后来我们调整方案，改为“分享后双方获得的是内容权益（如会员天数）而非现金，并且仅限新用户首单使用”，同时增加了设备指纹和风控策略。新用户留存率从8%提升到22%，LTV转正。\n\n这次复盘让我学到：设计增长机制时必须闭环思考，不能只看单一指标；要预设风险，提前做控制；同时要关注“有效增长”，而不是表面数据。这套思路在AI产品中同样适用，比如不能只看AI回答的点赞率，还要看用户是\n\n否真正解决了问题。","level":"中级","type":"经历描述","tags":["数据驱动与指标","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 7 题"},{"id":"q219","src":"exp","srcName":"面经实战","no":219,"q":"你怎么看待产品经理和运营、开发的关系？","a":"我认为产品经理是“翻译者”和“黏合剂”，不是“指挥者”。\n\n与运营的关系：运营更贴近用户和一线反馈，产品经理需要从运营那里获取真实需求和场景。同时，产品功能上线后，运营负责触达和反馈，产品要和运营一起看数据、做复盘。理想状态是，产品定义“做什么、为什么做”，运营定义“怎么让更多人用、怎么验证效果”。\n\n与开发的关系：开发是产品的实现者，产品经理要把需求讲清楚，并且尊重技术成本和风险。我习惯在写PRD前先和开发沟通技术可行性，避免方案无法落地。开发提出技术难点时，我会认真评估，必要时调整需求优先级。我的原则是：用逻辑和数据说服，而不是用职位压人。同时要保护开发的时间，把需求优先级排清楚。\n\n共同目标：我们是一个团队，最终要对用户价值和业务结果负责。产品经理的核心责任是“让正确的事情发生”，而不是争夺功劳。\n\n在AI产品中，这种协作更重要，因为算法团队拥有更强的技术话语权，产品经理必须用数据和场景说服他们，同时也要理解算法的不确定性和成本边界。","level":"中级","type":"观点判断","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 8 题"},{"id":"q220","src":"exp","srcName":"面经实战","no":220,"q":"为什么选择腾讯？你觉得腾讯的产品和其他大厂的产品，在逻辑上有什么不一样？","a":"我选择腾讯有两点：一是腾讯的产品文化非常注重用户体验和长期价值，这和我的产品观契合；二是腾讯在AI领域的布局，尤其是元宝、混元模型和微信生态的AI潜力，让我觉得这里有机会做出真正影响亿万用户的产品。\n\n腾讯和其他大厂的差异，我的理解是：\n\n•腾讯更重视“克制”和“用户体验”：微信很多功能迭代都很谨慎，先小范围验证，确保不打扰用户。而字节系更强调数据驱动和快速试错，产品迭代快，但有时会牺牲一些体验。\n\n• 腾讯的产品更依赖社交关系链：比如视频号、小程序，都是基于微信的社交网络生长出来的，而不是纯粹靠算法分发。这导致腾讯的产品往往有很强的网络效应，但冷启动可能更依赖社交推荐。\n\n•腾讯的AI产品更注重“融入场景”：比如元宝可以和微信生态打通，而不是独立做一个超级ApP。这和腾讯“连接一切”的逻辑一致。\n\n在AI产品中，我会更倾向于腾讯这种“把AI做成润物细无声的能力”的思路，让AI服务于现有场景，而不是为了AI而AI。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展","市场与竞品分析"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 9 题"},{"id":"q221","src":"exp","srcName":"面经实战","no":221,"q":"你未来想做什么方向的产品？为什么？","a":"我未来想做面向知识工作者的AI效率工具，比如AI搜索、AI文档助手、AI会议纪要等。原因有两点：\n\n第一，这个方向能最大化AI的语言理解优势，解决真实、高频的痛点。知识工作者每天要处理大量信息，AI能显著提效，用户价值明显。\n\n第二，这个方向能形成数据飞轮和产品壁垒。用户用得越多，产品越理解其偏好和场景，体验越好，留存越高。同时，这类产品有清晰的商业化路径，比如订阅制或企业付费。\n\n我目前已经在用Codex、WorkBuddy等工具搭建一些AI效率小工具，也做了竞品分析。我希望在腾讯这样的平台，结合微信生态，探索AI如何更好地帮助用户获取和处理信息。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 10 题"},{"id":"q222","src":"exp","srcName":"面经实战","no":222,"q":"你有哪些问题想向面试官了解？","a":"我想了解三个问题：\n\n1. 这个岗位目前团队的重心是偏向底层模型能力建设，还是上层应用产品化？日常工作中产品经理和算法的协作模式是怎样的？\n\n2. 团队对AI产品实习生/新人的培养路径是怎样的？会有机会独立负责一个模块吗？\n\n3. 目前产品在用户反馈中，最大的体验痛点是什么？团队希望新人优先解决什么问题？\n\n一面的两条总结性要求\n\n关于“对业务理解的深度要求更高，逻辑链必须完整闭环”：我在回答所有业务问题时，都刻意遵循了“定义问题一拆解一定位原因一设计方案一验证迭代”的闭环逻辑。比如在留存问题上，我没有直接说“加推送”，而是先拆漏斗、找流失点，再针对性设计干预，最后用数据验证。我相信这种思路能体现逻辑闭环。\n\n关于“抗压能力，面试官会一直挑战你的观点”：我理解面试官挑战是为了看我在压力下能否保持理性，而不是盲目坚持。我的应对方式是：不情绪化，先听完挑战，然后找对方逻辑中的合理点，再补充我的数据或逻辑；如果确实是我的漏洞，就大方承认并给出修正方向。刚才的几个问题中，比如被leader否定、结果与预期不一致，我都展示了这种“接受压力一冷静分析一给出方案”的态度。我相信在实际面试中也能保持这种状态。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经七","expTitle":"无 AI 应用，产品经理转 AI 产品经理","origin":"《面经七：无 AI 应用，产品经理转 AI 产品经理》截图 · 第 11 题"},{"id":"q223","src":"exp","srcName":"面经实战","no":223,"q":"请做一个简短的自我介绍","a":"面试官好，我叫XX，是XX大学计算机科学与技术专业的应届生。我的技术背景主要集中在大模型应用开发和数据分析方向，在校期间做过基于RAG的校园知识问答系统，也参与过一个小型AI编程工具的原型开发。\n\n我选择AI产品经理这个方向，是因为在项目实践中发现：技术方案能否成功，往往取决于对用户场景和业务约束的准确理解，而不仅仅是模型精度。我希望站在技术与用户之间，把AI能力转化成真正有用的产品功能。\n\n我的优势有三点：第一，能听懂算法和工程的语言，比如RAG、微调、推理成本这些概念我不陌生；\n\n第二，有产品落地的实操经验，从需求定义到原型验证都完整做过；第三，我持续关注腾讯元宝、混元模型等产品，对AI如何在真实场景中产生价值有自己的判断。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 1 题"},{"id":"q224","src":"exp","srcName":"面经实战","no":224,"q":"为什么选择投递腾讯技术背景的产品经理岗位？","a":"我选择腾讯技术背景的产品经理岗位，有三个核心原因。\n\n第一，腾讯的技术产品体系适合AI能力落地。腾讯拥有微信生态、腾讯云、游戏、内容等多条业务线，AI可以嵌入到不同的高频场景中。比如元宝和微信搜索的结合，CSIG在产业互联网中的AI解决方案，这些都需要既懂技术又懂产品的角色来推\n\n动。我希望在这样的平台上，把技术优势转化成规模化的用户价值。\n\n第二，技术背景的产品经理在AI时代更有“翻译”优势。AI产品的难点在于模型能力不确定、成本约束复杂，如果产品经理不懂技术，很容易提出无法落地的需求，或者被算法团队牵着走。我因为有技术背景，可以更准确地判断可行性、成本和风险，同时也能用产品语言和业务方沟通。这种双重能力在腾讯这样技术驱动型的公司尤其重要。\n\n第三，我个人对腾讯的产品文化有认同感。腾讯强润“_+以田白价估为优归” 这左AI时件后而重秘 闲为很多A立只为了怯勿败了百守休腾讯强调“一切以用户价值为依归”，这在AI时代反而更稀缺，因为很多AI产品为了炫技忽略了真实体验。我希望在重视用户价值的团队里，做既先进又有温度的AI产品。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 2 题"},{"id":"q225","src":"exp","srcName":"面经实战","no":225,"q":"你对腾讯CSIG/IEG/TEG的技术产品理念和“科技向善”的企业文化有什么了解？","a":"我了解一些，可能不够全面，但说说我的理解。\n\nCSIG（云与智慧产业事业群）：定位是产业互联网，把腾讯的技术能力（云、AI、安全、大数据）打包成行业解决方案，服务政务、金融、医疗、教育等B端客户。技术产品理念更强调“可靠、合规、可落地”，因为B端客户对稳定性和安全性的要求远高于C端。\n\nIEG（互动娱乐事业群）：负责游戏和电竞，技术产品理念偏向“体验创新和实时性”。比如AI在游戏NPC、内容生成、反作弊、玩家匹配等方面的应用，追求的是在极致体验下融合技术。IEG的技术产品往往需要平衡创新与工程稳定性。\n\nTEG（技术工程事业群）：是腾讯的技术中台，提供基础技术能力，比如大数据、AI平台、安全、网络等。技术产品理念是“服务内部、赋能业务”，更强调技术的复用性和效率，很多AI底层能力（如混元模型）就是从TEG孵化出来支撑全公司的。\n\n“科技向善”的理解：我认为“科技向善”不是一句口号，而是产品决策时的价值排序。尤其在AI产品中，它意味着：\n\n•面对幻觉、偏见、隐私问题时，优先选择对用户更安全的方案；\n\n• 在高风险场景（医疗、金融、未成年人）中，宁可降低效率也要保证合规和可解释；\n\n•在产品设计中主动嵌入“用户可控”和“透明性”，而不是把模型黑箱直接抛给用户。\n\n我理解，腾讯的“科技向善”要求技术产品经理不能只追求效率和增长，还要在每一个功能决策中考虑社会影响和长期信任。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展","AI 伦理与合规"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 3 题"},{"id":"q226","src":"exp","srcName":"面经实战","no":226,"q":"在校期间，你认为最有成就感的技术相关产品实践或项目经历是什么？","a":"我最有成就感的是我主导的“校园知识问答机器人”项目。它从一个课程作业开始，最后变成了一个在校内小范围使用的工具。\n\n背景：很多同学在选课、查学分、办证明等场景下，需要反复在教务处网站、学生手册、QQ群公告里找答案，信息分散且重复提问多。\n\n我的角色：作为项目负责人，我负责需求调研、技术方案设计、产品原型和上线推广。\n\n技术实现：我没有从头训练模型，而是采用了“RAG+通用大模型AP1”的方案。我把学生手册、教务处FAQ、学院公告等整理成结构化的知识库，用向量检索召回相关内容，再让大模型基于检索结果生成带引用来源的回答。为了控制成本，我做了简单的问题分类，高频常见问题直接走缓存或模板，复杂问题才调用大模型。\n\n产品化过程：我先用问卷和访谈收集了50多个高频问题，确保首批知识库覆盖大部分需求。然后做了一个极简的聊天界面，支持流式输出和引用跳转。上线前我在班级群做了小范围内测，根据反馈调整了回答的语气和引用格式。\n\n结果：\n\n这个工具在学院内测阶段有超过200人使用，日常问题解决率大约在80%左右，尤其是“学分怎么修”这类咨询，帮同学节省了大量时间。后来因为这个项目，我加入了学校的一个AI创新小组，开始系统学习AI产品方法论。\n\n成就感来源：不是因为技术多先进，而是我用一个很轻量的方案真实解决了一个高频痛点，而且整个过程中我需要同时考虑技术成本、用户体验和内容准确性。这让我第一次体会到技术产品经理的核心价值。","level":"中级","type":"经历描述","tags":["产品规划与需求","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 4 题"},{"id":"q227","src":"exp","srcName":"面经实战","no":227,"q":"你在技术与业务结合的场景中遇到过的最大挑战是什么？如何克服的？","a":"最大的挑战来自上述项目：技术团队和业务方对“可用”的定义不一致。\n\n具体表现：在校园问答项目初期，我和两位技术同学合作。他们关注的是“检索命中率”和“模型生成质量”，倾向于用更大的模型和更复杂的检索策略来提升技术指标。但当我拿着Demo给同学们试用时，反馈并不好：回答虽然准确，但延迟有时超过5秒，而且输出格式是整段文字，没有重点，用户找不到关键信息。\n\n矛盾点：技术团队认为已经达到可用标准，业务方（用户）觉得不好用，而我作为产品负责人被夹在中间。\n\n克服过程：\n\n1. 我把用户反馈拆解成可量化的体验指标：首字响应时间、完整回答时间、回答是否分点、是否有引用来源。让技术团队看到，除了准确率，体验指标同样重要。\n\n2. 共同定义“可用”的最低标准：我们拉齐了一个共识——首字响应小于1.5秒，完整回答小于4秒，常见问题命中缓存直接返回，不调用大模型。\n\n3. 技术上做了两个折中：一是用流式输出降低用户感知延迟；二是对高频问题做模板化，减少大模型调用。最终在保证准确率的前提下，体验大幅改善。\n\n复盘：\n\n我学到，技术与业务结合的最大挑战往往不是技术本身，而是评价标准的错位。作为产品经理，我必须把模糊的业务需求翻译成清晰的技术指标，同时把技术约束翻译成业务可接受的体验预期。这种“翻译”能力是我未来做AI产品最需要强化的。","level":"高级","type":"经历描述","tags":["技术架构与选型","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 5 题"},{"id":"q228","src":"exp","srcName":"面经实战","no":228,"q":"你如何平衡技术学习、产品策划与客户沟通的时间分配？","a":"我会用“目标导向+时间块管理”的方式，核心是确保每一块时间都有明确的产出物。\n\n技术学习（约占30%）：我设定每周固定的技术学习时间，比如周二、周四晚上各1.5小时，专注在大模型应用、AI产品趋势、技术方案解读上。为了避免漫无目的地刷新闻，我会带着具体问题去学习，比如“这周要评估RAG的检索优化方案，我就集中看相关的论文解读和实践案例”。学完后写一段百字笔记，沉淀到我的知识库里。这样技术学习不变成负担，而是服务当前项目。\n\n产品策划（约占40%）：产品策划需要整块的深度思考时间。我通常放在上午或周末，关闭消息提醒，集中写PRD、画原型、分析数据。我会用GTD方法把需求拆成小任务，避免被琐事打断。同时，我会把产品策划和技术学习联动，比如做竞品分析时，顺便体验竞品的AI功能并记录其技术实现线索。\n\n客户沟通（约占20%，但优先级最高）：客户沟通的优先级永远最高，因为错过关键需求会导致后续返工。我会把客户会议安排在下午或固定时段，会前准备好议题清单，会后立即输出会议纪要并同步干系人。如果客户临时加需求，我会评估优先级，必要时调整其他时间块。\n\n剩余10%是灵活缓冲：用于处理突发问题、复盘和团队同步。\n\n关键原则：我不追求“面面俱到”，而是用OKR思维把每周目标定清楚，然后反推每天的时间分配。比如这周目标是完成某功能的PRD，那我就会压缩技术学习时间，保证产品策划产出。这种动态调整让我在多重角色下保持稳定输出。","level":"中级","type":"方法流程","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 6 题"},{"id":"q229","src":"exp","srcName":"面经实战","no":229,"q":"你认为自己最大的技术型产品经理相关优点是什么？请结合实例说明？","a":"我认为最大的优点是“用技术语言沟通，用产品语言决策”。\n\n结合实例：在校园间答项目中，有一次算法同学提出要引入一个更大的模型，因为它的复杂问题回答质量更好。但我评估后认为，大部分用户问题其实集中在少数高频场景，引入大模型会让单次成本上升3倍，延迟增加1秒，而体验提升有限。\n\n我没有直接否定，而是拉取了用户提问的分布数据，发现80%的问题可以被50个高频模板覆盖。于是我提出：保留现有模型，针对高频问题做模板化，复杂问题再降级到大模型。这个方案让技术团队看到数据支撑，也让业务方认可成本控制。\n\n为什么这是优点：技术型产品经理最大的优势是能和算法、工程团队平等对话，理解他们的技术追求，但同时能用产品指标（成本、体验、用户价值）来做决策，而不是被技术指标绑架。这种能力在AI产品中尤其稀缺，因为很多技术团队会倾向于追求模型性能而忽视ROl。\n\n我的价值：我能成为那个“踩刹车”或“踩油门”的人，平衡技术理想和商业现实，最终让产品走得更远。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 7 题"},{"id":"q230","src":"exp","srcName":"面经实战","no":230,"q":"你觉得自己在技术产品能力上需要改进的地方是什么？正在如何提升？","a":"我觉得需要改进的主要是用户研究的深度和商业思维。\n\n用户研究深度不足：\n\n作为技术背景出身，我天然更关注“怎么做出来”，有时会忽略“用户为什么需要”。在校园问答项目中，我一开始就埋头研究RAG方案，没有做充分的用户分群，后来发现研究生和本科生的问题类型差异很大，如果早点做用户细分，可能知识库构建会更有针对性。\n\n提升方式：我在系统学习用户访谈、问卷设计、可用性测试等课程，并且在最近的AI产品分析中，强迫自己先做用户画像和场景拆解，再写技术方案。我也在尝试用“Jobs to be Done” 框架分析用户动机，而不只是功能清单。\n\n商业思维不足：我之前更多考虑功能和体验，对成本、定价、市场竞争的分析比较浅。比如做校园问答时，我没有想过如果规模化运营，API成本是多少，是否有付费意愿。\n\n提升方式：我在看《精益创业》和《商业模式新生代》，并且参与了一些AI创业社群的讨论，了解AI产品的成本结构和定价策略。我也开始关注腾讯云、OpenAl等公司的产品定价逻辑，思考不同类型的AI产品如何设计商业模式。\n\n总结：我知道自己的短板，所以没有把技术背景当成唯一优势，而是主动补足产品和商业维度，让自己更全面。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 8 题"},{"id":"q231","src":"exp","srcName":"面经实战","no":231,"q":"你如何定义“技术型产品的团队协作”？分享一次你与技术团队合作的经历？","a":"我认为技术型产品的团队协作，核心是“目标统一、语言互通、节奏匹配”。\n\n• 目标统一：技术和产品都要对齐用户价值和业务指标，而不是各自追求自己的KPl。\n\n• 语言互通：产品经理能用技术逻辑理解方案，技术团队能用产品逻辑理解需求。\n\n• 节奏匹配：在关键节点共同评审，避免信息滞后导致返工。\n\n分享一次经历：在校园问答项目中，我和两位开发同学合作。前期我写了一份比较完整的产品需求文档，但他们看了之后说“有些功能太理想化，现有接口不支持”。比如我设计了“相似问题自动合并”，但技术同学告诉我，这需要额外的聚类算法，工程复杂度高，短期内做不完。\n\n我的处理方式：我没有坚持原方案，而是把需求拆成PO和P1。PO只包含核心问答和引用功能，P1才是相似问题合并。我和技术同学一起评估每个功能的技术成本和用户价值，最终决定先上PO，同时把P1设计成可插拔模块，后续迭代再加。\n\n协作结果：技术团队觉得被尊重，愿意主动提出优化建议。后来他们在开发过程中发现了一个缓存优化点，主动和我说可以降低延迟。这种良性互动让项目推进得很顺利。\n\n我的理解：技术型产品协作中，产品经理不能只当“传话筒”，也不能不懂技术瞎指挥。要能听懂技术方案的边界，然后做出合理的优先级取舍，让团队在有限资源下达成最大价值。","level":"中级","type":"观点判断","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 9 题"},{"id":"q232","src":"exp","srcName":"面经实战","no":232,"q":"在与客户沟通技术产品需求时如果存在认知偏差，你会如何处理？","a":"我认为认知偏差是常态，处理的关键是“先对齐目标，再翻译语言，最后书面确认”。\n\n第一步：耐心倾听，找到偏差根源客户可能说“你们这个AI要能像人一样理解我们的业务”，但实际他想要的可能是“自动处理一些重复性的单据审核”。我会先追问具体场景：哪些单据？错误怎么处理？现在人工做需要多久？这样把模糊需求转成具体案例。\n\n第二步：用比喻和Demo对齐认知我会用客户熟悉的语言解释技术能力。比如客户不理解“RAG”，我就说：“就像你有一个很懂业务的助理，每次回答问题前先翻一遍你的手册，找到相关条款再回答，不会自己瞎编。但如果你问的问\n\n题手册里没有，他会告诉你‘我不确定’，而不是乱说。”同时，我会准备一个简单的Demo，让客户直接看到效果，比抽象描述更有说服力。\n\n第三步：设定明确边界和预期当客户期望超出技术能力时，我不会直接说“做不到”，而是说“这个需求我们可以分两期实现：第一期先做到自动提取关键信息，第二期再考虑自动生成报告。因为直接生成报告目前准确率不够稳定，风险比较大。”这样既承认需求价值，又管理了预期。\n\n第四步：书面记录，避免后续偏差每次沟通后，我会输出一份会议纪要，用通俗语言描述双方确认的需求范围、技术方案和验收标准，让客户签字确认。这样即使后续出现分歧，也有据可依。\n\n我的原则：认知偏差不可怕，可怕的是假装理解或强行推进。我会始终保持透明，用客户能理解的方式讲清楚技术的能力和局限，建立长期信任。尤其在AI这种高预期行业，管理预期本身就是产品经理的重要职责。","level":"中级","type":"方案设计","tags":["团队协作与沟通","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经八","expTitle":"有技术背景，投递 AI 产品经理岗位","origin":"《面经八：有技术背景，投递 AI 产品经理岗位》截图 · 第 10 题"},{"id":"q233","src":"exp","srcName":"面经实战","no":233,"q":"一分钟自我介绍","a":"面试官好，我叫XX，是XX大学XX专业应届生。我有两段实习经历，一段在某互联网公司做产品运营，另一段在AI应用团队做产品实习，参与了一个智能客服助手从0到1的落地。这两段经历让我形成了从用户需求到产品方案再到数据验证的完整闭环能力。\n\n我平时深度体验各种AI产品，比如元宝、Kimi、豆包，也会用Codex这类AI编程工具搭一些小Demo来验证想法。虽然我不懂底层算法，但我能理解AI的能力边界，也清楚怎么把AI技术转化成用户愿意用的功能。\n\n我的优势是：用户洞察比较敏锐，习惯用数据说话，同时动手能力强，能快速把想法做成原型。希望能在贵团队继续打磨产品能力，做出真正解决用户问题的产品。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 1 题"},{"id":"q234","src":"exp","srcName":"面经实战","no":234,"q":"从过往实习经历里挑一段最能体现产品能力的，围绕“产品能力”展开简短描述","a":"我选择在AI应用团队参与的“智能客服助手”项目。当时团队的目标是降低客服人工成本，同时提升用户问题解决率。我负责的是从需求调研到上线验证的完整产品环节。\n\n我首先和客服运营团队一起梳理了高频问题，发现其中60%以上是重复性、标准化的咨询，比如“怎么修改收货地址”“退款什么时候到账”。这些场景非常适合用AI来处理。于是我定义了产品的核心功能：自动识别用户意图，并基于知识库生成标准化回答，同时保留转人工入口。\n\n在方案设计上，我推动了一个“低置信度转人工”的兜底策略，确保AI回答不准时不会误导用户。上线后，我通过A/B测试发现，AI客服在标准化问题上的解决率达到78%，转人工率下降了15个百分点。这个项目让我完整实践了“发现需求一设计方案一推动落地一数据验证”的产品闭环。","level":"中级","type":"经历描述","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 2 题"},{"id":"q235","src":"exp","srcName":"面经实战","no":235,"q":"你刚才讲的是项目经历，你的“产品能力”具体体现在什么地方？或者你从这个项目里锻炼了哪些能力，有什么经验沉淀？","a":"我的产品能力主要体现在四个方面：\n\n第一，需求筛选和优先级判断。客服场景问题很多，但并不是所有问题都适合AI。我通过分析历史工单，把问题按频次、复杂度、用户情绪三个维度分类，最终只选频次高、复杂度低、情绪中性的问题交给AI。这让我学会了“做减法”，把资源集中在最有价值的场景。\n\n第二，跨团队沟通和方案折中。算法团队希望模型回答得越准越好，倾向于用更大的模型；但运营团队担心成本。我拉取了用户问题的长度分布，发现80%的问题都可以用规则或小模型解决。最后我们采用了“简单问题规则匹配，复杂问题大模型”的分流方案，既保效果又控成本。这让我明白，产品经理要能在技术理想和业务现实之间找到平衡。\n\n第三，数据驱动的选代意识。上线后我每天看“AI解决率”和“转人工率”，还专门设计了“用户点踩原因”的标签体系。通过分析bad case，我们发现“物流异常”类问题的解决率偏低，于是推动补充了物流知识库，两周后该类问题解决率提升了12个百分点。\n\n第四，风险兜底的敬畏心。我坚持所有AI回答都要展示引用来源，并且低置信度时宁可转人工也不硬答。这种“安全优先”的意识，在AI产品中非常重要。\n\n经验沉淀：我总结了一个“AI产品需求评估四象限”：高频且标准化一优先AI；高频但复杂一人机协作；低频但标准化一知识库查询；低频且复杂一人工处理。这个框架帮助我在面对新需求时快速判断。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 3 题"},{"id":"q236","src":"exp","srcName":"面经实战","no":236,"q":"在这个项目里面遇到最有挑战的事情是什么？你是怎么克服的？","a":"最有挑战的事情是“如何让客服团队信任AI，并愿意配合我们迭代”。\n\n刚开始，客服主管对AI很抵触，认为AI回答不够灵活，还可能引发用户投诉。我们第一次试运行，AI解决率只有55%，客服团队觉得“还不如自己答”。项目一度面临被叫停的风险。\n\n我的克服方式分三步：\n\n第一步，用数据说话。我没有直接辩解，而是拉出了AI处理的问题明细，发现大部分被投诉的案例集中在少数几类问题上，比如“退款到账时间”因为知识库更新不及时导致回答错误。我向客服团队承认问题，并承诺先解决这几类，而不是全面铺开。\n\n第二步，建立共同目标。我和客服主管坐下来，明确我们的目标不是“取代人工”，而是“帮人工过滤掉重复劳动”。我提出一个指标：AI处理标准化问题后，人工客服的平均响应时间要下降30%。这个目标让客服团队觉得我们是战友，不是对手。\n\n第三步，让客服参与产品选代。我邀请资深客服每周参与bad case评审，把他们的经验转化成知识库和规则。客服团队逐渐发现，他们教AI的过程，其实是在沉淀自己的方法论，反而提升了他们的专业价值。\n\n最终，AI解決率从55%提升到78%，客服团队也从抵触变成了主动提需求。这次经历让我深刻理解，AI产品的成功不仅靠技术，更要靠“人的协同”，产品经理必须做好变革管理。","level":"中级","type":"经历描述","tags":["产品规划与需求","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 4 题"},{"id":"q237","src":"exp","srcName":"面经实战","no":237,"q":"在使用微信时，有什么让你觉得用的不爽的点？假设你是微信的产品经理，你有什么样的优化思路？","a":"我最近觉得不爽的一个点是：微信的“收藏”功能越来越难用，尤其是收藏内容多了之后，找东西很费劲。\n\n比如我收藏了很多文章、链接、图片和聊天记录，但收藏夹只按时间排序，没有自动分类。有时想找半年前收藏的一篇行业分析，只能不断下滑，效率极低。而且收藏内容不支持全文搜索，只搜标题，经常找不到。\n\n如果我是微信产品经理，我的优化思路是：\n\n1. 引入AI自动分类和打标签。利用大模型对收藏内容进行语义理解，自动生成标签，比如“工作-行业报告”“生活-菜谱”“学习-课程笔记”。用户收藏时可以自动归类，也可以手动调整。\n\n2. 支持全文语义搜索。用户可以自然语言搜索，比如“帮我找一下上次收藏的关于新能源汽车的销量报告”，AI理解意图后在收藏夹里检索相关条目，甚至直接给出摘要和定位。\n\n3. 智能整理和去重。很多用户会重复收藏相似内容，AI可以检测到重复，并提示用户合并。对于已经失效的链接，可以提示“该内容可能已失效，是否尝试搜索原文”。\n\n4. 轻量级交互设计。微信一贯克制，所以我不会做复杂的文件夹体系，而是用“智能摘要+时间+标签”三种视图切换，保持简洁。\n\n这个优化思路既解决了用户痛点，又符合微信“润物细无声”的产品哲学，而且用到了AI能力，能体现AI产品经理的视角。","level":"高级","type":"方案设计","tags":["用户研究与体验","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 5 题"},{"id":"q238","src":"exp","srcName":"面经实战","no":238,"q":"用户反馈在开车等场景下，发起微信视频通话的流程太复杂（需解锁-开微信-找人-点加号-发起）。你分析一下需不需要解决这个问题？如果要解决，方案是什么？如果不解决，依据是什么？","a":"先分析需不需要解决。\n\n我会从三个维度判断：频率、风险、替代方案。\n\n•频率：开车时发起视频通话的用户占比有多少？我推测这个场景虽然存在，但绝对频率不高。因为开车时操作手机本身就危险，而且用户往往是在等红灯或停车时操作。相比日常聊天、刷朋友圈，发起视频通话的频次低。\n\n• 风险：如果在开车场景下优化，鼓励用户在驾驶中操作手机，反而可能增加安全风险。微信作为平台，不应该主动鼓励驾驶时使用手机。\n\n•替代方案：用户其实可以用“语音通话”替代视频，或者用Siri/语音助手发起，虽然体验不佳但基本可用。所以这个需求不是“没有解決方案”，而是“方案不够好”。\n\n我的结论是：这个需求有合理性，但不紧急，且存在安全伦理风险。\n\n如果解决，我的方案会是“语音发起+安全模式”：\n\n• 不专门为开车场景设计，而是优化“语音助手集成”。用户可以通过车载系统（如CarPlay）或耳机语音唤醒，说“微信视频呼叫张三”，系统自动发起视频或语音通话。\n\n• 但这种方案依赖系统级权限，实施成本高，且需要和手机厂商合作。短期来看，微信可能更倾向于优化“最近联系人快捷拨号”，减少步骤，而不是专门做驾驶模式。\n\n如果不解决，我的依据是：\n\n• 产品优先级上，微信有更多高频痛点和战略需求要解决；\n\n• 安全合规上，不鼓励驾驶中使用；\n\n• 用户价值上，该场景需求频次低，且已有可接受的替代方案。\n\n综合判断：该需求可以放入观察池，但短期内不应投入资源。产品经理必须有勇气拒绝需求，而不是用户提了就做。","level":"高级","type":"方案设计","tags":["用户研究与体验","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 6 题"},{"id":"q239","src":"exp","srcName":"面经实战","no":239,"q":"假设有两批用户提出需要“微信通话记录列表”（为了找漏接电话、查通话频次）。微信是不是要做一个通话记录列表？你收到这个命题后，怎么去调研论证这个需求的合理性和必要性？怎么判断这个需求重不重要？","a":"我的调研论证会分五步：\n\n第一步：明确需求来源和用户画像。这两批用户是谁？是普通用户、商务人士还是老年人？他们的具体场景是什么？比如商务用户可能经常漏接重要电话，需要查记录；普通用户可能只是偶尔想看看和某个人的通话频率。不同画像的需求强度差异很大。\n\n第二步：量化需求频次和强度。我会设计问卷或在用户反馈群中快速投票，问“你最近一个月有多少次想查通话记录但找不到？”如果大部分人回答“几乎没有”，说明需求强度弱。同时，我会看微信现有的“聊天记录”中是否已经保留了通话记录（微信的聊天列表里会显示“语音通话”或“视频通话”的记录）。如果已经有了，那用户可能没发现，说明是认知问题而非功能缺失。\n\n第三步：分析现有替代方案的可达性。微信的“聊天记录搜索”能否满足需求？用户可以搜索“通话”找到历史记录。如果替代方案够用，只是不够直观，那做一个独立列表的收益有限。\n\n第四步：评估对产品整体架构和隐私的影响。通话记录列表会涉及更敏感的隐私数据，用户可能担心泄露。而且微信一直强调聊天记录的私密性，做一个聚合列表可能带来新的隐私风险。需要权衡利弊。\n\n第五步：判断与微信战略目标的一致性。微信的核心目标是“连接”，通话记录列表对这个目标的贡献度低。相比起来，提升视频通话体验、优化群管理可能更重要。\n\n最终判断：我倾向于认为这个需求重要性中等偏低。除非数据证明大量用户有高频查询需求，否则不值得专门做一个独立列表。更好的方式可能是在聊天列表顶部增加一个“通话” 筛选标签，或者优化搜索体验，让用户更容易找到通话记录。\n\n产品经理的价值在于：不被用户表面的“要一个列表”带走，而是去挖掘背后的真实需求，并用更轻量、更符合产品定位的方式满足它。","level":"高级","type":"方案设计","tags":["数据驱动与指标","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 7 题"},{"id":"q240","src":"exp","srcName":"面经实战","no":240,"q":"你做过最疯狂的事情是什么？","a":"我做过最疯狂的事情是：为了测试一个AI产品的真实能力，我在一周内和不同AI助手对话了超过2000轮，并且把每一轮都手动记录、分类、打分。\n\n那段时间我迷上了AI产品，想知道它们到底有多“聪明”。于是我给自己定了个任务：每天下班后和三个不同的AI助手（元宝、Kimi、豆包）各聊至少100轮，覆盖闲聊、知识问答、逻辑推理、情感倾诉、角色扮演等不同场景。我用Excel记录每轮的问题、AI回答、我的评分和备注。\n\n一周后我积累了2000多条数据，发现了很多有趣的现象：比如某个AI在情感陪伴上表现出色，但在逻辑推理上经常偷换概念；另一个AI在知识问答上很准确，但一旦多轮对话就容易丢失上下文。我把这些发现整理成了一份《AI助手体验对比报告》，发在了自己的公众号上，意外获得了几千阅读，还被一些产品经理社群转发。\n\n这件事让我意识到：我对产品的好奇心和动手能力，是可以转化为有价值的洞察的。也让我更加坚定要做AI产品经理，因为只有深入了解用户和产品，才能做出真正好的设计。","level":"初级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 8 题"},{"id":"q241","src":"exp","srcName":"面经实战","no":241,"q":"你有什么问题要问我？","a":"我有三个问题想请教：\n\n1. 这个岗位的日常工作内容中，您最希望实习生能在前三个月独立承担或深度参与哪些具体任务？我想了解团队对实习生的期望，以便提前准备。\n\n2. 团队目前在AI产品落地中，遇到的最大挑战是来自技术层面、用户需求层面还是跨团队协作？这能帮助我理解团队当前的痛点，看看我的背景是否匹配。\n\n3. 您个人对AI产品经理这个角色，最看重哪种能力？是技术理解、用户洞察，还是数据驱动？我想了解团队文化，也帮助我判断自己未来需要重点提升的方向。","level":"初级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经九","expTitle":"有产品实习经历，无 AI 基础","origin":"《面经九：有产品实习经历，无 AI 基础》截图 · 第 9 题"},{"id":"q242","src":"exp","srcName":"面经实战","no":242,"q":"怎么能让 Agent 更懂你（我之前提到了 vibe coding和 Agent 的搭建）？","a":"让 Agent更懂用户，我认为核心不是技术上的复杂，而是产品设计上的持续对齐。我会从四个层面来思考：\n\n第一，给Agent更丰富的上下文。Agent不懂用户，往往是因为它没有足够的信息。比如我在做微信小程序 AI 助手时，发现如果只给Agent一段用户提问，它很容易答偏。后来我把用户的历史对话、当前所在页面、甚至用户选择的标签都作为上下文传给Agent，它就能理解“用户说的“这个’指的是什么”。所以产品经理要设计好“什么信息应该被记住，什么信息应该被遗忘”，并且保证隐私合规。\n\n第二，设计可学习的反馈闭环。让 Agent更懂你，不是一次性配置，而是像训练实习生一样，不断通过反馈来校准。我在项目中设计了“用户点踩后追问原因”的机制，并把点踩的样本自动回流到一个“负样本池”。每周我们会看这些bad case，把高频问题补充到知识库或调整Agent 的提示词。这样Agent会随着使用越来越懂用户\n\n第三，用自然语言设定 Agent 的“人设”和边界。我虽然不懂底层算法，但知道 Agent的行为很大程度上受系统提示词影响。比如我会写：“你是一个在微信内帮助用户查询校园信息的助手，回答要简短、友好，不确定时直接说‘我不确定’，不要编造。”这种“人设”就像给 Agent一个岗位说明书，它才能按你的期望工作。\n\n第四，给用户控制权，让用户自己“调教”Agent。\n\n懂用户的最好方式是让用户参与。产品上可以提供一个“偏好设置”，让用户选择Agent的回答风格（简洁/详细）、关注领域、甚至允许用户手动纠正 Agent的回答，并让 Agent记住这次纠正。这样Agent就从“通用”变成“个人专属”。\n\n结合 vibe coding的经验：我在用Codex、WorkBuddy 搭Agent 原型时，最大的感受就是，工具能快速生成框架，但“让 Agent 懂你”这件事，必须由产品经理定义清楚场景、上下文和反馈规则。工具只是加速了验证，不能替代产品思考。","level":"高级","type":"方案设计","tags":["技术架构与选型","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 1 题"},{"id":"q243","src":"exp","srcName":"面经实战","no":243,"q":"请说明生活中有哪些地方使用到了 AI？","a":"生活中 AI 已经很常见，我观察到的几个高频场景：\n\n第一，手机里的智能助手。比如Siri、小爱同学，我们用它设闹钟、查天气、播放音乐。这是最基础的语音交互 AI。\n\n第二，推荐系统。刷抖音、逛淘宝、看小红书，推荐的内容、商品都是AI根据我的行为实时计算的。这背后是机器学习在预测我们的兴趣。\n\n第三，拍照和图像处理。手机拍照的人像虚化、夜景优化，以及修图软件里的一键抠图、老照片修复，都用到了计算机视觉AI\n\n第四，导航和出行。高德、滴滴会根据实时路况规划路线，预测到达时间，甚至滴滴的派单逻辑也是 AI在优化。\n\n第五，内容生成。比如用AI写周报、生成PPT大纲、做会议纪要，或者用Midjourney 生成海报。这在工作中越来越常见。\n\n第六，智能客服。很多 App的在线客服已经是 AI在回复，解决一些标准化问题，比如查询订单、修改地址。\n\n第七，智能家居。家里的智能音箱、扫地机器人、智能门锁，都在用AI识别指令、规划路径。\n\n我的理解：AI 已经从 “新奇”变成“基础设施”，用户可能感知不到，但处处离不开。产品经理要做的就是找到那些〝用户觉得本来就应该这样”的场景，让AI润物细无声地提升体验。","level":"初级","type":"观点判断","tags":["行业趋势与职业发展","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 2 题"},{"id":"q244","src":"exp","srcName":"面经实战","no":244,"q":"请说明估算题（练得太少）？","a":"估算题是产品面试常见题型，我之前练得不多，但后来总结了一套方法。核心是：拆解、假设、验证合理区间，最后给结论。\n\n举例：估算某二线城市一天的外卖订单量。\n\n•第一步：明确口径。是美团+饿了么的总单量，还是单一平台？我假设是单一平台，比如美团。\n\n• 第二步：拆解。外卖订单量=城市常住人口 ×外卖用户渗透率 ×人均下单频率×平台市占率。\n\n• 第三步：填充假设。。城市常住人口：假设500万。\n\n•外卖用户渗透率：一二线城市约 60%，但二线城市可能50%，取50%，即250万潜在用户。。人均下单频率：高频用户每天1-2单，低频用户每周1-2单，平均下来约每周3单，每天约\n\n0.43单。。 平台市占率：假设美团60%，即250万 ×0.43 ×60%~64.5万单。\n\n• 第四步：交叉验证。一个500万人口城市，每天60-80万外卖订单量，平均每6-8人一单，符合常识。如果偏差大，再调整假设。\n\n我的心得：估算题不是考精确数字，而是考你的逻辑拆解能力和常识判断。只要把公式写清楚，假设说清楚，结果在合理范围，就算成功。我后来专门练习了十几个常见题型，比如抖音 DAU、某城市奶茶店数量、微信视频通话日活等，现在能比较稳地应对。","level":"高级","type":"方法流程","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 3 题"},{"id":"q245","src":"exp","srcName":"面经实战","no":245,"q":"请结合本篇经历，介绍你在微信产品岗位相关项目中承担的具体职责。","a":"在之前的一段实习中，我参与了一个基于微信生态的“校园 AI 问答助手”项目。这是一个内嵌在微信小程序里的AI助手，主要服务校园场景，比如查课表、问学分、找教室。\n\n我承担的具体职责包括：\n\n需求调研与场景定义：我访谈了 30多位同学，发现大家最频繁的问题集中在“教室在哪”“学分怎么算”“图书馆开放时间”这三类。我把这些场景整理成优先级列表，作为产品功能范围。\n\n产品原型与交互设计：因为团队资源有限，我用vibe coding 工具（主要是Codex 和 WorkBuddy）快速搭建了一个可交互的小程序原型，包含聊天界面、常用问题快捷按钮、转人工入口。这个原型后来直接用于用户测试，节省了大量开发时间。\n\nAgent 搭建与知识库维护：我通过一个低代码 Agent 平台配置了助手的逻辑：先判断意图，如果匹配到知识库的标准问题就直接回答，否则调用大模型生成并提示“仅供参考”。我还负责把学生手册、教务处公告整理成结构化知识库，并设置每周更新机制。\n\n测试与反馈闭环：我设计了“点踩原因”的标签体系，并把测试用户的反馈按周汇总。第一周测试后，我发现“教室查询”准确率只有 70%，原因是部分教学楼名称不统一。我推动补充了别名映射表，第二周准确率提升到90%。\n\n上线与指标监控：上线后我每周看三个核心指标：问题解决率（用户是否继续追问或转人工）、平均响应时长、用户满意度。根据数据，我调整了快捷按钮的排序，把高频问题前置，使用率提升了 15%。\n\n总结：在这个项目中，我不仅做了需求定义和原型，还实际参与了 Agent 的配置和知识库管理，这让我对 AI产品从技术到落地有了完整认知。","level":"中级","type":"经历描述","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 4 题"},{"id":"q246","src":"exp","srcName":"面经实战","no":246,"q":"你如何理解微信产品岗位的核心目标和用户价值？","a":"微信产品的核心目标，我理解是：在克制的产品哲学下，最大化“连接”的效率和质量。\n\n连接人：微信最基础的价值是让人和人沟通无障碍。所以微信的产品设计一切以不打扰、不泛滥为前提。比如消息不显示已读、群管理克制、好友上限等，都是在保护用户的社交压力。\n\n连接内容与服务：公众号、小程序、视频号、搜一搜，都是让用户更便捷地获取信息和服务。比如小程序的核心价值是“用完即走”，而不是把用户锁在微信里。这种克制反而让服务更高效。\n\n用户价值：微信的用户价值不是“功能多”，而是“可靠、简单、不被打扰”。用户在微信里能放心沟通、快速找到服务，同时不被无关信息轰炸。\n\n对AI产品岗位的启示：如果我在微信做AI产品，我会特别关注“AI如何不打扰用户”。比如AI助手不应该主动推送，而是用户需要时才出现；AI 回答要简短可信，不能为了炫技而长篇大论。核心是让 AI成为微信连接能力的一部分，而不是一个突兀的功能。","level":"中级","type":"观点判断","tags":["用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 5 题"},{"id":"q247","src":"exp","srcName":"面经实战","no":247,"q":"本篇提到的相关项目中，最主要的挑战是什么？你是如何处理的？","a":"最主要的挑战是：如何让AI 助手在校园场景下“可信”，因为学生一旦发现答案错误，就会对整个产品失去信任。\n\n具体表现：测试初期，AI助手在回答“某门课在哪个教室”时，出现过一次错误，把“教学楼A”说成“教学楼B”。结果那位同学上课迟到，在测试群里吐槽，导致群里其他用户都不敢再用。\n\n我的处理方式：\n\n第一步：立即修复并道歉。我们当天就修正了错误数据，并在小程序里弹了一条公告：“我们发现教室信息有误，已紧急修复。为给大家带来不便表示抱歉，我们正在增加信息校验机制。”这种透明沟通挽回了部分信任。\n\n第二步：建立 “低置信度拒答”机制。我和技术同学一起设计了一个简单的置信度判断：如果知识库中匹配到的答案来源不一致，或者多个来源冲突，AI 就不直接回答，而是回复：“我不确定，建议你查看教务处公告或联系辅导员。”这虽然降低了回答覆盖度，但大幅减少了错误。\n\n第三步：引入“来源引用”和“用户反馈”。每条回答下面都加上“信息来自教务处官网，更新于X月X日”。同时让用户可以一键“纠错”，纠错信息直接进入后台待处理队列。这样用户从“受害者”变成了“监督者”，参与感增强了信任。\n\n第四步：每周数据复盘。我建立了一个“错误率”指标，每周看错误数量和类型。如果某类问题错误率超过 5%，就暂停该类的AI回答，改为引导用户查看官方页面。\n\n结果：经过三周迭代，AI 助手的用户信任度明显回升，使用率不但没降，反而因为“诚实”的口碑吸引了更多同学尝试。\n\n复盘：AI产品最大的敌人不是“回答不了”，而是“回答错误但用户不知道”。宁可拒绝，不可误导，这是我在这个项目中刻进骨子里的原则。","level":"中级","type":"经历描述","tags":["产品规划与需求","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 6 题"},{"id":"q248","src":"exp","srcName":"面经实战","no":248,"q":"围绕微信的业务场景，你会使用哪些指标判断方案或运营动作是否有效？","a":"在微信业务场景中，我会根据方案类型选择不同的指标体系。\n\n如果是提升用户活跃或留存的方案：\n\n•核心指标：次日留存率、7日留存率、月活用户数、人均使用时长。\n\n• 过程指标：功能渗透率（使用新功能的用户占比）、使用频次、分享率（是否带动社交传播）。\n\n如果是优化功能体验的方案：\n\n• 核心指标：任务完成率（比如用户从发起到完成视频通话的比例）、操作时长（从进入到完成的时间）、用户满意度（CSAT）。\n\n• 过程指标：流失漏斗各步骤转化率、错误率、投诉率。\n\n如果是 AI 助手类产品：\n\n• 核心指标：问题解决率（用户不再追问或转人工）、准确率（通过用户反馈判断）、转人工率。\n\n• 辅助指标：首响时间、平均对话轮次、用户点踩率、主动纠错率。\n\n在校园问答项目中，我实际用的指标是：\n\n• 问题解决率：用户提问后2分钟内没有转人工，且没有继续追问的比例。\n\n• 点踩率：用户主动点“没用”的比例。\n\n• 快捷按钮使用率：用户通过快捷入口提问的比例，反映产品引导是否有效。\n\n• 人均使用次数：衡量用户粘性。\n\n指标使用原则：我会选一个北极星指标，比如“问题解决率”，再搭配2-3个过程指标。避免指标过多导致团队失去焦点。同时要区分“方案是否有效”和“是否划算”，比如AI方案可能提升了解决率，但成本过高，就需要引入成本效率指标。","level":"中级","type":"方法流程","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 7 题"},{"id":"q249","src":"exp","srcName":"面经实战","no":249,"q":"针对本篇涉及的业务问题，你当时还比较过哪些可选方案？","a":"在校园 AI 问答助手项目中，我比较过三个方案：\n\n方案一：纯规则引擎＋关键词匹配。这是最轻的方案，成本极低，响应快。但缺点是灵活性差，用户问法一变就答不上来。比如用户问“选修课怎么算学分”和“学分怎么修”可能就匹配不到。放弃原因：校园问题千奇百怪，规则维护成本高，且无法处理多轮追问。\n\n方案二：直接调用通用大模型 API，不做知识库。这是最简单的AI 方案，开发快。但缺点是通用模型不了解校园具体信息，容易产生幻觉。我们测试时，它回答“图书馆开放时间”就编了一个错误的时间。放弃原因：可信度太低，不适合校园这种需要准确信息的场景。\n\n方案三（最终选择）：RAG（检索增强生成）＋低置信度兜底。先建立本地知识库，检索到相关内容后再让大模型基于这些内容生成回答，并标注来源。如果检索置信度低，就拒答。选择原因：兼顾了灵活性和准确性。虽然开发成本高于前两个，但用户信任度是核心，必须保证答案可追溯。\n\n补充一个思考：我还考虑过做“纯人工客服+AI辅助建议”，即用户提问后由学长学姐回答，AI给出参考。但成本太高，且响应慢，不适合学生场景。最终选了 RAG 方案。\n\n我的体会：选择方案不是选技术最先进的，而是选“最能解决当前问题且成本可控”的。产品经理要能列出各方案的优缺点，用数据或小规模测试来辅助决策，而不是拍脑袋。","level":"中级","type":"对比分析","tags":["技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"","expNo":"面经十","expTitle":"有 AI 基础，求职 Agent 方向","origin":"《面经十：有 AI 基础，求职 Agent 方向》截图 · 第 8 题"},{"id":"q250","src":"pm","srcName":"大厂 PM 八股文","no":250,"q":"自我介绍？","a":"个人信息+工作经历（实习或在校经历）+岗位关联度（岗位倾向）＋结语个人信息里包含了，姓名，学历（如果学校比较nice，可以提一下学校名称），如果有HR在场，最好能带上在本地工作时间，和未来将在本地工作时间，来打消会辞职回老家的顾虑。工作经历（实习或在校经历），最好是离你比较近的这段工作经历里你觉得最好的那一面拿出来说说，这个时候也可以放个钩子，这个钩子的作用就是自我介绍后，诱导面试官跟着你的节奏走下去，展示你与应聘岗位的匹配度。比如说，我在XX公司负责XX产品期间，做了XXX，用户留存增长xX%，使用时长提升XX%，在此经历后，我研究出了自己的一套方法论，在XXX方面能够更快找到问题的解决方法。这个方法论和增长策略就是你的钩子，可以诱导面试官接下来询问更多细节，那就能让面试官跟着你的节奏来，让整个面试更顺畅。岗位关联度，首先问清楚应聘的岗位和岗位职责。你可以谈谈你对应聘岗位的认识了解，说明你选择该岗位和公司的强烈愿望，可以谈如果被录取，你将怎样尽职尽责地工作，且展示一下在工作经历中，有哪些工作或者经验是和应聘岗位关联度较高。结语，我的自我介绍完毕，希望与您有一个愉快的面试过程，请面试官提问。自我介绍的要点：\n\n1. 时间要把控好，基本上就是3~5分钟必须完结掉，一个好的谈话，应该是说少而听多。\n\n2. 可以在自我介绍的时候埋下钩子，比如你的方法论，你觉得好的产品或者功能等。但是千万别给自己埋坑，说的每一个字都需要经得起推敲，千万别被自己带到沟里。还没弄明白什么叫需求分析，就夸夸而谈，很可能被面试官一个问题问懵，那基本就告别了。也包括，离职原因等等，不必要就不要自己把原因什么的就说了。\n\n3. 自我介绍要有充分的信心，最好是在面试前，自己先练习几遍。非必要，在自我介绍时，不要谈自己的优点，因为有优点必有缺点，如果缺点环节没准备妥当，可能也是个坑。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"一、个人情况类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人情况"},{"id":"q251","src":"pm","srcName":"大厂 PM 八股文","no":251,"q":"为什么从xxx（主要是实习、工作）离职？","a":"先了解一下为啥要问这个，第一，是想了解你，通过你的离职原因可以了解你在哪个地方会比较反感，也是了解你下次离职是什么原因。第二，通过了解你的反感区域，去匹配本公司的点，如果本公司真的有这个点，那可能会拒掉（其实也是保护你避坑）。\n\n回答要点：\n\n1. 要正面回答，不要支支吾吾，更不要答非所问。刻意回避该问题，会让面试官觉得一定是比较难以启齿的问题，就会联想那些不好的，比如薪资太低想跳槽，不喜欢加班等等内容，往往会做出了不利于面试公司录用你的错误方法。\n\n2. 客观说法，不要抱怨。不要用抱怨的心态数落前公司的不足之处，多从自身出发，陈述原因。比如前公司的薪资低，想跳槽加薪，你可以说，对于自己的职业规划来说，想去一个更大的平台发展和学习等等；公司总加班，你可以说由于身体或者家庭原因不能接受频繁加班，与前公司的业务安排有冲突。\n\n3. 最好是能“承”前“启”后。在阐述离职原因时，可以降低甚至淡化前公司的消极因素，在表述前公司的时候，顺便夸一下当前公司的彩虹屁。比如“在前公司得到了什么赞誉，哪些业绩，但是公司上升空间有限，个人发展受限，正好看到贵公司在招聘，想来贵公司一展身手”。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"一、个人情况类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人情况"},{"id":"q252","src":"pm","srcName":"大厂 PM 八股文","no":252,"q":"为什么觉着自己适合做产品经理？","a":"先明确一下，这个问题适用于3年内的产品经理面试，就是初级以内的。超过3年，你可以直接回，我在这行3年了，业绩也不错，应该适合吧，然后把，上家公司的业绩再说一下。\n\n这道题是为了：\n\n1. 解应聘者，对产品经理岗位的理解（助理、实习生之类）；\n\n2. 了解应聘者对自己的认识，应聘者的能力优势；\n\n3. 应聘者的思维逻辑是否条理清楚。\n\n解题要点，先明确“适合”，后表现“兴趣”。\n\n1. 明确“适合”，就得先有对产品岗位的认知，只有知道这个岗位的职责能力，才会找到自身能力与其适合点。如果连认识都没有，就会牛头不对马嘴，基本瞬间就PASS掉。“适合”可以从这个模板来回答，产品岗位职责能力是XXXX，自身能力是XXXXXX，举例子XXXXX。\n\n【回答实例】：产品经理需要能准确抓住用户的痛点，设计产品去解决用户问题，实现价值，并在公司里也是个承上启下，前后沟通的桥梁，是重要有价值的角色，我在校学生会做活动时就实时发现了\n\n什么问题，并通过什么办法，通过与多少个部门进行沟通协调，解决了该问题，得到老师好评。\n\n2. 表现“兴趣”，可以通过平时生活对产品的兴趣和研究精神来回答。\n\n【回答实例】：平时脑子里会有很多的想法，个人也比较注重新体验，经常有一些新点子，也比较喜欢互联网，喜欢了解各种互联网产品，看他们解决了什么问题、定位是什么，为什么设计这样的产品功能。如果能自己做出一款改变一些人的产品，一定会很棒！工作中我也乐于思考，能承受一定压力，直面挑战，不断的提升和突破自己。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"一、个人情况类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人情况"},{"id":"q253","src":"pm","srcName":"大厂 PM 八股文","no":253,"q":"为什么想做AI产品经理？","a":"第一点是未来必定是AI的时代，ChatGPT开启了AI时代纪元，最近二三个月AI领域出现了爆发式的发展，还有海内外巨头公司都纷纷下场，未来一定会涌现出大量的AI使用场景需求，犹如当年的移动互联网，雷军说过，站在风口上，猪都能飞起来；第二点，长期主义的考虑，当下很多人都在讨论如何用ChatGPT变现，不断地学习各种AI工具，我前段时间也是疯狂沉迷使用各种AI产品，但时间一久，心里就纳闷：各种AI工具迭代太快了，压根学不过来，即使学来了，对我未来有什么帮助？真的变现赚钱吗？其实很多自媒体鼓吹AI，无非是为了割韭菜，就算ChatGPT生成视频脚本，剪映自动生成视频，然后上传到抖音上，最后就能涨大量的粉丝？醒醒吧，怎么可能？业余的怎么比得过专业的，而且专业的也不一定能挣到钱。所以我冷静下来，开始思考，我该如何真正利用好AI，如何把AI跟眼前的工作结合起来，如何抓住AI时代的红利；第三点，结合我的个人职业和夙愿，一直希望创造出用户最喜爱的产品，觉得贼有成就感，能在时代洪流里留下自己的一点痕迹，是一件很有意义的事情。结合这三点考虑，我决定转行AI产品经理，随着未来AI场景需求大量的涌现，AI产品经理岗位一定会迎来爆发性的需求，而且现在从事AI产品经理的人并不多，当需求侧远远大于供给侧，未来AI产品经理的溢价空间很大，俗称高薪人士。想明白后，我开始认认真真地从最基础的理论学起，抛弃浮躁的心态，做时间的长期主义者。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"一、个人情况类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人情况"},{"id":"q254","src":"pm","srcName":"大厂 PM 八股文","no":254,"q":"你做AI产品经理的优势？","a":"理解人工智能的基础知识和原理，包括机器学习、深度学习、自然语言处理等方面的概念和算法。需要掌握数据分析和数据挖掘的技能，能够有效地管理和利用大量数据来支持产品决策。需要具备产品设计和开发的经验，能够理解用户需求和体验设计原则，能够将AI技术应用到产品中，并在产品上实现良好的用户交互。需要了解相关的法律和道德问题，如隐私保护、公平性、透明度等，以确保产品符合合规标准并得到用户信任。需要具备优秀的沟通、协调和领导能力，能够与不同部门的团队进行合作，并管理和指导\n\nAI项目的开发和推广。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"一、个人情况类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人情况"},{"id":"q255","src":"pm","srcName":"大厂 PM 八股文","no":255,"q":"介绍一下你的某段实习、项目经历？","a":"这个问题的出发点，是为了挖掘求职者的从业经历中最有“分量”的经历，印象最深一般意味着与众不同，从项目的复杂度，应聘者的解决方法的角度，成果等方面最能察觉到一个人背后真正的能力。\n\n回答要点一，深入了解应聘岗位的职责，公司招人都是希望来了就能干活，所以尽量选择的项目是和该岗位比较契合的，所展现出来的能力也是该岗位所需要的。\n\n回答要点二，回答要有逻辑性和层次感。建议按“项目背景+自己所处环境+项目的挑战+解决方案+最后成果”的框架来解答。\n\n1. 通过项目背景和自己所处的环境，展示自己的该端经历的理解和思考。\n\n2. 通过表达项目的挑战和自己的解决方案，展示自己在这个经历中具备发现问题，解决问题的能力。\n\n3. 讲具体的解法和策略，只提炼大概，不展开细节，成果最好能量化指标。\n\n【回答实例】我在上一份工作中，参与过X个中大型的项目，其中让我印象比较深的项目是“XXXX项目”，当时基于整个行业XXXXX等背景，公司计划XXXX。项目启动前，我就主动申请加入该项目，希望负责这个项目的核心XXXX工作，因为这不仅能发挥我之前累积的项目经验相关，而且还能让我参与到XXX这个新的领域。当时面临比较大的挑战是如何XXXX，对此，我通过调研了XXXX得到了1.XX，2.XXX，3.XXXXX的用户需求，并对此进行了XXXX，优化迭代了XXXX，最终达到了项目预期，上线后用户量XXXX，日活跃人数\n\n回答要点三，尽量带上作品去，且回答时围绕作品来讲解，更容易让面试官信任。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"已有详解","chapter":"二、个人经历类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人经历"},{"id":"q256","src":"pm","srcName":"大厂 PM 八股文","no":256,"q":"你在实习/工作的过程中遇到过哪些困难？最大的困难是什么？怎么解决的？在这过程中你学到了什么？","a":"回答前先明确一下这个问题，不管是什么项目，总归是有一些大大小小的困难，所以不要回答没困难。没困难，只会让面试官觉得你在上份工作时，要么天天摸鱼，要么是项目组的边缘人物，未真正做过实事，基本上就是PASS掉。\n\n这个问题主要考察面试者：\n\n1. 在项目组中的角色和参与程度；\n\n2. 在面对问题的时候是怎么解决的，解决思路是什么？；\n\n3. 是否有对过去所做工作有总结和复盘。在产品岗会遇到的问题有但不限于包括，\n\n1.项目的时间压力；\n\n2. 人员协调沟通问题（包括团队对产品功能有分歧）；\n\n3. 资源不足问题；\n\n4. 产品功能上线反馈差；\n\n5. 产品优化后效果不明显或者倒退；等等。你可以自己对号入座，从项目上找出2~3个比较困难的点，进行整理。记住，一定要给出复盘结果，最好能有方法论产出。\n\n【回答实例】在XXXX项目中，我有遇到过比较大的困难，当时做XXX功能优化时，未遍历到所有场景，导致功能测试时有部分异常问题，经测试人员反馈后我做了XXX，又做了XXXX，和团队沟通XXXX，最后保证了功能的稳定上线，从这次事件后，我整理了产品规划中所有可能会碰到的规范性文档。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"已有详解","chapter":"二、个人经历类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人经历"},{"id":"q257","src":"pm","srcName":"大厂 PM 八股文","no":257,"q":"你觉得你实习/工作期间做的最好的项目是哪个？为什么？具体介绍一下？（项目内容）","a":"这个问题主要考察面试者\n\n1、怎么定义最好的项目，如何衡量的。\n\n2、面试者的执行力和项目推动力如何。\n\n3、面对问题，是怎么思考，怎么拆解的。建议这样的框架来回答：背景（包括项目背景和自己所在项目组角色）-目标-解决方案-项目结果（数据）。选择的项目一定是你参与度比较高的，从头跟到上线有产出的那种。这样你才能将来龙去脉说的清楚。项目背景和角色分工尽量阐述清楚，在说到解决方案时，这里有个小技巧可以判断自己讲述的是否清楚，那就看面试官听完后是否继续追问你已经讲述的内容，因为这个时候面试官需要对你所描述的项目的复杂度，给出的解决方案有个大概的判断。在陈述项目成果时，要用数据说话，比如xx指标，提升了多少，原因是什么等等。\n\n【回答实例】我认为我做的最好的项目/产品是xxX，原因有：项目达到并超出预期的数据目标，xxx指标提升多少；我自己在这个项目中得到了很大提升，沉淀了自己做产品规划、项目管理、标杆产品打造的方法论，并推广应用到xxx项目中和分享给团队成员。这个项目的背景是xxx，目标是xxx，当时我作为产品主负责人亲自去到现场，完整体验xxx业务的全流程，拆解流程中遇到的各种问题，并针对问题提出解决方案，将解决方案与行业方案进行对标和优化，与XXXX相关方等达成一致，然后规划迭代版本，不断迭代，协同XXX相关方对产品进行落地推广，在推广使用过程中不断收集用户反馈和查看产品数据，在大家共同的努力下最终完成xxx目标。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"已有详解","chapter":"二、个人经历类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人经历"},{"id":"q258","src":"pm","srcName":"大厂 PM 八股文","no":258,"q":"你参与/负责的产品在市面上有哪些竞品？你们的竞争优势是什么？你更看好哪款产品？","a":"考察的是对面试者对产品的熟悉程度和对行业的熟悉程度，也可以从回答的结构来分析，入职后的竞品分析工作时的步骤是否有问题，产出的结果是否满足需求。步骤一，先选择一个自己比较满意，复杂度较高的产品。步骤二，阐述产品所在行业背景，行业用户画像，及产品所占市场份额或者产品所处阶段。步骤三，选择竞品，至少2个，因为面试官往往会多问，保守一点3个以上。步骤四，明确分析维度，建议从产品定位、竞品明确宣传的核心优势功能、整体的目标和路径规划、产品的定价策略、产品的销售方式和策略、营销、产品宣传渠道、产品背后的支撑体系、文档及培训支持、研发团队、实力、背景等等进行分析。步骤五，与你负责的产品做比较，突出产品差异化，和你在差异化上找出的核心觉争力。最好能带上数据结果。比如提升了市场占有率什么的。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"已有详解","chapter":"二、个人经历类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 个人经历"},{"id":"q259","src":"pm","srcName":"大厂 PM 八股文","no":259,"q":"AI产品经理和传统产品经理有什么区别？","a":"主要考察候选人除了对通用的产品能力技能之外，是否熟悉 AI产品的特媒技能和要求。\n\n第一：面试官您好，AI产品经理作为产品经理，核心职责和底层能力与传统产品经理是一致的，仍然是通过一定的产品方案满足用户的需求从而实现业务目标。\n\n但是它与普通的产品经理，主要存在以下两点不同：第一：实现产品目标的技术手段不同。传统产品经理对接的是研发工程师，需要通过研发工程师的代码，来完成产品的功能实现，那他们使用的就是研发技木。而AI产品经理对接的是算法工程师和研发工程师，需要对接算法工程师完成具体的模型，再对接研发工程师进行工程开发联调和上线。最终，我们得到的产品形态可能是一个API接口，没有所谓的页面。基于这种情况，AI产品经理除了要懂一些基本的研发技术之外，也需要深入学习算法知识，比如工作中常用到哪些算法，以及它们的实现逻辑等等。第二：AI 产品经理在与技术人员的协作上与传统产品经理有很大不同。传统产品经理和研发协作时候，只需要提供PRD文档，对需求进行讲解，有问题及时提供解答就可以了。但是 AI 产品经理很难产出一个 ROI（投资回报率）指标明确的PRD文档，以及我们和算法同学的沟通也不是一次需求宣讲就能完成的，通常我们需要进行多次的沟通确认，并且在沟通中逐渐清晰对于算法目标范围的设定。","level":"中级","type":"对比分析","tags":["产品规划与需求","行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"三、产品素质类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 产品素质"},{"id":"q260","src":"pm","srcName":"大厂 PM 八股文","no":260,"q":"AI产品经理的工作职责和能力要求是什么？","a":"主要考察候选人对于AI产品经理的工作流程和工作职责有一个全局的了解。如果一个求职者真的从0-1做过一款AI产品，那么这个问题一定不难，所以这个问题也有助于面试官判断求职者是都有简历造假包装简历的嫌疑。\n\n面试官您好，一个 AI产品上线的流程大致可以分为，需求定义、方案设计、算法预研、模型构建、模型评估、工程开发、测试上线等几个步骤。这其中，产品经理需要主导的节点有定义产品方向、设计产品方案、跟进产品开发和产品验收评估，AI产品经理的工作职责主要是在这四个步骤得到体现。\n\n1、产品经理对产品方向进行定义作为AI产品经理，首要的职责都是去定义一个AI产品。这包括，搞清楚这个行业的方向，这个行业通过AI技术可以解决的问题，这个 AI产品具体的应用场景，需要的成本和它能产生的价值。这就要求AI产品经理除了具备互联网产品经理的基础知识之外，还需要了解AI技术的边界，以及通过 AI技术能够解决的问题是什么。\n\n2、产品经理给出产品的设计方案完成了产品定义之后，产品经理需要给出产品的设计方案。产品的设计方案会根据产品形态不同而不同，比如硬件和软件结合的AI产品，会包括外观结构的设计，机器学习平台的产品需要包括大量的交互设计，模型类的产品（推荐系统、用户画像）更多的是对于模型上线的业务指标的要求。所以，对于AI产品经理来说，此阶段的能力要求为，基本的技术知识是必须要了解的。这些包括基本的统计学概率论知识，主流算法的基本原理和应用场景，以及这些算法可以帮助我们达成什么样的产品目标。\n\n3、产品经理跟进产品上线产品设计完成之后，就到了工程和算法同学分别进行开发的环节了。在这个过程中，作为AI产品需要承担一些项目经理的职责，去跟进项目的上线进度，协调项目资源。因此，这个阶段产品经理至少要知道模型的构建过程是怎么样的。另外，产品经理还需要知道模型构建过程中，每个节点的产出物，以及它的上下游关系。只有这样，产品经理才可以清楚评估项目进度，遇到需要协调资源的时候，也知道产品在这个阶段需要的是什么。\n\n4、产品评估产品开发完成之后，产品经理还需要验收产品是否满足业务需求。在这个阶段，产品经理的能力要求是，需要知道如何去评估一个模型，评估模型的指标都有哪些，具体评估的过程是怎么样的，以及评估结果在什么范围内是合理的。","level":"中级","type":"概念解释","tags":["产品规划与需求","行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"三、产品素质类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 产品素质"},{"id":"q261","src":"pm","srcName":"大厂 PM 八股文","no":261,"q":"AI目前在B端和C端有哪些落地场景？","a":"1.C端场景：通用的傻瓜式AIGC（妙鸭等）为C端用户以及兴趣爱好者使用，最终可能呈现：社区（小红书等）、社交（朋友圈等）以及自媒体短视频（抖音、快手等）\n\n2.B端场景：蚂蚁百灵大模型、月之暗面Kimi大模型、昆仑万维天工大模型、知乎知海图AI大模型、出门问问序列猴子大模型、面壁智能Luca大模型等大模型在近日通过备案，其中包括三个行业大模型，分别是办公行业的金山WPS大模型、教育行业的网易有道子日大模型和好未来MathGPT大模型。","level":"中级","type":"场景设计","tags":["产品规划与需求","行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"三、产品素质类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 产品素质"},{"id":"q262","src":"pm","srcName":"大厂 PM 八股文","no":262,"q":"什么样的AI产品算是成功的产品？","a":"一、功能性：一个成功的AI产品首先要具备强大的功能性。它应该能够解决用户的实际问题，并提供精准的答案或结果。比如，一个智能语音助手应该能够听懂用户的指令并作出相应的回应；\n\n注意兴趣\n\n一个智能推荐系统应该能够根据用户的个人喜好和行为数据提供个性化的推荐内容等。功能性是AI产品最基本也是最重要的特点之一。\n\n二、智能性：AI产品的核心在于智能，它应该能够模拟人类的思维和决策过程。智能性可以表现为产品的学习能力和适应能力。一个成功的AI产品应该能够不断学习用户的偏好，并根据用户的反馈不断优化和改进。通过不断的迭代和升级，AI产品能够逐渐变得更加智能，为用户提供更加贴心和个性化的服务。三、用户体验：一个成功的AI产品应该注重用户体验。它应该能够与用户进行自然而流畅的交流，并能够准确理解用户的需求。好的用户体验不仅体现在产品功能的完善，还包括界面的友好性和操作的简单性。一个优秀的AI产品应该能够通过简洁清晰的界面设计，使用户能够轻松上手并得到满意的使用体验。四、安全性：随着AI技术的广泛应用，数据安全和隐私保护越来越受到重视。一个成功的AI产品应该具备良好的安全性能，保证用户的个人信息不被泄露或滥用。同时，AI产品应该能够辨别和应对各种安全威胁，确保用户的使用过程安全可靠。综上所述，一个成功的AI产品需要具备功能性、智能性、用户体验和安全性等特点。通过不断的技术创新和用户需求的满足，AI产品能够在市场中脱颖而出，为用户带来更好的体验和便利。","level":"中级","type":"概念解释","tags":["产品规划与需求","行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"三、产品素质类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 产品素质"},{"id":"q263","src":"pm","srcName":"大厂 PM 八股文","no":263,"q":"机器学习和深度学习的关系","a":"深度学习是机器学习的一种，二者是包含关系，比如机器学习还包含强化学习等诸多其他算法。一般要谈机器学习与深度学习的区别，我们最好是将其视为深度学习与传统的机器学习方法的区别。下面引用花书的两张图，来说明这种包含关系。人工智能AI，一种是基于知识的，我们人类专家直接将规则写好，然后让AI运行这个规则的流程，例如一般单机游戏中的AI。另一种就是机器学习，我们不写出规则，而是让机器在数据中学习到这些规则。\n\n下图中阴影部分是表示每个算法中机器可以学习到的部分，我们从左到右依次进行讲解：（1）基于规则的系统，机器没有可以学习的，程序员写好程序交给机器去执行就行了。（2）经典的机器学习方法，人类设计好特征，然后将特征送给可学习的特征映射器（分类，回归等）。本篇文章重点讲经典的机器学习方法与深度学习的区别。（3）表示学习，对于浅层神经网络，我们只学到简单的特征。对于深层神经网络，开始我们学到简单特征，之后随着网络深度的增加，我们的网络将进一步整合之前的简单特征得到更加高级更加抽象的特征。最右边的这个就是深度学习。","level":"高级","type":"对比分析","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q264","src":"pm","srcName":"大厂 PM 八股文","no":264,"q":"机器学习和深度学习的区别","a":"以下将从三个方面来说明二者之间的区别。（1）算法流程之间的区别经典的机器学习方法：输入->人工抽取特征->决策树或逻辑回归等算法->结果。深度学习：输入->可学习网络->结果。\n\n我们可以看到，在深度学习中，并不会人工进行特征的选取，整个过程是一种端到端的学习方式。而在经典机器学习方法中，需要使用人工去精心设计特征，而这些特征第一耗费人力，第二不一定就能找到最适合的哪一个特征。早期用于图像分类的手工特征，例如图像均值，方差，Forstner算子、SUSAN算子和SIFT算子等。深度学习在算法上有两个优势：精度高，操作简单。（2） 速度上的区别因为深度学习的模型本身比较大，所以模型需要进行多轮的大量的数据训练，才可以收敛，因此在训练上，深度学习要比经典的机器学习方法要慢很多。但是，在推理阶段，深度学习的执行时间将大大缩短，尤其是在GPU的硬件加持下。（3）数据以及硬件的依赖深度学习比经典的机器学习方法的模型参数要多得多，因此常常深度学习需要训练的数据也是非常大的，比如imagenet这样大的数据集加速了深度学习的发展。另一方面，想要训练的快，就需要使用运算速度非常快的GPU，因为无论卷积还是transformer两者在网络结构上都是可以并行运算的，这正好符合GPU的特性。一般使用GPU可以加速几十倍的速度，相比于CPU。数据的增加和硬件的飞速发展也促使了近年来深度学习的关注量要远远超过经典的机器学习方法。","level":"高级","type":"对比分析","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q265","src":"pm","srcName":"大厂 PM 八股文","no":265,"q":"什么是K近邻算法","a":"K-近邻算法（K Nearest Neighbor）又叫KNN算法，指如果一个样本在特征空间中的k个最相似的样本中的大多数属于某一个类别，则该样本也属于这个类别。也就是对于新输入的实例，从数据集中找到于该实例最邻近的k个实例，那么这k个实例大多数属于某一个类，那么就把该实例放到该类中。KNN算法不仅可以用于分类，还可以用于回归。通过找出一个样本的k个最近邻居，将这些邻居的属性的平均值赋给该样本，就可以得到该样本的属性。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q266","src":"pm","srcName":"大厂 PM 八股文","no":266,"q":"什么是KNN 算法的实现原理","a":"存在一个样本数据集合，也称作为训练样本集，并且样本集中每个数据都存在标签，即我们知道样本集中每一个数据与所属分类的对应关系。输入没有标签的新数据后，将新的数据的每个特征与样本集中数据对应的特征进行比较，然后算法提取样本最相似数据（最近邻）的分类标签。一般来说，我们只选择样本数据集中前k个最相似的数据，这就是k-近邻算法中k的出处，通常k是不大于20的整数。最后，选择k个最相似数据中出现次数最多的分类，作为新数据的分类。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q267","src":"pm","srcName":"大厂 PM 八股文","no":267,"q":"KNN 算法的优缺点","a":"优点\n\n1.简单好用，容易理解，精度高，理论成熟，既可以用来做分类也可以用来做回归；\n\n2. 可用于数值型数据和离散型数据；\n\n3. 训练时间复杂度为O（n）；无数据输入假定；\n\n4. 对异常值不敏感缺点\n\n1.计算复杂性高；空间复杂性高；\n\n2. 样本不平衡问题（即有些类别的样本数量很多，而其它样本的数量很少）；\n\n3. 一般数值很大的时候不用这个，计算量太大。但是单个样本又不能太少，否则容易发生误分。\n\n4. 最大的缺点是无法给出数据的内在含义。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q268","src":"pm","srcName":"大厂 PM 八股文","no":268,"q":"什么是线性回归算法","a":"线性回归是利用数理统计中的回归分析，来确定两种或两种以上变量间相互依赖的定量关系的一种统计分析方法，运用十分广泛。线性回归模型是相对简单的回归模型，对一个或多个自变量之间的线性关系进行建模，可用最小二乘法求模型函数。\n\n回归分析中，只包括一个自变量和一个因变量，且二者的关系可用一条直线近似表示，这种回归分析称为一元线性回归分析。如果回归分析中包括两个或两个以上的自变量，且因变量和自变量之间是线性关系，则称为多元线性回归分析。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q269","src":"pm","srcName":"大厂 PM 八股文","no":269,"q":"线性回归算法的实现原理","a":"线性回归算法的目的是来找到一条函数表达式，从而能够最好的拟合给定的数据集。当得到这条函数表达式的时候，讲所有已知的点代入到这个函数表达式之间，就会得到一个函数值，而这个函数值减去真实值之后就会得到一个误差，将所有的误差平方后求和就是这个函数表达式整体的一个误差，这种将所有误差平方求和的方法叫做残差平方和。得到的结果越大，就说明预测值和实际值差距越大，得到的结果越小，就说明预测值和实际值差距越小，当结果为0时，证明所有的点都在这个函数表达式上。\n\ny= ko +kizi + Kpzz+.+/varepsilon\n\n举个例子，在二维平面上一些点随机的分布在一条线的两侧，那么线性回归的目的就是找到这条线的函数表达式，得到这条线的函数表达式就能处理未知的点，就能够求出他的结果值。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q270","src":"pm","srcName":"大厂 PM 八股文","no":270,"q":"线性回归算法的应用场景（广告投放）","a":"假如，现在部门要推出一款产品。为了让产品卖得更好，就到处去投放广告，让大家都知道这个产品，激发大家购买的欲望。因为一般来说，广告投放得越多，钱花得越多，知道的人越多，产品卖得越多。那根据历史累计的广告投放经费和销售额，我们可以画出一张关系图，图上每个点对应的X轴代表广告费，Y轴代表销售额。结合这张图我们可看出，有些坐标点的收益相对较高，有些坐标点的收益相对较低，大概率它们是符合线性关系的。已知线性回归方程是Y=AX+B，将已有数据代入到这个方程中，然后求得出一组A和B的最优解，最终拟合出一条直线，使得图中每个点到直线的距离最短，也就是上面说的损失函数最小。这样，我们就能通过这个最优化的A和B的值，进行估算广告经费和销售额的关系了。","level":"高级","type":"场景设计","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q271","src":"pm","srcName":"大厂 PM 八股文","no":271,"q":"线性回归算法的优缺点","a":"优点：\n\n1. 运算速度快，由于算法简单，符合非常简洁的数学原理，所以线性回归算法不管时建模速度还是预测速度都是非常快的。\n\n2. 可解释性很强，由于最终可以得到一个数学函数表达式，根据计算出的系数就可以明确的知道每个变量的影响大小。\n\n3. 善于获取数据集中的线性关系。缺点：\n\n1. 预测的精确度较低，由于获得的模型只是要求最小的损失，而不是数据良好的拟合，所以精确度比较低。\n\n2. 不相关的特征会影响结果，对噪声数据处理比较难。\n\n3. 不适用于非线性数据。\n\n4. 容易出现过拟合，尤其是数据量不大的情况。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q272","src":"pm","srcName":"大厂 PM 八股文","no":272,"q":"什么是逻辑回归算法","a":"简单来说，逻辑回归（Logistic Regression）是一种用于解决二分类（0or 1）问题的机器学习方法，用于估计某种事物的可能性。比如某用户购买某商品的可能性，某病人患有某种疾病的可能性，以及某广告被用户点击的可能性等。注意，这里用的是“可能性”，而非数学上的“概率”，logisitc回归的结果并非数学定义中的概率值，不可以直接当做概率值来用。该结果往往用于和其他特征值加权求和，而非直接相乘。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q273","src":"pm","srcName":"大厂 PM 八股文","no":273,"q":"逻辑回归算法的优缺点","a":"优点：（1）对率函数任意阶可导，具有很好的数学性质，许多现有的数值优化算法都可以用来求最优解，训练速度快；（2）简单易理解，模型的可解释性非常好，从特征的权重可以看到不同的特征对最后结果的影响；（3）适合二分类问题，不需要缩放输入特征；\n\n（4）内存资源占用小，因为只需要存储各个维度的特征值；（5）直接对分类可能性进行建模，无需事先假设数据分布，避免了假设分布不准确所带来的问题（6）以概率的形式输出，而非通过知识直接判断是0还是1，对许多利用概率辅助决策的任务很有用缺点：（1）不能用逻辑回归去解决非线性问题，因为Logistic的决策面是线性的；（2）对多重共线性数据较为敏感；（3）很难处理数据不平衡的问题；（4）准确率并不是很高，因为形式非常的简单（非常类似线性模型），很难去拟合数据的真实分布；（5）逻辑回归本身无法筛选特征，有时会用gbdt来筛选特征，然后再上逻辑回归。简单来说，逻辑回归（Logistic Regression）是一种用于解决二分类（0 or 1）问题的机器学习方法，用于估计某种事物的可能性。比如某用户购买某商品的可能性，某病人患有某种疾病的可能性，以及某广告被用户点击的可能性等。注意，这里用的是“可能性”，而非数学上的“概率”，logisitc回归的结果并非数学定义中的概率值，不可以直接当做概率值来用。该结果往往用于和其他特征值加权求和，而非直接相乘。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q274","src":"pm","srcName":"大厂 PM 八股文","no":274,"q":"朴素贝叶斯算法的实现原理","a":"朴素贝叶斯（NB）是一种基于贝叶斯定理和特征条件独立假设的分类方法。本质上朴素贝叶斯模型就是一个概率表，其通过训练数据更新这张表中的概率。为了预测一个新的观察值，朴素贝叶斯算法就是根据样本的特征值在概率表中寻找最大概率的那个类别。之所以称之为「朴素」，是因为该算法的核心就是特征条件独立性假设（每一个特征之间相互独立），而这一假设在现实世界中基本是不现实的。简单来说，朴素贝叶斯分类器假设在给定样本类别的条件下，样本的每个特征与其他特征均不相关，对于给定的输入，利用贝叶斯定理，求出后验概率最大的输出。朴素贝叶斯的基本思想：如果一个事物在一些属性条件发生的情况下，事物属于A的概率>属于B的概率，则判定事物属于A。假设我们有一个数据集，它是由两类数据构成，数据分布如下图所示：\n\nP1（×，y）表示数据点（× ）属子类别1（图中用 点表示的类别）的概率P2（×， ）表示数据点（× ）属于类别2（图中用三角形表示的类别）的概率那么对于一个新数据点（x,y），可以用下面的规则来判断它的类别：如果 p1（X,y）>P2（x,y），那么类别为1。如果p2（x,y）>P1（x,V），那么类别为2。也就是说，我们会选择高概率对应的类别。这就是贝叶斯决策理论的核心思想，即选择具有 最高概率的决策。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q275","src":"pm","srcName":"大厂 PM 八股文","no":275,"q":"朴素贝叶斯算法的优缺点","a":"优点：\n\n1. 算法简单且易于实现：朴素贝叶斯算法基于简单的概率统计原理，模型参数估计简单，算法实现相对容易。\n\n2. 高效性：朴素贝叶斯算法具有高效的训练和预测速度，适用于大规模数据集。\n\n3. 对小样本数据有效：朴素贝叶斯算法在处理小样本数据时表现良好，因为它通过特征条件独立假设来估计参数，减少了参数估计的不确定性。\n\n4. 对缺失数据友好：朴素贝叶斯算法能够处理缺失数据，通过忽略缺失特征的条件概率来进行分类预测。缺点：\n\n5. 特征条件独立假设过于简单：朴素贝叶斯算法假设特征之间相互独立，这在实际应用中并不总是成立。特征之间的相关性可能会导致分类结果的偏差。\n\n6. 对输入数据分布的假设：朴素贝叶斯算法假设特征的分布满足条件独立性，但在实际情况中，特征之间的关系可能是复杂的，导致模型的偏差。\n\n7. 处理连续特征困难：朴素贝叶斯算法对连续特征的处理相对困难，通常需要进行离散化处理，这可能会导致信息损失。\n\n8. 类别之间的类别比例影响结果：朴素贝叶斯算法对类别之间的类别比例敏感，如果训练样本中某个类别的样本数量远大于其他类别，可能会导致分类结果的偏差。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q276","src":"pm","srcName":"大厂 PM 八股文","no":276,"q":"朴素贝叶斯算法的应用案例（要不要购买延误险）？","a":"最近看到一则新闻，王女士从2015年开始，凭借自己对航班和天气的分析，成功地购买了大约900次飞机延误险并获得延误赔偿，累计获得保险理赔金高达300多万元。那么她是怎么决定要买延误险的呢？其实，航班延误最主要的原因就是天气变化，包括起飞地及降落地的天气；除此之外，也有机场和航空公司的原因。假设这些原因之间并没有互相影响，每一项对于飞机最终是否延误的影响都是独立的，王女士集齐过去的数据，就可以计算出每一个条件与飞机延误的概率。比如，在总体上延误的概率为20%，不延误的概率为80%。在飞机延误的情况下，“起飞地天气=晴天”的概率为20%，“降落地天气=雨天”的概率为40%，“机场=首都机场”的概率为35%，“航空公司=南方航空”的概率为5%；在不延误的情况下，这些属性的概率分别为60%、55%、45%、55%。那么这个时候，有一架南方航空公司的航班，从北京飞往上海，北京天气是晴天，上海天气是雨天，那么，我们就可以根据上面的概率算出来不延误的综合概率=80% × 60% × 55% × 45% × 55%=\n\n0.0065412，延误的综合概率=20%×20%×40%×35%×5%=0.00028，从这个结果来看，不延误的可能性要高于延误的可能性，所以这次不需要买延误险。","level":"高级","type":"场景设计","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q277","src":"pm","srcName":"大厂 PM 八股文","no":277,"q":"决策树算法的实现原理？","a":"决策树算法的原理是根据已知数据集的特征和决策树算法是.种常用的机器学习算法，它可分类结果，构建一颗树形结构，通过对待分类样才进行特征比较和分类判断，实现对新样本的分类预测决策树算法的基本原理是根据信息熵和信息增齐对数据集进行划分，构建一棵树形结构。在决策树中，每个节点代表一个特征，每个分支代表这个特征的一个取值，个叶子节点代表一个分类结果信息简是度量信息不确定性的一种方法，它的作越大，表示信息的不确定性越高。在决策树算法中，我们希望通过划分从而提高分类的准确性。信息增益是指在某个特征上划分数据集前后数据集，让信息熵减少，即让信息不确定性降低信息熵的减少量。我们希望选择信息增益最大的毕征作为当前节点的划分标准，从而构建决策树。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q278","src":"pm","srcName":"大厂 PM 八股文","no":278,"q":"决策树算法的应用案例（预测用户违约）？","a":"银行客户流失是指银行的客户终止在该行的所有业务并销号。但在实际运营中，对于具体业务部门，银行客户流失可以定位为特定的业务终止行为。商业银行的客户流失较为严重，流失率可达20%。而获得新客的成本是维护老客户的5倍。因此，从海量客户交易数据中挖掘出对流失有影响的信息，建立高效的客户流失预警体系尤为重要。客户流失的主要原因有：价格流失、产品流失、服务流失、市场流失、促销流失、技术流失、政治流失。有些时候表面上是价格导致的客户流失，但实际上多重因素共同作用导致了客户的流失。比如说，不现实的利润目标、价格结构的不合理、业务流程过于复杂、组织结构的不合理等等。维护客户关系的基本方法：追踪制度，产品跟进，扩大销售，维护访问，机制维护。因此建立量化模型，合理预测客群的流失风险是很有必要的。比如：常用的风险因子，客户持有的产品数量、种类，客户的年龄、性别，地理区域的影响，产品类别的影响，交易的时间间隔，促销的手段等等。根据这些因素及客户流失的历史数据对现有客户进行流失预测，针对不同的客群提供不同的维护手段，从而降低客户的流失率。","level":"高级","type":"场景设计","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q279","src":"pm","srcName":"大厂 PM 八股文","no":279,"q":"决策树算法的优缺点？","a":"1.决策树所产生的预测规则的形式为：如果xr1€A1•且xrmEAm，那么Y=y，很容易解释。\n\n2. 在树的生长过程中，对定序或连续自变量而言只需使用变量取值的大小顺序而不使用具体取值。因內对这些自变量进行任何单调增变换（例如，取对数）都不改变变量取值的大小顺序，而对自变量进行任何单调减变换（例如，取倒数）把原来取值的大小顺序完全颠倒；所以这些变换都不会改变划分的结果。因此，在建立决策树时，无需考虑自变量的转换（但注意，有时需要考虑因变量的转换）。\n\n3. 因为决策树只使用了定序或连续自变量取值的大小顺序，它对自变量的测量误差或异常值是稳健的。\n\n4. 决策树能够直接处理自变量的缺失值。如第二章所述，如果数据中有多个自变量存在缺失，决策树可用来插补这些自变量的缺失值。\n\n5. 决策树可以用作变量选择的工具。缺点：\n\n1. 每个非叶节点的划分都只考虑单个变量，因此很难发现基于多个变量的组合的规则。例如，可能按照2×1+3×2的值划分比较好，但决策树只会考虑按照x1或x2的值进行划分，很难发现这样的组合规则。\n\n2. 为每个非叶节点选择最优划分时，都仅考虑对当前节点划分的结果，这样只能够达到局部最优，而无法达到全局最优。\n\n3. 正因为决策树是局部贪婪的，树的结构很不稳定。例如，若将学习数据集随机分割为不同的训练数据集和修正数据集，可能对于某次分割，xr1被选作根节点的划分变量，而对于另一次分割，xr2（r2 r1）被选作根节点的划分变量，之后继续划分下去，这两棵树的结构差异会非常大。这种差异也可能使得两棵树的预测性能存在很大差异。而这些差异仅仅是由学习数据集随机分割的差异带来的！此外，因为不同结构的树隐含的预测规则存在不同的解释，所以这种结构不稳定性也降低了决策树的可解释性。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q280","src":"pm","srcName":"大厂 PM 八股文","no":280,"q":"什么是决策森林算法？","a":"随机森林是一种基于决策树的集成算法。随机森林通过构建多个决策树来进行分类，每个决策树都是基于随机抽样的训练数据集构建的。在构建每个决策树的过程中，我们会随机选择一个特征子集来进行特征选择，并在每个节点上选择最佳的特征进行分割。通过集成多个决策树的预测结果，随机森林可以减少过拟合的风险，并提高模型的泛化能力","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q281","src":"pm","srcName":"大厂 PM 八股文","no":281,"q":"SVM算法的实现原理？","a":"SVM（支持向量机）是一种用于分类和回归分析的机器学习算法。它基于构建一个最优的超平面，可以将不同类别的数据分隔开来，从而实现分类。具体来说，SVM的算法原理如下：寻找最优的超平面：在给定的训练数据中，SVM算法会寻找一个最优的超平面，使得将数据分为两个类别的间隔最大化。核函数的应用：对于非线性分类问题，SVM采用核函数将数据映射到高维空间中，使得在该空间中可以使用线性超平面分割数据。求解优化问题：SVM通过求解一个凸二次规划问题来确定最优的超平面。该问题的目标是找到一个最小的误分类率，并最大化分类边界的间隔。支持向量的确定：在确定最优的超平面后，SVM算法将寻找支持向量，即离最优超平面最近的训练数据点。这些数据点在分类过程中起到了关键的作用。分类器的构建：基于最优的超平面和支持向量，SVM可以构建一个分类器，用于对新的数据进行分类。\n\n总体来说，SVM是一种强大的分类器，可以处理线性和非线性分类问题。它的核心思想是最大化分类边界的间隔，并利用支持向量来确定最优的超平面，从而实现高效的分类。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q282","src":"pm","srcName":"大厂 PM 八股文","no":282,"q":"SVM 算法的优缺点？","a":"优点\n\n1. 能够处理高维数据SVM算法的核心思想是将数据映射到高维空间中，使得数据在该空间中更容易被分离。这种映射方式可以通过选择不同的核函数来实现，例如线性核、多项式核、高斯核等。因此，SVM算法能够处理高维数据，不受维度灾难的影响。\n\n2. 具有较强的泛化能力SVM算法采用结构风险最小化原则进行模型选择，即在保证训练误差最小的同时，尽可能地减小泛化误差。这种原则能够有效地避免过拟合现象的发生，使得SVM算法具有较强的泛化能力。\n\n3. 适用于小样本数据由于SVM算法采用间隔最大化原则进行分类，因此其分类效果不仅与训练样本的数量有关，还与训练样本的分布情况有关。当训练样本数量较小时，SVM算法能够更好地处理数据分布不均匀的情况。\n\n4. 可以处理非线性问题SVM算法通过核函数的选择，可以将非线性问题转化为线性问题进行处理。例如，通过选择高斯核函数，可以将数据映射到无限维空间中，从而实现对非线性问题的分类。\n\n5. 具有较好的鲁棒性和可解释性SVM算法对异常点的鲁棒性较好，可以有效地避免异常点对分类结果的影响。此外，SVM算法的分类结果具有较好的可解释性，能够清晰地描述不同类别之间的区别。缺点\n\n6. 对参数的敏感性SVM算法中存在多个参数需要进行调节，例如核函数的选择、正则化参数的选择等。这些参数的选择对分类结果有较大的影响，需要进行反复试验和调整。如果参数选择不当，可能会导致分类效果较差。\n\n7. 计算复杂度高SVM算法的计算复杂度较高，尤其是对于大规模数据集和高维数据集，计算时间和计算空间都会很大。此外，SVM算法的训练过程需要多次迭代，也会增加计算的复杂度。\n\n8. 对数据的缩放敏感SVM算法对数据的缩放敏感，如果数据没有进行归一化处理，可能会导致分类结果的偏差。\n\n9. 对噪声数据敏感SVM算法对噪声数据敏感，如果数据中存在噪声数据，可能会导致分类结果的偏差。因此，在使用SVM算法进行分类之前，需要对数据进行预处理，去除噪声数据。\n\n10. 仅适用于二分类问题SVM算法仅适用于二分类问题，对于多分类问题需要进行多次二分类处理。此外，对于不平衡的数据集，SVM算法可能会出现分类偏差的问题。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q283","src":"pm","srcName":"大厂 PM 八股文","no":283,"q":"K-means 算法实现原理？","a":"K-means是一种常用的聚类方法，它将数据划分为K个相似的簇，其中每个簇的中心为该簇内所有数据点的均值。以下是K-means的基本原理和步骤：原理：K-means基于一个简单的想法：相似的数据点应该在空间中彼此靠近，并且可以通过计算每个点到各个簇中心的距离来找到这些点的簇标签。步骤：初始化：首先选择K个数据点作为初始的簇中心。这可以是随机选择，也可以是使用某种启发式方法。分配数据点：对于数据集中的每一个数据点，计算其到K个中心的距离，并将其分配到距离最近的中心所在的簇。更新簇中心：对于每一个簇，计算簇中所有数据点的均值，将均值作为新的簇中心。收敛判断：比较新的簇中心与上一次迭代的簇中心，如果簇中心没有（或只有微小的）变化，算法结束。否则，返回第2步。结束：当簇中心不再变化或达到预定的迭代次数时，算法结束。需要注意的是，K-means的结果可能会受到初始中心的影响，导致局部最优。为了获得更好的聚类结果，通常会多次运行算法，每次使用不同的初始中心，然后选择最好的结果。","level":"高级","type":"概念解释","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q284","src":"pm","srcName":"大厂 PM 八股文","no":284,"q":"应用案例：K-means 算法对用户分层？","a":"RFM模型是衡量客户价值和客户创利能力的重要工具和手段。根据美国数据库营销研究所ArthurHughes的研究，最近一次消费时间间隔（Recency），消费频率（Frequency），消费金额（Monetary），这三个要素构成了数据分析最好的指标，通过这3个指标对用户进行分类，根据不同类别的用户进行精准营销。最近一次消费时间间隔（Recency）：近度，最近一次有效订购订单距离当前时间点的时间。\n\n理论上最近一次购买的顾客越近越是优质客户，最近才购买商品或服务的顾客，是最有可能再次购买商品或服务的客户，对即时提供的商品或者是服务也最有可能有反应；最近一次消费的过程是持续变动的，客户的最近一次消费时间间隔会随着时间的变化以及客户的购买行为变化而变化；最近一次消费时间间隔可以帮助监控业务的健康程度。比如，月报告中显示上一次购买很近的客户（最近一次消费为1个月）人数环比增加，则表示该业务是个稳健成长的业务。相反，如上一次购买很近的客户（最近一次消费为1个月）人数环比降低，则表示该业务走向衰落的先兆；消费频率（Frequency）：频度，客户在限定时间内订购订单的次数。消费频次高的客户，往往也是满意度最高的客户；根据消费频次，可以把客户分成不同层级，观察用户在不同层级的分布情况，通过运营手段提高消费频次，增加高层级客户占比；消费金额（Monetary）：值度，客户在限定时间内订购订单的总支付金额。消费金额是衡量客户价值的支柱指标，”帕雷托法则”——公司80%的收入来自20%的顾客，对有价值的客户进行营销能得到更可观的经验效果；以客户订购订单的Recency、Frequency、Monetary来替代客户使用的Recency、Frequency、Monetary，主要有以下几点原因：电信行业的客户每天都在使用电信业务的情况下，其最近时间间隔为零，不同的客户区分度很小，客户订购的时间间隔较大，以订购近度替代使用近度，避免了客户使用的近度难于区分的问题。如果客户在一定时期内使用电信业务的次数数量非常大，则客户的频度也将是一个很大的数量，客户订购的次数相对较少，可以减少统计客户使用次数的工作量。客户订购支付金额跟客户实际使用消费金额最终是相等的，因此，从订购交费角度构建的RFM模型是可取的。因此需要从客户交费角度来考虑对客户进行RFM模型建模，以RFM模型为基础，通过客户的RFM行为特征衡量分析客户忠诚度与客户内在价值。从公司所有的客户记录中选择近2年内还有消费订购记录的客户进行分析。把这3个指标（R、F、M）按价值从低到高排序，并把这3个指标作为XYZ坐标轴，大于（等于）总RFM平均值的为价值高坐标、小于总RFM平均值的为价值低坐标。","level":"高级","type":"场景设计","tags":["机器学习基础"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q285","src":"pm","srcName":"大厂 PM 八股文","no":285,"q":"K-means 算法的优缺点？","a":"优点：\n\n1. 实现简单\n\n2.对于大数据集，算法是高效的\n\n缺点：\n\n1. 结果可能会受到初始中心选择的影响，导致局部最优\n\n2.对于簇的形状和大小敏感（例如，对于非凸形状的簇，K-means可能不会很好地工作）\n\n3.需要预先指定K值，这在实际应用中可能不容易确定为了解决部分缺点，有很多变种和改进的方法，例如K-means++（用于更好的初始化中心）、二分K-means、DBSCAN（不需要预先指定簇的数量，并且可以发现任意形状的簇）等。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"四、经典算法类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 经典算法"},{"id":"q286","src":"pm","srcName":"大厂 PM 八股文","no":286,"q":"什么是神经网络？","a":"神经网络是一种模拟人脑神经系统的计算模型，它由大量的人工神经元组成，通过模拟神经元之间的连接和信息传递来实现复杂的信息处理和学习。神经网络具有自适应性、非线性和并行处理等特点，被广泛应用于机器学习、模式识别、数据挖掘等领域。神经网络的基本组成单位是人工神经元，也称为节点或神经元。每个神经元都有多个输入和一个输出，输入通过带有权重的连接传递给神经元，神经元对输入进行加权求和，并经过一个激活函数处理后输出结果。神经网络的结构由多个神经元以层次化的方式连接而成，层与层之间的神经元之间存在连接，信息通过这些连接从输入层传递到输出层。神经网络的学习过程是通过调整连接权重来实现的。在训练过程中，神经网络接收一组已知的输入和对应的输出，通过计算实际输出与期望输出之间的误差，并利用误差反向传播算法来更新连接权重。通过反复迭代训练，神经网络能够逐渐优化权重，提高对输入数据的处理和泛化能力。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q287","src":"pm","srcName":"大厂 PM 八股文","no":287,"q":"什么是CNN算法？","a":"CNN，全称为卷积神经网络（Convolutional Neural Network），是一种深度学习模型，广泛应用于图像和视频识别、自然语言处理和生物信息学等领域。CNN的核心思想是通过卷积层自动、有效地提取输入数据的特征。CNN的基本组成\n\n1. 卷积层 （Convolutional Layer）：。通过滤波器（或称为卷积核）扫描输入数据，提取局部特征。。 滤波器可以学习到图像中的边缘、纹理等特征。\n\n2. 激活函数：\n\n。通常使用ReLU （Rectified Linear Unit）等非线性激活函数，增加模型的非线性表达能力。\n\n3. 池化层（Pooling Layer）：。用于降低特征的空间维度，减少计算量，同时增加对图像位移的不变性。。最常见的池化操作是最大池化（Max Pooling）和平均池化 （Average Pooling）。\n\n4. 全连接层 （Fully Connected Layer）：。在网络的未端，将卷积层和池化层提取的特征映射到最终的输出，如分类标签。\n\n5. 损失函数和优化算法：。通过反向传播算法和梯度下降等优化算法，调整网络权重，最小化损失函数。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q288","src":"pm","srcName":"大厂 PM 八股文","no":288,"q":"CNN模型的应用场景？","a":"CNN （Convolutional Neural Network）是深度学习中的一种前馈神经网络，应用范围广泛，包括图像识别、语音识别、自然语言处理等领域。其主要特点是通过权值共享和池化操作来减少训练参数并提高模型的鲁棒性和泛化能力，可有效地提高识别准确率。","level":"高级","type":"场景设计","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q289","src":"pm","srcName":"大厂 PM 八股文","no":289,"q":"CNN模型的优缺点？","a":"CNN算法的优点包括模型的准确性高、对于图像处理有天然的优势、具有较强的特征抽象和泛化能力、可以降低算法的复杂度、并且可以利用GPU等硬件提高计算速度。","level":"高级","type":"对比分析","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q290","src":"pm","srcName":"大厂 PM 八股文","no":290,"q":"什么是RNN模型？","a":"RNN（Recurrent Neural Network），中文称作循环神经网络，它一般以序列数据为输入，通过网络内部的结构设计有效捕捉序列之间的关系特征，一般也是以序列形式进行输出。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q291","src":"pm","srcName":"大厂 PM 八股文","no":291,"q":"RNN模型实现原理？","a":"输入层：RNN能够接受一个输入序列（例如文字、股票价格、语音信号等）并将其传递到隐藏层。隐藏层：隐藏层之间存在循环连接，使得网络能够维护一个“记忆”状态，这一状态包含了过去的信息。这使得RNN能够理解序列中的上下文信息。输出层：RNN可以有一个或多个输出，例如在序列生成任务中，每个时间步都会有一个输出。Recurrent Neural Networks （RNNs）","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q292","src":"pm","srcName":"大厂 PM 八股文","no":292,"q":"RNN模型应用场景？","a":"文本分析与生成\n\n1.自然语言处理RNN可用于词性标注、命名实体识别、句子解析等任务。通过捕获文本中的上下文关系，RNN能够理解并处理语言的复杂结构。\n\n2. 机器翻译RNN能够理解和生成不同语言的句子结构，使其在机器翻译方面特别有效。\n\n3. 文本生成利用RNN进行文本生成，如生成诗歌、故事等，实现了机器的创造性写作。语音识别与合成\n\n4.语音到文本RNN可以用于将语音信号转换为文字，即语音识别（Speech to Text），理解声音中的时序依赖关系。\n\n5. 文本到语音RNN也用于文本到语音（Text to Speech）的转换，生成流畅自然的语音。时间序列分析\n\n6.股票预测通过分析历史股票价格和交易量等数据的时间序列，RNN可以用于预测未来的股票走势。\n\n7. 气象预报RNN通过分析气象数据的时间序列，可以预测未来的天气情况。视频分析与生成\n\n8.动作识别RNN能够分析视频中的时序信息，用于识别人物动作和行为模式等。\n\n9. 视频生成RNN还可以用于视频内容的生成，如生成具有连续逻辑的动画片段。","level":"高级","type":"场景设计","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q293","src":"pm","srcName":"大厂 PM 八股文","no":293,"q":"RNN模型的优缺点？","a":"优点：能够处理不同长度的序列数据。能够捕捉序列中的时间依赖关系。缺点：对长序列的记忆能力较弱，可能出现梯度消失或梯度爆炸问题。训练可能相对复杂和时间消耗大。","level":"高级","type":"对比分析","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q294","src":"pm","srcName":"大厂 PM 八股文","no":294,"q":"什么是GAN模型？","a":"GAN由两个主要组成部分构成：生成器（Generator）和判别器（Discriminator）。这两个部分通过对抗学习的方式相互竞争，从而使得生成器能够不断提高生成逼真样本的能力，而判别器则不断提高辨别真伪样本的能力。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q295","src":"pm","srcName":"大厂 PM 八股文","no":295,"q":"GAN模型实现原理？","a":"1.生成器（Generator）生成器的主要任务是接收一个随机噪声向量作为输入，并将其转化为与真实数据相似的样本。生成器最初的输出可能非常随机，但随着训练的进行，它会逐渐生成更加逼真的样本。生成器的训练目标是欺骗判别器，使其无法准确区分生成的样本和真实数据。\n\n2. 判别器 （Discriminator）判别器是一个二分类器，用于评估输入样本的真实性。它接收来自生成器的样本和真实数据，并尝试将它们正确分类为“真”或“假”。判别器的训练目标是尽可能准确地区分生成的样本和真实数据，使得生成器的输出更加逼真。\n\n3. 对抗学习过程在训练过程中，生成器和判别器通过对抗学习相互博弈。生成器的目标是欺骗判别器，使其无法区分生成的样本和真实数据。而判别器的目标是尽可能准确地判断输入样本的真实性。这种对抗学习的过程持续进行，直到生成器生成的样本足够逼真，判别器无法有效区分真假为止。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q296","src":"pm","srcName":"大厂 PM 八股文","no":296,"q":"GAN模型应用场景？","a":"1.图像合成与编辑：GAN可以用于生成高分辨率图像，风格转换和图像增强。它也可以用于编辑图像，如将黑白照片转换为彩色。\n\n2. 视频生成：GAN可以生成逼真的视频帧，扩展视频长度，甚至用于视频修复和插值。\n\n3. 自然语言处理：GAN可以用于生成文本段落、对话和语音合成，提高机器翻译的质量等。\n\n4. 医学图像处理：GAN可以用于生成医学图像数据，辅助医生进行诊断和手术规划。\n\n5. 游戏与虚拟现实：GAN可用于创建虚拟角色、场景和游戏内容，提升游戏体验。","level":"高级","type":"场景设计","tags":["深度学习与神经网络"],"dims":[],"status":"已有详解","chapter":"五、深度学习类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 深度学习"},{"id":"q297","src":"pm","srcName":"大厂 PM 八股文","no":297,"q":"什么是大模型？","a":"我这边从AI产品经理的角度来看，首先LLM本身一种具有强大NLP能力的模型，通过DL（深度学习）的方法和大量训练数据来生成，能够捕捉丰富的语言信息和深层的语义关联。实际上LLM在很大程度上重塑了NLP方向的研究和应用格局。通过更为先进的预训练和微调策略，让现在的大模型能够迅速适应多种下游任务，显著降低了模型开发的难度和成本，另外LLM具有强大的生成能力，能够生成富有创意和质量较高的文本内容。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q298","src":"pm","srcName":"大厂 PM 八股文","no":298,"q":"什么是ROC曲线？","a":"ROC曲线是接收者操作特征曲线的缩写，是一种用于评估分类模型性能的工具。ROC曲线图像的横轴代表假阳性率，纵轴代表真阳性率。在ROC曲线图像中，对角线代表随机猜测模型的预测表现。ROC曲线越靠近左上角，分类模型的性能越好。下图中的蓝色曲线就是 ROC曲线，它常被用来评价二值分类器的优劣，即评估模型预测的准确度。二值分类器，就是字面意思它会将数据分成两个类别（正/负样本）。例如：预测银行用户是否会违约、内容分为违规和不违规，以及广告过滤、图片分类等场景。篇幅关系这里不做多分类 ROC的讲解。坐标系中纵轴为 TPR（真阳率/命中率/召回率）最大值为1，横轴为 FPR（假阳率/误判率）最大值为1，虚线为基准线（最低标准），蓝色的曲线就是 ROC曲线。其中 ROC曲线距离基准线越远，则说明该模型的预测效果越好。（TPR: True positive rate; FPR: False positive rate）ROC 曲线接近左上角：模型预测准确率很高ROC曲线略高于基准线：模型预测准确率一般\n\nROC低于基准线：模型未达到最低标准，无法使用","level":"高级","type":"概念解释","tags":["模型训练与评估"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q299","src":"pm","srcName":"大厂 PM 八股文","no":299,"q":"什么是AUC？","a":"AUC被定义为ROC曲线下的面积。往往使用AUC值作为模型的评价标准是因为很多时候ROC曲线并不能清晰的说明哪个分类器的效果更好，而作为一个数值，对应AUC更大的分类器效果更好。其中，ROC曲线全称为受试者工作特征曲线，它是根据一系列不同的二分类方式，以真阳性率感为纵坐标，假阳性率为横坐标绘制的曲线。\n\n1. AUC就是衡量学习器优劣的一种性能指标。从定义可知，AUC可通过对ROC曲线下各部分的面积求和而得。\n\n2. AUC面积的意义：AUC是衡量二分类模型优劣的一种评价指标，表示预测的正例排在负例前面的概率。","level":"高级","type":"概念解释","tags":["模型训练与评估"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q300","src":"pm","srcName":"大厂 PM 八股文","no":300,"q":"1T公走Iranstormer俣型：","a":"Transformer模型是由谷歌公司提出的一种基于自注意力机制的神经网络模型，用于处理序列数据。相比于传统的循环神经网络模型，Transformer模型具有更好的并行性能和更短的训练时间，因此在自然语言处理领域中得到了广泛应用。在自然语言处理中，序列数据的输入包括一系列文本、语音信号、图像或视频等。传统的循环神经网络（RNN）模型已经在这些任务中取得了很好的效果，但是该模型存在着两个主要问题：一是难以并行计算，二是难以捕捉长距离依赖关系。为了解决这些问题，Transformer模型应运而生。作为一种基于自注意力机制的神经网络模型，Transformer模型能够对序列中的每个元素进行全局建模，并在各个元素之间建立联系。与循环神经网络模型相比，Transformer模型具有更好的并行性能和更短的训练时间。Transformer模型中包含了多层encoder和decoder，每一层都由多个注意力机制模块和前馈神经网络模块组成。encoder用于将输入序列编码成一个高维特征向量表示，decoder则用于将该向量表示解码成目标序列。在Transformer模型中，还使用了残差连接和层归一化等技术来加速模型收敛和提高模型性能。Transformer模型的核心是自注意力机制（Self-Attention Mechanism），其作用是为每个输入序列中的每个位置分配一个权重，然后将这些加权的位置向量作为输出。自注意力机制的计算过程包括三个步骤：计算注意力权重：计算每个位置与其他位置之间的注意力权重，即每个位置对其他位置的重要性。计算加权和：将每个位置向量与注意力权重相乘，然后将它们相加，得到加权和向量。线性变换：对加权和向量进行线性变换，得到最终的输出向量。通过不断堆叠多个自注意力层和前馈神经网络层，可以构建出Transformer模型。对于Transformer模型的训练，通常采用无监督的方式进行预训练，然后再进行有监督的微调。在预训练过程中，通常采用自编码器或者掩码语言模型等方式进行训练，目标是学习输入序列的表示。在微调过程中，通常采用有监督的方式进行训练，例如在机器翻译任务中，使用平行语料进行训练，目标是学习将输入序列映射到目标序列的映射关系。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q301","src":"pm","srcName":"大厂 PM 八股文","no":301,"q":"什么是ChatGPT模型？","a":"GPT是OpenAI公司基于谷歌的Transformer语言模型框架而开发出来的技术。GPT，英文全称是Generative Pre-trained Transformer，直译过来是生成型预训练-变换器。名字前面加上chat，即“聊天生成型预训练-变换器”。从算法模式的版本上，ChatGPT经历了GPT-1（2018年）、GPT-2（2019年）、GPT-3（2020年）和InstructGPT（2022年初）四个版本，未来有望生成新版本即GPT-4（预计2023年）。\n\nGPT-1（2018年）：仅需要对预训练的语言模型做很小的结构改变，即加一层线性层，即可方面地应用于下游各种任务。GPT-2（2019年）：使用zero-shot设定，基本实现一劳永逸，训练一个模型，在多个任务上都能使用。GPT-3（2020年）不通过任何样例学习，而是利用少量样本去学习，更接近人脑学习模式。InstructGPT（2022年初）：经过多任务的微调后，能在其他任务上实现zero-shot预测，泛化能力极大提升。（InstuctGPT可以理解成是GPT-3的微调版本，与GPT-3相比更擅长遵循指令，回答更真实，且有害情绪输出大幅下降）。ChatGPT可以理解成是GPT-3.5的微调版本，未来有望生成新版本即GPT-4，相较于InstructGPT，ChatGPT效果更加真实，模型的无害性实现些许提升，编码能力更强。ChatGPT使用的新的AI训练方法，加大“人”的反馈权重，进行训练监督策略模型、训练奖励模型（Reward Mode，RM）、采用PPO（Proximal Policy Optimization，近端策略优化）三个阶段的训练，在持续参数迭代的过程中，输入奖励模型，得到优化参数。且会不断重复第二和第三阶段，通过迭代，训练出更高质量的ChatGPT模型。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q302","src":"pm","srcName":"大厂 PM 八股文","no":302,"q":"什么是Diffusion模型？","a":"Diffusion模型是一种深度生成模型，属于无监督学习中的概率模型，主要用于图像生成和视频预测等领域。Diffusion模型的工作原理是通过一系列高斯噪声逐步加入到原始图像中，直到图像变成纯高斯噪声。然后，模型通过去除噪声来还原图像。Diffusion模型的特点是加入噪声的过程是可逆的，即噪声可以由原始图像逐步还原。因此，Diffusion模型可以由给定的噪声图像还原出原始图像。Diffusion模型在图像生成方面具有很好的效果，可以生成高质量的图像。此外，Diffusion模型还可以用于视频预测，即根据给定的前几帧预测未来帧。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"六、大数据模型类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 大数据模型"},{"id":"q303","src":"pm","srcName":"大厂 PM 八股文","no":303,"q":"什么是特征清洗、数据交换？","a":"特征清洗（Feature Cleaning）是指在数据分析和机器学习任务中，对原始数据集中的特征进行处理和筛选，以提高模型的性能和准确性。特征清洗的目标是去除冗余、不相关或低质量的特征，同时保留与目标变量相关且有用的特征。\n\n特征清洗可以包括以下几个方面的处理：缺失值处理：对于含有缺失值的特征，可以选择删除该特征或使用合适的方法填充缺失值，如均值、中位数或众数等。异常值处理：对于含有异常值的特征，可以通过设定阈值或使用统计方法来检测和处理异常值，如删除、替换或插值等。数据类型转换：将特征的数据类型转换为适合分析和建模的形式，如将文本型特征转换为数值型特征，或将分类变量进行独热编码等。特征选择：根据特征与目标变量之间的相关性或重要性，选择最具有预测能力的特征，可以使用统计方法、特征重要性评估或正则化方法等进行选择。数据交换（Data Exchange）是指在不同系统或平台之间传输和共享数据的过程。在现实应用中，不同系统之间可能存在着数据格式、结构和接口的差异，因此需要进行数据交换来实现数据的互通。数据交换可以采用多种方式，如文件传输、数据库连接、API调用等。常见的数据交换格式包括CSV（逗号分隔值）、JSON（JavaScript对象表示法）、XML（可扩展标记语言）等。在数据交换过程中，需要确保数据的完整性、准确性和安全性，同时考虑数据量、传输速度和系统兼容性等因素。数据交换在数据集成、业务合作和信息共享等场景中起到了重要的作用，能够促进不同系统之间的数据流动和协作，提高数据的利用价值和效率。","level":"高级","type":"概念解释","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q304","src":"pm","srcName":"大厂 PM 八股文","no":304,"q":"什么是过拟合和欠拟合？","a":"过拟合 （Overfitting）和欠拟合（Underfitting）是机器学习中常见的两个问题，涉及到模型在训练数据上的表现与在新数据上的泛化能力之间的平衡。过拟合指的是模型在训练数据上表现良好，但在新数据上的预测能力较差。过拟合通常发生在模型过于复杂或训练数据过少的情况下。当模型过度拟合训练数据时，它会过分关注数据中的噪声和异常值，导致对新数据的泛化能力下降。过拟合的特征包括训练集上的误差很低，但验证集或测试集上的误差较高。解决过拟合的方法包括：增加训练数据量：通过增加更多的训练样本，可以减少模型对于训练数据的过度拟合。減少模型复杂度：简化模型结构，如减少模型的参数数量、降低多项式次数等，以避免模型过于复杂而导致过拟合。正则化（Regularization）：通过添加正则化项来限制模型的复杂度，例如L1正则化（Lasso）和L2正则化（Ridge），以减少模型对训练数据的过度拟合。交叉验证（Cross-validation）：使用交叉验证来评估模型的泛化能力，通过将数据集划分为训练集和验证集，并多次进行训练和验证，以选择最佳的模型参数。\n\n欠拟合指的是模型无法很好地拟合训练数据，导致在训练数据和新数据上都表现较差。欠拟合通常发生在模型过于简单或训练数据不足的情况下。当模型欠拟合时，它不能捕捉到数据中的复杂关系和模式，导致预测能力较弱。欠拟合的特征包括训练集和验证集上的误差都较高。解决欠拟合的方法包括：增加模型复杂度：增加模型的参数数量、引入更多的特征等，以提高模型的灵活性和拟合能力。改进特征工程：对原始数据进行更好的特征提取和选择，以提供更有信息量的特征。增加训练数据量：通过增加更多的训练样本，可以提供更多的信息来改善模型的拟合能力。调整模型超参数：调整模型的超参数，如学习率、正则化参数等，以找到更好的模型配置。过拟合和欠拟合是机器学习中需要关注和解决的问题，通过合适的方法和技术，可以使模型在训练数据和新数据上都能够取得良好的表现。","level":"高级","type":"概念解释","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q305","src":"pm","srcName":"大厂 PM 八股文","no":305,"q":"什么是跨时间测试和回溯测试？","a":"跨时间测试也叫00T测试，是测量模型在时间上的稳定性。回溯测试是用过去--段时间的真实数据构造出一个模拟的环境（回溯环境），让模型在历史的那段环境中运行，得到历史某个时间点的模型结果。一般来说，跨时间测试是在模型上线之前就应该要做的事情。回溯测试是指模型已经存在并已经上线了，想要看模型在历史某个时间点的数据表现时候，进行的测试。","level":"高级","type":"概念解释","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q306","src":"pm","srcName":"大厂 PM 八股文","no":306,"q":"什么是训练集、验证集和测试集2","a":"训练集（training set）顾名思义指的是用于训练的样本集合，主要用来训练神经网络中的参数.验证集（development set或validation set）用于验证模型性能的样本集合.不同神经网络在训练集上训练结束后，通过验证集来比较判断各个模型的性能，有时候也被称为开发集。测试集（test set）对于训练完成的神经网络，测试集用于客观的评价神经网络的性能","level":"高级","type":"概念解释","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q307","src":"pm","srcName":"大厂 PM 八股文","no":307,"q":"你之前负责产品中使用的最核心的算法是什么？这种算法有哪些优缺点？","a":"第四章有详细介绍","level":"高级","type":"对比分析","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"指向其他章节","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q308","src":"pm","srcName":"大厂 PM 八股文","no":308,"q":"你对深度学习有哪些了解？深度学习的应用场景有哪些？","a":"深度学习是一种人工神经网络的应用，是机器学习的分支之一。它是通过构建多层神经网络来模拟人类的神经系统，从而实现对大量数据的自动分类和预测。深度学习的最大特点是通过多层次的特征提取和组合来实现高效的数据处理。深度学习的基本原理是通过前向传播算法，将输入的数据通过多层神经网络，一层一层地进行特征提取和组合，最终得出分类或预测结果。应用场景深度学习的应用领域非常广泛，包括自然语言处理、图像识别、语音识别、智能推荐等。其中，在图像识别领域，深度学习已经取得了非常显著的成果，例如在ImageNet 大规模视觉识别挑战赛中，深度学习的表现已经超过了人类的识别能力。例如在医疗领域中，深度学习已经开始被用于医学图像的分析和疾病预测等方面。在智能推荐领域，深度学习也被广泛应用于产品推荐和广告投放等方面。","level":"高级","type":"场景设计","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q309","src":"pm","srcName":"大厂 PM 八股文","no":309,"q":"什么是机器学习？","a":"机器学习（Machine Learning） 是对研究问题进行模型假设，利用计算机从训练数据中学习得到模型参数，并最终对数据进行预测和分析的一门学科。","level":"高级","type":"概念解释","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q310","src":"pm","srcName":"大厂 PM 八股文","no":310,"q":"机器学习的应用场景都有哪些？","a":"图像和语音识别：机器学习可以通过训练模型来实现图像和语音识别，如人脸识别、语音识别和文字识别等。自然语言处理：机器学习可以用于文本分析、情感分析、机器翻译、问答系统等自然语言处理任务。推荐系统：机器学习可以通过学习用户的行为和兴趣来实现个性化推荐，如电商网站的商品推荐、音乐推荐等。\n\n金融风控：机器学习可以用于金融领域的风险控制和欺诈检测，如信用评估、反洗钱等。医疗健康：机器学习可以应用于医疗领域，如疾病诊断、医学影像分析、药物研发等。自动驾驶：机器学习可以应用于自动驾驶技术，如图像识别和预测等。工业生产：机器学习可以应用于工业领域的自动化生产和设备维护，如设备故障预测和优化生产等。总之，机器学习具有广泛的应用领域，可以用于图像和语音识别、自然语言处理、推荐系统、金融风控、医疗健康、自动驾驶、工业生产等方面。通过机器学习，可以实现更智能、更高效、更准确的决策和服务，为人类带来更多的便利和效益。","level":"高级","type":"场景设计","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q311","src":"pm","srcName":"大厂 PM 八股文","no":311,"q":"逻辑回归相比于线性回归，有什么区别？","a":"区别：性质不同、任务定位不同、输出值不同、损失函数不同等。性质不同逻辑回归是一种广义的线性回归分析模型；线性回归是利用数理统计中回归分析，来确定两种或两种以上变量间相互依赖的定量关系的一种统计分析方法。逻辑回归常用于数据挖掘，疾病自动诊断，经济预测等领域；线性回归常运用于数学、金融、趋势线、经济学等领域。任务定位线性回归用于回归任务；逻辑回归用于分类任务。输出值线性回归输出连续值；逻辑回归输出概率值；本质是因为逻辑回归使用了sigmod函数进行了映射，将值域映射到（0,1），在二类任务中，若大于0.5，则为某个类，小于0.5，为另一类。损失函数线性回归采用MSE损失函数，逻辑回归采用交叉熵损失函数。线性回归在LR中，将线性回归的结果通过sigmod函数映射到0到1之间，映射的结果刚好可以看做是数据样本点属于某一类的概率，如果结果越接近0或者1，说明分类结果的可信度越高。这样做不仅应用了线性回归的优势来完成分类任务，而且分类的结果是0~1之间的概率，可以据此对数据分类的结果进行打分。对于线性不可分的数据，可以对非线性函数进行线性加权，得到一个不是超平面的分割面。逻辑回归\n\n逻辑回归虽然叫做回归，但是其主要解决分类问题。可用于二分类，也可以用于多分类问题。由于线性回归其预测值为连续变量，其预测值在整个实数域中。而对于预测变量y为离散值时候，可以用逻辑回归算法 （Logistic Regression）逻辑回归的本质是将线性回归进行一个变换，该模型的输出变量范围始终在0和1之间。","level":"高级","type":"对比分析","tags":["机器学习基础","模型训练与评估"],"dims":[],"status":"已有详解","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q312","src":"pm","srcName":"大厂 PM 八股文","no":312,"q":"你能介绍一下KNN/朴素贝叶斯/SVM/CNN/Diffusion/NLP的原理吗？你熟悉哪几种深度学习和机器学习算法？都有哪些区别","a":"第四章有详细介绍","level":"高级","type":"概念解释","tags":["模型训练与评估","机器学习基础"],"dims":[],"status":"指向其他章节","chapter":"七、技术基础类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 技术基础"},{"id":"q313","src":"pm","srcName":"大厂 PM 八股文","no":313,"q":"AI算法工程师说你的需求实现不了怎么办？","a":"从产品工作一开始我们就有必要执行三部曲：确立专家效应一找到根本原因一使用沟通软技能。","level":"中级","type":"方法流程","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q314","src":"pm","srcName":"大厂 PM 八股文","no":314,"q":"工作中做的最失败的事情/项目/遇到的最大困难是什么？","a":"问题原因：然而，项目在开始阶段就遇到了困难。首先，需求分析不足，导致我们没有完全了解市场需求和竞争情况。其次，团队内部的沟通问题也显现出来，不同部门之间的协作不够紧密。最重要的是，项目管理方面存在问题，没有明确定义的里程碑和时间表，导致进度延误。采取的行动：面对这个局面，我作为项目团队的一员，采取了一系列行动来纠正问题。首先，我促使团队进行了深入的市场研究，以更好地理解客户需求和竞争对手的情况。其次，我倡导加强跨部门协作，促进信息共享和合作。最后，我与项目管理团队合作，制定了明确的项目计划，并设定了可行的里程碑和截止日期。教训和启示：尽管我们采取了这些行动，但最终项目仍然失败了。这次经历让我深刻认识到了几个重要的教训。首先，市场研究和需求分析是项目成功的关键，不能忽视。其次，有效的团队协作和沟通对于项目的顺利进行至关重要。最后，良好的项目管理和计划是确保项目按时交付的关键因素。","level":"中级","type":"概念解释","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q315","src":"pm","srcName":"大厂 PM 八股文","no":315,"q":"请说说你们产品的主要竞品是谁？","a":"针对竞品公司，我需要了解具体的市场情况和行业背景。在人工智能行业中，有许多具有竞争力的公司。以图像识别技术为例，商汤和依图是知名的AI技术公司，它们在图像识别领域有着深厚的技术积累和丰富的应用经验。","level":"中级","type":"概念解释","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q316","src":"pm","srcName":"大厂 PM 八股文","no":316,"q":"如果公司研发资源不足以实现你想要的功能？怎么办？","a":"确保你的方案是完整且精简的闭环一个磕磕绊绊的方案落地一定会受阻，同时也会降低你的信誉度，让你在之后方案的推进中举步维艰。拆分阶段当资源固定且你需要分配出的任务复杂度偏高时，将任务拆分成多个阶段，分步骤出成果的是更好的方案，快速出成绩能保证你的“大棋”不会死在棋局成型前。尽量评估精准规避开发因为对任务认知不够，评估出的时间超出你的容错范围；如果能力不足无法实际评估，第一时间寻求对方上级的支持。没人愿意做对自己毫无意义的事情在沟通前搞清对方的okr，找到可以和你的需求和他的贴合点，会让沟通结果达到双方满意的程度。施加压力每个人在工作中都会存在压力，那么你也可以作为施压方，你可以认为这是在CPU他人，但屠龙者终成恶龙只是时间问题，最重要的如何善用手头的一切资源。这里要注意的点是对事不对人，勿带情绪做事，情绪化对于成年人来说是一件特别幼稚的事。当然，也有可能通过各种方式的尝试后，还是没有得到理想结果；如果直接搁置最终结果是不利于自己的成果产出的，该怎么破局呢？可否在市面上找到一些类似的模版或无代码开发平台，自力更生呢？","level":"中级","type":"方法流程","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q317","src":"pm","srcName":"大厂 PM 八股文","no":317,"q":"训练模型时数据集都有哪些来源？","a":"机器学习用于模型训练的数据来源主要包括公开数据集、自有数据集、合作伙伴提供的数据集等。其中公开数据集是比较常见和容易获取的，例如 mageNet、COCO、MNIST等，自有数据集则是企业或组织自己收集、整理和标注的数据集，合作伙伴提供的数据集则是通过与其他企业、组织或个人的合作来获得的数据集。","level":"中级","type":"概念解释","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q318","src":"pm","srcName":"大厂 PM 八股文","no":318,"q":"工作中用什么样的方法清洗数据？","a":"数据清洗的主要包括：纠正错误、删除重复项、统一规格、修正逻辑、转换构造、数据压缩、补足残缺/空值、丢弃数据/变量。","level":"中级","type":"概念解释","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q319","src":"pm","srcName":"大厂 PM 八股文","no":319,"q":"模型构建流程通常包括几个阶段？","a":"1.筹备阶段：在这个阶段，我们与团队成员和相关利益相关者合作，明确项目的目标和范围。我们确定项目所需的数据集、技术要求和资源配备，并制定项目计划和时间表。\n\n2. 数据准备阶段：在这个阶段，我们收集和准备所需的数据集。这可能涉及数据的获取、清洗、标注和格式转换等工作。我们还会对数据进行分析和探索，以确保其质量和适用性。\n\n3. 模型开发阶段：在这个阶段，我们根据项目的需求和目标选择适当的机器学习算法和模型架构。我们进行特征工程，选择和提取最相关的特征，并进行模型训练和调优。在这个阶段，我们可能会进行多次迭代，以改进模型的性能和准确性。\n\n4. 模型评估阶段：在这个阶段，我们对训练好的模型进行评估和验证。我们使用验证数据集对模型进行测试，评估其性能和泛化能力。如果需要，我们可能会进行模型调整和改进，以达到预期的效果。\n\n5. 上线部署阶段：在这个阶段，我们将训练好的模型部署到实际应用环境中。我们将模型集成到相应的系统中，并进行系统测试和性能优化。同时，我们确保模型的稳定性、安全性和可扩展性。","level":"中级","type":"概念解释","tags":["团队协作与沟通","技术架构与选型"],"dims":[],"status":"已有详解","chapter":"八、工作场景类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 工作场景"},{"id":"q320","src":"pm","srcName":"大厂 PM 八股文","no":320,"q":"你怎么看待AI或者人工智能行业？对于整个AI行业有哪些认知？","a":"我对AI或人工智能行业持乐观态度。目前，人工智能已经在许多行业得到广泛应用，如金融、医疗、零售和制造等。AI技术的不断进步和成熟，为企业提供了巨大的机会和挑战。我认为人工智能行业正在迅速发展，并且将持续成为未来的关键技术领域。\n\n我密切关注AI行业中的一些新技术和新应用。例如，近年来，深度学习、自然语言处理和计算机视觉等技术的突破，使得人工智能在图像识别、语音识别、智能助理等领域取得了重大进展。此外，强化学习和自动驾驶等领域也受到了广泛的关注和投资。认知我的独特观点是，AI不仅仅是一项技术，而是一种推动社会进步和创新的力量。随着技术的不断发展和应用的扩大，AI将深刻改变人们的工作方式、生活方式和社会结构。同时，我认为在AI发展的过程中，我们需要关注伦理、隐私和安全等重要问题，以确保人工智能的发展能够造福整个社会。","level":"中级","type":"方法流程","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"九、行业认知类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 行业认知"},{"id":"q321","src":"pm","srcName":"大厂 PM 八股文","no":321,"q":"结合我们公司的业务场景？通过AI技术可以做哪些工作来提升用户体验？","a":"通过AI技术，可以在业务场景中提升用户体验的多个方面。举例来说，对于电商平台，AI可以通过推荐系统个性化推荐商品，提供更准确的搜索结果，从而提高用户的购物体验。在客服领域，AI可以通过自然语言处理和智能对话系统，实现智能客服，提供快速、准确的问题解答和服务。在智能家居领域，AI可以实现智能语音助手，使用户可以通过语音控制设备，提供更便捷的生活体验。总的来说，AI技术可以帮助优化业务流程，提高效率，减少人为错误，提供个性化的服务，从而提升用户的满意度和体验。\n\n1. 工作做的外呼机器人是多轮对话吗，话术以及流程如何设置\n\n2. 看你经历主要对语音语义，nlp比较熟悉吧，那么你讲讲相关技术和内容？\n\n3. 然后又是深问过往经历，问过做的用户分级策略是怎么回事？\n\n4.那么你刚才说的这种策略，那么你想到如何去证明你的策略的有效性呢？\n\n5. 策略写好之后，你想过如何去应用吗？\n\n6. 不同业务方同时提出都要使用这个策略，你如何进行沟通并评判优先级\n\n7. 用过抖音吗，知道抖音的广告形式吗，你如何理解广告技术和投放相关内容吗？\n\n8. 如果业务方需要一个完美的短视频广告，利用AI技术可以从哪些角度进行赋能\n\n9.针对素材很少的情况下为了产出同等要求的视频广告，从计算机视觉，图像处理角度哪些技术可以应用到视频制作。","level":"中级","type":"场景设计","tags":["行业趋势与职业发展"],"dims":[],"status":"已有详解","chapter":"九、行业认知类","round":"","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《大厂产品经理面试题八股文》截图 · 行业认知"},{"id":"q322","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":322,"q":"请做一个自我介绍","a":"回答示例（1.5-2分钟，重在“标签+场景+动力”）\n\n面试官好，我叫［姓名］，之前在［某公司/某业务线］做C端产品，两年内主导过［某功能］，日活提升了30%。这让我积累了很强的用户洞察和快速迭代能力。为什么转型AI产品？因为我发现传统产品做到一定程度，体验优化会遇到天花板，而AI（尤其大模型）能真正解决很多以前“只能人工做”的事。比如我之前负责的内容社区，用户最痛的是“长图文转短视频”，靠人工剪辑成本极高—这让我强烈意识到，AI不是功能点缀，而是生产关系的变革。为了补技术课，我自学了提示词工程、RAG原理，还自己用Coze搭过一个客服助手demo，跑通了“用户问-知识库召回-模型回答”的闭环。我的优势在于：既懂C端用户心理，又能跟算法工程师聊清楚badcase类型和模型优化方向。今天非常希望能加入贵公司的AI产品团队，用AI真正降低用户的操作门槛。\n\n为什么能加分：快速给出能力标签（C端增长+用户洞察），并用具体场景表达对AI的“真需求”而非跟风，最后体现了技术学习行动（demo、RAG原理）。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q323","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":323,"q":"你是哪里人，平常的性格特点是什么？这种性格如何适配AI产品经理的工作？","a":"回答示例（拿地域特点+性格与AI产品经理能力模型强挂钩）\n\n我是河北人，从小就比较直接、敢表达，性格上主要有三个特点：\n\n• 好奇心重：遇到一个新事物，喜欢拆解到底层原理。比如大模型为什么会产生幻觉，我会去看注意力机制和概率生成逻辑—这种探究习惯让我能跟算法同学聊到同一层粒度。\n\n• 有条理的“整理控”：我平时喜欢用表格和流程图梳理信息。做AI产品，面对海量badcase、用户反馈、模型效果评测时，这种条理性帮我快速归类问题，找到最高ROI的优化点。\n\n• 对模糊性的高容忍度：Al产品的效果往往是不确定的，同样的输入可能输出不同结果。我不会因此焦虑，而是习惯用“置信度+人工兜底”的产品设计思路来管理用户预期。举个例子，在之前做［某功能］时，模型准确率只有70%，团队很慌，我用性格里的整理控做了错误分类表，再用高容忍度接受了“不是100%才能上线”，而是设计了“当置信度\u003c0.6时展示参考来源”的交互，结果用户满意度反而提升。所以我认为我的性格天然适合AI产品这种探索性强、需要理性质疑、同时接受不确定性的工作。\n\n为什么能加分：不空洞地说“认真负责”，而是把性格特质翻译成AI产品经理的具体行为（归类badcase、置信度设计、接受不确定性），面试官会觉得很“对味”。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q324","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":324,"q":"过往经历中遇到过的最大挫折是什么？具体是如何应对和复盘的？","a":"回答示例（选一个与AI产品能力可关联的真实挫折，重点在“应对+可迁移复盘”）\n\n最大的挫折是之前
