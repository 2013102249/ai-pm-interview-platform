s behind a “spike\" in gradient norm by a few training steps. Such spikes areusually caused by the embedding layer's abnoral gradients, as we observe that its gradient normis ofien several magnitude Iarger that those of other layers in GLM-130B's early saigs aefving tSf.Figure 4 （a））. In addition, it tends to fluctuate dramatically in the early training. The problem is\n\nFinally, we find the gradient shrink on embedding laycrs could overcome loss spikes and thus sta-bilize GL.M-130B's training. It is first used in the multi-modal transformer Cog View （Ding et al.，\n\n其实这块我有个自己的想法，e和a 是否也可以做衰减，随着训练过程逐渐减小，来避免loss spike的现象\n\n另外假设我们能一次性加载所有样本进行训练（实际上不可能做到），是否还会出现loss spike的现象最后目前流行的fp8，fp16混合训练，如果upscale设置的过小，导致梯度在进入优化器之前就下溢，是不是会增加浅层梯度长时间不更新的可能性，进而增加loss spike的出现的频率。（这么看来似乎提升upscale大小以及优化e大小是进一步提升模型效果的一个思路）","level":"高级","type":"观点判断","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q406","src":"topic","srcName":"专题题库","no":406,"q":"什么是推荐系统？","a":"• 推荐系统是信息过滤系统的一个子类，旨在预测用户对某个项目的评级或偏好。\n\n• 推荐系统通常使用协同过滤和基于内容的过滤中的一种或两种，以及其他系统，如基于知识的系统。","level":"中级","type":"概念解释","tags":["技术架构与选型","机器学习基础"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q407","src":"topic","srcName":"专题题库","no":407,"q":"基于知识的推荐系统与协作和基于内容的推荐系统有何不同？","a":"• 基于内容和协作系统的推荐主要基于历史数据。\n\n• 基于知识的系统的建议是基于用户对他们想要的东西的直接规范。\n\n•知识型系统的一个重要特征是针对特定领域的高度定制。这种定制是通过使用知识库来实现的，知识库以约束或相似性度量的形式对相关领域知识进行编码。","level":"中级","type":"对比分析","tags":["技术架构与选型","机器学习基础"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q408","src":"topic","srcName":"专题题库","no":408,"q":"协作推荐系统和基于内容的推荐系统有什么区别？","a":"• 推荐系统的协作方法是仅基于用户和项目之间记录的过去交互来产生新推荐的方法。\n\n• 与协作方法不同，基于内容的方法使用有关用户和/或项目的附加信息。\n\n• 现实世界中，使用协同过滤的一个例子是Last.fm公司。他们会通过观察用户定期收听的乐队和单曲，并将它们与其他用户的收听行为进行比较，创建一个推荐歌曲的“电台”。这种方法充分利用了用户的行为。\n\n• Pandora 采用基于内容的推荐系统方法。它利用歌曲或艺术家的属性来查找播放具有类似属性的音乐的“电台”。用户反馈用于优化电台的结果，当用户“不喜欢”某首歌曲时，电台会淡化某些属性；当用户“喜欢”某首歌曲时，电台会强调其他属性。\n\n匐圍","level":"中级","type":"对比分析","tags":["技术架构与选型","机器学习基础"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q409","src":"topic","srcName":"专题题库","no":409,"q":"推荐系统中存在哪些特定领域的挑战？","a":"• 在不同的领域中，例如时间数据、基于位置的数据和社交数据，推荐的上下文起着至关重要的作用。上下文推荐系统的概念是为了解决这些领域中出现的额外附加信息而开发的。\n\n• 此概念针对不同类型的数据进行了不同的修改。\n\n• 一些特定领域的应用是基于上下文的推荐系统、时间敏感的推荐系统、基于位置的推荐系统和社交推荐系统。","level":"中级","type":"概念解释","tags":["技术架构与选型","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q410","src":"topic","srcName":"专题题库","no":410,"q":"推荐系统有哪些应用？","a":"• 查询推荐：一个有趣的问题是如何使用weblog向用户推荐查询。目前还不清楚查询推荐是否应被视为个性化应用，因为推荐通常是针对特定会话的（即，取决于用户在短会话中的行为历史），而不使用长期用户行为。这是因为查询通常是在多个会话中无法使用用户重新识别机制的场景下发出的。\n\n•门户内容和新闻个性化：许多在线门户网站都具有强大的用户识别机制，可通过该机制识别回访用户。在这种情况下，可以个性化提供给用户的内容。新闻个性化引擎（例如 Google 新闻）也采用这种方法，其中使用Gmail 帐户进行用户识别。新闻个性化通常基于包含用户行为（点击）的隐式反馈，而不是显式评级。\n\n• 计算广告：计算广告是一种推荐形式，因为公司希望能够根据相关上下文（网页或搜索查询）为用户识别广告。因此，推荐系统的许多想法直接应用于计算广告领域。","level":"中级","type":"概念解释","tags":["技术架构与选型","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q411","src":"topic","srcName":"专题题库","no":411,"q":"什么是基于模型的协作方法？","a":"• 基于模型的协作方法仅依赖于用户-项目交互信息并假设一个潜在模型来解释这些交互。\n\n• 例如，矩阵分解算法包括将巨大而稀疏的用户-项目交互矩阵分解为两个较小且密集的矩阵的乘积：用户因子矩阵（包含用户表示）乘以因子-项目矩阵（包含项目表示）。","level":"中级","type":"概念解释","tags":["技术架构与选型","机器学习基础"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q412","src":"topic","srcName":"专题题库","no":412,"q":"基于内容的系统的基本组成部分是什么？","a":"基于组件的系统的各个组件如下：\n\n1. 预处理和特征提取：基于内容的系统用于各种领域，例如网页、产品描述、新闻、音乐特征等。在大多数情况下，从这些不同的来源提取特征，以将其转换为基子关键字的向量空间表示。这是任何基于内容的推荐系统的第一步，并且它高度特定于领域。然而，正确提取最具信息量的特征对于任何基于内容的推荐系统的有效运行都是必不可少的。\n\n2. 基于内容的用户资料学习：基于内容的模型特定于特定用户。因此，构建用户特定模型以根据用户购买或评价商品的历史记录来预测用户对商品的兴趣。为了实现此目标，利用用户反馈，这些反馈可能以先前指定的评级（显式反馈）或用户活动（隐式反馈）的形式表现出来。此类反馈与商品的属性结合使用以构建训练数据。在此训练数据上构建学习模型。生成的模型称为用户资料，因为它在概念上将用户兴趣与商品属性联系起来。\n\n3. 过滤和推荐：在此步骤中，使用从前面步骤中学习到的模型为特定用户提供商品推荐。此步骤需要非常高效，因为预测需要实时进行。","level":"中级","type":"概念解释","tags":["技术架构与选型","机器学习基础"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"推荐系统","expNo":null,"expTitle":null,"origin":"《推荐系统面试中最常见的问题》截图"},{"id":"q413","src":"topic","srcName":"专题题库","no":413,"q":"目前主流的开源模型体系有哪些？","a":"…• 介绍一下FFN块计算公式？\n\n• 介绍一下GeLU计算公式？\n\n• 介绍一下Swish计t算公式？\n\n• 介绍一下使用GLU线性门控单元的FFN块计算公式？？\n\n• 介绍一下使用GeLU的GLU块计算公式？\n\n• 介绍一下使用Swish的GLU块计算公式？\n\n• 各LLMs都使用哪种激活函数？\n\n心目前主流的开源LLM（语言模型）模型体系包括以下几个：\n\n1. GPT 系列：由 OpenAI 发布的一系列基于 Transformer 架构的语言模型，包括GPT、GPT-2、GPT-3 等。GPT模型通过在大规模无标签文本上进行预训练，然后在特定任务上进行微调，具有很强的生成能力和语言理解能力。\n\n2. BERT：由Gooogle发布的一种基于 Transformer 架构的双向预训练语言模型。BERT 模型通过在大规模无标签文本上进行预训练，然后在下游任务上进行微调，具有强大的语言有理解能力和表征能力。\n\n3. XLNet ：由CMU和GoogleBrain发布的一种基于 Transformer 架构的自回归预训练语言模型。XLNet 模型通过自回归方式预训练，可以建模全局依赖关系，具有更好的语言建模能力和生成能力。\n\n4. ROBERTa：由Facebook发布的一种基于 Transformer 架构的预训练语言模型。ROBERTa 模型在 BERT 的基础上进行了改进，通过更大规模的数据和更长的训练时间，取得了更好的性能。\n\n5. T5：由Google发布的一种基于 Transformer 架构的多任务预训练语言模型。T5模型通过在大规模数据集上进行预训练，可以用于多种自然语言处理任务，如文本分类、机器翻译、问答等。这些模型在自然语言处理领域取得了显著的成果，并被广泛应用于各种任务和应用中。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 一、基础面"},{"id":"q414","src":"topic","srcName":"专题题库","no":414,"q":"prefixLM 和 causal LM 区别是什么？","a":"PrefixLM（前缀语言模型）和CausaLLM（因果语言模型）是两种种不同类型的语言模型，它们的区别在于生成文本的方式和训练目标。\n\n1. PrefixLM：前缀语言模型是一种生成模型，它在生成每个词时都可以考虑之前的上下文信息。在生成时，前缀语言模型会根据给定的前缀（即部分文本序列）预测下一个可能的词。这种模型可以用于文本生成、机器翻译等任务。\n\n2. Causal LM：因果语言模型是一种自回归模型，它只能根据之前的文本生成后续的文本，而不能根据后续的文本生成之前的文本。在训练时，因果语言模型的目标是预测下一个词的概率，给定之前的所有词作为上下文。这种模型可以用于文本生成、语言建模等任务。\n\n总结来说，前缀语言模型可以根据给定的前缀生成后续的文本，而因果语言模型只能根据之前的文本生成后续的文本。它们的训练目标和生成方式略不有不同，适用于不同的任务和应用场景。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 一、基础面"},{"id":"q415","src":"topic","srcName":"专题题库","no":415,"q":"涌现能力是啥原因？","a":"大模型的涌现能力主要是由以下几个原因造成的：\n\n＜ 1. 数据量的增加：随着互联网的发展和数字化信息的爆炸增长，可用于训练模型的数据量大大增加。更多的数据可以提供更丰富、更广泛的语言知识和语境，使得模型能够更好地理解和生成文本。\n\n2. 计算能力的提升：随着计算硬件的发展，特别是图形处理器（GPU）和专用的AI芯片（如TPU）的出现，计算能力大幅提升。这使得训练更大、更复杂的模型成为可能，从而提高了模型的性能和涌现能力。\n\n3. 模型架构的改进：近年来，一些新的模型架构被引入，如Transformer它在处理序列数据上表现出色。这些新的架构通过引入自注意力机制等技术，使得模型能够更好地捕捉长距离的依赖关系和语言结构，提高了模型的表达能力和生成能力。\n\n4. 预训练和微调的方法：预训练和微调是一种有效的训练策略，可以在大规模无标签数据上进行预训练，然后在特定任务上进行微调。这种方法可可以使模型从大规模数据中学习到更丰富的语言知识和语义理解，从而提高模型的涌现能力。\n\n、综上所述，大模型的涌现能力是由数据量的增加、计算能力的提升、模型架构的改进以及预训练和微调等因素共同作用的结果。这些因素的进步使得大模型能够更好地理解和生成文本，为自然语言处理领域带来了显著的进展。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 一、基础面"},{"id":"q416","src":"topic","srcName":"专题题库","no":416,"q":"大模型LLM的架构介绍？","a":"LLM （Large LanguageModel）是指基于大规模数据和多数量的语言模型。具体的架构可以有多种选择，以下是一种常见的大模型LLM的架构介绍：\n\n1. Transformer 架构：LLM 常使用 Transformer 架构，它是一种基于自注意力机制的序列模型。Transformer 架构田多个编码器层和解码器层组成，每个层都包含多头自注意力机制和前馈神经网络。这种架构可以捕捉长距离的依赖关系和语言结构，适用于处理大规模语言数据。\n\n2. 自注意力机制（Self-Attention）：自注意力机制是 Transformer 架构的核心组件之一。它允许模型在生成每个词时，根据输入序列中的其他词来计算该词的表示。自注意力机制能够动态地为每个词分配不同的权重，从而更好地捕捉上下文信息。\n\n3. 多头注意力（Multi-HeadAttention）：多头注意力是自注意力机制的一种扩展形式。它将自注意力机制应用多次，每次使用不同的权重矩阵进行计算，得到多个注意力头。多头注意力可以提供更丰富的上下文表示，增强模型的表达能力。\n\n4. 前馈神经网络（Feed-Forward Network）：在 Transformer 架构中，每个注意力层后面都有一个前馈神经网络。前馈神经网络由两个全连接层组成，通过非线性激活函数（如ReLU）进行变换。它可以对注意力层输出的表示进行进一步的映射和调整。\n\n5. 预训练和微调：LLM通常采用预训练和微调的方法进行训练。预训练阶段使用大规模无标签数据，通过自监督学习等方法进行训练，使模型学习到丰富的语言知识。微调阶段使用有标签的特定任务数据，如文本生成、机器翻译等，通过有监督学习进行模型的微调和优化。需要注意的是，大模型LLM的具体架构可能会因不同的研究和应用而有所不同。上述介绍的是一种常见的架构，但实际应用中可能会有一些变体或改进。\n\n1、LLMS复读机问题","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 一、基础面"},{"id":"q417","src":"topic","srcName":"专题题库","no":417,"q":"什么是LLMS复读机问题？","a":"LLMS复读机 问题指的是：大型语言模型（LLMS）在生成文本时出现的一种现象，即模型倾向于无限地复制输入的文本或者以过度频繁的方式重复相同的句子或短语。这种现象使得模型的输出缺乏多样性和创造性，给用户带来了不好的体验。复读机问题可能出现的原因包括：\n\n数据偏差：大型语言模型通常是通过预训练阶段使用大规模无标签数据进行训练的。如果训练数据中存在大量的重复文本或者某些特定的句子或知语出现频率较高，模型在生成文本时可能会倾向于复制这些常见的模式。\n\n训练目标的限制：大型语言模型的训练通常是基于自监督学习的方法，通过预测下一个词或掩盖词来学习语言模型。这样的训练目标可能使得模型更倾向于生成与输入相似的文本，导致复读\n\n机问题的出现。\n\nX缺乏多样性的训练数据：虽然大型语言模型可以处理大规规模的数据，但如果训练数据中缺乏多样性的语言表达和语境，模型可能无法学习到足够的多样性和创造性，导致复读机问题的出现。为了解决复读机问题，可以采取以下策略：\n\n1. 多样性训练数据：在训练阶段，尽量使用多样性的语料库来训练模型，避免数据偏差和重复文本的问题。\n\n2. 引入噪声：在生成文本时，可以引入一些随机性或噪声，例如通过采样不同的词或短语，或者引入随机的变换操作，以增加生成文本的多样性。\n\n3. 温度参数调整：温度参数是用来控制生成文本的多样性的一个参数。通过调整温度参数的值，可以控制生成文本的独创性和多样性，从而减少复读机问题的出现。\n\n4. 后处理和过滤：对生成的文本进行后处理和过滤，去除重复的句子或短语，以提高生成文本的质量和多样性。\n\n需要注意的是复读机问题是大型语言模型面临的一个挑战，解决这个问题是一个复杂的任务，需要综合考虑数据、训练目标、模型架构和生成策略等多个因素。目前，研究人员和工程师们正在不断努力改进和优化大型语言模型，以提高其生成文本的多样性和创造性。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 二、进阶面"},{"id":"q418","src":"topic","srcName":"专题题库","no":418,"q":"为什么会出现LLMS复读机问题？","a":"出现LLMS复读机问题可能有以下几个原因：\n\n1. 数据偏差：大型语言模型通常是通过预训练阶段使用大规模无标签数据进行训练的。如果训练数据中存在大量的重复文本或者某些特定的句子或短语出现频率较高，模型在生成文本时可能会倾向于复制！这些常见的模式。\n\n2. 训练目标的限制：大型语言模型的训练通常是基于自监督学习的方法，通过预测下一个词或掩盖词来学习语言模型。这样的训练目标可能使得模型更倾向于生成与输入相似的文本，导致复读机问题的出现。\n\n3. 缺乏多样性的训练数据：虽然大型语言模型可以处理大规模的数据，但如果训练数据中缺乏多样性的语言表达和语境，模型可能无法学习到足够的多样性和创造性，导致复读机问题的出现。\n\n4. 模型结构和参数设置：大型语言模型的结构和参数设置也可能对复读机问题产生影响。例如，模型的注意力机制和生成策略可能导致模型更倾向问于复制输入的文本。\n\n为了解决复读机问题，可以采取以下策略：\n\nX•多样性训练数据：在训练阶段，尽量使用多样性的语料库来训练东模型，避免数据偏差和重复文本的问题。\n\n• 引入噪声：在生成文本时，可以引入一些随机性或噪声，例如通过采样不同的词或短语，或者引入随机的变换操作，以增加生成文本的多样性。\n\n• 温度参数调整：温度参数是用来控制生成文本的多样性的一个参数。通过调整温度参数的值，可以控制生成文本的独创性和多样性，从而减少复该机问题的出现。\n\n• 后处理和过滤：对生成的文本进行后处理和过滤，去除重复的问子或短语，以提高生成文本的质量和多样性。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 二、进阶面"},{"id":"q419","src":"topic","srcName":"专题题库","no":419,"q":"如何缓解 LLMS复读机问题？","a":"为了缓解LLMS复读机问题，可以尝试以下方法：\n\n1. 多样性训练数据：在训练阶段，使用多样性的语料库来训练模型，避免数据偏差和重复文本的问题。这可以包括从不同领域、不同来源和不同风格的文本中获取数据。\n\n2. 引入噪声：在生成文本时，引入一些随机性或噪声，例如通过采样不同的词或短语，或者引入随机的变换操作，以增加生成文本的多样性。这可以通过在生成过程中对模型的输出进行采样或添加随机性来实现。\n\n3. 温度参数调整：温度参数是用来控制生成文本的多样性的一个参数。通过调整温度参数的值，可以控制生成文本的独创性和多样性。较高的温度值会增加随机性，从而减少复读机问题的出现。\n\n4. Beam搜索调整：在生成文本时，可以调整Bcam搜索算法的参数。Bcam搜索是种常用的生成策略，它在生成过程中维护了一个候选序列的集合。通过调整Beam大小和搜索宽度，可以控制生成文本的多样性和创造性。\n\n5. 后处理和过滤：对生成的文本进行后处理和过滤，去除重复的句子或短语，以提高生成文本的质量和多样性。可以使用文本相似度计算方法或规则来检测和去除重复的文本。\n\n6. 人工干预和控制：对于关键任务或敏感场景，可以引入人工干预和控制机制，对生成的文本进行审查和筛选，确保生成结果的准确性和多样性。\n\n需要注意的是，缓解LLMS复读机 问题是一个复杂的任务，没有一种通用的解决方案。不同的方法可能适用于不同的场景和任务，需要根据具体情况进行选择和调整。此外，解决复读机问题还需要综合考虑数据、训练目标、模型架构和生成策略等多个因素，需要进一步的研究和实践来提高大型语言模型的生成文本多样性和创造性。\n\n2. Ilama系列问题","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 二、进阶面"},{"id":"q420","src":"topic","srcName":"专题题库","no":420,"q":"llama输入句子长度理论上可以无限长吗？","a":"理论上来说，LLMs可以处理任意长度的输入人句子，但实际上存在一些限制和挑战。下面是一些相关的考虑因素：\n\n1. 计算资源：生成长句子需要更多的计算资源，包括内存和计算时间。由于LLMs通常是基于神经网络的模型，计算长句子可能会导致内存不足或计算时间过长的问题。\n\n2. 模型训练和推理：训练和推理长句子可能会面临一些挑战。，在训练阶段，处理长句子可能会导致梯度消失或梯度爆炸的问题，影响模型的收敛性和训练效果。在推理阶段，生成长句子可能会增加模型的错误率和生成时间。\n\n3. 上下文建模：LLMS是基于上下文建模的模型，长句子的上下文可能会更加复杂和深层。模型需要能够捕捉长句子中的语义和语法结构，以生成准确和连贯的文本。尽管存在这些挑战，研究人员和工程师们已经在不断努力改进和优化LLMS，以处理更长的句子。例如，可以来用分块的方式处理长句子，将其分成多个较短的片段进行处理。此外，还可以通过增加计算资源、优化模型结构和参数设置，以及使用更高效的推理算法来提高LLMs处理长句子的能力。\n\n值得注意的是，实际应用中，长句子的处理可能还受到应用场景、任务需求和资源限制等因素的影响。因此，在使用 LLMS处理长句子时，需要综合考虑这些因素，并根据具体情况进行选择和调整","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"阿里大模型","expNo":null,"expTitle":null,"origin":"《阿里大模型面试真题》截图 · 二、进阶面"},{"id":"q421","src":"topic","srcName":"专题题库","no":421,"q":"能否概述一下 Transformers 的架构？","a":"我们首先将模型视为一个黑盒子。在机器翻译应用程序中，它会接受一种语言的句子，然后输出另一种语言的翻译，如下所示：\n\n深入研究黑匣子，变压器内部有：\n\n• 编码组件：它是一堆 N编码器\n\n• 解码组件：解码器堆栈 N\n\n• 以及它们之间的联系只\n\n现在，每个编码器被分解为两个子层：自注意力层和前馈神经网络层输入首先流经自注意力层，自注意力层的输出被馈送到前馈神经网络。这个序列不断重复，直到到达最后一个编码器最后，解码器接收编码器组件的输出，同样具有自注意层和前馈层，流程与之前类似，但是在它们之","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q422","src":"topic","srcName":"专题题库","no":422,"q":"下一句预测（NSP）在语言建模中是如何使用的？","a":"下一句预测（NSP）用于语言建模，是 BERT 模型背后训练过程的一半（另一半是掩码语言建模（MLM））。下一句预测训练的目标是预测一个句子是否在逻辑上跟随呈现给模型的另一个句子。在训练过程中，模型会得到成对的句子，其中一些句子在原文中是连续的，而另一些则不是。然后，模型会接受训练，以预测给定的一对句子是否相邻。这使模型能够理句子之间的长期依赖关系。研究人员发现，如果没有 NSP，BERT 在每个指标上的表现都会变差—因此它的使用与语言建模相关。","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q423","src":"topic","srcName":"专题题库","no":423,"q":"如何评价语言模型的性能？","a":"在 NLP 中，评估语言模型有两种方式：外部评估和内部评估。\n\n• 内在评估可以捕获模型捕获其应该捕获的内容（例如概率）的程度。\n\n• 外部评估（或基于任务的评估））捕捉模型在特定任务中的有用程度。LM 的一个常见内在评估是困惑度。它是模型预测单词的逆概率的几何平均值。直观地说，困惑度意味着惊讶。我们测量模型看到新数据时的惊讶程度。困惑度越低，训练效果越好。另一个常见的衡量标准是交叉熵，它是困惑度的对数（底数）。根据经验法则，困惑度的降低是值得注意的。外部评估将取决于任务。例如：对于语音识别，我们可以通过运行语音识别器两次（每个语言模型各一次）来比较两种语言模型的性能，看看哪个模型的转录更准确。","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q424","src":"topic","srcName":"专题题库","no":424,"q":"生成语言模型如何工作？","a":"最基本的想法如下：它们将n 标记作为输入，并产生 one 标记作为输出。\n\n标记是一段文本。在 OpenAI GPT 模型中，常用短词通常对应单个标记，而长词和不常用词通常会被拆分成多个标记。这个基本思想应用于扩展窗口模式。你给它，输入标记，它产生 one 标记输出，然后它将输出标记合并为下一次送代的输入的一部分，产生新的标记输出，依此类推。这个模式不断重复，直到达到停止条件，表明它已完成生成您需要的所有文本。\n\n现在，输出背后是所有可能标记的概率分布。模型的作用是返回一个向量，其中每个条目表示选择特定标记的概率。\n\n此概率分布来自训练阶段。在训练期间，模型会接触大量文本，并调整其权重以在给定输入标记序列的情，况下预测良好的概率分布。GPT生成模型是通过大量互联网数据进行训练的，因此它们的预测反映了它们所见过的各种信息。","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q425","src":"topic","srcName":"专题题库","no":425,"q":"大型语言模型上下文中的标记是什么？","a":"ChatGPT 和其他LLM 依赖于将输入文本分解成片段。每个片段大约是一个单词大小的字符序列或更小的片段。我们称这些为子词标记。该过程称为标记化，使用标记器完成。、“bur” 和标记可以是单词，也可以是字符块。例如，“hamburger”一词被分解为标记“ham”“ger”，而i“pear”等简短而常见的单词则是单个标记。许多标记以空格开头，例如“hello” 和\n\n这些模型理解这些标记之间的统计关系，并且擅长生成标记序列中的下一个标记。\n\n给定 API 请求中处理的令牌数量取决于输入和输出的长度。根据粗略的经验法则，令牌 1大约为英文文本的4 字符或单词。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q426","src":"topic","srcName":"专题题库","no":426,"q":"在 NLP 中使用基于 Transformer 的架构与基于 LSTM的架构有何优势？","a":"为了在Transformer之前创建序列到序列模型，我们使用了著名的LSTM 及其编码器-解码器架构，其中\n\n•〝编码器”部分创建了 单词序列的矢量表示。\n\n•〝解码器”从向量表示中返回一个单词序列。LSTM模型考虑到了单词之间的相互依赖性，因此我们需要前一个状态的输入才能对当前状态进行任何操作。该模型有一个限制：训练速度相对较慢，输入序列不能并行传递。现在，Transformer的理念是不使用循环网络，而是仅使用位于其架构核心的注意力机制来保持序列中单词的相互依赖性。注意力机制衡量两个序列中两个元素之间的关联程度。在基于 Transformer 的架构中，注意力机制应用于单个序列（也称为自注意力层）。自注意力层确定同一序列中不同单词的相互依赖性，以将相关表示与其关联。以这句话为例：“狗没有过马路，因为它太累了”。对人类来说，“它”显然指的是“狗”，而不是“街道”。因此，自注意力过程的目标是检测“狗”和“它”之间的联系。与前代产品相比，这一特性使Transformer 的训练速度更快，而且事实证明，它们对噪声和缺失数据的鲁棒性更强。另外，在上下文嵌入中，Transformer 可以从上下文中提取信息来纠正缺失或噪声数据，这是其他神经网络无法提供的功能。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q427","src":"topic","srcName":"专题题库","no":427,"q":"能提供一些大型语言模型中对齐问题的例子吗？","a":"一致性问题是指模型的目标和行为与人类价值观和期望的一致程度。大型语言模型，例如 GPT-3，基于来自互联网的大量文本数据进行训练，能够生成类似人类的文本，但它们可能并不总是产生符合人类期望或理想值的输出。\n\n大型语言模型中的对齐问题通常表现为：\n\n1. 缺乏帮助：当模型没有遵循用户的明确指示时。\n\n2. 幻觉：当模型编造不存在或错误的事实时。\n\n3. 缺乏可解释性：人类很难理解模型如何得出特定的决定或预测。\n\n4. 产生有偏见或有害的输出：当使用有偏见/有害数据训练的语言模型时，即使没有明确指示这样做，也可能在其输出中重现这种输出。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q428","src":"topic","srcName":"专题题库","no":428,"q":"自适应 Softmax在大型语言模型中有何用处？","a":"自适应 softmax在大型语言模型中非常有用，因为它可以在处理大型词汇表时进行高效的训练和推理。传统的softmax涉及计算词汇表中每个单词的概率，随着词汇量的增长，计算成本会变得很高。自适应 softmax根据单词的常见程度将单词分组到聚类中，从而减少了所需的计算次数。这减少了计算词汇表概率分布所需的计算次数。通过使用自适应 softmax，大型语言模型可以得到更高效的训练和运行，从而实现更快的实验和开发。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q429","src":"topic","srcName":"专题题库","no":429,"q":"BERT训练如何进行？","a":"BERT（来自 Transformers 的双向编码器表示）利用变换器架构来学习文本中单词之间的上下文关系，并且由于 BERT 的目标是生成语言表示模型，因此它只需要编码器部分。BERT编码器的输入是一系列token，这些token 首先被转换成/向量，然后在神经网络中处理。然后，BERT 算法利用以下两种训练技术：\n\n•掩码 LM（MLM）：在将单词序列输入BERT之前，每个序列中的一定比例的单词会被替换为一个【MASK】 标记。然后，该模型会尝试根据序列中其他非掩码单词提供的上下文来预测掩码单词的原始值。\n\n• 下一句预测（NSP）：模型在预训练期间将两个掩码句子连接起来作为输入。有时它们对应于原文中彼此相邻的句子，有时则不是。然后，模型必须预测这两个句子是否彼此相连。\n\n现在，为了帮助模型在训练中区分这两个句子，输入会用一些额外的元数据进行处理，例如：|［CLS］在第一个句子的标记嵌入：开头插入一个标记，并［SEP］ 在每\n\n个句子的结尾插入一个标记。段嵌入：这些分配标记来识别每个句子并允许编码器区分它们。位置嵌入：指示句子中的标记位置。\n\n然后，为了预测第二句话是否确实与第一句话有关，执行以下步骤：\n\n• 整个输入序列都经过 Transformer模型。\n\n• 使用一个简单的分类层（学习到的权重和偏差矩阵），将标记的输出转换为形状向量。\n\n• 在训练BERT模型时，Masked LM和Next Sentence Prediction一起训练，目标是最小化两种策略的组合损失函数。","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q430","src":"topic","srcName":"专题题库","no":430,"q":"Transformer 网络比CNN和RNN有何优势？","a":"•使用RNN，您必须逐字逐句地访问最后一个单词的单元。如果网络形成的范围很长，则可能需要几个步骤才能记住，每个掩码状态（单词中的输出向量）都依赖于前一个掩码状态。这对GPU来说是一个主要问题。这种顺序性是并行化过程的障碍。此外，在这种序列太长的情况下，模型往往会一个接一个地忘记远处位置的内容，或者与后面位置的內容混合在一起。通常，每当涉及到长期依赖关系时，我们都知道RNN会受到消失梯度问题的影响。\n\n• 早期的努力是尝试使用顺序卷积来解決依赖性问题，以解决RNM问题。采用长序列并应用卷积。缺点是CNN方法需要很多层来摘获顺序数据结构中的长期依赖性，但永远不会成功，或者使网络变得太大而最终变得不切实际。\n\n• Transformer提出了一种新方法，它提出对每个单词进行编码并应用注意力机制来连接两个较远的单词，然后解码器根据当前单词之前的所有单词来预测句子。此工作流程可以并行化，从而加速学习并解决长期依赖问题。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q431","src":"topic","srcName":"专题题库","no":431,"q":"有没有办法训练大型语言模型（LLM）来存储特定的上下文？","a":"目前“记住”过去对话的唯一方法是将过去的对话包含在提示中。\n\n在某些时候，你会达到令牌限制（如果你聊天的时间足够长）。每个 GPT-3模型都有你可以传递给它的令牌的最大数量。在的情况下text-davinci-003，它是4096令牌。当你达到此限制时，\n\nOpenAlAPL 将抛出错误。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q432","src":"topic","srcName":"专题题库","no":432,"q":"您可以在 LLM 中使用哪些迁移学习技术？","a":"有几种迁移学习技术在LLM中常用。以下是三种最流行的技术：\n\nV• 基于特征的迁移学习：该技术涉及使用预先训练的语言模型作为特征提取器，然后在提取的特征之上为目标任务训练单独的模型。\n\n•微调：涉及采用预先训练的语言模型并针对特定任务进行训练。有时在微调时，您可以保持模型权重不变，只需添加要训练的新层。其他时候，您可以一次慢慢解冻一个层。您还可以在预训练时使用未标记的数据，通过屏蔽单词并尝试预测哪个单词被屏蔽。\n\n• 多任务学习：涉及同时在多个相关任务上训练单个模型。其理念是，模型将学会在任务之间共享信息，从而提高每个任务的性能。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q433","src":"topic","srcName":"专题题库","no":433,"q":"什么是迁移学习？为什么它很重要？","a":"预先训练的模型（例如GPT-3）本质上为开发人员承担了大量艰苦的工作：它教会模型对问题有基本的了解，并以通用格式提供解决方案。通过迁移学习，假设预先训练的模型可以生成基本解决方案，我们可以将学习迁移到另一个环境中。因此，我们将能够使用微调根据我们的要求定制模型，而无需重新训练整个模型。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q434","src":"topic","srcName":"专题题库","no":434,"q":"编码器和解码器模型有什么区别？","a":"编码器型号：\n\n• 它们只使用了Transformer 模型的编码器。在每个阶段，注意力层都可以访问初始句子中的所有单词。\n\n• 这些模型的预训练通常围绕以某种方式破坏给定的句子（例如，通过掩盖其中的随机单词）并要求模型查找或重建初始句子。\n\n• 它们最适合需要理解完整句子的任务，例如句子分类、命名实体识别（以及更一般的词分类）和提取问答。解码器型号：\n\n• 它们只使用Transformer 模型的解码器。在每个阶段，对于给定的单词，注意力层只能访问句子中位于该单词之前的单词。\n\n• 解码器模型的预训练通常围绕预测句子中的下一个单词进行。\n\n• 它们最适合涉及文本生成的任务。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q435","src":"topic","srcName":"专题题库","no":435,"q":"Wordpiece和 BPE有什么区别？","a":"WordPiece 和 BPE 都是子词标记算法。它们的工作原理是将单词分解为更小的单位，称为子词。然后我们定义所需的词汇量并不断添加子词，直到达到限制。\n\n• BPE 从训练数据中所有字符的词汇表开始。然后，它会送代合并最常见的字符对，直到达到所需的词汇表大小。合并是贪梦的，这意味着最频繁的字符对总是首先合并。\n\n• WordPiece 也从训练数据中所有字符的词汇表开始。然后，它使用统计模型来选择最有可能提高训练数据可能性的字符对，直到达到词汇量。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q436","src":"topic","srcName":"专题题库","no":436,"q":"（LLM）中的全局注意力和局部注意力有何区别？","a":"考虑例句 “Wally 在哪里”，应将其翻译为意大利语“Dove e Wally”。在 Transformer 架构中，编码器逐字处理输入，产生三个不同的隐藏状态。然后，注意层从所有编码器隐藏状态（通常带有加权和）中生成单个困定大小的上下文向量，它表示在处理此类输入词时必须给予该上下文的“注意力”这时全局和局部主意力就会发挥作用。全局注意力机制在创建上下文向量时会考虑所有隐藏状态。应用时会产生大量计算。这是因为必须考虑所有隐藏状态，将它们连接成矩阵，然后由NN 处理以计算它们的权重。\n\n另一方面，局部注意力在创建上下文向量时只考虑所有隐藏状态的子集。子集可以通过多种不同的方式获得，例如使用单调对齐和预测对齐。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q437","src":"topic","srcName":"专题题库","no":437,"q":"LLM 中的next-token-prediction和 masked-language-modeling有什么区别？","a":"两者都是训练大型语言模型的技术，涉及预测单词序列中的单词。\n\n1. 下一个标记预测：模型被赋予一个单词序列，目标是预测下一个单词。例如，给定短语Hannahis.______该模型将尝试预测：\n\n• 汉娜（Hannah）是姐姐\n\n• 汉娜是朋友\n\n• 汉娜（Hannah）是一名营销人员\n\n• 汉娜（Hannah）是一名喜剧演员\n\n1.掩码语言建模：为模型提供一系列单词，目标是预测中间的掩码单词。例如，给定短语“Jakomask reading”，模型将尝试填补空白，因为，\n\n• Jacob 害怕读书\n\n• Jacob 喜欢读书\n\n• Jacob 喜欢读书\n\n• Jacon 讨厌读书","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q438","src":"topic","srcName":"专题题库","no":438,"q":"为什么基于 Transformer 的架构中需要多头注意力机制？","a":"就拿这个句子为例：巴克很可爱，他是一只狗。这里，如果我们以单词“dog”为例，从语法上讲，我们可以理解单词“Bark ”“cute ”和“he ”应该与单词“dog”具有某种意义或相关性。这些单词表示这只狗的名字叫 Bark，它是一只公狗，它是一只可爱的狗。简单来说，单靠一个注意力机制可能无法正确识别这三个词与‘dog’相关，而我们可以感觉到，在这里最好使用三个注意力来表示与‘dog’相关的三个词。因此，为了克服使用单一注意力机制的一些缺陷，我们使用了多头注意力机制。这减少了单一注意力机制查找所有重要单词的负担，也增加了轻松找到更多相关单词的机会。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q439","src":"topic","srcName":"专题题库","no":439,"q":"为什么要使用编码器-解码器 RNN而不是普通的序列到序列 RNN进行自动翻译？","a":"简单的序列到序列 RNN会在读取句子的第一个单词后立即开始翻译该句子，而编码器-解码器 RNN会先读取整个句子，然后进行翻译。一般来说，如果你一次翻译一个句子中的一个单词，结果会很糟糕。例如，法语句子“Je vous enprie”的意思是“不客气”但如果你使用简单的序列到序列RNN一次翻译一个单词，你会得到 “我为你祈祷”，这是没有意义的。所以在自动翻译的情况下，最好使用编码器-解码器 RNN先阅读整个句子，然后再翻译。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q440","src":"topic","srcName":"专题题库","no":440,"q":"解释一下Transformer 架构中的Self-Attention机制是什么？","a":"我们可以将自注意力机制视为一种通过包含输入上下文信息来增强输入嵌入信息内容的机制。换句话说，自注意力机制使模型能够权衡输入序列中不同元素的重要性，态调整它们对输出的影响。\n\n假设我们有一个文本x，我们使用嵌入算法将其从原始文本转换而来。然后为了应用注意力机制，我们将查询（q）以及一组键值对（k，V）映射到输出x。9、k和v都是向量。结果称为注意力头，然后沿着简单的前馈神经网络发送。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q441","src":"topic","srcName":"专题题库","no":441,"q":"迁移学习如何在（LLM）中发挥作用？","a":"LLM中的迁移学习涉及在大量文本语料库上训练语言模型，然后在特定任务上对模型进行微调。该过程涉及几个步骤：\n\n1. 预训练：在此步骤中，语言模型在大量文本语料库上进行训练，以学习语言中的模式和关系。预训练的目标是生成一组可用于各种NLP 任务的通用语言表示。\n\n2. 微调：语言模型经过预训练后，可以针对特定的NLP 任务进行微调，例如情绪分析或文本分类。微调涉及采用预训练模型并在特定于目标任务的较小数据集上对其进行训练。微调的目标是使通用语言表示适应手头的特定任务。\n\n3. 推理：模型经过微调后，即可用于对新数据进行预测。在推理过程中，模型会接收输入文本并生成输出，该输出表示模型对当前任务的预测","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q442","src":"topic","srcName":"专题题库","no":442,"q":"LLM参数与神经网络中的权重有何关系？","a":"是的，大型语言模型 （LLM）中的参数与标准神经网络中的权重类似。在LLM 和神经网络中，这些参数都是数值，它们以随机系数开始，并在训练期间进行调整以最大限度地减少损失。这些参数不仅包括决定神经元之间连接强度的权重，还包括影响神经元输出的偏差。在GPT-4 或其他基于Transformer 的模型等大型语言模型（LLM）中，•參数”词是指決定模型行为的数值。这些参数包括权重和偏差，它们共同定义了模型內神经元的连接和激活。以下是更详细的解释：\n\n• 权重：权重是定义模型中不同层之间神经元连接强度的数值。在LLM 中，权重主要用于构成模型架构的注意力机制和前馈神经网络。它们在训练过程中进行调整，化模型生成相关且连贯的文本的能力。\n\n• 偏差：偏差是添加到输入加权总和中的额外数值，然后通过激活函数传递。它们有助于控制神经元的输出，并为模型的学习过程提供灵活性。偏差可以被认为是一种将激活函数向左或向右移动的方法，使模型能够学习输入数据中更复杂的模式和关系。\n\n训练过程涉及迭代调整这些参数（权重和偏差）以最小化损失函数。这通常使用梯度下降或其变体（例如随机梯度下降或Adam优化器）来完成。损失函数测量模型预测与真实值（例如句子中正确的下一个单词）之间的差异。通过最小化损失，模型可以学习生成与其训练数据中的模式非常相似的文本。研究人员经常使用术语“參数”而不是“权重”来强调权重和偏差在模型的学习过程中都起着至关重要的作用。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q443","src":"topic","srcName":"专题题库","no":443,"q":"精细调整LLM有哪些缺点？","a":"• 微调需要手动创建大量数据，并且模型可能会记住您提供的部分数据。\n\n• 每次您想要添加新功能时，您都需要创建一堆虚假数据，然后运行微调过程，然后使用新微调的模型，而不是在提示中添加几行。\n\n•它比较贵。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q444","src":"topic","srcName":"专题题库","no":444,"q":"BERT 中的Word Embedding、 Position","a":"•词嵌入是一个学习到的查找图，即每个单词都被赋予一个独热编码，然后将其作为索引，并且与该索引相对应的是一个n 维向量，其中的系数是在训练模型时学习到的。\n\n• 位置嵌入类似于词嵌入。不同之处在于，它使用句子中的位置作为索引，而不是独热编码。然后，这些位置对应于一个-向量，其系数来自训练模型。\n\n• 另一方面，位置编码是一个静态西数，它将整数输入映射到实值向量，以捕捉位置之间的固有关系。也就是说，它捕捉到这样一个事实：输入中的位置与位置的关系比与位置的4 关系更密切。换句话说，位置编码不是学习而是一个选择的数学函数，5 17 否一Rn","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q445","src":"topic","srcName":"专题题库","no":445,"q":"基于特征的迁移学习与（LLM）中的微调有何区别？","a":"• 在基于特征的迁移学习中，你可以通过运行模型来训练词嵌入，然后在不同的任务或模型上使用模型中的那些特征（即词向量）\n\n• 进行微调时，您可以使用完全相同的模型A，只是将其运行在不同的任务上。有时在进行微调时，您可以保持模型权重不变，只需添加一个要训练的新层。其他时候，您可以一次慢慢解冻一个层。您还可以在预训练时使用未标记的数据，通过屏蔽单词并尝试预测哪个单词被屏蔽。","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q446","src":"topic","srcName":"专题题库","no":446,"q":"为什么 transformer 需要位置编码？","a":"在RNN中，我们将句子逐字逐句地输入到网络中。也就是说，首先将单词”工“作为输入传递，然后传递单词“am”，依此类推。我们逐字逐句地输入句子，以便我们的网络完全理解句子。\n\n但是对于Transformer 网络，我们不遵循循环机制。因此，我们不是逐字逐句地输入句子，而是将句子中的所有单词并行输入到网络中。并行输入单词有助于减少训练时间，也有助于学习长期依赖关系。当我们将单词并行输入到 Transformer 时，词序（单词在句子中的位置）很重要。因此，我们应该向Transformer 提供一些有关词序的信息，以便它能够理解句子。如果我们将输入矩阵直接传递给 Transformer，它就无法理解词序。因此，我们不需要将输入矩阵直接输入 Transformer，而是需要添加一些指示词序（单词的位置）的信息，以便我们的网络能够理解句子的含义。为此，我们引1入了一种称为位置编码的技术。顾名思义，位置编码是一种指示单词在句子中的位置（词序）的编码。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"某大厂 LLM","expNo":null,"expTitle":null,"origin":"《某大厂大语言模型面试题》截图"},{"id":"q447","src":"topic","srcName":"专题题库","no":447,"q":"AI 越来越强，甚至能独立完成完整模块，你的核心优势到底在哪？","a":"AI 的输出质量，完全取決于人输入的质量。在编码这件事上，有五件事AI无法替我担责：\n\n1. 定义问题（Problem Definition）：业务方说要“提升用户体验’，我得把它翻译成‘首屏接口耗时降低300ms’，Al做不到这种翻译。\n\n2. 构建上下文（Context Building）：哪些祖传代码是屎山但不能动，哪些模块即将重构不宜侵入，这些潜规则只有我知道。\n\n3. 验证结果（Validation）：代码能跑通不代表业务跑通，我得做业务语义层面的验收。\n\n4. 拍板決策（Decision Making）：是牺牲一点性能换取更好的可读性，还是为了极致性能引入复杂缓存？这是trade-off,Al没有‘取舍’的直觉。\n\n5. 控制成本（Cost Control）：让Al 写出一个炫技的算法，可能让服务器内存飙升，我得管住它的‘炫技冲动’。所以我的优势从来不是和AI比谁写代码更快，而是我知道什么该让它写、什么该拦着它写，以及怎么把它生成的代码修正成真正能上线的产品。”","level":"中级","type":"对比分析","tags":["技术架构与选型","行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q448","src":"topic","srcName":"专题题库","no":448,"q":"在你负责的项目里，哪些放心交给 Al，哪些必须自己亲手来？","a":"“我的判断标准不是‘复杂’或‘简单’，而是两个硬核维度：Bug产生的代价 与综合成本。我画了一个二维矩阵：\n\n• 代价高＋AI 写成本低（如核心支付、权限校验）：绝对禁止 Al直接写。我必须自己手写核心链路，或者让AI生成骨架后，我逐行手改并上强验证。\n\n• 代价高+AI写成本也高（如复杂算法适配老旧数据库）：仅让AI 出思路。让 AI给伪代码或技术方案参考，具体落地必须我自己来，因为调优老系统需要对底层数据分布有直觉。\n\n• 代价低+AI写成本低（如CRUD 接口、单元测试、数据转换 DTO）：全量放行。这类代码边界清晰、规范明确，AI 写比我快 10倍，我只需要 Review 即可。\n\n• 代价低＋AI 写成本高（如极其冷门的底层驱动调用）：自己写。因为让Al查资料试错的时间，我早就手写完了。另外还有一个隐藏标准—代码的‘变更频率’。如果这段代码这周改了3次需求，我绝不会让A写，因为频繁变动的业务语义，AI跟不上下游需求的‘潜台词’变更。”","level":"中级","type":"概念解释","tags":["技术架构与选型","行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q449","src":"topic","srcName":"专题题库","no":449,"q":"你 Review AI生成的内容时，重点看什么？怎么防住那种‘合理但错误’的代码？","a":"“我Review AI 代码有个‘三层漏斗’，一层层筛：\n\n1. 第一层（最重要）：业务语义对齐。AI代码最大的骗局是‘语法正确，语义错误’。比如需求是‘下单后减库存’，AI可能理解成‘支付成功回调后减库存’，如果是‘下单锁库存、支付才真正扣减’，AI大概率会写错。我的做法是：不看代码先看注释—让AI用自然语言把这段代码要实现的业务规则复述一遍，如果复述错了，代码根本不用看。\n\n2. 第二层：安全与防御。重点查输入校验（SQL/NOSQL 注入）、权限分级（越权风险）、敏感数据（日志里有没有打印手机号、身份证）。\n\n3. 第三层：工程健壮性。有没有 NPE风险、事务边界是否合理、循环里有没有查询DB、日志级别是否合适。关于‘合理但错误’的代码—这种代码逻辑自洽、风格优美、甚至能跑通单元测试，但就是和业务预期南辕北辙。防这个的唯一办法是：反向测试。拿着AI 的实现逻辑，反过来去问产品经理“如果发生XX情况，系统这么处理是否符合预期？’—把验证前置到需求层面，而不是纯看代码。一旦发现语义偏差，立刻把这条规则沉淀到项目的 AI_PROMPT.md 里，下次让AI生成时主动规避。”","level":"中级","type":"方法流程","tags":["技术架构与选型","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q450","src":"topic","srcName":"专题题库","no":450,"q":"AI生成的部分上线后出了 Bug，你怎么处理？","a":"好的回答：“不管是不是Al写的，线上Bug处理只有一个原则：先火，再查案，最后修防火墙。\n\n•第一步：止血（5分钟内）。回滚版本或打开降级开关。这时候不纠结责任，线上用户每多等一秒都是损失。\n\n• 第二步：定因（深挖三层）。看监控确定影响面，看链路日志定位到具体代码行。特别地，针对Al生成的代码，我要多问自己三个问题：。 是安全审查漏了？（比如没校验数组越界）。 是边界条件没覆盖？（比如并发场景下的脏读）。 还是业务语义理解偏差？（比如把‘含税价’当成了‘不含税价’）想清楚为什么 Review 时没拦住，比找到 Bug本身更重要。\n\n• 第三步：补流程（举一反三）。补充这条场景的集成测试用例，并在团队 Review 清单里增加这一类检查项。如果是语义偏差，直接去更新 AI 的系统提示词（System Prompt），告诉它‘下次遇到价格字段，必须明确区分含税与不含税’。一个线上Bug 不可怕，可怕的是同类 Bug 因为流程没补上，下个月再来一次。”","level":"中级","type":"方法流程","tags":["技术架构与选型","行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q451","src":"topic","srcName":"专题题库","no":451,"q":"最极端的情况——Al写的内容出Bug，你让Al去修，结果 AI 自己修了三轮都修不好，你怎么兜底？","a":"好的回答：“这个问题很刁钻，但确实是每天都在发生的现实。AI修不好自己的代码，通常是因为：\n\n1. 它对线上运行时数据没有感知（不知道 Redis 里存的是什么格式）；\n\n2. 问题根因涉及3个以上微服务的交互，AI的上下文窗口根本装不下完整的调用链。这时候的兜底策略就是‘拉开副驾驶，自己坐进主驾’：\n\n• 第一，立即手动接管。别跟AI死磕，先回滚到上一个稳定版本，线上用户等不起。\n\n• 第二，依赖你之前 Review 时积累的‘脑内地图’。如果当初 Review AI代码时，你认真理解过它的逻辑分支，现在排查日志会快很多——你能直接判断是哪一步的输入输出和预期不符。如果当初只是‘看着没问题就过了’，那现在排查就像看别人写的天书，时间成本直接翻倍。。第三，自己改代码并上线。走完整的测试流程，确保修复无误。\n\n• 第四，深度复盘。复盘时问自己：为什么 AI修不好？是提示词没给它足够的报错堆栈？还是问题本身需要跨服务上下文？这次复盘会直接决定—下次遇到同等级别的复杂问题，到底还给不给 AI修，还是直接默认自己上手。说到底，AI可以是超级实习生，但我必须是那个兜底的架构师。它能写能改是惊喜，它改不了的时候，我得能接手，这是工程师的底线。”\n\n工程落地类","level":"中级","type":"方法流程","tags":["技术架构与选型","行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q452","src":"topic","srcName":"专题题库","no":452,"q":"团队用 AI编程，Token 成本像流水一样，怎么有效控制？","a":"好的回答：“成本控制不是一刀切地‘少用’，而是 “精细化路由’。我们落地了五个策略：\n\n1. 模型路由（最见效）：70%的简单任务（代码补全、解释、单元测试）路由给 DeepSeek-Coder或 Qwen-Coder 这类高性价比小模型；只有30%的复杂重构、架构设计才调用 Claude 3.5或GPT-4。成本直接降60%。\n\n2. 上下文减肥（Context Trimming）：不让AI读整个项目。我们通过语义索引，只把当前修改文件相关的引用文件和接口定义喂给 AI，无关的测试代码、历史版本统统不喂。\n\n3. Prompt缓存（Caching）：维护一套标准的 System Prompt 和项目级 Rules。利用各大平台的 Prompt Caching能力，长提示词的重复输入成本能降低90%。\n\n4. 模板复用：建一个团队内部的 AI_Templates 仓库，把常用的Mapper、Service、Controller生成模板固话下来，避免每次让AI 从头‘理解’一遍规范。\n\n5. 成本看板：给每个开发者的IDE 插件接上用量监控。不是用来考核，而是用来发现异常—比如某同学一个月消耗了别人10倍的Token，那就要看看是不是他总在让AI 重写整个模块，帮他优化下工作流。核心原则是：用经济模型管AI—一便宜的模型做糙活，贵的模型做细活。”","level":"中级","type":"方法流程","tags":["技术架构与选型","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q453","src":"topic","srcName":"专题题库","no":453,"q":"你们团队怎么管理AI生成的生成的内容，防止它变成“技术债加速器’？","a":"好的回答：“我们立了四根支柱来管理 AI代码：\n\n1. 归属权明确 （Accountability）：谁的IDE 点了 Accept，谁就是这段代码的第一责任人。CodeReview 时，AI生成的代码必须显式标注［AI-Generated］，Reviewer 对标注代码的审查力度要提升一级。\n\n2. 流程对齐（Process）：AI代码不走特殊通道，和人工代码一模一样—必须经过PR、必须通过CI（静态扫描+单元测试）、必须至少一人 Approve。没有‘“因为是 AI写的就少看一眼’这回事。\n\n3. 指标观测 （Metrics）：我们追踪两个核心指标—— ‘AI 代码的 Bug率’（上线后30天内产生的故障数/总 AI代码行数）和 ‘AI代码的重构率’（提交后7天内被人工重写的比例）。如果某个模块的重构率超过30%，说明AI在这个领域生成质量不行，我们就直接禁用该场景的AI生成。\n\n4. 知识反哺（Feedback）：把 Review 中发现的Al 常犯错误，沉淀到一个 bad_cases.md 文档，并定期微调项目的•cursorrules 或 prompt.md，让整个团队的AI工具越用越聪明。核心认知：AI代码不是“‘银弹’，它是“放大镜’—放大了好工程师的效率，也放大了坏工程师的偷懒。管理必须跟上。\"","level":"中级","type":"方法流程","tags":["技术架构与选型","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q454","src":"topic","srcName":"专题题库","no":454,"q":"很多公司没有私有化 Agent，用公网AI写代码，怎么保证不泄露公司核心代码？","a":"好的回答：“在当前大部分公司没有能力自研私有化大模型的情况下，代码安全是悬在头上的剑。我们的策略是‘物理隔离＋脱敏处理＋工具约束’三管齐下：\n\n• 敏感代码物理隔离（红线）：核心算法（如定价引擎、风控模型）、密钥管理、交易撮合逻辑这些代码物理隔离，不仅不让AI生成，开发时甚至不允许在连接公网的IDE 中打开。这些模块只能在公司的跳板机（无外网）上开发。\n\n• 强制使用企业版：个人版的数据协议太模糊，我们统一采购 GitHub Copilot Business 或通义灵码企业版。合同中明确写明‘零数据保留（Zero Data Retention）’和“不用于模型训练’，法务合规风险降到最低。\n\n• 配置文件拦截（.gitignore +.claudeignore）：在项目根目录维护严格的•claudeignore 和.cursorignore，把包含数据库连接串、内部IP、业务敏感字段命名的文件统统排除在AI 工具的索引范围外，从源头掐断读取可能。\n\n• 脱敏Mock（进阶操作）：如果实在想让 AI帮忙看一段核心逻辑的写法，我们会把变量名、类名、字段名全部替换成无意义的 A，B，C，把具体的业务数值替换成 123，让AI只看“模式’不看‘数据’。\n\n面试/汇报时怎么说：“我们建立了分级开发环境。非敏感业务用企业版 AI工具提效，敏感模块在离线环境开发。同时通过ignore 文件强制排除配置文件和密钥文件。所有 AI 生成的代码入库前必须经过安全专项扫描，确保没有把内部包名或IP 泄露到注释里。”","level":"中级","type":"方法流程","tags":["技术架构与选型","行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"VibeCoding","expNo":null,"expTitle":null,"origin":"《VibeCoding 面试题》截图 · 场景类"},{"id":"q455","src":"topic","srcName":"专题题库","no":455,"q":"你认为什么样的产品才算是成功的产品？","a":"判断一个产品是否成功，可以看三层：需求、黏性、体验。\n\n• 需求：这是一个产品之所以被称为产品的前提。产品的本质就是用来解决需求的，黏性和体验是之后的事。\n• 黏性：这是一个成功产品的另一个典型特点。一个成功的产品，一定是不断被用户想起的产品；一旦用户产生了某种需求，就能想起你，这就是一个好的产品。\n• 优秀的用户体验：在这个产品同质化竞争比较严重的时代，好的用户体验就是商机，尤其是你弯道超车的策略之一。","level":"初级","type":"观点判断","tags":["产品规划与需求","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 1 题"},{"id":"q456","src":"topic","srcName":"专题题库","no":456,"q":"请你说一下产品经理的工作都有哪些？","a":"1. 需求收集：用户调研、同事提出的需求、老板提出的需求、竞品分析出来的需求、数据分析出来的需求、自己规划的一些需求。\n2. 产品的定义与设计：产品规划、产品设计与功能优化、撰写需求文档、上线后的意见反馈与 BUG 跟踪；项目管理：制定计划并跟踪、确定资源投入、把控质量，写周报等汇报。\n3. 产品生命周期管理：管理产品从诞生到消亡过程中的所有活动、市场推广，做运营计划，给客服培训等。","level":"初级","type":"方法流程","tags":["产品规划与需求","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 2 题"},{"id":"q457","src":"topic","srcName":"专题题库","no":457,"q":"请你说一下产品的需求来源有哪些？","a":"• 老板提出的战略性需求\n• 产品经理根据产品方向规划需求\n• 推广规划的活动和数据分析出来的一些需求\n• 用户访谈提出需求\n• 其他参与者和关注者反馈的需求","level":"初级","type":"方法流程","tags":["产品规划与需求","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 3 题"},{"id":"q458","src":"topic","srcName":"专题题库","no":458,"q":"解决方案产品经理如何进行商业模式的分析？","a":"ToB 的商业模式有一种比较通用的宏观分析方法论，主要是要想清楚 4 件事：\n\n• 需求/用户价值（价值主张）：你想要给客户提供什么东西？要用一句话能讲清楚产品的利益点。\n• 企业价值（营收模式）：通过你提供的价值主张，你期望自己企业从客户的哪个方面赚多少钱？\n• 执行（关键资源）：想要兑现你的价值主张，哪些资源是必备的？\n• 关键流程：为了让你的营收模式跑起来，哪些步骤是必备的？企业需要建立什么样的组织架构和规章制度，来让这些步骤运转得更有效率。","level":"中级","type":"方法流程","tags":["商业模式与定价","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 4 题"},{"id":"q459","src":"topic","srcName":"专题题库","no":459,"q":"你觉得产品经理需要具备哪些能力？","a":"1. 逻辑能力\n2. 沟通能力\n3. 文档能力\n4. 学习能力\n5. 项目管理能力\n6. 自我管理能力\n7. 抗压能力","level":"初级","type":"观点判断","tags":["行业趋势与职业发展","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 5 题"},{"id":"q460","src":"topic","srcName":"专题题库","no":460,"q":"如何系统地了解一款产品？","a":"1. 熟悉系统的功能框架：每个功能模块是干什么的，跟其他模块的关系是什么，有没有依赖关系。\n2. 从主流程开始：搜集有哪些主要的业务、每个业务的业务流程，在理解业务流程的基础上，再对应去系统操作；如果能找到用例图，这块就更容易理解了。\n3. 了解每个场景的常用异常情况：通常会遇到哪些问题，如何解决的，为什么这样解决。\n4. 找历史资料：如果能找到版本的更新记录和初版的产品需求文档、原型，就可以更深入地了解系统的来龙去脉。\n5. 找客服要工单记录：了解最新遇到的问题，在了解真实业务诉求的基础上，探求每个问题背后对应的产品设计问题，自己尝试思考解决方案。","level":"中级","type":"方法流程","tags":["产品规划与需求","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 6 题"},{"id":"q461","src":"topic","srcName":"专题题库","no":461,"q":"产品上线之后需要关注哪些数据指标？","a":"一般来说，产品上线之后需要关注的指标有：\n\n• 注册用户数：已注册用户的总和\n• 次日留存/7 日留存\n• ARPU：总收入/总用户数，即每个用户的平均收入\n• 日活跃用户数/月活跃用户数（DAU/MAU）\n• 用户增长率\n• 新用户占比：新用户占今日活跃用户数的比例\n• 用户流失率\n• 渠道转化率","level":"中级","type":"指标设计","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 7 题"},{"id":"q462","src":"topic","srcName":"专题题库","no":462,"q":"产品上线后的种子用户该如何获取？","a":"对于种子用户的获取，一般通过两种方式：\n\n• 冷启动：初创公司由于没有钱，或者由于还没有经过需求验证阶段，所采用的启动方式。主要包括通过优质的文章或者熟人推荐进行启动，比较典型的是知乎早期的启动方式。\n• 热启动：公司通过大量的资源（人力/资金/流量等）让产品快速启动的方法，比如进行大规模的补贴或者广告推广；早期微博通过邀请明星入驻启动的方法就是热启动。","level":"中级","type":"方案设计","tags":["冷启动与产品策略","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 8 题"},{"id":"q463","src":"topic","srcName":"专题题库","no":463,"q":"你平时比较喜欢哪款产品？它哪个地方吸引你？","a":"1. 所选的 APP 最好与面试的目标公司或者部门业务相关，这样更容易有话聊。当然这可能对求职者要求更高——很多同学都是海投，如果每面试一家公司都要针对性地准备这道题，确实有很大的工作量。\n2. 分析过程要全。这道题考查的一个重点就是分析维度，看你对一个产品的分析维度全不全。重点突出在某一个维度上，着重分析该产品做得最好的地方。比如分析抖音的时候，个性化推荐一定是重点叙述的点；分析网易云音乐的时候，歌曲评论功能也一定需要重点阐述。\n3. 针对优化方面：先列出该产品常见的用户并选择你的目标用户，列出用户痛点并确定其优先级；可以从用户、场景、需求、痛点进行描述，梳理需求用例。也可以用用户旅程地图进行描述，在这个过程中关注用户体验，了解客户的需求以及需要改进的用例；再根据一些标准（例如对用户的影响/重要性、对公司的潜在价值和开发难度）对它们进行优先级排序来整理你的用例。一旦完成优先级的排序，就可以讨论痛点的解决方案了。","level":"中级","type":"观点判断","tags":["用户研究与体验","市场与竞品分析"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 11 题"},{"id":"q464","src":"topic","srcName":"专题题库","no":464,"q":"我们是做 xxx 的，谈谈你对我们这个产品和行业的看法？","a":"• 阐述应聘公司的产品行业存在的契机和至今的发展。\n• 对市场格局做一个基础阐述，并对产品在行业里未来的（乐观）畅想。\n\n【回答实例】（作业帮）在线教育因为双减政策，整个市场有了大的震荡，但是高中部分还是可以继续做，所以可以先把高中学科类做为核心之一，但是只是缓兵之计，可能需要做到随时取缔的准备。那产品可以慢慢转向到成人教育、职业教育和艺术素质教育上来，XXXXX。","level":"高级","type":"观点判断","tags":["行业趋势与职业发展","市场与竞品分析"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 12 题"},{"id":"q465","src":"topic","srcName":"专题题库","no":465,"q":"基于生活中的痛点设计一款产品？","a":"1. 针对一，我们可以从用户、场景、需求来看。引用俞军的话：“用户不是自然人，而是需求的集合”，可以通过固定用户、改变场景来改变需求，通过改变的需求来发现痛点；也可以通过固定的场景、改变用户来改变需求，然后来发现痛点。比如普通 18~30 岁的用户在固定场景下使用的产品，如果是 5 岁孩子去这个场景下，是否会发生需求的变更，需求的变更是否会发现不同的痛点。\n2. 针对二，设计产品模型，就是把最初的产品想法，梳理业务逻辑、需求边界、视觉和体验、功能描述，用产品设计工具做成可执行的产品方案。","level":"高级","type":"方案设计","tags":["产品规划与需求","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 13 题"},{"id":"q466","src":"topic","srcName":"专题题库","no":466,"q":"你觉得 to B 的产品和 to C 的产品有什么区别？","a":"产品目标用户不同：to B 面向企业用户；to C 面向广大个人/消费者。\n\n1. 产品体现价值不同：B 端是企业战略价值主张，降本增效和提高业绩；C 端是个人用户体验、爽感、个人某方面需求的满足感，基本对应马斯洛需求层次理论。\n2. 决策产品使用的对象不同：B 端是企业领导/采购方，多数非直接产品使用者；C 端是产品直接使用者，广大普通用户，自我决策使用权。\n3. 产品的盈利方式不同：B 端基本只有直接盈利，面向企业售卖产品及服务进行收费；C 端面向用户群体，直接盈利如会员付费，间接盈利如流量广告。\n4. 产品运营方式不同：B 端是销售先行，寻找销售线索、建立服务、塑造品牌故事，以会销为主，企业口碑传播、渠道投放曝光；C 端主要以促销、活动、裂变、私域、拉新。","level":"中级","type":"对比分析","tags":["商业模式与定价","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 14 题"},{"id":"q467","src":"topic","srcName":"专题题库","no":467,"q":"产品策划和产品运营有什么区别？","a":"• 从产品生命周期看：产品策划更强调产品从 0 到 1；运营更强调产品从 1 到 100。\n• 从需求分工看：产品运营实际上是对产品设计的验证和检验，站在产品的第一战线（用户），去理解和把握用户的需求，进而转化为优化产品的需求。但是在产品的前期，产品性质与人群匹配的过程中，需求的决定还是取决于产品经理，因为产品经理要确保产品的初衷、定位和价值不发生改变，或者根据市场的需求做相应的改变。产品和运营，都是为了能够让产品更好地获得更多的用户；一些点子和需求，需要大家共同商讨确定。只要这个需求是正确的，最终目的是为了获得更多的目标用户，那么产品和运营都需要支持。","level":"中级","type":"概念辨析","tags":["产品规划与需求","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"产品经理基础","expNo":null,"expTitle":null,"origin":"《产品经理面试题 15 题》截图 · 第 15 题"},{"id":"q468","src":"topic","srcName":"专题题库","no":468,"q":"Transformer Encoder 有什么子层？","a":"Transformer 编码器（Encoder）由六个相同层构成，每层的主要子层包括两个部分：\n\n· 多头自注意力机制（Multi-Head Self-Attention Mechanism）：这一层允许编码器查看输入序列中的其他位置，来更好地编码一个单词。它由多个头组成，每个头独立地学习输入数据的不同方面。\n· 前馈神经网络（Feed-Forward Neural Network，Linear+ReLU+dropout+Linear）：这是一个简单的全连接神经网络，它对每个位置的注意力向量进行处理，但是对不同位置是独立的。\n\n除了这些主要子层，还有一些重要的组件：\n\n· 层归一化（Layer Normalization）：在多头自注意力机制和前馈神经网络之后，通常会有层归一化步骤，以稳定网络的学习过程。\n· 残差连接（Residual Connections）：在每个子层之后，都会加上一个残差连接，然后进行层归一化。残差连接有助于避免在网络中出现梯度消失的问题。\n\n这种结构的组合使得 Transformer 编码器非常有效且灵活，适用于处理各种顺序数据任务。","level":"中级","type":"概念解释","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 1 题"},{"id":"q469","src":"topic","srcName":"专题题库","no":469,"q":"Transformer self-attention 的公式是什么？","a":"Attention(Q, K, V) = Softmax(QKᵀ / √d_k) · V\n\n其中 Q（Query）、K（Key）、V（Value）是输入分别乘以三个不同权重矩阵得到的表示，d_k 是 Key 向量的维度。除以 √d_k 做缩放，是为了避免维度变大时点积结果过大、把 softmax 推向梯度平缓区。","level":"中级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 2 题"},{"id":"q470","src":"topic","srcName":"专题题库","no":470,"q":"Transformer 的优缺点有哪些？","a":"一、优点\n\n· 具有并行处理能力：与基于循环的模型（如 LSTM 和 GRU）相比，Transformer 可以并行处理整个序列，大大提高了训练效率。\n· 长距离依赖：借助多头自注意力机制，Transformer 能够有效捕捉序列中长距离的依赖关系，这对于理解文本等复杂序列数据至关重要。\n· 灵活性和泛化能力：Transformer 模型在多种任务上都表现出色，包括机器翻译、文本生成、语音识别等。\n· 可扩展性：Transformer 模型可以通过增加层数来提高其复杂性和学习能力，使其适用于大规模数据集和复杂任务。\n· 更好的性能：在许多 NLP 任务中，Transformer 模型超越了以往的技术，设立了新的性能标准。\n\n二、缺点\n\n· 计算资源密集：尽管 Transformer 允许并行化，但其自注意力机制涉及大量的计算，对计算资源（尤其是内存）的需求很高。\n· 可解释性不足：与某些传统模型相比，Transformer 的决策过程更难解释和理解。\n· 过拟合风险：Transformer 模型因其大量的参数而容易过拟合，尤其是在数据较少的情况下。\n· 训练需要精心调优：由于模型的复杂性，找到最佳的训练参数（如学习率、层数、头数等）可能需要大量的实验和调整。\n· 长序列挑战：尽管 Transformer 在处理长距离依赖方面表现出色，但处理非常长的序列时性能可能会下降，因为自注意力机制的计算成本随序列长度的增加而显著增加。\n\n三、总结\n\n1. 尽管 Transformer 有一些局限性，但其在处理复杂序列任务方面的优势，使其成为当前最流行和最有效的深度学习架构之一。\n2. 局部信息的获取不如 RNN 和 CNN 强：Transformer 关注的是全局关系，而 RNN 在计算过程中更关注局部，对距离更加敏感。","level":"中级","type":"对比分析","tags":["技术架构与选型","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 3 题"},{"id":"q471","src":"topic","srcName":"专题题库","no":471,"q":"Encoder 端和 Decoder 端是如何进行交互的？","a":"在 Transformer 模型中，编码器（Encoder）和解码器（Decoder）通过一个特殊的注意力机制进行交互，这个机制通常被称为“编码器-解码器注意力”或“交叉注意力”（Cross-Attention）。\n\n以下是这种交互的详细步骤：\n\n1. 编码器处理输入序列：编码器首先处理输入序列，通过自注意力和前馈网络生成一系列上下文表示。这些表示包含了输入序列中每个元素的信息，以及它们之间的相对关系。\n2. 解码器自注意力层：在解码器端，每个解码器层首先通过自注意力机制处理先前生成的输出（例如，在序列生成任务中的先前生成的单词）。这个过程与编码器中的自注意力相似，但有一个关键差异：为了保证自回归属性（即只能使用当前位置之前的信息），解码器在自注意力计算中应用了掩码（masking）。\n3. 交叉注意力层：这是编码器和解码器交互的关键部分。在这一层，解码器的每个元素（或步骤）会对编码器的所有输出进行注意力计算。简而言之，解码器在生成每个元素时都会考虑整个输入序列的上下文信息。\n\n· 查询（Query）：来自解码器的表示。\n· 键（Key）和值（Value）：来自编码器的表示。","level":"高级","type":"方法流程","tags":["技术架构与选型","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 4 题"},{"id":"q472","src":"topic","srcName":"专题题库","no":472,"q":"Transformer 中为什么需要线性变换？","a":"K、Q、V 分别是输入向量经过不同的线性变换矩阵 W_k、Q_k、V_k 计算得到。在 QKᵀ 部分，线性变换矩阵将 K、Q 投影到了不同的空间，增加了表达能力（这一原理可以同理 SVM 中的核函数——将向量映射到高维空间以解决非线性问题），这样计算得到的注意力矩阵的泛化能力更高。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 5 题"},{"id":"q473","src":"topic","srcName":"专题题库","no":473,"q":"Transformer attention 的注意力矩阵的计算为什么用乘法而不是加法？","a":"Transformer attention 的注意力矩阵计算用乘法，是为了计算速度更快。在计算复杂度上，乘法和加法理论上的复杂度相似，但是在实践中，乘法可以利用高度优化的矩阵乘法代码（有成熟的加速实现），使得点乘速度更快、空间利用率更高。","level":"高级","type":"概念辨析","tags":["技术架构与选型","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 6 题"},{"id":"q474","src":"topic","srcName":"专题题库","no":474,"q":"transformer 中的 attention 为什么 scaled？","a":"虽然矩阵加法的计算更简单，但是 Add 形式套着 tanh 和 V，相当于一个完整的隐层。在整体计算复杂度上两者接近，但是矩阵乘法已经有了非常成熟的加速实现。在 d_k（即 attention-dim）较小的时候，两者的效果接近；但是随着 d_k 增大，Add 开始显著超越 Mul。\n\n极大的点积值将整个 softmax 推向梯度平缓区，使得收敛困难，也就是出现了高赞答案里解释的“梯度消失”。\n\n这才有了 scaled。所以，Add 是天然地不需要 scaled，Mul 在 d_k 较大的时候必须要做 scaled。个人认为，Add 中的矩阵乘法，和 Mul 中的矩阵乘法不同：前者中只有随机变量 X 和参数矩阵 W 相乘，但是后者中包含随机变量 X 和随机变量 X 之间的乘法。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 7 题"},{"id":"q475","src":"topic","srcName":"专题题库","no":475,"q":"Transformer attention 计算注意力矩阵的时候如何对 padding 做 mask 操作的？","a":"padding 位置置为 -1000，再对注意力矩阵进行相加。\n\n（即把 padding 位置的注意力分数压到极小，softmax 之后这些位置的权重趋近于 0，从而被屏蔽掉。）","level":"高级","type":"方法流程","tags":["技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 8 题"},{"id":"q476","src":"topic","srcName":"专题题库","no":476,"q":"介绍一下 Transformer 的残差结构及意义","a":"Transformer 模型中的残差连接（Residual Connection）是一种重要的网络结构设计，它直接将某一层的输入添加到后面层的输出上。\n\n一、残差结构的介绍\n\n在 Transformer 中，每个编码器和解码器层都包含残差连接。具体来说，对于一个给定的层（比如自注意力层或前馈神经网络层），其处理过程可以总结为：\n\n1. 层内处理：输入首先通过层内的主要操作（如自注意力或前馈神经网络）。\n2. 加上残差：将这个操作的原始输入直接加到操作的输出上。\n3. 层归一化：在大多数情况下，加法操作之后会接一个层归一化（Layer Normalization）步骤。\n\n这种结构可以表示为：Output = Normalize(Layer(x) + x)，其中 Layer(x) 表示层的操作，x 是输入。\n\n二、残差结构的意义\n\n1. 缓解梯度消失问题：深度神经网络中常见的问题之一是梯度消失，这会使得训练过程变得困难。残差连接允许梯度直接流过网络，有助于保持梯度的稳定性，从而缓解梯度消失问题。\n2. 加速收敛：由于残差连接的帮助，网络可以更快地学习，加速收敛过程。这是因为它允许网络在训练早期阶段更有效地传播信息和梯度。\n3. 促进深层网络训练：残差连接使得构建更深层的网络变得可行，因为它们减少了训练过程中的复杂性和困难。\n4. 保留信息：残差连接确保了即使经过多个层的处理，输入信息也不会被完全替代或丢失。这在处理长序列时尤其重要，因为信息需要在整个网络中有效传递。\n5. 支持特征重用：残差连接通过将较低层的特征直接传递到后面的层，支持了特征的重用。这意味着网络可以学习使用并重用早期层的特征，而不是每次都重新学习。\n\nTransformer 中的残差连接是提高模型性能、稳定性和训练效率的关键设计之一；它们使得深层网络的训练成为可能，同时也确保了信息在网络中的有效传递。","level":"中级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 9 题"},{"id":"q477","src":"topic","srcName":"专题题库","no":477,"q":"Transformer 为什么使用 LN 而不是 BN？","a":"Transformer 模型选择使用层归一化（Layer Normalization, LN）而不是批归一化（Batch Normalization, BN），主要是基于这两种归一化技术的不同特性和在处理序列数据时的适用性考虑：\n\n1. 独立于批大小：\n· LN：层归一化对每个样本独立进行，不依赖于批大小。这使得 LN 在处理不同长度的序列或小批量数据时表现更稳定。\n· BN：批归一化依赖于整个批次的数据统计信息。在小批量数据或批量大小变化时，BN 的效果可能会受到影响。\n2. 序列数据的动态长度：\n· 在处理序列数据（特别是长度不一的序列）时，LN 的独立性使其更适合。因为 BN 需要整个批次的数据统计，不同长度的序列可能会导致统计信息不准确。\n3. 计算效率：\n· LN 可以在单个样本级别上进行计算，这对于自然语言处理中常见的动态长度序列特别有用。另一方面，BN 需要在批次级别上进行计算，可能不适合长度变化大的序列。\n4. 训练和推理一致性：\n· BN 在训练和推理阶段的行为不同（训练时使用当前批次的统计信息，推理时使用整个数据集的统计信息），这可能导致不确定性。而 LN 在训练和推理时的行为是一致的，因为它总是基于单个样本进行归一化。\n5. 内存效率：\n· 在处理大规模序列数据时，使用 BN 可能会增加内存消耗，因为需要存储整个批次的统计信息。LN 由于其样本独立的特性，在这方面更加高效。\n\n总结来说，层归一化因其与批大小无关、适合处理动态长度序列、以及在训练和推理阶段行为一致等优点，被认为是在 Transformer 架构中处理序列数据的更合适的选择。","level":"高级","type":"对比分析","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 10 题"},{"id":"q478","src":"topic","srcName":"专题题库","no":478,"q":"Decoder 阶段的多头自注意力和 Encoder 的多头自注意力有什么区别？/ 为什么 Decoder 自注意力需要进行 sequence mask？","a":"在 Transformer 模型中，编码器（Encoder）和解码器（Decoder）的多头自注意力机制在基本原理上是相似的，但在实际应用中存在几个关键的区别：\n\n一、四个关键区别\n\n1. 遮蔽（Masking）的应用\n· 编码器多头自注意力：在编码器中的多头自注意力机制不使用遮蔽。这意味着在计算每个元素的注意力时，它可以看到输入序列中的所有其他元素。\n· 解码器多头自注意力：解码器中的多头自注意力机制使用了所谓的“前瞻遮蔽”（Look-ahead Masking）或“因果遮蔽”（Causal Masking）。这种遮蔽确保在预测一个元素时，只能使用该元素之前的元素信息，从而避免信息的未来泄露。这对于序列生成任务（如文本生成）至关重要，因为在生成当前词时，模型不应该知道后续的词。\n2. 关注点的不同\n· 编码器多头自注意力：编码器的自注意力层主要关注的是如何对输入数据中的元素进行编码，包括元素之间的关系和上下文信息。\n· 解码器多头自注意力：解码器的自注意力层则更加关注于已生成的输出序列，即如何基于目前已生成的序列内容来决定下一个元素。\n3. 输入来源的不同\n· 编码器多头自注意力：编码器的自注意力层处理的输入来自于原始输入序列（例如，待翻译的句子）。\n· 解码器多头自注意力：解码器的自注意力层处理的输入来自于之前的解码器输出（例如，在文本生成任务中，之前生成的文本序列）。\n4. 解码器中额外的交叉注意力层\n· 虽不直接是自注意力的一部分，但值得一提的是，解码器中除了自注意力层之外，还包含了交叉注意力层（也是多头注意力），其中解码器利用编码器的输出来进一步指导生成过程。这是解码器和编码器之间唯一的直接交互，也是解码器结构的一个重要组成部分。\n\n总结来说，尽管编码器和解码器在多头自注意力的基本机制上是相似的，但它们在遮蔽方式、关注点以及输入来源方面存在显著的区别，这些区别使得它们能够适应各自的角色和任务需求。\n\n二、为什么 Decoder 自注意力需要 sequence mask\n\n解码器（Decoder）中的自注意力机制需要进行序列遮蔽（sequence masking），主要是为了实现两个目的：防止信息的未来泄露（Future Information Leakage）和保持自回归特性（Autoregressive Property）。","level":"高级","type":"对比分析","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 11 题"},{"id":"q479","src":"topic","srcName":"专题题库","no":479,"q":"Transformer 的并行化体现在哪里，Decoder 可以做并行化嘛？","a":"Encoder 的模块是串行的，但模块内的子模块（多头注意力和前馈网络）内部都是并行的，因为单词之间没有依赖关系。Decoder 引入 sequence mask 就是为了并行化训练，推理过程不并行。","level":"高级","type":"概念解释","tags":["技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 12 题"},{"id":"q480","src":"topic","srcName":"专题题库","no":480,"q":"Transformer 计算量最大的部分是哪里？","a":"在 Transformer 模型中，计算量最大的部分通常是多头自注意力（Multi-Head Self-Attention）机制。这是因为自注意力涉及到对序列中的每个元素与序列中的所有其他元素进行比较，这种全序列对全序列的操作在计算上是非常昂贵的。\n\n以下是自注意力机制中计算量大的几个方面：\n\n1. 点积注意力计算：在自注意力机制中，对于每个元素，都需要计算其与序列中所有其他元素的点积。这种全对全的操作导致计算量随序列长度的平方增长。\n2. 线性变换：在计算注意力之前和之后，需要对查询（Query）、键（Key）和值（Value）进行线性变换。这些变换本身也是计算密集型的，尤其是当模型的维度和头数较大时。\n3. 多头注意力：Transformer 中使用的是多头注意力机制，这意味着上述计算需要被复制多次（每个头一次），进一步增加了总体计算量。\n4. 缩放因子的应用：在计算点积后，还需要应用一个缩放因子（通常是维度的平方根的倒数），虽然这部分计算量相对较小，但也是计算过程的一部分。\n5. Softmax 计算：计算完点积后，还需要对每个元素的分数应用 softmax 函数以获得最终的注意力权重。这个过程涉及到指数和归一化步骤，对于长序列来说也是计算密集型的。\n\n虽然其他部分，如前馈网络（Feed-Forward Network）和层归一化（Layer Normalization）也需要计算资源，但与多头自注意力相比，它们通常占据的计算量较小。特别是在处理长序列时，自注意力机制的计算量成为模型中的主要瓶颈。","level":"高级","type":"概念解释","tags":["技术架构与选型","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 13 题"},{"id":"q481","src":"topic","srcName":"专题题库","no":481,"q":"Transformer、LSTM 和单纯的前馈神经网络比，有哪些提升？","a":"LSTM 相比于单纯的前馈神经网络，首先具有理解文本的语序关系的能力（RNN）；除此之外，又解决了 RNN 在处理长序列时发生的梯度消失和梯度爆炸的问题。Transformer 进一步解决了 RNN、LSTM 等模型的长距离依赖问题，能够理解更长的上下文语义，可以并行化，所以需要的训练时间更短。","level":"中级","type":"对比分析","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 14 题"},{"id":"q482","src":"topic","srcName":"专题题库","no":482,"q":"有哪些处理超长文本的方法？","a":"处理超长文本是自然语言处理（NLP）中的一个挑战，尤其是在使用标准的 Transformer 模型时，因为它们通常对输入序列的长度有限制。以下是一些处理超长文本的常用方法：\n\n1. 分段处理（Chunking）：将长文本分割成较小的段落或句子，并分别处理每个部分。这种方法简单直接，但可能会丢失跨段落的上下文信息。\n2. 层次化注意力（Hierarchical Attention）：模型首先在较低层次（如句子或段落级别）处理文本，然后在更高层次上整合这些信息。这种方法可以捕捉更广泛的上下文，但实现相对复杂。\n3. 长序列 Transformer 变体：一些专门为长序列设计的 Transformer 变体，如 Transformer-XL、Reformer、Longformer、Big Bird 等，通过改进注意力机制或内存管理机制来处理更长的文本。\n· Transformer-XL：使用循环机制和相对位置编码来处理长序列。\n· Reformer：使用局部敏感哈希（Locality-Sensitive Hashing, LSH）注意力和可逆层来减少计算和内存需求。\n· Longformer：引入了局部窗口式的自注意力机制，并结合了全局注意力，使其能够处理长文本。\n· Big Bird：采用了稀疏注意力机制，结合随机、局部和全局注意力。\n4. 滑动窗口（Sliding Window）：使用滑动窗口在文本上进行局部注意力计算，窗口可以重叠以保持一些上下文信息，每个窗口作为一个独立的序列进行处理。\n5. 稀疏注意力机制：只计算注意力矩阵的一个稀疏子集，而不是完整的序列对序列注意力，这可以显著减少计算量。\n6. 提取关键信息：使用文本摘要或关键词提取技术来缩减文本长度，只保留最重要的信息。这种方法适用于某些特定的应用场景。\n7. 多任务学习：通过将超长文本处理作为一个辅助任务，在多任务学习框架下训练模型。例如，可以将文本摘要作为一个任务，来帮助模型学习如何提取关键信息。\n8. 利用外部知识库：结合外部知识库，例如使用实体链接或知识图谱，减少模型需要直接从文本中学习的信息量。\n\n每种方法都有其优点和限制，选择哪一种方法取决于特定的应用场景和需求。在实际应用中，可能需要根据具体任务进行方法的调整和优化。","level":"高级","type":"方案设计","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 15 题"},{"id":"q483","src":"topic","srcName":"专题题库","no":483,"q":"Transformer 为何不使用一个头而使用多头注意力机制？","a":"多头能让 Transformer 注意到不同子空间，捕捉到更加丰富的特征信息。这一做法是论文作者提出用于克服“模型在对当前位置的信息进行编码时，会过度地将注意力集中于自身的位置”的问题，并且经过作者验证这样效果比较好。\n\n论文在 WMT 2014 英德数据集上做了架构消融实验（Table 3），指标为 dev 集 PPL / BLEU，参数量单位为百万：\n\n· base（N=6，d_model=512，d_ff=2048，h=8，d_k=d_v=64，P_drop=0.1，ε_ls=0.1，100K steps）：4.92 / 25.8，65M\n· (A) 只改头数：h=1 → 5.29 / 24.9；h=4（d_k=d_v=512）→ 5.00 / 25.5；h=16（32/32）→ 4.91 / 25.8；h=32（16/16）→ 5.01 / 25.4\n· (B) 固定 d_k=d_v=16 改头数：h=16 → 5.16 / 25.1，58M；h=32 → 5.01 / 25.4，60M\n· (C) 改层数与维度：N=2 → 6.11 / 23.7，36M；N=4 → 5.19 / 25.3，50M；N=8 → 4.88 / 25.5，80M；d_model=256（d_k=d_v=32）→ 5.75 / 24.5，28M；d_model=1024（128/128）→ 4.66 / 26.0，168M；d_ff=1024 → 5.12 / 25.4，53M；d_ff=4096 → 4.75 / 26.2，90M\n· (D) 改 dropout 与 label smoothing：P_drop=0.0 → 5.77 / 24.6；P_drop=0.2 → 4.95 / 25.5；ε_ls=0.0 → 4.67 / 25.3；ε_ls=0.2 → 5.47 / 25.7\n· (E) 用可学习位置编码替代正弦位置编码：4.92 / 25.7\n· big（N=6，d_model=1024，d_ff=4096，h=16，P_drop=0.3，300K steps）：4.33 / 26.4，213M\n\n从表中可以看出：在参数量基本不变的前提下，多头（h=8）明显优于单头（h=1，BLEU 24.9）；但头数并非越多越好，h=32 反而略低于 h=8 和 h=16。真正带来大幅提升的是把模型做大（big 版本 BLEU 26.4）。","level":"高级","type":"概念解释","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 16 题"},{"id":"q484","src":"topic","srcName":"专题题库","no":484,"q":"Transformer 为什么 Q 和 K 使用不同的权重矩阵，不能使用同一个值进行自身的点乘操作？","a":"K 和 Q 的点乘是为了得到一个 attention score 矩阵，然后经过归一化后与 V 进行相乘。如果不用 Q，直接拿 K 和 K 点乘的话，attention score 矩阵会是一个对称矩阵，导致泛化能力很差。使用 Q、K 不相同可以保证在不同空间进行投影，增强了表达能力，提高了泛化能力。","level":"高级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 17 题"},{"id":"q485","src":"topic","srcName":"专题题库","no":485,"q":"深度学习中有哪些常用的注意力机制？","a":"在深度学习中，注意力机制是一种重要的技术，用于增强模型在处理复杂任务时的表现。以下是一些常用的注意力机制及其经典例子：\n\n1. Soft Attention（软注意力）：对输入的所有部分分配权重，通常通过一个可训练的模型来计算。\n· Bahdanau Attention（Additive Attention）——经典例子：用于神经机器翻译（NMT）。序列到序列模型（seq2seq）中的注意力机制，通过学习输入序列中每个元素的相关性来生成目标序列。\n· Luong Attention（Multiplicative Attention）——经典例子：改进的神经机器翻译。在生成目标序列时，通过点积计算输入和隐藏状态之间的相似性。\n2. Hard Attention（硬注意力）：基于采样，只选择输入的一部分进行处理，而不是对所有输入进行加权求和。\n· 经典例子：图像描述生成（Image Captioning）。在生成描述时，仅关注图像中的特定区域。\n3. Self-Attention（自注意力）：用于计算序列内部各个元素之间的关联，适用于处理序列数据。\n· Scaled Dot-Product Attention——经典例子：Transformer 模型。通过点积计算输入序列中各元素之间的相似性，并进行缩放处理，广泛用于自然语言处理任务。\n· Multi-Head Attention——经典例子：Transformer 中的多头注意力，通过并行计算多个自注意力机制并将结果拼接，提高模型的表达能力；Stable Diffusion 中也使用了多头注意力。\n4. Hierarchical Attention（层次注意力）：用于处理具有层次结构的数据，例如文档中的句子和句子中的词。\n· 经典例子：文档分类（Document Classification）。先对句子中的词进行注意力计算，再对文档中的句子进行注意力计算。\n5. Local Attention（局部注意力）：只对输入序列的一部分进行注意力计算，适用于处理长序列数据。\n· 经典例子：语音识别（Speech Recognition）。在语音识别任务中，仅关注当前时间窗口内的特征。\n6. Cross-Attention（交叉注意力）：用于两个不同序列之间的注意力计算，例如在多模态任务中对图像和文本进行关联。\n· 经典例子：视觉问答（Visual Question Answering），计算问题和图像之间的关联；文生图，Stable Diffusion 中有交叉注意力机制。\n7. Graph Attention（图注意力）：用于图数据的处理。\n· 经典例子：图神经网络（GNN）。在图结构数据中，对节点的邻居节点进行加权求和。\n8. Convolutional Attention（卷积注意力）：结合卷积操作和注意力机制，增强卷积神经网络的表示能力。\n· SENet（Squeeze-and-Excitation Network）——经典例子：图像分类，通过注意力机制重新调整通道的权重。\n· CBAM（Convolutional Block Attention Module）——经典例子：图像分类和目标检测，结合通道注意力和空间注意力。\n9. Temporal Attention（时序注意力）：用于处理时间序列数据。\n· 经典例子：时间序列预测（Time Series Forecasting），在多变量时间序列预测任务中关注时间序列中的模式。\n10. Dual Attention（双重注意力）：同时对两个不同维度的特征进行注意力计算。\n· 经典例子：多模态学习（Multimodal Learning），在场景分割任务中同时关注空间特征和通道特征。\n11. Residual Attention（残差注意力）：结合残差网络和注意力机制，增强特征的传递和组合。\n· 经典例子：图像分类，在残差网络中引入注意力机制，提升图像分类的性能。\n12. Transformers 系列\n· Vanilla Transformer——经典例子：神经机器翻译（NMT），通过自注意力机制进行序列到序列任务。\n· BERT（Bidirectional Encoder Representations from Transformers）——经典例子：各类 NLP 任务，如问答、文本分类等。\n· GPT（Generative Pre-trained Transformer）——经典例子：文本生成，如对话生成、文章续写等。\n13. Adaptive Attention（自适应注意力）：根据输入数据动态调整注意力机制。\n· 经典例子：视觉问答，在图像描述生成任务中自适应地调整注意力范围。\n14. Multi-Scale Attention（多尺度注意力）：在不同尺度上进行注意力计算。\n· 经典例子：视频分析（Video Analysis），在视频理解任务中对不同时间尺度的信息进行关注。\n15. Co-Attention（协同注意力）：同时对两个序列进行注意力计算，通常用于多模态任务。\n· 经典例子：视觉问答，计算问题和图像之间的关联。\n16. Self-Supervised Attention（自监督注意力）：通过自监督学习机制进行训练。\n· 经典例子：图像分类和对比学习，用于视觉任务的自监督学习框架，引入注意力机制进行特征对比学习。\n\n以上是深度学习中一些常用的注意力机制及其经典例子。选择适合的注意力机制可以显著提升模型的性能，不同的注意力机制在不同的应用场景中有不同的表现和优势。","level":"高级","type":"概念解释","tags":["深度学习与神经网络","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 18 题"},{"id":"q486","src":"topic","srcName":"专题题库","no":486,"q":"注意力机制计算时，QKV 的维度必须相同吗？","a":"不一定必须相同，但在有些维度上必须相同：\n\n1. QKV 的 N 和 head 默认是必须相同的。\n2. Q 和 K 的 embeddings 必须相同（一般 QKV 的 embeddings 都是相同的）。\n3. K 和 V 的序列长度 len 必须相同，Q 与（K 和 V）序列长度可以不同。\n\n假设：\n\n· Q 的维度：(N, Q_len, head, Q_dim)\n· K 的维度：(N, K_len, head, K_dim)\n· V 的维度：(N, V_len, head, V_dim)\n\nQK 计算注意力分数：\n\nenergy = torch.einsum(\"nqhd,nkhd->nhqk\", [queries, keys])\n\n由 nqhd * nkhd -> nhqk 可知，QK 后的维度是 (N, head, Q_len, K_len)。QK 是在 dim 维度上做的矩阵乘法，也就是 N、head、dim 维度上 QK 必须相同。\n\n计算注意力机制公式输出时：\n\nout = torch.einsum(\"nhql,nlhd->nqhd\", [attention, values])\n\n· QK 后的维度是 (N, head, Q_len, K_len)\n· V 的维度是 (N, V_len, head, V_dim)\n\n由 nhql, nlhd -> nqhd 可知，计算后的维度是 (N, Q_len, head, V_dim)。这里 l 维度消失，所以是在 l 维度做的乘法；l 维度代表的是 K_len 和 V_len，由此可知 K 和 V 的 (N, head, len) 是相同的。\n\n附：多头注意力的前向计算代码\n\ndef forward(self, values, keys, query, mask):\nN = query.shape[0]\nvalue_len, key_len, query_len = values.shape[1], keys.shape[1], query.shape[1]\n\n# Split the embedding into self.heads different pieces\nvalues = values.reshape(N, value_len, self.heads, self.head_dim)\nkeys = keys.reshape(N, key_len, self.heads, self.head_dim)\nqueries = query.reshape(N, query_len, self.heads, self.head_dim)\n\nvalues = self.values(values)\nkeys = self.keys(keys)\nqueries = self.queries(queries)\n\nenergy = torch.einsum(\"nqhd,nkhd->nhqk\", [queries, keys])\nif mask is not None:\nenergy = energy.masked_fill(mask == 0, float(\"-1e20\"))\n\nattention = torch.softmax(energy / (self.embed_size ** (1 / 2)), dim=3)\nout = torch.einsum(\"nhql,nlhd->nqhd\", [attention, values]).reshape(N, query_len, self.heads * self.head_dim)\nout = self.fc_out(out)\nreturn out","level":"高级","type":"概念解释","tags":["技术架构与选型","深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"Transformer","expNo":null,"expTitle":null,"origin":"《Transformer 面试问题汇总》截图 · 第 19 题"},{"id":"q487","src":"topic","srcName":"专题题库","no":487,"q":"你可以用一句话阐述一下你对智能客服的理解，并简单介绍下智能客服系统在各个领域的应用方式吗？","a":"在我的理解里，智能客服是指利用大数据和人工智能技术，通过电话呼叫自动化系统向用户提供个性化服务和信息。\n\n智能客服涉及语音识别、文本生成、知识图谱等技术，这些技术共同构成了智能客服的技术基础。在应用场景方面，智能客服广泛应用于电商、金融、电信、教育等多个行业。\n\n· 在电商领域，智能客服可以帮助用户查询订单状态、退换货政策等信息。\n· 在金融领域，智能客服可以解答用户关于贷款、信用卡等金融产品的疑问。\n· 在电信领域，智能客服可以处理用户的话费查询、套餐变更等业务。","level":"中级","type":"概念解释","tags":["技术架构与选型","用户研究与体验"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"智能客服","expNo":null,"expTitle":null,"origin":"《AI 智能客服系统面试》截图 · 第 1 题"},{"id":"q488","src":"topic","srcName":"专题题库","no":488,"q":"为什么会选择 LangChain 框架结合大语言模型来开发智能客服系统？","a":"首先我们先了解一下什么是 LangChain 框架：LangChain 框架基于大语言模型的问答能力，它可以整合其他功能。\n\n· 比如在线搜索：当用户询问一个问题时，LangChain 框架将首先接入在线搜索功能，获取相关搜索结果。\n· 然后，这些搜索结果将作为输入传递给大语言模型，以获取更加全面和准确的回答。\n· 最后，框架将模型的反馈结果提供给用户。\n\n结合 LangChain 框架的特性，我们可以看到它在智能客服系统中具有天然的优势：传统的客服系统常常无法满足用户需求，因为这些系统通常只能提供事先预设的固定答案，无法应对复杂多变的问题；而 LangChain 框架通过结合大语言模型和在线搜索功能，能够以更加智能的方式回答用户的问题。","level":"中级","type":"方案设计","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"智能客服","expNo":null,"expTitle":null,"origin":"《AI 智能客服系统面试》截图 · 第 2 题"},{"id":"q489","src":"topic","srcName":"专题题库","no":489,"q":"从长远来看，你觉得这个 AI 客服系统有哪些发展计划呢？","a":"我们对这款 AI 客服系统拥有长远的规划，目标是让这个 AI 客服系统成为一款高效、智能、用户友好的客服解决方案，以满足不断变化的用户需求。\n\n主要包括以下几个方面：\n\n1. 系统性能优化：我们将致力于进一步提升系统的性能，以提供更快速、高效的响应能力。通过优化算法和增强硬件设施，我们将确保系统能够在大规模用户同时访问时保持稳定和高效。\n2. 拓展用户群体和应用场景：我们将着眼于引入更多的使用者，并拓展系统在各个行业和应用场景中的应用范围。通过与不同领域的企业合作，我们将定制化系统功能，满足不同行业特定需求。\n3. 多渠道互动方式：为了提供更加便捷和多样化的用户体验，我们将增加多渠道互动方式。除了传统的文字输入外，我们还计划引入语音识别、图像识别等技术，使用户可以通过多种方式与系统进行交互。\n4. 整合垂直领域知识库：为了提供更加精准和专业的回答，我们将整合更多的垂直领域知识库到系统中。这些知识库将涵盖各个行业的专业知识和常见问题解答，以提供更科学、权威的答案。","level":"高级","type":"方案设计","tags":["产品规划与需求","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"智能客服","expNo":null,"expTitle":null,"origin":"《AI 智能客服系统面试》截图 · 第 3 题"},{"id":"q490","src":"topic","srcName":"专题题库","no":490,"q":"RAG 技术体系的总体思路是什么？","a":"数据预处理 -> 分块（这一步骤很关键，有时候也决定了模型的效果）-> 文本向量化 -> query 向量化 -> 向量检索 -> 重排 -> query + 检索内容输入 LLM -> 输出。","level":"高级","type":"方法流程","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · RAG"},{"id":"q491","src":"topic","srcName":"专题题库","no":491,"q":"使用外挂知识库主要为了解决什么问题？","a":"· 克服遗忘问题。\n· 提升回答的准确性、权威性、时效性。\n· 解决通用模型针对一些小众领域没有涉猎的问题。\n· 提高可控性和可解释性，提高模型的可信度和安全性。","level":"中级","type":"概念解释","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · RAG"},{"id":"q492","src":"topic","srcName":"专题题库","no":492,"q":"如何评价 RAG 项目效果的好坏？","a":"针对检索环节的评估：\n\n· MRR（平均倒数排名）：查询（或推荐请求）的排名倒数。\n· Hits Rate 命中率：前 k 项中，包含正确信息的项的数目占比。\n· NDCG。\n\n针对生成环节的评估：\n\n· 非量化：完整性、正确性、相关性。\n· 量化：Rouge-L。","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · RAG"},{"id":"q493","src":"topic","srcName":"专题题库","no":493,"q":"大模型的幻觉问题、复读机问题是什么？","a":"幻觉问题：即生成的内容是无意义的或不忠实于提供的源内容。\n\n复读机问题：重复生成某些话。","level":"中级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 幻觉与复读机"},{"id":"q494","src":"topic","srcName":"专题题库","no":494,"q":"针对幻觉问题、复读机问题有没有什么解决办法？","a":"针对幻觉问题：引入外挂知识库，加入一些纠偏规则，限制输出长度等。\n\n针对复读机问题：\n\n· 丰富数据集的多样性，预处理时尽量过滤重复无意义的文本。\n· 同义词替换等做数据增强。\n· 温度参数调整。\n· 后处理与过滤。","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 幻觉与复读机"},{"id":"q495","src":"topic","srcName":"专题题库","no":495,"q":"出现幻觉问题、复读机问题的原因有哪些？","a":"针对幻觉问题，主要分为两大类：\n\n· 生成结果与数据源不一致，自相矛盾。\n· 用户问题超出了大模型的认知。\n\n针对前者，可能是训练数据和源数据不一致、数据没对齐，或者编码器理解能力的缺陷和解码器策略错误，可能导致幻觉；后者则是用户的问题不在语言模型认知范围内。\n\n针对复读机问题：数据质量不高，存在大量单一、重复文本，文本过长。\n\n（补充：当前面的条件文本过长时，大模型输出的几个短文本会被原始的很长的条件文本淹没，继续预测下一个 token 的话，在模型看起来可能条件仍然是差不多的。此时如果使用 greedy search，只选择概率最大的一个 token，模型极大可能会将前面已经生成的短文本重新预测成概率最大的文本，以此类推，会一直重复下去。）","level":"高级","type":"概念解释","tags":["模型训练与评估","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 幻觉与复读机"},{"id":"q496","src":"topic","srcName":"专题题库","no":496,"q":"当前主流的开源大模型是哪个，其架构具体是怎样的？","a":"当前开源影响范围最广、生态建设最好的开源大模型是 Meta 的 LLaMA。\n\n其依旧采用 Transformers 架构，并做了如下改动：\n\n· 为了提高训练稳定性，对每个子层做输入前置归一化，归一化函数为 RMSNorm（受 GPT-3 启发）。\n· 为了提升性能，SwiGLU 激活函数替换 ReLU 激活函数（受 PaLM 启发）。\n· 从绝对位置嵌入，改为旋转嵌入（受 GPT-neo 启发）。\n· 使用 causal multi-head attention 的一个高效实现来减少内存占用和运行时间。","level":"高级","type":"概念解释","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 开源模型"},{"id":"q497","src":"topic","srcName":"专题题库","no":497,"q":"有哪几种 SFT 方法？","a":"· 全微调\n· Adapter Tuning\n· Prefix Tuning\n· Prompt Tuning\n· P-Tuning v1\n· LoRA\n· RLHF\n\n（SFT 时，学习率设置为预训练阶段的 10%，一般会取得不错的效果。）","level":"高级","type":"概念解释","tags":["模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · SFT 与微调"},{"id":"q498","src":"topic","srcName":"专题题库","no":498,"q":"什么是 LoRA 微调？","a":"在原始 PLM（Pre-trained Language Model）旁边增加一个旁路，做一个降维再升维的操作，来模拟所谓的 intrinsic rank。训练的时候固定 PLM 的参数，只训练降维矩阵 A 与升维矩阵 B。模型的输入输出维度不变，输出时将 BA 与 PLM 的参数叠加。用随机高斯分布初始化 A，用 0 矩阵初始化 B，保证训练的开始此旁路矩阵依然是 0 矩阵。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · SFT 与微调"},{"id":"q499","src":"topic","srcName":"专题题库","no":499,"q":"RAG 的检索阶段，常见的向量检索模型有哪些？","a":"ANN 算法：\n\n· 乘积量化（PQ）\n· 暴力搜索\n· hnswlib\n\nKD 树。","level":"中级","type":"概念解释","tags":["技术架构与选型","自然语言处理"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · RAG 检索"},{"id":"q500","src":"topic","srcName":"专题题库","no":500,"q":"针对通用的 RAG，你觉得还有哪些改进点？","a":"· query 侧：做 query 的纠错、改写、规范化和扩展。\n· 对向量数据库做层次索引，提高检索效率和精度。\n· 对 LLM 模型微调，针对当前垂直领域引入知识库，提升回答的专业性、时效性和正确性。\n· 对最终输出做后处理，降低输出的不合理 case。","level":"高级","type":"方案设计","tags":["技术架构与选型","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · RAG 改进"},{"id":"q501","src":"topic","srcName":"专题题库","no":501,"q":"什么是 LangChain？","a":"LangChain 为大型语言模型提供了一种全新的搭建和集成方式。通过这个强大的框架，我们可以将复杂的技术任务简化，让创意和创新更加易于实现。有点类似于神经网络开发与 TensorFlow/PyTorch 之间的关系。","level":"中级","type":"概念解释","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · LangChain"},{"id":"q502","src":"topic","srcName":"专题题库","no":502,"q":"SFT 和 RLHF 优劣对比","a":"从方法、优点、缺点三个维度对比：\n\nSFT\n· 优点：1. 启动简单，仅需要问答对数据就可以进行训练；2. 训练简单，直接对 LLM 进行调参，大部分情况下训练几个 epoch 就可达到预期；3. 显存资源相比于 RLHF 来说耗费低。\n· 缺点：1. 模型的效果非常依赖于 SFT 数据的质量，取决于 SFT 数据标注的质量；2. 对标注要求高，对一条指令来说，写出高质量的回答其实是一件非常困难的事情，耗时耗力。\n\nRLHF\n· 优点：1. 直接利用人类偏好来进行指导大模型的训练，使大模型的输出更能满足人们的要求；2. 在安全性和事实性上，都能有很大的提升。\n· 缺点：1. 训练消耗大量的显存；2. 训练过程中很不稳定，想要成功的训练不是那么容易的事情；3. 除了 SFT 阶段的数据，还得标注 reward 的数据；在对齐人类偏好的过程中，判断两个回答哪个更好比较容易，但想标注好多少，又不是件容易的事情。","level":"高级","type":"对比分析","tags":["模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · SFT 与 RLHF"},{"id":"q503","src":"topic","srcName":"专题题库","no":503,"q":"大模型训练经常出现 OOM 问题，在现有硬件基础下，有什么性能提升 trick？","a":"梯度累积。\n\n（把多个小 batch 的梯度累加后再更新参数，用时间换显存。）","level":"高级","type":"方法流程","tags":["技术架构与选型","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 训练优化"},{"id":"q504","src":"topic","srcName":"专题题库","no":504,"q":"长文本可以直接输入大模型吗？","a":"不可以。\n\n· 受限于计算资源。\n· 训练阶段长句子会导致梯度消失或者梯度爆炸（因为它依赖前面的词进行最大似然估计作为损失函数，这个最大似然估计化简一下就是连乘的形式，容易造成梯度消失或者梯度爆炸）。\n· 推理阶段会增加预测错误率。","level":"中级","type":"概念解释","tags":["技术架构与选型","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 长文本限制"},{"id":"q505","src":"topic","srcName":"专题题库","no":505,"q":"大模型推理时，显存中有哪几部分数据？","a":"模型参数（权重）。\n\n（实际推理时还会占用 KV Cache 和推理过程中的中间激活值。）","level":"中级","type":"概念解释","tags":["技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 显存"},{"id":"q506","src":"topic","srcName":"专题题库","no":506,"q":"模型在训练和推理的时候各占用显存的多少？","a":"· 一般来说，训练占用模型参数量的 16 倍大小（优化器、梯度、模型本身）。\n· 推理占用模型参数量的 2 倍大小（FP16 是一个单位参数大小对应两个字节，INT8 是一个单位参数大小对应一个字节）。","level":"中级","type":"概念解释","tags":["技术架构与选型","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 显存"},{"id":"q507","src":"topic","srcName":"专题题库","no":507,"q":"详细说说 DeepSpeed 的机制","a":"是一种数据并行的方法，采用的 ring all-reduce 方式。\n\n传统的 parameter server 是 server 和 client 的方式：client 通过计算分配给自己的数据产生梯度，传给 server，server 做聚合，然后把聚合后的参数再传给 client。这个方式的弊端是 server 容易成为瓶颈，server 通信量太大；另外可能一个 client 失败，会导致其他 client 等待。\n\nRing all-reduce 是一种分布式的方式，各个节点分配通信量。总的通信量和 PS 没啥变化，但是通信的压力平摊到各个 GPU 上了，GPU 之间的通信可以并行进行。\n\n假如 GPU 数量是 N，把模型参数分成 N 份，每个 GPU 要存放整个参数，每个 GPU 也要分配训练数据。当一次迭代，N 个 GPU 之间要经过一个 scatter 和 gather 操作：reduce-scatter 是将不同 GPU 上对应的参数的 gradient 相加，一共需要通讯（N-1）次；all-gather 是将合并完整的参数传到其他 GPU 上，需要通讯（N-1）次。一次 all-reduce，单卡通信量为 2*sita。\n\nZeRO 包括 3 种方案，逐步递进：\n\n· ZeRO-1：将 Adam 的参数分割成 N 份，这样一个 GPU 上只能保存一份 Adam 参数；这对于 forward 没啥影响，gradient 需要进行一次 all-reduce，但是只能更新一部分参数，所以 W 需要进行一次 all-gather，通信量为 3N*sita，存储为 12*sita/N + 4*sita。\n· ZeRO-2：将 AdamW、gradient 都分割成 N 份，梯度就不需要 all-gather 了，只需要 scatter 了，W 需要 all-gather，通讯量为 2N*sita。\n· ZeRO-3：将参数、Adam 和 gradient 都分割，forward 的时候需要将 W all-gather，backward 时还需要把 W all-gather 回来，计算梯度，丢掉不属于自己的 W，然后对梯度做 reduce-scatter，更新 W，通讯量为 3N*sita。\n\n最后采用 stage 3：用 1.5 倍的通讯开销，换回近 120 倍的显存。\n\n另外，还有 ZeRO-Offload 是基于 ZeRO-2，将 Adam 和 gradient 放到内存中，在 CPU 内起了 N 个线程计算。其中的一条主线是 gradient 总是需要 scatter 的，感觉这个数据并行标志。这里需要注意一点：不管是 forward 还是 backward，都是需要有完整的 W 的。另外有了 gradient 以及 AdamW 的参数，才能更新 W。","level":"高级","type":"概念解释","tags":["技术架构与选型","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 分布式训练"},{"id":"q508","src":"topic","srcName":"专题题库","no":508,"q":"什么是混合精度训练？","a":"FP64 用 8 个字节共 64 位，FP32 用 4 个字节共 32 位，FP16 用 2 个字节共 16 位。\n\n在神经网络模型的训练过程中，通常默认使用单精度（FP32）浮点数据类型来表示网络模型的权重和其他参数。\n\n为什么需要混合精度训练？使用 FP16 训练神经网络，相比使用 FP32 有以下优点：\n\n· 内存占用减少：FP16 的位宽是 FP32 的一半，所以权重等参数占用的内存也减少了一半，这样就可以训练更大的网络模型或者使用更多的数据。\n· 通讯效率提高：对于分布式训练，特别是大模型训练，通讯的开销是一个性能瓶颈，通讯的位宽减少了一半，就可以加快通讯速度，减少等待时间，提高数据流通效率。\n· 计算效率更高：在一些专门的 AI 加速芯片上，使用 FP16 的计算性能比 FP32 更快。\n\n但是使用 FP16 也会带来一些问题，主要有两个方面：数据溢出、舍入误差。\n\n为了利用 FP16 的优势，提高深度学习训练的效率和性能，同时避免精度溢出和舍入误差的影响，可以采用 FP16 和 FP32 的混合精度训练，主要涉及以下三个重要技术点：\n\n· 权重备份（Weight Backup）\n· 损失放大（Loss Scaling）\n· 精度累加（Precision Accumulated）","level":"中级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 混合精度"},{"id":"q509","src":"topic","srcName":"专题题库","no":509,"q":"什么是 prefix LLM 和 causal LLM？","a":"· prefix LM：token 可以相互看到，输入双向注意力，输出单向注意力（ChatGLM、ChatGLM2、U-PaLM）。\n· causal LM：严格自回归，从左到右的单向注意力（LLaMA-7B、LLaMA 衍生物、Qwen）。","level":"中级","type":"概念辨析","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · 模型结构"},{"id":"q510","src":"topic","srcName":"专题题库","no":510,"q":"说一说针对 MHA 后续的一些计算优化工作","a":"1. KV Cache，核心思想：因为 Transformer 是自回归的，每一个 token 的预测包含大量前文的重复冗余计算。优化点是将需要重复利用的中间结果存下来，避免重复计算。\n2. MQA，核心思想：虽然 SRAM 的带宽很大，但是容量很小（A100 只有大概 20M），所以要进一步减少需要缓存的数据。MQA 中的多头只有 Q 是不一样的，K、V 完全相同。\n3. GQA，核心思想：进一步减少需要缓存的数据大小，K、V 分组复制，数据大小介于 MQA 和 MHA 之间。\n4. FlashAttention，核心思想：将 Q、K、V 切分为更小的块，从 HBM 中加载到 SRAM，需要计算的时候直接从 SRAM 中读。","level":"高级","type":"概念解释","tags":["深度学习与神经网络","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · Attention 优化"},{"id":"q511","src":"topic","srcName":"专题题库","no":511,"q":"说说 attention 几种常见的计算方式","a":"· self-attention。\n· DIN 的 attention：计算得到权重之后，没有进行 softmax 归一化操作，而是保留了权重原始的信号强度。\n\n原始权重是通过网络最后一层激活函数得到，因此可以利用激活函数的特点，将其值限制在 0-1 之间，如 sigmoid 函数，从而使得到的原始权重值可直接用于加权求和，保留了权重的差异性。使用 softmax 操作虽然可以进行归一化，但同时会弱化权重之间的差异性，有损用户兴趣的局部聚焦性。","level":"中级","type":"概念解释","tags":["深度学习与神经网络"],"dims":[],"status":"","chapter":"","round":"","part":"","topic":"鹅厂大模型技术面","expNo":null,"expTitle":null,"origin":"《鹅厂大模型技术面经》截图 · Attention 优化"}]};

const API_BASE = "https://ai-pm-interview-486.app.workbuddy.host".replace(/\/+$/, "");
const API_SHARECODE = "ML5MQW3TYD";   // WorkBuddy 托管网关的访问参数，非该环境时为空
function apiUrl(path){
  if (!API_SHARECODE) return API_BASE + path;
  return API_BASE + path + (path.includes("?") ? "&" : "?") + "sharecode=" + encodeURIComponent(API_SHARECODE);
}
const REMOTE_AUTH = /^https?:\/\//.test(API_BASE);      // 是否接入真实登录服务；否则为本地演示模式
const AUTH_KEY = "aipm_auth_v1";
const SYNC_DIRTY_KEY = "aipm_sync_dirty";

let AUTH = (() => {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if (a && a.account && a.expiresAt > Date.now()) return a;
  } catch(e){}
  return null;
})();

function saveAuth(a){ AUTH = a; try { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); } catch(e){} }
function clearAuth(){ AUTH = null; try { localStorage.removeItem(AUTH_KEY); } catch(e){} }

let syncTimer = null, syncing = false, lastSyncAt = 0;
let syncState = (() => { try { return localStorage.getItem(SYNC_DIRTY_KEY) === "1" ? "pending" : "idle"; } catch(e){ return "idle"; } })();

function renderSyncDot(){
  const d = document.getElementById("sync-dot");
  if (!d) return;
  const cls = syncState === "ok" ? "ok" : (syncState === "pending" || syncState === "syncing") ? "pending" : syncState === "error" ? "err" : "";
  d.className = "sync-dot " + cls;
  d.title = syncState === "ok"
    ? "已同步 · " + new Date(lastSyncAt || Date.now()).toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"})
    : syncState === "syncing" ? "正在同步…"
    : syncState === "error" ? "同步失败，稍后自动重试"
    : "进度会随练习自动同步";
}

function renderUserbox(){
  const box = document.getElementById("userbox");

    '<button class="logout-btn" id="logout-btn">退出</button>';
  document.getElementById("logout-btn").addEventListener("click", () => {
    if (!confirm("退出登录？本机进度会保留，下次登录仍可继续。")) return;
    flushSync();
    clearAuth();
    document.body.classList.add("auth-mode");
    renderUserbox();
    renderLogin();
  });
  renderSyncDot();
}

function weakSummary(){
  const typeCnt = {}, tagCnt = {};
  for (const q of QS){
    const p = store.progress[q.id];
    if (!p || (p.s !== "vague" && p.s !== "unknown")) continue;
    if (q.type) typeCnt[q.type] = (typeCnt[q.type] || 0) + 1;
    for (const t of q.tags) tagCnt[t] = (tagCnt[t] || 0) + 1;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => k + " " + v).join("、");
  return { weakType: top(typeCnt), weakTag: top(tagCnt) };
}

function progressDetail(){
  const o = {};
  for (const id in store.progress){
    const p = store.progress[id];
    const s = p.s === "known" ? "k" : p.s === "vague" ? "v" : p.s === "unknown" ? "u" : "";
    if (!s && !p.fav) continue;
    o[id] = s ? (p.fav ? [s, 1] : s) : "f";
  }
  return JSON.stringify(o);
}

function scheduleSync(){
  if (!AUTH || !REMOTE_AUTH) return;
  syncState = "pending";
  try { localStorage.setItem(SYNC_DIRTY_KEY, "1"); } catch(e){}
  renderSyncDot();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushProgress(false), 5000);
}

async function pushProgress(keepalive){
  if (!AUTH || !REMOTE_AUTH || syncing) return;
  clearTimeout(syncTimer);
  syncing = true; syncState = "syncing"; renderSyncDot();
  const st = globalStats();
  const w = weakSummary();
  const stats = {
    seen: st.seen, known: st.known, vague: st.vague, unknown: st.unknown, fav: st.fav,
    total: st.total, rate: st.total ? Math.round(st.known / st.total * 1000) / 10 : 0,
    weakType: w.weakType, weakTag: w.weakTag,
  };
  try {
    const r = await fetch(apiUrl("/api/progress"), {
      method: "POST", keepalive: !!keepalive,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + AUTH.token },
      body: JSON.stringify({ stats, detail: progressDetail(), device: (navigator.userAgent || "").slice(0, 40) }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    syncState = "ok"; lastSyncAt = Date.now();
    try { localStorage.setItem(SYNC_DIRTY_KEY, "0"); } catch(e){}
  } catch(e){
    syncState = "error";
  } finally {
    syncing = false; renderSyncDot();
  }
}
function flushSync(){
  if (!AUTH || !REMOTE_AUTH) return;
  if (syncState === "pending" || syncState === "error") pushProgress(true);
}

function migrateLegacyStore(){
  try {
    const legacy = JSON.parse(localStorage.getItem("aipm_prep_v1") || "null");
    if (legacy && legacy.progress && Object.keys(legacy.progress).length && !Object.keys(store.progress).length){
      store.progress = legacy.progress;
      store.settings = store.settings || legacy.settings || {};
      saveStore();
    }
  } catch(e){}
}

async function restoreFromCloud(token){
  if (!REMOTE_AUTH || !token || token === "local") return;
  if (Object.keys(store.progress).length) return;      // 本机已有进度时以本机为准
  try {
    const r = await fetch(apiUrl("/api/progress"), { headers: { "Authorization": "Bearer " + token } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j.found || !j.detail) return;
    const d = JSON.parse(j.detail);
    const map = { k: "known", v: "vague", u: "unknown" };
    for (const id in d){
      const v = d[id];
      if (Array.isArray(v)) store.progress[id] = { s: map[v[0]] || "", fav: v[1] ? 1 : 0, seen: 1, lastAt: Date.now() };
      else if (v === "f") store.progress[id] = { s: "", fav: 1, seen: 1, lastAt: Date.now() };
      else if (map[v]) store.progress[id] = { s: map[v], fav: 0, seen: 1, lastAt: Date.now() };
    }
    saveStore();
  } catch(e){}
}

function enterApp(){
  document.body.classList.remove("auth-mode");

}
function getProg(qid){ return store.progress[qid] || {s:"", fav:0, seen:0, lastAt:0}; }
function markSeen(qid){
  const p = getProg(qid);
  p.seen = (p.seen || 0) + 1; p.lastAt = Date.now();
  store.progress[qid] = p; saveStore();
  scheduleSync();
}
function setStatus(qid, s){
  const p = getProg(qid);
  p.s = s; p.lastAt = Date.now();
  if (!p.seen) p.seen = 1;
  store.progress[qid] = p; saveStore();
  scheduleSync();
}
function toggleFav(qid){
  const p = getProg(qid);
  p.fav = p.fav ? 0 : 1;
  store.progress[qid] = p; saveStore();
  scheduleSync();
  return !!p.fav;
}
function globalStats(){
  let seen = 0, known = 0, vague = 0, unknown = 0, fav = 0;
  for (const q of QS){
    const p = store.progress[q.id];
    if (!p) continue;
    if (p.seen) seen++;
    if (p.s === "known") known++;
    else if (p.s === "vague") vague++;
    else if (p.s === "unknown") unknown++;
    if (p.fav) fav++;
  }
  return {seen, known, vague, unknown, fav, total: QS.length};
}

/* ==================== 工具函数 ==================== */
const $app = document.getElementById("app");
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtAnswer(text){
  if (!text) return '<div class="ans-empty">本题暂无参考详解</div>';
  const lines = esc(text).split("\n");
  return lines.map(t => {
    let cls = "";
    if (/^\s*【[^】]*】/.test(t)) cls = "l-bracket";
    else if (/^\s*(第[一二三四五六七八九十]+[部分章节]|[一二三四五六七八九十]+、)/.test(t)) cls = "l-h";
    else if (/^\s*[·•]\s*/.test(t)) cls = "l-dot";
    else if (/^\s*\d+[.、)]\s*/.test(t)) cls = "l-num";
    return cls ? '<span class="' + cls + '">' + t + "</span>" : t;
  }).join("\n");
}
