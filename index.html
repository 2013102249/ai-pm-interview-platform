/* ==================== 视图：题库 ==================== */
const bankState = {
  src: "all", level: "", type: "", tags: new Set(), exps: new Set(),
  chapter: "", round: "", part: "", topic: "",
  q: "", sort: "no", shown: 24
};
function bankFilter(){
  return QS.filter(q => {
    if (bankState.src !== "all" && q.src !== bankState.src) return false;
    if (bankState.level && q.level !== bankState.level) return false;
    if (bankState.type && q.type !== bankState.type) return false;
    if (bankState.tags.size && !q.tags.some(t => bankState.tags.has(t))) return false;
    if (bankState.exps.size && (!q.expNo || !bankState.exps.has(q.expNo))) return false;
    if (bankState.chapter && q.chapter !== bankState.chapter) return false;
    if (bankState.round && q.round !== bankState.round) return false;
    if (bankState.part && q.part !== bankState.part) return false;
    if (bankState.topic && q.topic !== bankState.topic) return false;
    if (bankState.q){
      const kw = bankState.q.toLowerCase();
      const hay = (q.q + q.a + q.tags.join(" ") + q.type + q.level + (q.expTitle||"") + (q.expNo||"") + qGroup(q)).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}
function bankSort(list){
  const lv = {"初级":0,"中级":1,"高级":2};
  const arr = list.slice();
  if (bankState.sort === "levelAsc") arr.sort((a,b) => (lv[a.level]||0) - (lv[b.level]||0) || a.no - b.no);
  else if (bankState.sort === "levelDesc") arr.sort((a,b) => (lv[b.level]||0) - (lv[a.level]||0) || a.no - b.no);
  else if (bankState.sort === "rand") arr.sort(() => Math.random() - 0.5);
  else arr.sort((a,b) => a.no - b.no);
  return arr;
}
function renderBank(){
  // 支持 #/bank?src=pm&chapter=xxx 等入口参数（应用一次后清理 hash，避免覆盖用户后续切换的库）
  const param = (location.hash.split("?")[1] || "");
  const qp = new URLSearchParams(param);
  const urlSrc = qp.get("src");
  if (urlSrc && (urlSrc === "all" || SRCMAP[urlSrc]) && bankState.src !== urlSrc){
    bankState.src = urlSrc;
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.exps.clear();
    bankState.shown = 24;
  }
  ["chapter","round","part","topic"].forEach(k => {
    const v = qp.get(k);
    if (v) bankState[k] = v;
  });
  if (urlSrc || qp.get("chapter") || qp.get("round") || qp.get("part") || qp.get("topic")){
    history.replaceState(null, "", location.pathname + location.search + "#/bank");
  }
  const list = bankSort(bankFilter());
  const bs = DB.stats.bySrc;
  const F = DB.facets;

  const srcTabs = [["all","全部",DB.stats.total]].concat(SRCS.map(s => [s.k, s.short || s.name, s.count]));

  // 分册维度筛选：仅当前数据源有对应字段时出现（大厂八股→章节 / 鹅厂→轮次 / LLM→分部 / 专题→专题）
  const GROUP_FACET = {pm:["章节","chapter","chapters"], tx:["轮次","round","rounds"],
                       llm:["分部","part","parts"], topic:["专题","topic","topics"]};
  const gf = GROUP_FACET[bankState.src];
  const groupRow = gf ? fRow(gf[0], F[gf[2]].map(v =>
    '<button class="chip ' + (bankState[gf[1]] === v ? "on" : "") + '" data-group="' + gf[1] + '" data-val="' + esc(v) + '">' + esc(v) + "</button>").join("")) : "";
  const showExpRow = bankState.src === "all" || bankState.src === "exp";

  $app.innerHTML =
    '<div class="card toolbar">' +
      '<div class="tabs">' +
        srcTabs.map(([k,t,n]) =>
          '<button class="tab ' + (bankState.src === k ? "on" : "") + '" data-src="' + k + '">' + t + '<span class="n">' + n + "</span></button>").join("") +
      "</div>" +
      '<div class="toolbar-row">' +
        '<div class="search-box"><span class="ic">⌕</span><input id="bank-search" placeholder="搜索题目 / 答案关键词 / 标签…" value="' + esc(bankState.q) + '"></div>' +
        '<select class="sel" id="bank-sort">' +
          '<option value="no"' + (bankState.sort==="no"?" selected":"") + ">按序号</option>" +
          '<option value="levelAsc"' + (bankState.sort==="levelAsc"?" selected":"") + ">难度：初级→高级</option>" +
          '<option value="levelDesc"' + (bankState.sort==="levelDesc"?" selected":"") + ">难度：高级→初级</option>" +
          '<option value="rand"' + (bankState.sort==="rand"?" selected":"") + ">随机排序</option>" +
        "</select>" +
        '<button class="btn btn-ghost btn-sm" id="filter-toggle">筛选' +
          (chipActive() ? " ●" : "") + "</button>" +
        (hasActiveFilter() ? '<button class="btn btn-ghost btn-sm" id="filter-reset">重置</button>' : "") +
      "</div>" +
    "</div>" +

    '<div class="card filters" id="filter-panel">' +
      fRow("难度", F.levels.map(l =>
        '<button class="chip ' + (bankState.level === l ? "on" : "") + '" data-level="' + esc(l) + '">' + l + "</button>").join("")) +
      fRow("题型", F.types.map(t =>
        '<button class="chip ' + (bankState.type === t ? "on" : "") + '" data-type="' + esc(t) + '">' + t + "</button>").join("")) +
      fRow("标签", F.tags.map(t =>
        '<button class="chip ' + (bankState.tags.has(t) ? "on" : "") + '" data-tag="' + esc(t) + '">' + t + "</button>").join("")) +
      groupRow +
      (showExpRow ? fRow("面经", Object.keys(F.expMeta).map(no =>
        F.expMeta[no].count ? '<button class="chip ' + (bankState.exps.has(no) ? "on" : "") + '" data-exp="' + no + '">' + no + " · " + F.expMeta[no].count + " 题</button>" : "").join("")) : "") +
    "</div>" +

    '<div class="result-bar"><span>共 <b>' + list.length + "</b> 题" +
      (list.length > bankState.shown ? "（已显示 " + bankState.shown + "）" : "") + "</span>" +
      '<span>点击题目展开参考详解 · ☆ 收藏 · 右下角标记掌握情况</span></div>' +

    '<div class="qlist" id="qlist">' +
      (list.length === 0
        ? '<div class="card empty"><div class="ei">🔍</div><p>没有符合条件的题目，试试放宽筛选条件</p></div>'
        : list.slice(0, bankState.shown).map(q => qCard(q)).join("")) +
    "</div>" +

    (list.length > bankState.shown
      ? '<button class="btn btn-ghost load-more" id="load-more">加载更多（还有 ' + (list.length - bankState.shown) + " 题）</button>"
      : "");

  bindBank();
}
function hasActiveFilter(){
  return !!(bankState.level || bankState.type || bankState.tags.size || bankState.exps.size ||
            bankState.chapter || bankState.round || bankState.part || bankState.topic || bankState.q);
}
function chipActive(){
  return !!(bankState.level || bankState.type || bankState.tags.size || bankState.exps.size ||
            bankState.chapter || bankState.round || bankState.part || bankState.topic);
}
function fRow(label, chips){
  return '<div class="f-row"><span class="f-label">' + label + '</span><div class="f-chips">' + chips + "</div></div>";
}
function qCard(q){
  const p = getProg(q.id);
  return '<div class="qcard" data-qid="' + q.id + '">' +
    '<div class="qcard-head">' +
      '<span class="qno">#' + q.no + "</span>" +
      '<div class="qmain">' +
        '<div class="qtitle">' + esc(q.q) + "</div>" +
        '<div class="qmeta">' + srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
          (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
          groupBadge(q) + statusBadge(q) + tagBadges(q) + progBadge(p) + "</div>" +
      "</div>" +
      '<button class="fav-btn ' + (p.fav ? "on" : "") + '" data-fav title="收藏">' + (p.fav ? "★" : "☆") + "</button>" +
      '<span class="chev">▾</span>' +
    "</div>" +
    '<div class="qcard-body" hidden>' +
      '<div class="ans">' + fmtAnswer(q.a) + "</div>" +
      '<div class="qcard-actions">' +
        '<span class="act-label">掌握情况</span>' +
        '<button class="rbtn ' + (p.s==="known"?"on-k":"") + '" data-rate="known">✓ 掌握了</button>' +
        '<button class="rbtn ' + (p.s==="vague"?"on-v":"") + '" data-rate="vague">～ 模糊</button>' +
        '<button class="rbtn ' + (p.s==="unknown"?"on-u":"") + '" data-rate="unknown">✗ 重学</button>' +
        '<span class="q-src-line">' + esc(q.origin) + "</span>" +
      "</div>" +
    "</div>" +
  "</div>";
}
function bindBank(){
  const panel = document.getElementById("filter-panel");
  if (chipActive()) panel.classList.add("show");
  document.getElementById("filter-toggle").addEventListener("click", () => panel.classList.toggle("show"));
  const resetBtn = document.getElementById("filter-reset");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    bankState.level = ""; bankState.type = ""; bankState.tags.clear(); bankState.exps.clear();
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.q = ""; bankState.shown = 24; renderBank();
  });
  document.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => {
    bankState.src = b.dataset.src;
    // 分册维度与面经筛选只对各自数据源有效，切换来源时一并清理
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.exps.clear();
    bankState.shown = 24; renderBank();
  }));
  const search = document.getElementById("bank-search");
  let deb = null;
  search.addEventListener("input", () => {
    clearTimeout(deb);
    deb = setTimeout(() => { bankState.q = search.value.trim(); bankState.shown = 24; renderBank(); }, 160);
  });
  document.getElementById("bank-sort").addEventListener("change", e => {
    bankState.sort = e.target.value; renderBank();
  });
  document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => {
    bankState.level = bankState.level === b.dataset.level ? "" : b.dataset.level;
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    bankState.type = bankState.type === b.dataset.type ? "" : b.dataset.type;
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.tag;
    bankState.tags.has(t) ? bankState.tags.delete(t) : bankState.tags.add(t);
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-exp]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.exp;
    bankState.exps.has(t) ? bankState.exps.delete(t) : bankState.exps.add(t);
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-group]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.group, val = b.dataset.val;
    bankState[key] = bankState[key] === val ? "" : val;
    bankState.shown = 24; renderBank();
  }));
  const lm = document.getElementById("load-more");
  if (lm) lm.addEventListener("click", () => { bankState.shown += 24; renderBank(); });

  // 题卡交互（事件委托）
  document.getElementById("qlist").addEventListener("click", e => {
    const card = e.target.closest(".qcard");
    if (!card) return;
    const qid = card.dataset.qid;
    const q = QMAP[qid];
    if (e.target.closest("[data-fav]")){
      const on = toggleFav(qid);
      e.target.closest("[data-fav]").classList.toggle("on", on);
      e.target.closest("[data-fav]").textContent = on ? "★" : "☆";
      toast(on ? "已收藏" : "已取消收藏");
      return;
    }
    if (e.target.closest("[data-rate]")){
      const s = e.target.closest("[data-rate]").dataset.rate;
      setStatus(qid, s);
      markSeen(qid);
      card.querySelector(".qmeta").innerHTML =
        srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
        (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
        statusBadge(q) + tagBadges(q) + progBadge(getProg(qid));
      card.querySelectorAll("[data-rate]").forEach(b => {
        b.classList.remove("on-k","on-v","on-u");
        const m = {known:"on-k", vague:"on-v", unknown:"on-u"};
        if (b.dataset.rate === s) b.classList.add(m[s]);
      });
      toast(s === "known" ? "标记为已掌握" : s === "vague" ? "标记为模糊，需巩固" : "标记为待重学");
      return;
    }
    if (e.target.closest(".qcard-head")){
      const body = card.querySelector(".qcard-body");
      const open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      card.classList.toggle("open", open);
      if (open) markSeen(qid);
    }
  });
}

/* ==================== 视图：练习 ==================== */
const practice = { pool: [], idx: 0, revealed: false, started: false, onlyWeak: false, log: [] };
function buildPool(opts){
  let list = QS.slice();
  if (opts.src && opts.src !== "all") list = list.filter(q => q.src === opts.src);
  if (opts.onlyWeak) list = list.filter(q => { const s = getProg(q.id).s; return s === "vague" || s === "unknown" || !s; });
  if (opts.favOnly) list = list.filter(q => getProg(q.id).fav);
  if (opts.exp) list = list.filter(q => q.expNo === opts.exp);
  if (opts.chapter) list = list.filter(q => q.chapter === opts.chapter);
  if (opts.round) list = list.filter(q => q.round === opts.round);
  if (opts.part) list = list.filter(q => q.part === opts.part);
  if (opts.topic) list = list.filter(q => q.topic === opts.topic);
  if (opts.shuffle) list.sort(() => Math.random() - 0.5); else list.sort((a,b) => a.no - b.no);
  if (opts.limit && opts.limit > 0) list = list.slice(0, opts.limit);
  return list;
}
function renderPractice(){

  if (params.get("mode") === "weak" && !practice.started){
    practice.pool = buildPool({onlyWeak:true, shuffle:false});
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    if (practice.pool.length === 0){ practice.started = false; }
    history.replaceState(null, "", location.pathname + location.search + "#/practice");
  }
  if (params.get("resume") === "1" && !practice.started && store.settings.lastPool){
    const lp = store.settings.lastPool;
    practice.pool = buildPool(lp);
    practice.idx = Math.min(lp.idx || 0, practice.pool.length - 1);
    practice.revealed = false; practice.started = true; practice.log = [];
    history.replaceState(null, "", location.pathname + location.search + "#/practice");
  }

    practice.pool = buildPool({exp: params.get("exp")});

    history.replaceState(null, "", location.pathname + location.search + "#/practice");

  if (!practice.started || practice.pool.length === 0){

        "</div></div>" +
        '<div class="fld"><div class="fld-label">练习设置</div><div class="opt-row">' +
          '<button class="opt on" data-mode="all">全部题目</button>' +

        "</div></div>" +

function bindPracticeSetup(){
  const sel = {src:"all", mode:"all", order:"seq", limit:20};
  $app.querySelectorAll("#p-src .opt").forEach(b => b.addEventListener("click", () => {
    $app.querySelectorAll("#p-src .opt").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.src = b.dataset.v;
  }));
  $app.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    $app.querySelectorAll("[data-mode]").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.mode = b.dataset.mode;
  }));
  $app.querySelectorAll("[data-order]").forEach(b => b.addEventListener("click", () => {
    $app.querySelectorAll("[data-order]").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.order = b.dataset.order;
  }));
  $app.querySelectorAll("#p-limit .opt").forEach(b => b.addEventListener("click", () => {
    $app.querySelectorAll("#p-limit .opt").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.limit = parseInt(b.dataset.v, 10);
  }));
  document.getElementById("p-start").addEventListener("click", () => {
    const opts = {
      src: sel.src,
      shuffle: sel.order === "rand",
      limit: sel.limit,
      onlyWeak: sel.mode === "weak",
      favOnly: sel.mode === "fav"
    };
    practice.pool = buildPool(opts);
    if (practice.pool.length === 0){
      toast("该范围内没有题目，请调整设置");
      return;
    }
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    store.settings.lastPool = Object.assign({idx:0}, opts);
    saveStore();
    renderPractice();
  });
}
function revealPractice(){
  practice.revealed = true;
  markSeen(practice.pool[practice.idx].id);
  store.settings.lastPool = store.settings.lastPool || {};
  store.settings.lastPool.idx = practice.idx;
  saveStore();
  renderPractice();
}
function practiceNext(rating){
  const q = practice.pool[practice.idx];
  markSeen(q.id);
  if (rating) setStatus(q.id, rating);
  practice.log.push({qid: q.id, rating: rating || "skip"});
  if (practice.idx + 1 >= practice.pool.length){ endPractice(); return; }
  practice.idx++;
  practice.revealed = false;
  renderPractice();
}
function endPractice(){
  const done = practice.log.filter(l => l.rating && l.rating !== "skip");
  const known = done.filter(l => l.rating === "known").length;
  const vague = done.filter(l => l.rating === "vague").length;
  const unknown = done.filter(l => l.rating === "unknown").length;
  const total = practice.log.length;
  practice.started = false;

  $app.innerHTML =
    '<div class="practice-wrap"><div class="card p-done">' +
      '<div class="big">' + total + "</div>" +
      "<h3>本轮练习完成</h3>" +

      '<div class="mini-stats">' +
        '<div class="ms" style="color:var(--green)"><b>' + known + "</b><span>掌握</span></div>" +
        '<div class="ms" style="color:#d97706"><b>' + vague + "</b><span>模糊</span></div>" +
        '<div class="ms" style="color:var(--red)"><b>' + unknown + "</b><span>重学</span></div>" +
      "</div>" +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="p-again">再来一轮</button>' +
        '<a class="btn btn-ghost" href="#/mock">去模拟面试</a>' +
        '<a class="btn btn-ghost" href="#/home">回首页</a>' +
      "</div>" +
    "</div></div>";
  document.getElementById("p-again").addEventListener("click", () => {
    practice.pool = buildPool(store.settings.lastPool || {shuffle:true});
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    renderPractice();
  });
}

const mock = {

function mockPoolFrom(opts){
  let list = QS.slice();
  if (opts.scope === "level") list = list.filter(q => q.level === opts.level);
  else if (opts.scope === "type") list = list.filter(q => q.type === opts.type);
  else if (opts.scope === "expNo") list = list.filter(q => q.expNo === opts.expNo);
  else if (opts.scope && opts.scope !== "all") list = list.filter(q => q.src === opts.scope);
  list.sort(() => Math.random() - 0.5);
  return list.slice(0, opts.count);
}
function renderMock(){

  // 模考进行中离开又返回：恢复计时（不重置剩余时间）

function bindMockSetup(expNos){

function startMockTimer(reset){
  stopMockTimer();
  if (reset !== false) mock.remain = mock.per;
  mock.timer = setInterval(() => {
    mock.remain--;
    const el = document.getElementById("m-remain");
    const bar = document.getElementById("m-tbar");
    if (!el){ stopMockTimer(); return; }
    el.textContent = fmtTime(Math.max(0, mock.remain));
    if (mock.remain <= 15){ el.classList.add("warn"); bar && bar.classList.add("warn"); }
    if (bar) bar.firstElementChild.style.width = Math.max(0, mock.remain / mock.per * 100) + "%";
    if (mock.remain <= 0){
      stopMockTimer();
      if (!mock.revealed){
        mock.revealed = true; mock.timedOut = true;
        markSeen(mock.pool[mock.idx].id);
        renderMockQuestion();
        toast("时间到，已展开参考详解");
      }
    }
  }, 1000);
}
function stopMockTimer(){ if (mock.timer){ clearInterval(mock.timer); mock.timer = null; } }
function renderMockQuestion(){

function renderMockReport(){
  const log = mock.log;
  const n = log.length;
  const totalSpent = log.reduce((s,l) => s + l.spent, 0);
  const avg = n ? Math.round(totalSpent / n) : 0;

  const ok = log.filter(l => l.rating === "ok").length;

  // 薄弱点：没思路 + 超时 的题，按题型 / 标签聚合
  const weakQs = log.filter(l => l.rating === "lost" || l.timedOut).map(l => QMAP[l.qid]);
  const byType = {}, byTag = {};
  weakQs.forEach(q => {
    if (q.type) byType[q.type] = (byType[q.type]||0) + 1;
    q.tags.forEach(t => byTag[t] = (byTag[t]||0) + 1);
  });
  const topType = Object.entries(byType).sort((a,b) => b[1]-a[1]).slice(0,5);
  const topTag = Object.entries(byTag).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxBar = Math.max(1, ...topType.map(x => x[1]), ...topTag.map(x => x[1]));

  function bars(entries, color){

      '<div class="r-grid">' +

        '<div class="rg a"><b>' + ok + "</b><span>基本答出</span></div>" +
        '<div class="rg r"><b>' + lost + "</b><span>没思路</span></div>" +

      "</div>" +
      '<div class="r-sec"><h4>薄弱题型</h4>' + bars(topType, "linear-gradient(90deg,#f59e0b,#ef4444)") + "</div>" +
      '<div class="r-sec"><h4>薄弱知识点</h4>' + bars(topTag, "linear-gradient(90deg,#8b5cf6,#ec4899)") + "</div>" +
      (weakQs.length ?
        '<div class="r-sec"><h4>待强化题目（' + weakQs.length + "）</h4>" +
          '<div class="weak-list">' + weakQs.map(q =>
            '<div class="weak-item"><div class="wq">#' + q.no + " " + esc(q.q) + "</div>" +
            '<div class="wm">' + esc(q.srcName) + " · " + esc(q.level) + " · " + esc(q.type) +
            (q.expNo ? " · " + esc(q.expNo) : "") + " · " + esc(q.tags.join(" / ")) + "</div></div>").join("") +
        "</div>" : "") +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">' +
        '<button class="btn btn-primary" id="r-again">再模拟一场</button>' +

        '<a class="btn btn-ghost" href="#/bank">回题库</a>' +
      "</div>" +

        F.rounds.filter(r => (F.counts.rounds[r] || 0) > 0).map((r, i) => {
          const qs = QS.filter(q => q.round === r);
          const types = {};
          qs.forEach(q => { if (q.type) types[q.type] = (types[q.type]||0)+1; });
          const topTypes = Object.entries(types).sort((a,b) => b[1]-a[1]).slice(0,3);
          return '<div class="card exp-card" data-round-card="' + esc(r) + '">' +
            '<div class="eh"><span class="exp-no">' + (i + 1) + "</span>" +
              "<div><h3>第 " + esc(r) + "</h3>" +
              '<div class="ep">腾讯 AI 产品经理 · ' + qs.length + " 题</div></div></div>" +
            '<div class="ec">' + (i === 0 ? "基础筛选：背景、动机、产品基本功" : i === 1 ? "专业深挖：项目细节与方案设计" : "终面把关：业务判断与岗位匹配") + "</div>" +
            '<div class="emini">' + topTypes.map(([t,c]) => '<span class="badge b-type">' + esc(t) + " " + c + "</span>").join("") + "</div>" +
            '<div class="exp-acts">' +
              '<a class="mini-btn" href="#/bank?src=tx&round=' + encodeURIComponent(r) + '">浏览题目</a>' +
              '<a class="mini-btn pri" href="#/practice?src=tx&round=' + encodeURIComponent(r) + '">▶ 练这一轮</a>' +
            "</div>" +
          "</div>";
        }).join("") +
      "</div>" +
      '<div class="card note-card" style="margin-top:14px">' +
        "<b>使用方法：</b>先找到与自己背景最接近的一套面经通读全文，理解面试官的提问逻辑与高分答法；再用「练习这套」做输出训练；最后用「模考这套」做限时自测。各套面经的提问点重合度很高，吃透 2–3 套即可覆盖绝大多数真实面试场景。鹅厂三轮建议按一面 → 二面 → 三面顺序连刷，体会同一份简历被逐轮撬深的节奏。" +
      "</div>";
    $app.querySelectorAll("[data-exp-card]").forEach(el =>
      el.addEventListener("click", () => { location.hash = "#/exp/" + encodeURIComponent(el.dataset.expCard); }));
    $app.querySelectorAll("[data-round-card]").forEach(el =>
      el.addEventListener("click", e => {
        if (e.target.closest("a")) return;   // 让「浏览 / 练习」按钮走自己的链接
        location.hash = "#/bank?src=tx&round=" + encodeURIComponent(el.dataset.roundCard);
      }));
    return;
  }

  const no = param;
  const g = F.expMeta[no];
  const qs = QS.filter(q => q.expNo === no).sort((a,b) => a.no - b.no);

  $app.innerHTML =
    '<div class="card exp-detail-head">' +
      '<a class="back" href="#/exp">← 返回全部面经</a>' +
      "<h2>" + esc(no) + "：" + esc(g.title) + "</h2>" +
      '<div class="ep2">候选人画像：' + esc(g.persona) + " · 共 " + qs.length + " 题</div>" +
      '<div class="exp-advice">💡 讲师提示：' + esc(g.advice) + "</div>" +
      '<div class="exp-detail-actions">' +
        '<a class="btn btn-primary" href="#/practice?exp=' + encodeURIComponent(no) + '">▶ 练习这套（' + qs.length + " 题）</a>" +
        '<button class="btn btn-ghost" id="exp-mock">⏱ 用这套题模考</button>' +
      "</div>" +
    "</div>" +
    '<div class="qlist">' + qs.map(q => qCard(q)).join("") + "</div>";

  document.getElementById("exp-mock").addEventListener("click", () => {
    mock.pool = QS.filter(q => q.expNo === no).sort(() => Math.random() - 0.5).slice(0, 10);
    if (mock.pool.length === 0){ toast("该套题为空"); return; }
    mock.per = 90; mock.idx = 0; mock.revealed = false; mock.rated = null; mock.timedOut = false;
    mock.log = []; mock.finished = false; mock.t0 = Date.now(); mock.tq = Date.now();
    startMockTimer();
    location.hash = "#/mock";
  });

  // 题卡交互
  document.querySelector(".qlist").addEventListener("click", e => {
    const card = e.target.closest(".qcard");
    if (!card) return;
    const qid = card.dataset.qid;
    const q = QMAP[qid];
    if (e.target.closest("[data-fav]")){
      const on = toggleFav(qid);
      e.target.closest("[data-fav]").classList.toggle("on", on);
      e.target.closest("[data-fav]").textContent = on ? "★" : "☆";
      return;
    }
    if (e.target.closest("[data-rate]")){
      const s = e.target.closest("[data-rate]").dataset.rate;
      setStatus(qid, s); markSeen(qid);
      card.querySelector(".qmeta").innerHTML =
        srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
        (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
        statusBadge(q) + tagBadges(q) + progBadge(getProg(qid));
      card.querySelectorAll("[data-rate]").forEach(b => {
        b.classList.remove("on-k","on-v","on-u");
        const m = {known:"on-k", vague:"on-v", unknown:"on-u"};
        if (b.dataset.rate === s) b.classList.add(m[s]);
      });
      return;
    }
    if (e.target.closest(".qcard-head")){
      const body = card.querySelector(".qcard-body");
      const open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      card.classList.toggle("open", open);
      if (open) markSeen(qid);
    }
  });
}

/* ==================== 键盘快捷键（练习视图） ==================== */
document.addEventListener("keydown", e => {
  const view = (location.hash || "#/home").replace("#/","").split("/")[0];
  if (view !== "practice" || !practice.started) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    if (!practice.revealed) revealPractice();
    else practiceNext(null);
  } else if (e.key === "1" && practice.revealed) practiceNext("known");
  else if (e.key === "2" && practice.revealed) practiceNext("vague");
  else if (e.key === "3" && practice.revealed) practiceNext("unknown");
});

/* ==================== 启动 ==================== */
switchAccount(AUTH ? AUTH.account : null);
document.getElementById("ft-date").textContent = DB.generatedAt;
if (!AUTH){
  document.body.classList.add("auth-mode");
  renderLogin();
} else {
  renderUserbox();
  if (syncState === "pending" || syncState === "error") scheduleSync();
  if (!location.hash) location.hash = "#/home";
  route();
}
window.addEventListener("pagehide", flushSync);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSync();
});
