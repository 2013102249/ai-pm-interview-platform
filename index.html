做某款C端社区产品的“用户增长”功能时，我推动的一次首页改版，上线后核心活跃指标反而下降了12%。应对过程：\n\n• 我没有立刻回滚，而是先拉数据看是哪个用户群在跌，发现新用户跌了20%，老用户变化不大。于是立刻做了用户访谈和热力图，发现新用户根本找不到发帖入口—改版时我以为“简介清晰”，实际是用老用户的路径去套新用户，犯了自我视角错误。\n\n• 当天我就紧急上线了一个临时浮层引导，同时启动灰度测试方案，把新旧版本各放10%流量对比。一周内活跃恢复到原水平，并且两周后比之前还涨了5%，因为我保留了改版中好的部分（信息密度提升），同时修正了入口问题。复盘沉淀：\n\n1. 任何改版前必须有“新手任务完成率”作为核心观测指标，不能只看整体DAU。\n\n2. 对于不确定的改动，采用“反向指标监控”——比如改版同时监控新用户次日留存，一旦跌破阈值自动告警。\n\n3. 应用到AI产品：后来我做AI功能上线，都会先切5%流量，并额外监控“平均交互轮数”和“转人工率”两个冷启动指标，防止模型效果波动造成大面积伤害。这次挫折让我深刻理解：好的产品经理不是不犯错，而是犯小错、快发现、能回滚、会沉淀。\n\n为什么能加分：有具体数字、有行动步骤、有总结到可复用的方法论，并且主动关联到AI产品的灰度与监控意识。","level":"中级","type":"经历描述","tags":["团队协作与沟通","产品规划与需求"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q325","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":325,"q":"做过最枯燥的一项工作是什么？你是如何保持执行力的？","a":"回答示例（选一个看起来“枯燥但重要”的工作，体现思考+目标感）\n\n最枯燥的是刚入行时负责整理用户反馈标签。当时系统还不完善，每周要从5000多条反馈里手动归类、打标签，连续做了两个月。这真的非常单调重复。我是这样保持执行力的：\n\n1. 赋予枯燥工作意义感：我告诉自己，这些标签就是产品的“病理报告”，如果能提炼出高频痛点，就能指导产品改进。于是我每周输出一份“用户痛点排行榜”，后来开发同学会根据我的排行榜来排需求优先级 ——这让我的工作被看见了价值。\n\n2. 用工具思维优化过程：干了两周后，我发现很多反馈可以用关键词匹配预分类，于是自学了一点简单的正则表达式，搭了个半自动脚本，将人工时间从每周8小时压缩到2小时，剩下的时间我就用来深度分析那些无法归类的边缘案例。\n\n3. 采用番茄钟加自我奖励：每完成50条标注就站起来活动一下，喝口水，或者听一首喜欢的歌，保持大脑不进入“麻木状态”。后来这段经历对我做AI产品帮助巨大—因为我现在特别清楚，高质量的标注数据有多珍贵，也更能体谅算法同学清洗数据的辛苦。和算法沟通时，我能主动提出“我们能不能先圈定一个置信度高的子集做标注，降低你们的工作量”，合作非常顺畅。\n\n为什么能加分：没有抱怨枯燥，而是展示了自驱力、优化思维、以及对AI产品核心环节（数据标注）为什么能那刀。没得把怨忙煤，而走度示了目驱力、优化忠维、以及对A广品核心坏（数据你注）的深刻理解，体现“产品经理也能动手提效”。","level":"初级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q326","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":326,"q":"详细介绍一段你最核心的项目经历，说明你的角色、核心产出和关键决策。","a":"回答示例（选择一段能体现A|能力或强烈产品决策的经历，按照“背景-角色-行动-决策-产出”结构）\n\n我分享一个从0到1做的AI智能评论辅助工具项目，背景是社区用户发帖后，很多人不知道该怎么写评论来活跃氛围，导致互动率低。我的角色：产品负责人，统筹需求、设计、算法对接、上线策略。核心产出：上线后，帖子平均评论数从2.1条提升到4.7条，用户发帖后7日留存提升18%。后面这个能力被复制到其他3个社区场景。关键决策有三条：\n\n1. 第一个关键决策：不自己训练模型，而是基于大模型API+少量业务prompt快速验证。当时团队有人建议自研小模型，我坚持先用大模型API跑通MVP，两周就上线了demo。因为AI产品试错成本高，先验证“用户是否真的需要”比模型效果极致优化更重要。\n\n2. 第二个关键决策：不做全自动评论，而是“AI生成草稿＋用户一键修改/发布”。算法同事想做直接发评论，但我坚持加人工确认步骤。理由：①避免AI生成不当内容风险；②让用户感觉是“辅助”而非“替代”，更容易接受。后来验证，85%的用户会微调AI生成的内容再发布，既保留了创作者掌控感，又大幅降低了内容安全审核压力。\n\n3. 第三个关键决策：冷启动时先用种子用户分批开放，且每个用户每天限用5次。因为推理成本是一笔账，更重要的是防止低质量内容泛滥。我们同时上线了“有用/无用”按钮，用于收集偏好数据，两周后就针对高频负反馈场景优化了prompt。\n\n这个项目让我最深的一点：做AI产品，产品经理的核心价值在于“为用户找到合适的AI介入边界”，不是技术越强越好，而是体验与可控的平衡。\n\n为什么能加分：有数字产出、有取舍逻辑（API vS自研、自动vS确认步骤）、有成本与风险意识，直接对应当下大厂AI产品经理最看重的素质。","level":"中级","type":"经历描述","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q327","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":327,"q":"你的经历偏C端，对B端产品（如后台系统、商家AI工具）有什么看法？","a":"回答示例（承认差距+展示理解+提出可迁移能力）\n\n您说得对，我过去确实主要以C端产品为主，但正因为如此，我对B端AI产品反而有一个很强烈的兴趣和观察。我的第一个看法：B端AI产品和C端最大的区别在于 价值度量衡不同。C端要的是易用、留存、情感满足；B端要的是确定性、ROI、可审计。比如给客服坐席用的AI辅助工具，它不需要多“有趣”，但必须保证查得准、可回溯、降低平均处理时长。这决定了B端AI产品经理必须更关注：准确率、召回率、置信度阈值设计、以及“人机责任边界”。第二个看法：B端AI其实更容易构建壁垒。C端AI大家都能调用同一个大模型，体验差异不大；而B端往往需要深入企业私有数据和工作流，一旦模型加上企业知识库、业务规则，替换成本极高。所以我非常看好将“通用大模型＋企业知识库RAG+工作流编排”作为B端AI产品的标准范式。我的可迁移能力：我虽然在C端，但我做过的【前面提到的Al评论工具】本质上也是一个面向内容创作者的“生产力工具”—帮他们节省时间、提高质量。我积累的“模型效果评测体系”“badcase闭环流程”“用户接受度测试方法”完全可以用到B端。而且我擅长用户访谈和场景挖掘，这对于理解商家复杂的业务流程非常有帮助。如果给我一个B端AI产品项目，我会在前两周先做关键人物地图和工作流分析，找到AI最高ROI的介入节点（例如自动填表单、智能分单、客服话术生成），而不是一上来就做大而全的智能助手。\n\n为什么能加分：不回避经验偏差，反而清晰说出B端与C端的本质差异（确定性 vS 体验），并提出可迁移能力，表明学习意愿和方法。","level":"中级","type":"观点判断","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q328","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":328,"q":"对接研发团队时，是否遇到过直接的质疑或阻力？具体是什么情况，你如何解决的？","a":"回答示例（选真实场景，体现沟通能力、技术理解、共赢思维）\n\n遇到过。在做AI评论工具时，算法工程师质疑我说：“你这个需求需要模型生成有‘情绪共鸣’的评论，但现在的基座模型很难稳定做到，用户预期会崩。你这是在提不可实现的需求。”我的解决过程：\n\n1. 先认同，不防御：我说“你说得对，让模型稳定产生‘共鸣感’确实很难，我们能不能换个角度—不追求“共鸣’，而是追求‘相关性+可修改’？”我先接住对方的专业判断，让对话进入解决问题模式。\n\n2. 把模糊需求拆解成可验证指标：我把“情绪共鸣”拆成三个可量化的点：①评论与帖子主题的相关性得分（>0.7）；②包含至少一个正向情感词；③不以反问或说教结尾。算法同学一看这是一个“可优化、可评测”的目标，态度马上就积极了。\n\n3. 提供数据支持：我从历史高互动评论里标注了200条正样本，和算法一起看了20条badcase，我们共同发现：模型的“说教语气”问题最严重，于是约定优先优化“去除说教”的prompt和规则过滤层。\n\n4. 建立共创机制：我提议每周开一次30分钟的“badcase评审会”，产品带用户反馈，算法带模型输出分析，一起定下周的优化优先级。这个机制一直保留到项目上线后，大大减少了后续的需求摩擦。最终这个功能上线后，算法同学主动和我说：“你是我合作过的产品里，少数能听懂“模型不确定性’并且愿意一起打磨边界的人。”我觉得产品经理和研发之间的信任，不是靠哄，而是靠共同面对不确定性并一步步锁定确定性。\n\n为什么能加分：展现了情绪管理、拆解模糊需求的能力、数据驱动沟通、以及建立长期协作机制的意识。这点在大厂面试中非常加分。","level":"中级","type":"经历描述","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q329","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":329,"q":"正在推进的项目因更高优需求插入被暂停，你内心的真实想法是什么？会如何调整工作","a":"节奏和心态？\n\n回答示例（展现成熟度、目标感、优先级管理能力）\n\n先说真实想法：坦白说，第一反应肯定会有失落，特别是自己已经投入了很多精力、甚至看到了初步成果的项目。但我不会陷入情绪，而是会立刻问自己两个问题：① 新插入的需求是否真的对公司/用户价值更大？② 我的项目是永久停还是可延期？我会主动找上级确认：新需求的紧急性和预期收益，以及我的项目后续是否有重新启动的时间窗口。如果确认确实是更优先的事，我会把失落转化为一种“资产化暂停”的心态—不是放弃，而是给项目做一次高质量归档，方便未来随时重启。调整节奏和心态的具体做法：\n\n1. 心态上：告诉自己“产品经理的工作本质是资源分配，优先级变化是常态，适应变化比抱怨变化更重要”。我会把这次暂停看作一次练习“快速切换能力”的机会。\n\n2. 节奏上：。第一步，做好暂停交接文档：把项目的当前进展、未解决的问题、关键决策、待办事项、依赖方全部整理清楚，标注“下一步如果重启，前3天应该做什么”。这样未来接手（无论是自己还是别人）都能无缝衔接。。第二步，主动拥抱新需求：不带着“被抢资源”的情绪进入新项目，而是用最快速度搞清楚新需求的目标和核心指标，主动请缨承担其中一个模块，用积极的姿态重新建立节奏。。第三步，设立一个“复盘日历”：每周花15分钟看一眼旧项目的环境是否发生变化（比如数据是否还在积累、依赖方是否释放），如果有好的重启契机，及时向 leader 提出一个轻量化的“验证性重启” 方案。\n\n我曾经就遇到过类似情况，后来那个暂停的项目在两个月后因为业务方向调整又重新上线了，而且因为我当时做了详细归档，仅用了三天就接回了进度，反而比之前更稳。这件事让我深刻理解：产品经理不只管推进，也管优雅地暂停和准确地恢复。\n\n为什么能加分：坦诚承认失落但不过度负面，把重点落在“资产化暂停”和“主动规划恢复路径”上，体现极强的自驱力和组织性。","level":"中级","type":"观点判断","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q330","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":330,"q":"为什么选择AI产品经理方向，而不是继续做本专业相关工作？","a":"（注：如果你的本专业是计算机/设计/运营等，可以替换对应内容。这里以常见情况 “非AI背景（如传统互联网产品/运营/设计）”为例）\n\n回答示例（核心逻辑：不是逃离原专业，而是被AI的“杠杆效应”吸引）\n\n我本科/之前的专业是［XX，比如市场营销/工业设计/计算机］，并且我也很喜欢本专业带给我的能力积累。但我之所以坚定地走向AI产品经理，并不是觉得本专业没有前景，而是因为Al正在成为所有专业能力的“杠杆放大器”。具体来说：\n\n1. 从解决“已知问题”到解决“以前无法解决的问题”。以前做传统产品，很多体验优化受限于技术和人力，比如用户在海量笔记里找信息、商家手动回复海量评论—这些问题只能绕过去或用笨办法。但AI（尤其是大模型）让这些瓶颈变得可解。我希望自己从一个“适应限制的产品经理”变成“重新定义边界的产品经理”。\n\n2. 本专业的视角反而是我的独特优势。比如我学市场营销出身，在做AI客服或AI内容生成工具时，我比纯技术背景的产品经理更懂用户心理、文案调性、转化漏斗；我学设计出身，就更清楚AI生成图像如何嵌入创作流程。我并不是抛弃本专业，而是带着本专业的洞察，去找到AI最高ROI的应用场景。\n\n3. 长期来看，AI会嵌入所有产品形态。未来可能没有“AI产品经理”这个独立职位，而是所有产品经理都必须懂Al。我现在主动切换赛道，是为了提前储备这个核心能力，而不是等到落后了再追赶。所以说，我选择AI产品经理方向，更像是“升级操作系统，而不是卸载应用”—我还是在用原有的产品sense和业务理解，只是现在多了一个超级工具。\n\n为什么能加分：表达了清晰的职业逻辑，强调“叠加优势”而非“从头再来”，并且有远见地预判了Al产品经理的演进趋势。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q331","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":331,"q":"你认为AI产品经理和传统产品经理的核心区别是什么？","a":"回答示例（强调思维方式的不同，而不是技术能力的堆砌）\n\n我认为核心区别不在于“会不会调用AP户”或“懂不懂模型参数”，而在于 产品经理与不确定性的关系，以及价值创造的方式。\n\n我总结了三个最本质的区别：举一个具体例子：传统产品经理做一个搜索框，核心是索引准、速度快。AI产品经理做一个AI搜索，要考虑：大模型是否有时效性（RAG）、是否胡乱生成（幻觉）、用户能不能区分“模型答案”和“官方答案”、每次搜索成本是否可控。所以更深层的区别是：传统产品经理更多在设计和编排确定性的“流程”；AI产品经理在设计和约来概率性的“智能体”。后者需要更强的实验思维、风险意识、以及对“模糊的用户预期”的管理能力。但两者也有共同点：都必须深刻理解用户场景和商业价值。AI产品经理只是多了一套新的“解题工具和约束条件”。\n\n为什么能加分：用对比表格条理清晰，避免了“AI产品经理更高级”的傲慢，展现了平等的专业认知，同时提到了具体例子（AI搜索）。","level":"中级","type":"对比分析","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q332","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":332,"q":"最近在使用的AI产品有哪些？选一款分析其核心优势和不足。","a":"回答示例（选择一款你真正深度使用过的，最好能与目标公司/岗位相关。这里以 “Notion AI” 为例，你也可以换成ChatGPT、Perplexity、Midjourney、小红书自带的AI功能等）\n\n我最近高频使用三款AI产品：Notion Al（用于写作辅助和会议记录整理）、Perplexity AI（用于搜索研究）、以及豆包（日常轻量问答）。我重点分析 Notion Al。核心优势：\n\n1. 场景嵌入极深：它不是单独一个聊天窗口，而是自然地出现在你写文档、记笔记、列表格的任何地方，选中文字就能“续写”“总结”“改语气”。这种上下文感知大大降低了使用门槛。\n\n2. 个人知识库的便捷整合：Notion AI可以基于你的所有笔记内容回答问题，相当于给自己建了一个可对话的第二大脑。这对知识工作者来说价值很高。\n\n3. 多步工作流的 demo能力：比如“从这段会议记录里提取待办事项，并按照优先级排序生成表格”—它能理解复杂指令并结构化输出，比普通聊天助手更“像生产力工具”。主要不足（比较克制地指出）：\n\n1. 准确性和幻觉问题：当让它总结一篇长文时，偶尔会遗漏关键点或编造不存在的结论。在专业场景下，我需要逐字核对，反而抵消了效率收益。\n\n2. 响应速度与成本感知：有时生成一段文本要等5-8秒，而且提示“使用了高级AI配额”。这种“等待+稀缺感”会让用户下意识减少使用，违背了“无摩擦嵌入”的设计初衷。\n\n3. 缺乏与外部实时数据的连接：比如让它“根据最新行业报告写总结”，它只能基于几月前的训练数据或我的已有文档，无法主动联网搜索。相比之下，Perplexity在这个点上做得更好。如果我是Notion AI的产品经理，我会优先优化：①为高风险场景（如总结财务数据）提供“引用溯源”交互；②引入“快慢双模型”——简单任务用快速廉价模型，复杂任务再调用大模型，平衡成本和体验；③增加与企业级知识库（如公司Google Drive）的深度RAG集成，提升B端价值。\n\n为什么能加分：展现出你不仅是“使用AI”，还会从产品视角分析优势/不足，并提出可落地的改进方向，这是AI产品经理的核心能力。选择Notion这种生产力工具也比较契合小红书的工作场景（内容创作、知识管理）。","level":"中级","type":"对比分析","tags":["市场与竞品分析"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q333","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":333,"q":"假如入职了我们公司，你希望在获得哪些能力的成长？","a":"（针对岗位，结合小红书“社区+搜索+AIGC”的独特性来回答）\n\n回答示例（具体、务实、可量化，同时表达对公司的理解）\n\n如果有机会加入小红书AI产品团队实习，我希望在以下三个能力上获得刻意成长：\n\n1. 从“AI功能设计”到“AI驱动的内容社区生态设计”的能力小红书是一个UGC社区，AI不仅要解决效率问题，还要维护社区氛围和创作者生态。我希望学习如何设计AI工具（比如智能标题生成、图片美化、评论辅助）既能提高创作者产出效率，又不破坏“真诚分享”的社区基调。我想掌握这种“在效率与真实性之间找到平衡”的设计方法。\n\n2. 在真实业务场景中的“模型效果评测与迭代”实战经验我之前更多是纸上谈兵或者做小demo。在小红书，每天有海量的真实用户反馈和badcase，我希望在 mentor 指导下，完整参与一次 从badcase归类一＞数据标注—评测集构建一提出模型优化方向-上线后A/B测试的全流程。特别想学习如何用数据驱动的方式判断“一个prompt优化或SFT是否真的改善了用户体验”。\n\n3. 跨职能协作与优先级决策能力在小红书这样体量的公司，资源竞争和需求优先级管理一定会更复杂。我希望通过参与实际项目，学会如何在“算法资源有限、运营有诉求、用户有反馈”的多方拉扯中，用逻辑和数据做出优先级判断，并有效对齐各方预期。这是我从“会做产品”到“能推动产品”的关键一步。最后，我也会给自己定一个产出目标：实习结束前，独立负责上线一个有明确业务指标的AI功能（哪怕是个很轻的小功能），并且输出一份《小红书AI产品中的“社区友好型”设计原则》文档，可以反哺团队。我希望能用结果说话，不只带走能力，也留下价值。\n\n为什么能加分：表现出对小红书业务特性的深刻理解（社区、创作者、搜索），能力要求具体且可衡量，并且有主动交付成果的意识。最后那句“不只带走能力，也留下价值”非常加分。","level":"初级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"一面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q334","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":334,"q":"请做一个自我介绍，突出你在AI产品方向的核心竞争力。","a":"回答示例（突出“C端用户洞察+AI落地执行力＋小红书场域理解”）\n\n面试官好，我叫［姓名］，目前［学校/专业］，之前有过［某公司/项目］的产品实习/项目经历。我的核心竞争力可以概括为三个词：场景嗅觉、边界感、闭环力。\n\n• 场景嗅觉：我习惯从用户真实的“麻烦”里找AI机会。比如之前在做［某C端项目］时，发现大量用户卡在“写长文”这一步，于是我设计了一个Al续写助手，参与率超过40%。\n\n• 边界感：我清楚大模型现阶段能做什么、不能做什么。我不会要求算法做“100%准确的情感分析”，而是会设计“置信度+人工确认”的交互，把不确定性变成产品特性而非缺陷。\n\n• 闭环力：从badcase归因、标注、评测到推动模型优化，我完整跑通过小闭环。同时我深度使用小红书，注意到社区里很多用户“想创作但不知如何表达”，也看到平台正在探索各种AI功能。我非常希望能在小红书，把AI真正变成创作者和普通用户的“表达加速器”，而不是一个花哨的玩具。提示：如果实际没有完整跑通过模型闭环，可以改成“我通过自学和实践，理解了RAG、SFT、评测集的基本逻辑，并尝试用过Coze/扣子搭建过小原型”。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q335","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":335,"q":"介绍一款你最喜欢的APP，从产品设计和用户价值角度分析其核心逻辑。","a":"推荐选择：小红书本身（展现对公司的热爱+深度理解），或者多邻国、得物、Notion等。以小红书为例：我最喜欢的APP是小红书。从用户价值看，它解决了两个核心需求：① 生活决策参考（“什么值得买/吃/玩”）；② 轻量化表达与归属感（普通人也能通过图文/视频记录生活并获得共鸣）。产品设计核心逻辑（双飞轮）：「明及 核心超担（XC花）•\n\n1.内容生产飞轮：极低的发布门槛（模板、滤镜、贴纸、现在还有AI辅助）＋强激励机制（点赞收藏评论、粉丝互动、甚至商业变现） 激励普通用户持续生产UGC。\n\n2. 内容消费飞轮：强大的个性化推荐（双列瀑布流，兼顾探索与沉浸）＋搜索心智（用户主动搜“XX攻略”）—让好内容能找到精准受众，从而再反哺创作者。一个很巧妙的设计是“搜推融合”：用户在搜索框的行为会实时影响推荐流，同时推荐流里的爆文又会引导更多搜索。这种设计让内容既有热度又有深度，比其他纯推荐或纯搜索平台更懂用户当下意图。如果要说一个可优化的点（展现思考深度）：目前AI在创作侧的支持还不够“原生”，比如AI写标题/写文案的功能藏得比较深，如果能更自然地出现在发布流程中，可能会进一步降低表达门槛。注意：如果你选其他APP，也可以套用“双飞轮”分析框架。但选小红书更能拉近距离。","level":"中级","type":"对比分析","tags":["用户研究与体验"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q336","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":336,"q":"深挖你在xx项目中的具体工作，如何对接算法团队落地AI功能？","a":"（请用你简历上的真实项目替换“xx项目”。以下是通用高分回答结构，你可以往里填具体内容）我负责的［项目名］中，需要落地一个［具体AI功能，如：智能标题生成、用户评论辅助等］。我的具体工作分为三个阶段：阶段一：定义问题与可行性判断我先分析了50条用户真实内容，归纳出“用户不知道怎么写开头/标题” 是第二大流失原因。然后我带着典型case与算法沟通：我们需要的是“基于图文内容生成3个风格不同的标题”，而不是“预测最高点击率标题”。算法评估后认为利用开源模型+业务prompt可以达到可用水平。\n\n阶段二：数据准备与效果对齐我负责组织标注：给算法提供了200条“内容-好标题”的正样本，并定义了“相关性、吸引力、不低俗”三个评分维度。同时我和算法一起用20条badcase确定了模型基线（准确率68%）。我们约定第一版上线允许一定比例的差评，但必须有“人工修改后发布”的兜底。阶段三：上线迭代与协作机制上线后我每周拉取模型输出与用户实际修改/采纳的数据，形成“拒绝原因分类表”（比如“不相关”“太夸张”“语气不对”），再与算法一起决定：是优化prompt、增加规则过滤，还是补充标注做SFT。整个过程中，我坚持一个原则：不给算法提“更好的模型”这种空需求，而是给“标注集-评测case-优化方向”的具体输入。最终这个功能的用户采纳率达到52%，超出预期。这次经历让我深刻理解：AI产品经理的核心对接工作，就是 把模糊的用户需求翻译成算法可优化、产品可验证的工程任务。","level":"高级","type":"经历描述","tags":["技术架构与选型","团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q337","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":337,"q":"项目中是否真实接触过用户？通过哪些渠道获取用户反馈，如何落地到产品优化？","a":"回答示例（强调多渠道+定量定性结合+落地闭环）\n\n是的，我在［某项目］中深度接触过用户。我主要通过三个渠道获取反馈：\n\n1. 用户访谈：每周约3-5名真实用户（通过问卷筛选），远程或当面聊，重点是观察他们使用产品时的困惑和“绕路”行为。\n\n2. 在线反馈系统：我们产品内嵌了“反馈”入口，用户可以直接描述问题。我会每天分类打标，生成高频问题排行榜。\n\n3. 数据行为分析：通过埋点看用户是否在某一步大量流失、是否会重复修改AI生成的内容等。落地优化的一个完整案例：早期AI标题生成功能上线后，用户访谈中很多人说“生成的标题太像营销号，不想用”。同时数据也显示“拒绝原因”里“过于夸张”占比最高。显亦 担绝原因 里 心士兮张 白比取局。我做了三步：\n\n•从拒绝case里筛选出20个典型“过于夸张”的标题（如“震惊！••”），与用户确认具体反感点。\n\n•写了一份“标题风格约束规则”（禁止感叹号堆叠、禁止“震惊体”词汇），与算法沟通在prompt中加入负向示例。\n\n• 同时增加了一个“温和/中性/活泼”的风格选择器。改版后，该功能的拒绝率从43%降到26%，而且用户访谈中“感觉AI懂我”的正面反馈明显增加。总结我的方法：反馈不是收集了就完事，而是要走完“归因一方案一验证一再迭代”的闭环。","level":"中级","type":"方法流程","tags":["用户研究与体验"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q338","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":338,"q":"小红书后台会干预用户的内容选择吗？站在AI产品角度，你如何看待这种干预？","a":"（这是一道考察社区理解+Al价值观+产品伦理的题，需要客观、专业）首先，从技术和产品事实上看，任何内容平台（包括小红书）后台都会对用户看到的内容进行干预，这不是秘密，而是行业常态。干预的形式包括：推荐算法排序、审核过滤、低质内容降权、敏感话题限流等。从AI产品角度，我认为这种干预可以分成两类，需要区别看待：\n\n1. 正向干预（必要且有益）\n\n• 推荐算法的个性化排序：本质是一种“价值匹配干预”，让用户更高效地看到可能感兴趣的内容。这是平台的核心竞争力。\n\n• 安全与合规干预：对违法违规、虚假诈骗、恶意引战等内容进行过滤或减少推荐。这是平台的底线责任，AI审核在其中发挥巨大作用。\n\n• 生态调控：比如对新创作者给予少量流量扶持，防止头部垄断。这种干预有助于社区长期健康。\n\n2. 需要谨慎设计的干预\n\n• 过度“流量指挥棒”可能导致内容同质化（比如什么火就一窝蜂模仿）。AI产品经理需要设计干预的“透明度”与“可解释性”，比如告诉创作者“你的内容因含有XX因素曝光受限”，而不是黑盒惩罚。\n\n• 干预与用户自主权的平衡：比如允许用户通过“不感兴趣”“屏蔽词”等工具主动调整自己的信息流，把部分干预权交还给用户。我的观点：干预不是问题，不透明、不可控、不尊重用户的干预才是问题。作为AI产品经理，在设计内容理解模型与推荐策略时，应该把“可解释性”和“用户可控性”作为第一级需求，而不是事后补救。小红书在这方面已经做了不少努力（比如“为什么看到这条笔记”的说明），未来AI可以帮助做得更细粒度、更个性化。","level":"高级","type":"观点判断","tags":["用户研究与体验","AI 伦理与合规"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q339","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":339,"q":"从用户视角出发，为什么愿意使用小红书的AI生成功能？核心驱动力是什么？","a":"回答示例（从“表达成本”和“社交收益”两个角度）\n\n用户愿意使用小红书的AI生成功能（比如AI写标题、AI写文案、AI修图），核心驱动力不是“因为它是A”，而是AI帮他们解决了真实痛点。我总结三个最核心的驱动力：\n\n1. 降低“空白页焦虑”：很多普通用户有分享欲，但不知道如何开头、如何把零散想法组织成一篇笔记。AI生成初稿、扩写、润色，直接降低了“从0到1”的心理门槛。这是效率驱动。\n\n2. 提升内容的“社区适配度”：小红书有自己的语言风格（真诚、干货、情绪共鸣）。AI可以根据优质笔记学习这些风格，让新手的笔记更容易被社区接受和互动。这是融入驱动（想获得点赞和归属感）。\n\n3. 获得“超常发挥”的惊喜感：有时候用户自己写不出那么好的句子，但AI能给出一个意想不到的表达，让用户觉得“哇，这个比我自己想的还好”，从而愿意使用。这是创造惊喜驱动。\n\n值得注意的是，用户不会愿意使用那些看起来“很A”的僵硬内容，因为小红书社区强调“真实分享”。所以AI生成功能必须做到：辅助而非替代，增强个体表达而非抹去个人特色。这也是小红书做Al与通用AI工具最大的不同。","level":"中级","type":"观点判断","tags":["用户研究与体验"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q340","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":340,"q":"对于小红书KOL而言，使用AI功能的收益点在哪里？","a":"回答示例（KOL与普通用户有显著差异，要突出“规模化+品牌一致性＋商业变现”）\n\n小红书KOL（关键意见领袖，也就是有一定粉丝量的博主）使用AI功能的收益点明显不同于普通用户，主要体现在三个层面：\n\n1. 内容生产规模化KOL需要高频更新（日更甚至一日多更），但灵感与精力有限。Al可以帮助他们：快速生成多个标题进行A/B测试、将一篇长干货拆成若干条短笔记、把同一内容适配到不同平台。这直接提升了单位时间的内容产量，对商业价值影响显著。\n\n2. 保持风格一致性的“AI分身”成熟KOL有自己的语气、人设和金句习惯。通过微调或prompt工程，可以训练出一个“像我一样说话”的AI助手，用来回复评论区、写种草文案初稿等。这既维持了人设，又释放了KOL的精力去做更高价值的拍摄、选品等。这是品牌一致性驱动。\n\n3. 商业化内容优化对于商单笔记，品牌方往往要求一定的数据表现。AI可以帮助KOL：分析历史爆文特征、推荐关键词、优化首图和标题以提高点击率。甚至可以预测一篇笔记的互动区间，辅助KOL与品牌议价。这是变现效率驱动。当然，KOL也有担忧：如果内容太依赖AI，会不会失去粉丝的信任？所以好的AI工具应该透明、可控，让KOL始终掌握最终编辑权。小红书如果能提供“KOL专属的AI训练空间”（用自己的历史笔记微调模型），将会是一个高价值的付费功能。","level":"中级","type":"观点判断","tags":["商业模式与定价"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q341","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":341,"q":"除了简历上的项目，是否有其他AI相关的实践或尝试？","a":"（这道题考察主动学习。如果你没有实际项目，可以说自学、竞赛、小工具、甚至是深度使用AI产品后的拆解）有的。除了简历上的项目，我还在持续做一些小型的自主实践，主要是为了保持对AI能力的“手感”：实践一：用Coze（扣子）搭建了一个“小红书爆款标题助手”Bot我爬取了500条小红书高赞笔记的标题，总结出“数字型”“痛点型”“悬念型”等6种模板，结合大模型API做了一个bot。输入笔记主题，它能生成10个不同风格的标题并给出预估互动等级。这个bot被我运营的一个小社群使用了，反馈不错。这让我实际体会了提示词工程、知识库挂载、工作流编排的全过程。实践二：参与了一次Kaggle上的LLM安全性挑战赛\n\n虽然不是排名很高，但在这个过程中我学习了如何构建对抗性prompt、如何评估模型对有害输入的鲁棒性。这对我后来设计AI内容安全策略有很大帮助。实践三：每周花2小时“AI产品体验日志”字践二•每周花入小时“AI立品休验口去”我会选择一款新的AI应用（比如最近试了LensAI、Pika、海螺AI），从产品定位、交互设计、模型能力、商业闭环四个角度写一份简短评测。目前已经积累了15篇，这不仅锻炼了我的产品分析能力，也让我对AI赛道保持敏感。我认为AI产品经理不能只等工作中去学，平时保持动手和思考的习惯很重要。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q342","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":342,"q":"你主导的项目是否做过完整复盘？核心优化点是什么，是否有落地验证？","a":"（选一个你真实做过的项目，如果没有“主导”，可以说“深度参与”。以下是结构模板）是的，在［项目名］中，我主导了上线后的一次完整复盘。当时我们上线了一个［某功能］，初期数据不达预期（目标采纳率40%，实际上线第一周只有22%）。复盘过程：我召集了产品、算法、设计、运营（如果有）一起，花了两小时走了一遍“数据-行为-访谈”三维复盘：\n\n• 数据：看漏斗，发现在“AI生成结果页”流失率高达60%。\n\n• 行为：看用户停留时长和修改次数，发现大多数用户点开生成结果后直接关掉，没有修改或发布。\n\n•访谈：找了8个流失用户，多数反馈“生成的内容和我想说的不太像，又不能调”。核心优化点（三个）：\n\n1. 缺少用户引导：用户不知道可以“输入更多关键词”来定制结果。—增加一个“补充要求”输入框。\n\n2. 生成结果单一：只给一个结果，没有选择空间。—改为一次生成3个不同版本。\n\n3. 缺少快速反馈机制：用户不喜欢某个结果但没法告诉AI。一加入“换一个”“不太像”“再口语一点”等快捷按钮。落地验证：优化后上线A/B测试（实验组 vs对照组），实验组的采纳率从22%提升到了37%，用户平均修改次数从0.3次上升到1.2次，而且“换一个”按钮使用率达到41%，说明用户确实需要多轮调整。后续我们把这个交互模式复制到了其他AI功能中。这次复盘给我最大的收获是：不要假设用户知道怎么跟AI对话，要设计清晰的交互信号和渐进式控制。","level":"中级","type":"方法流程","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q343","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":343,"q":"你所学的专业是什么？专业知识如何赋能AI产品经理的工作？","a":"（请你根据实际专业填。这里以常见专业举例：心理学/市场营销/计算机/工业设计。如果专业不相关，可以说“虽非直接相关，但培养了XX能力”。我以“信息管理与信息系统”为例）我就读的专业是信息管理与信息系统，这个专业核心是学怎么用信息技术解决商业问题，课程涵盖数据库、数据分析、用户行为、产品设计等—可以说和AI产品经理天然对口。具体的赋能体现在三点：\n\n1. 数据思维：我熟悉SQL、基础统计、A/B测试原理。在做AI产品时，能自己拉数据验证假设，比如分析badcase的分布是否与内容长度/类目相关，而不是依赖分析师排期。\n\n2. 系统视角：AI产品不是一个孤立的模型，而是整个业务流程中的一环。我习惯用流程图和数据流图来梳理“用户一产品一模型一数据一模型优化”的闭环，这有助于发现系统瓶颈。\n\n3. 用户行为模型：学过技术接受模型（TAM）、理性行为理论等。在做AI功能时，我会思考用户是否感知到“有用”和“易用”，从而设计新手引导与信任建立机制。如果您的专业是心理学：可以强调对用户动机、认知负荷、信任建立的理解；设计专业：强调交互细节、Al输出在UI上的呈现方式、情感化设计；计算机专业：强调能看懂技术方案文档、与算法高效沟通、评估模型可行性；文科经管类：强调场景洞察、商业分析、内容生态理解。请按实际情况替换。","level":"初级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q344","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":344,"q":"针对小红书的AI搜索功能，你认为目前存在哪些问题？","a":"（这是考察你产品洞察+深度使用小红书的关键题。你可以提前打开小红书搜索体验一下。以下为经过观察的常见问题，请结合你实际体验微调）我深度使用小红书的Al搜索功能（例如搜完后的“智能摘要”或“大家还搜”）。目前我认为存在三个主要问题：\n\n1. 摘要的“覆盖率和时效性”不足有些长尾或较新的查询，AI无法生成摘要，直接兜底到正常搜索结果。用户会疑惑“为什么有时有摘要有时没有”，体验不一致。而且摘要有时用的是几个月前的笔记，对于“xx地最近天气/活动”这类时效性问题不够准。\n\n2. 摘要与原生内容的割裂感目前的AI摘要通常是置顶的一块灰色区域，用户容易跳过（或误以为是广告）。而且点击摘要里的推荐词后，会重新搜索，而不是在原结果基础上细化。理想的设计应该是：摘要可交互、可追问，并平滑衔接下面的笔记列表。\n\n3. 缺乏“多模态搜索”的深度整合小红书有很多图片和视频内容，但目前AI搜索主要还是基于文本。比如用户拍一张衣服的照片想找同款，目前的“以图搜图”还比较初级，没有结合大模型对款式、场景的理解。如果能把视觉理解和文本检索结合，体验会飞跃。我的改进建议：\n\n• 对高频时效性查询，接入实时信号（如最近24小时的热门笔记）；\n\n• 将AI搜索升级为“对话式探索”：允许用户在搜索后继续问“这个景点适合亲子吗？”“预算500以内推荐哪家？”，把搜索变成轻量Agent；\n\n• 开放搜索摘要的反馈按钮（“有用/没用”），用于持续优化模型和召回策略。当然，这些问题背后有技术难度和资源优先级，我理解需要逐步解决。但作为AI产品经理，我会从用户价值最大的场景（如旅游攻略、美妆测评）先切入优化。","level":"高级","type":"观点判断","tags":["市场与竞品分析","生成式 AI 与多模态"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q345","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":345,"q":"你的最快到岗日期是什么时候？实习期间能否接受阶段性加班？","a":"（真诚、明确、给出底线）我的最快到岗日期是［具体日期，比如：6月25日］，我可以提前完成学校事务，全职实习。关于加班，我完全可以接受阶段性、项目驱动的加班。我理解在互联网公司，尤其是AI产品处于快速迭代期时，为了赶上线节点或解决突发问题需要投入额外时间。我自己的习惯是：平时高效工作减少无效加班，但关键时刻不推脱。如果团队需要，我也愿意承担一些周末的轮值或on-call（如果是线上支持）。同时我也会注意保持好身体状态，确保长期稳定的产出。希望我的回答能让您放心。","level":"初级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"二面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q346","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":346,"q":"请做一个自我介绍","a":"面试官好，我叫［姓名］，目前［学校/专业/年级］。在过去的产品相关经历中，我逐渐形成了自己的核心竞争力：懂用户、懂AI边界、懂数据闭环。\n\n• 懂用户：我做过C端用户调研、行为分析，能敏锐捕捉到用户真正的“麻烦时刻”。\n\n• 懂AI边界：我自学了大模型基本原理、RAG、SFT、评测体系，能跟算法工程师用同一个语言对话。\n\n• 懂数据闭环：我主导过从badcase归因、标注、评测到推动模型迭代的全流程，会用数据指导产品优化。我非常喜欢小红书，它既是一个生活方式社区，也是一个巨大的“表达与决策”场景。AI在这里有巨大的发挥空间：降低创作门槛、提升搜索效率、辅助消费决策。我希望加入小红书AI团队，把AI真正变成用户手中的“表达加速器” 和“生活小助手”。","level":"中级","type":"经历描述","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q347","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":347,"q":"再详细讲一下你的核心项目，说明项目的核心价值和行业意义。","a":"（请用你简历上最亮眼的项目替换。以下是一个通用且具有“AI+行业意义”的示例，你可以参照这个结构来改写自己的项目）我深度参与的核心项目是［项目名称：如“AI智能创作助手”］。\n\n项目价值：该功能为内容社区的用户提供“标题生成”“文案扩写”“语气改写”三种能力，上线后用户采纳率达到37%，内容发布转化率提升15%。核心价值：它降低了普通用户从“有想法”到“发一篇高质量笔记”的门槛，特别是解决了“空白页焦虑”问题。行业意义：当前内容社区普遍面临“创作者增长瓶颈”—头部创作者产出稳定，但腰尾部用户发帖意愿低。我们的项目验证了：AI辅助创作可以把普通人转化成轻度创作者，从而扩大社区内容供给的“长尾”。这为整个UGC行业提供了一条可复用的增长路径：不是只盯着爆款，而是用AI降低所有人的表达成本。项目中我负责需求定义、效果评测体系搭建、以及与算法团队的迭代协同。提示：如果项目偏B端，可以改为“行业意义是证明了AI可以将某业务流程效率提升XX%，为同类企业提供降本增效的参考范式”。","level":"高级","type":"经历描述","tags":["产品规划与需求"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q348","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":348,"q":"你所在的项目团队架构是怎样的？你在其中如何发挥协同作用？","a":"我所在的项目团队是“产品+算法+研发+运营”的典型互联网产研结构，规模约12人：\n\n• 产品组（2人）：负责需求、交互、上线策略、效果评测（我是核心成员）。\n\n• 算法组（4人）：负责模型选型、训练/微调、推理部署。\n\n• 研发组（3人）：负责前后端工程、API接入、数据埋点。\n\n• 运营组（2人）：负责用户招募、反馈收集、内容安全审核。\n\n•QA（1人）：负责功能测试和模型输出质量抽检。我的协同作用：\n\n1. 充当用户与算法之间的翻译官：把用户反馈中的“太夸张”“不相关”转化成具体的badcase分类和优化方向（如“减少感叹号堆叠”“增加产品参数约束”）。\n\n2. 建立效果评测与联调机制：我牵头制定了每周一次的 “badcase评审会”，产品带用户数据，算L．建业双未件测刁状骑机耐。我牢大耐疋」母同一次时 Daacase许甲公，广的市用广数拮，异法带模型分析，研发评估工程可行性，运营反馈审核侧问题。这个机制让原本各自为战的团队形成了统一的迭代节奏。\n\n3. 推动数据驱动的优先级决策：当算法同学资源有限时，我会用数据说话（例如“35%的坏case来源于超长文本场景，这应该是下一轮优化的重点”），而不是靠“我认为”。通过这种方式，我虽然不写模型代码，但成为了团队信息的“枢纽节点”和迭代节奏的“节拍器”。","level":"中级","type":"方法流程","tags":["团队协作与沟通"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q349","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":349,"q":"目前AI内容生态行业的发展现状如何？存在哪些机遇和挑战？","a":"（考察行业视野，需要客观、有层次）当前AI内容生态行业处于 “从功能嵌入到生态重塑”的过渡期。我把它分成三个层次来看：现状：\n\n• 头部应用（如小红书、抖音、Notion、Canva）已普遍接入AI生成/搜索/总结能力，但多数仍是“附加功能”而非核心流程。\n\n• 独立的AI内容工具（Midjourney、Runway、HeyGen）在专业场景快速渗透，但面临用户留存和商业化的挑战。\n\n• 内容平台普遍在探索“AI生成内容标识”“反作弊”“版权保护”等治理机制。机遇：\n\n1. 供给侧红利：AI能把“不会写/不会画”的普通人变成内容生产者，极大扩充内容生态的多样性。\n\n2. 交互范式变革：从“点击-浏览”变成“对话-生成”，可以诞生新的产品形态（如A搜索、Al伴侣）。\n\n3. 垂直场景深度：结合特定行业知识（医疗、法律、教育）的AI内容工具拥有高壁垒和高付费意愿。挑战：\n\n1. 内容可信度与幻觉：AI生成内容可能误导用户，尤其在小红书这类消费决策场景，一条虚假的“种草”可能造成实际损害。\n\n2. 社区真实性的侵蚀：如果大量内容由AI生成且不声明，用户可能感到“社区没有活人了”，破坏信任。\n\n3. 同质化风险：所有人都用相似的模型和prompt，可能导致内容风格趋同，失去平台特色。\n\n4. 版权与合规：训练数据版权、生成内容版权归属、深度合成监管等政策尚不明朗。在小红书这样的社区，AI内容生态的核心矛盾是“效率与真实性的平衡”。我认为胜出的关键不是生成能力最强，而是“能生成符合社区调性、用户可信任、且可追溯的内容”。","level":"高级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q350","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":350,"q":"小红书做独立AI功能（而非嵌入现有流程）的意义是什么？与行业内其他产品的差异性","a":"在哪？（这是对产品策略的深度考察，需要理解“独立入口 vS 场景嵌入”的权衡）小红书做独立AI功能（例如独立的“AI创作助手”入口或“Al搜索”Tab），而非完全嵌入现有发布或搜索流程，我认为有三层战略意义：\n\n1. 降低用户认知负担，形成“AI心智”如果将AI功能打散在发布页的各个角落，用户可能感知不到“这是AI在帮我”。独立入口可以集中展示AI能力，让用户明确知道“我在使用AI工具”，从而培养对AI的信任和使用习惯。这类似于微信把“扫一扫”独立出来，而不是藏在菜单里。\n\n2. 借独立空间快速试错，避免干扰核心流程嵌入流程的任何改动都可能影响主链路的数据（如发布转化率）。独立AI功能就像一个“沙盒”，可以大胆尝试新的交互（如多轮对话、多模态输入），即使效果不好也不会伤害核心体亼”验。这是风险隔离。\n\n3. 探索“Al原生”新场景，而非优化老场景嵌入流程本质是“让现有功能更好用”，而独立入口可以探索“以前做不到的事”。例如独立的“AI穿搭助手”可以让你上传多张衣服照片，AI给出搭配建议—这个流程与现有发布/搜索完全不同，独立空间更灵活。与行业内其他产品的差异性：\n\n• 相比Notion Al（完全嵌入文档）、Canva AI（嵌入设计流程），小红书的独立AI功能更强调社区调性与生活场景。例如豆包的 “AI佛跳墙”是泛娱乐，而小红书的独立AI应该紧扣“生活决策”与“表达灵感”。\n\n• 相比传统 “AI应用商店”（一堆工具列表），小红书的独立入口应该与社区内容深度打通—比如你在独立AI里生成的草稿，可以一键跳转到发布页继续编辑，形成“独立使用一回流社区” 的闭环。\n\n• 长期看，独立AI功能可以成为小红书探索AI Agent的试验田：例如一个“旅行规划Agent”，能帮你查攻略、订酒店、生成笔记草稿，这是单纯嵌入搜索无法实现的。","level":"高级","type":"方案设计","tags":["产品规划与需求","市场与竞品分析"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q351","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":351,"q":"做AI产品时，为什么选择自研模型/对接第三方模型，而不使用竞品的成熟方案？","a":"（考察技术选型逻辑，体现成本、差异化、数据安全、迭代速度的综合权衡）选择自研、第三方API、还是直接用竞品方案，取决于业务场景、数据隐私、迭代自由度、成本四个维度。我分别说明决策逻辑：一、什么情况下选择第三方成熟方案（如OpenAI API、文心一言API）？\n\n• 通用能力需求：比如摘要、翻译、情感分析，没有强业务特色。\n\n• 快速验证MVP：需要在两周内上线看用户反应，自研来不及。\n\n• 算力和工程资源有限：中小团队无法承担训练成本。小红书在一些通用场景（如“笔记智能配文”）用第三方API是合理的，但需要注意数据脱敏和合规。二、什么情况下需要自研或微调模型？\n\n• 业务强相关的“风格/知识”：小红书的内容语言（“绝绝子”“yyds”“保姆级攻略”）是独特的，通用模型很难生成地道的小红书风。这时候需要用平台历史笔记做SFT或LORA，形成自己的“社区语言模型”。\n\n• 数据安全与合规：用户私信、个人消费记录等敏感数据不能传给第三方。\n\n• 高频调用成本控制：当某类API调用量巨大（如每天千万次），自研推理的成本可能远低于按次付费。\n\n• 需要深度定制推理时延和并发：例如实时AI搜索要求毫秒级响应，自研可以极致优化。三、为什么不直接用竞品的成熟方案（比如直接套用某竞品的AI功能）？竞品方案（如某款AI写作工具）可能功能很强大，但有两个致命问题：\n\n1. 无法与小红书的社区数据打通：它们不知道用户的浏览历史、收藏夹、粉丝画像，无法做个性化推荐或风格定制。\n\n2. 被卡脖子风险：竞品随时可能封API、涨价、改变策略。核心能力必须掌握在自己手里，这是战略安全。总结我的决策框架：通用能力用第三方快速跑通，核心差异化能力和高成本场景自研或微调，绝不把社区独有的数据资产交给竞品。","level":"高级","type":"对比分析","tags":["技术架构与选型"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q352","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":352,"q":"AI功能的打分体系（如内容生成质量、搜索精准度）是如何建设的？核心维度有哪些？","a":"（这是考察“AI效果评测”的专业能力，必须具体、可操作）AI功能的打分体系不能只靠 “我觉得”，而要建立一套可复现、可对比、可自动化的评测框架。我会分成离线评测和在线评测两部分，核心维度因功能而异。以内容生成质量为例：离线评测（用固定测试集人工或自动化打分）核心维度包括：\n\n1. 相关性：生成内容是否与用户输入的主题/关键词强相关（1-5分）。\n\n2. 有用性：是否提供了有价值的信息或建议（而非空洞废话）。\n\n3. 社区调性适配度：是否符合小红书“真诚、干货、共情”的语言风格（可通过与优质笔记的相似度模型辅助打分）。\n\n4. 安全合规：是否包含违规词、歧视、虚假信息（二分类：通过/不通过）。\n\n5. 多样性：同一输入生成的多个结果之间是否有足够的差异（避免雷同）。我们会定期抽取500个case，由至少3名标注员独立打分，计算一致性（Kappa值），然后取平均分作为基线。在线评测（真实用户反馈＋行为指标）核心维度：\n\n1. 采纳率：用户是否直接使用/发布生成的内容（生成一发布完成）。\n\n2. 修改率：用户是否对生成内容进行了编辑—高修改率说明质量不够好，但可接受；高抛弃率（不修改不发布）说明差。\n\n3. 用户满意度：通过“上/”或打分组件收集主观评价。\n\n4. 留存影响：使用过AI功能的用户，次日/7日留存是否显著高于未使用者。\n\n5. 人工审核通过率：对生成内容进行随机抽审，计算违规比例。对于搜索精准度，核心维度包括：\n\n• DCG@10（搜索结果排序质量）\n\n• 长点击率（用户点进笔记并停留>15秒的比例）\n\n• 无结果率（搜索后0点击的比例）\n\n• Al摘要的置信度（模型自我评估的概率阈值）这套打分体系的价值在于：离线保证模型不倒退，在线指导产品优化方向，两者结合形成“评测驱动迭代”的文化。","level":"高级","type":"方法流程","tags":["数据驱动与指标","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q353","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":353,"q":"小红书AI业务存在的核心价值是什么？短期和长期目标分别是什么？","a":"（这是业务理解题，需要紧扣小红书的平台定位）小红书AI业务的核心价值（或者说“为什么小红书写要做AI”）我认为是：用AI放大社区的“表达”与“决策”两大心智，同时构建下一代内容交互范式。\n\n• 对内：提升用户体验（降低创作门槛、提高搜索效率），巩固社区壁垒。\n\n• 对外：在AI浪潮中抢占“生活服务Agent”的入口，避免被通用AI产品（如ChatGPT、豆包）侵蚀流量。短期目标（0-1年）：\n\n1. 工具价值验证：上线3-5个高使用频次的AI功能（如智能标题、Al搜索总结、AI修图），单功能月活渗透率达到15%以上，用户满意度>4分（5分制）。\n\n2. 形成评测与迭代闭环：建立标准化的效果评测流程和badcase处理机制，让每个AI功能都有据可依地持续优化。\n\n3. AI内容治理体系：建立AI生成标识、反作弊、版权保护等基础能力，避免生态污染。长期目标（1-3年）：\n\n1. 成为“生活决策Agent”：用户在小红书内就能完成“想一个问题—AI提供个性化方案一参考真实用户笔记—一键下单/预订”的全流程，而不再是跳转到其他ApP。\n\n2. AIl原生内容形态：出现只有AI才能创造的互动内容（如可对话的虚拟博主、动态生成的个性化游记），形成差异化壁垒。\n\n3. 创作者AI工作台：为KOL提供AI数据分析、内容优化、粉丝互动助理等深度工具，提高平台对核心创作者的粘性。最终目标：让AI成为小红书的第二增长曲线，而不仅仅是一个功能模块。","level":"高级","type":"观点判断","tags":["商业模式与定价"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q354","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":354,"q":"如何量化AI产品功能的效果？","a":"（考察指标设计能力，强调“业务指标”而不是“模型指标”）量化AI产品功能的效果，我会建立三层指标体系：核心业务指标 —模型效果指标 —>成本与风险指标。以“Al标题生成”为例：第一层：核心业务指标（衡量商业价值）\n\n• 发布转化率：使用该功能的用户 vs未使用用户，最终完成笔记发布的比例。\n\n• 内容质量：使用AI生成标题的笔记，平均互动（点赞+评论+收藏）是否高于普通笔记。\n\n• 创作者活跃度：周活跃创作者中，使用AI功能的比例；以及使用AI后，创作者的周发布频次变化。\n\n• 用户留存：Al功能使用者的次周留存率与大盘对比。第二层：模型效果指标（衡量AI能力质量）\n\n• 采纳率：用户点击“使用此标题”的次数/ 总生成次数。\n\n• 用户修改率：用户对AI结果进行编辑的比例（过高的修改率说明模型不够好）。\n\n• 满意度评分：用户主动评分的均值（1-5分）。\n\n• 多样性得分：同一用户连续多次请求，生成结果的重复度。第三层：成本与风险指标（衡量可持续性）\n\n• 单次调用成本：推理成本（尤其是第三方API）、工程资源占用。\n\n• 内容安全违规率：AI生成的标题中，被审核拦截的比例。\n\n• 用户负反馈率：点击“不喜欢”或投诉“AI生成内容误导”的比例。重要原则：我应该定义一个北极星指标，比如“AI功能带来的有效发布增量”（使用AI的用户中，超过其历史发布水平的增量部分）。这个指标直接关联平台价值。同时，每周出一份“AI功能健康度看板”，包含上述关键指标的趋势和阈值告警，确保团队所有人都能一目了然。","level":"高级","type":"方法流程","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q355","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":355,"q":"你认为小红书AI业务的核心定位是做内容生态，还是做服务工具？为什么？","a":"（这是一道战略定位题，需要辩证回答，给出自己的判断逻辑）我认为目前小红书AI业务的核心定位是“以服务工具为起点，最终反哺内容生态”，而不是二选一。但非要选一个当前最核心的定位，我会选内容生态。理由如下：\n\n1. 小红书的根本资产是内容与社区关系。无论是搜索、推荐、还是AI生成，最终目的都是为了让用户产生更多有价值的互动。如果AI只做“服务工具”（比如天气查询、计算器），它和平台核心优势无关，很容易被替代。\n\n2. AI生成功能直接扩充内容供给：降低创作门槛一产生更多笔记-丰富生态一吸引更多用户一再激励创作者，这是正循环。而纯工具（如AI修图）虽然有用，但对内容生态的贡献是间接的。\n\n3. 行业竞争格局：通用AI助手（豆包、文心一言）已经在“服务工具”上做得很好，小红书拼不过它们的通用能力。但小红书独有的生活方式数据+用户信任是壁垒，所以AI必须服务于“让社区更好”这个原点。但我不认为“内容生态”和“服务工具”是对立的。好的AI工具（比如AI旅行规划）本身就是内容的一种形式，而且可以沉淀为笔记。长期来看，AI业务应该实现“工具即内容，内容即工具”的融合：用户使用AI工具的过程中产生的内容，直接成为社区的一部分。这是小红书区别于纯工具产品的终极形态。\n\n所以我的结论：现阶段核心定位是“赋能内容生态的智能工具集”，长期定位是“内容生态与服务工具深度融合的智能伴侣”。","level":"高级","type":"观点判断","tags":["商业模式与定价"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q356","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":356,"q":"你在项目中是如何做数据复盘的？如何通过数据指导AI功能的选代？","a":"（请结合你的真实项目。以下是通用高分回答结构）我在项目中做数据复盘遵循“定指标-拉数据一找异常-归因一出方案一上线验证”六步法。以AI标题生成功能的一次复盘为例：第一步：定指标我们预先定义了复盘的核心指标：采纳率、修改率、发布转化率、用户满意度。第二步：拉数据（按周/按版本）上线第一周，采纳率只有22%，远低于预期（40%）。我拉取了分维度数据：按用户类型（新用户Vs老用户）、按内容长度（短笔记vs长笔记）、按时段。第三步：找异常发现：新用户采纳率仅15%，而老用户27%；长笔记（>500字）的采纳率只有18%。同时用户修改率高达58%，说明生成结果不够好。第四步：归因我抽取了50条低采纳案例，人工分类发现：\n\n• 45%：生成的标题与内容不相关（模型召回问题）\n\n• 30%：标题风格过于营销化（“震惊！”“必看！”）\n\n• 25%：用户其实不需要标题（有些笔记是纯图片，用户没写正文）第五步：出方案\n\n• 针对不相关：增加输入字段让用户输入“关键词”，并优化RAG召回逻辑。\n\n• 针对营销化：在prompt中加入负向约束，并且对输出结果做规则过滤（禁止连续多个感叹号）。\n\n• 针对不需要标题的场景：只在用户已有正文内容超过50字时才展示AI标题入口。第六步：上线验证改版后A/B测试，实验组采纳率从22%提升到37%，修改率从58%下降到34%，用户满意度从3.2提升到4.1。同时我们将这个复盘流程固化，每周一次，并建立了一个“badcase自动抽样+归因看板”。通过这个案例，我深刻理解：数据复盘不是看结果，而是找到能指导行动的具体维度。","level":"中级","type":"方法流程","tags":["数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q357","src":"tx","srcName":"鹅厂 AI PM 三轮面经","no":357,"q":"你认为自己能为公司的AI业务拓展带来什么价值？","a":"（这是自我价值陈述题，要真诚、具体、有差异化）\n\n我认为我能为小红书的AI业务拓展带来三个独特价值：\n\n1. 从0到1的AI功能落地经验我之前完整参与过AI功能从需求挖掘、效果评测、到与算法协同迭代的全过程。我不仅能提需求，还能拿着badcase和评测数据跟算法同学一起分析优化方向，减少沟通损耗。在小红书，我可以快速接手现有的AI功能并推动迭代，或者从零探索新场景。\n\n2. 强用户洞察与社区体感我是小红书的深度用户，对这个社区的“语言、流行趋势、用户痛点”有天然的敏感度。我能把社区中观察到的问题（比如“新手不会写标题”）快速转化为AI产品的具体需求，并设计出符合小红书调性的交互和文案。\n\n3. 数据驱动与结构化思维我习惯用数据和框架说话。在实习期间，我可以帮助团队建立或优化AI功能的日常数据监控看板、badcase归因模板、周度复盘SOP等，让AI迭代从“靠感觉”变成“可量化、可复制”的流程。同时，我会保持主动学习，对AI行业的新动态（如新的模型、竞品功能）持续输出评测报告，为团队提供输入。最后，我希望自己不只是完成分配的任务，而是能够主动发现并推动解决一个未被满足的AI场景，比如“AI帮你写评论”或“AI摘要隐私设置”。我相信我的热情和能力可以转化为实际产出。","level":"中级","type":"观点判断","tags":["行业趋势与职业发展"],"dims":[],"status":"","chapter":"","round":"三面","part":"","topic":"","expNo":null,"expTitle":null,"origin":"《鹅厂 AI 产品经理大厂面经（三轮）》截图"},{"id":"q358","src":"llm","srcName":"大模型 LLMs 八股文","no":358,"q":"目前 主流的开源模型体系有哪些？","a":"目前 主流的开源模型体系 分三种：\n\n•第一种：prefix Decoder 系\n\n•介绍：输入双向注意力，输出单向注意力\n\n•代表模型：ChatGLM、ChatGLM2、U-PaLM\n\n第二种：causal Decoder 系\n\n•介绍：从左到右的单向注意力\n\n•代表模型：LLaMA-7B、LLaMa 衍生物\n\n第三种：Encoder-Decoder\n\n•介绍：输入双向注意力，输出单向注意力\n\n•代表模型：T5、Flan-T5、BART","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q359","src":"llm","srcName":"大模型 LLMs 八股文","no":359,"q":"prefix Decoder 和 causal Decoder 和 Encoder-Decoder 区别是什么？","a":"prefix Decoder 和 causal Decoder 和 Encoder-Decoder 区别在于 attention mask不同：\n\nEncoder-Decoder：\n\n•在输入上采用双向注意力，对问题的编码理解更充分\n\n•适用任务：在偏理解的 NLP任务上效果好\n\n．缺点：在长文本生成任务上效果差，训练效率低；\n\ncausal Decoder：\n\n•自回归语言模型，预训练和下游应用是完全一致的，严格遵守只有后面的token才能看到前面的token的规则；\n\n•适用任务：文本生成任务效果好\n\n•优点：训练效率高，zero-shot 能力更强，具有涌现能力\n\nprefix Decoder：\n\n•特点：prefix部分的token互相能看到，causal Decoder 和 Encoder-Decoder 折中；\n\n•缺点：训练效率低","level":"高级","type":"对比分析","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q360","src":"llm","srcName":"大模型 LLMs 八股文","no":360,"q":"大模型LLM的训练目标 是什么？","a":"1.语言模型根据 已有词预测下一个词，训练目标为最大似然函数：\n\n训练效率：Prefix Decoder \u003c Causal DecoderCausal Decoder结构会在所有token上计算损失，而 Prefix Decoder 只会在 输出上计算损失。\n\n2. 去噪自编码器随机替换掉一些文本段，训练语言模型去恢复被打乱的文本段。目标函数为：\n\n去噪自编码器的实现难度更高。采用去噪自编码器作为训练目标的任务有GLM-130B、T5.","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q361","src":"llm","srcName":"大模型 LLMs 八股文","no":361,"q":"涌现能力是啥原因？","a":"根据前人分析和论文总结，大致是2个猜想：\n\n•任务的评价指标不够平滑；\n\n•复杂任务 vs 子任务，这个其实好理解，比如我们假设某个任务T有5个子任务 Sub-T构成，每个sub-T随 着模型增长，指标从40%提升到60%，但是最终任务的指标只从 1.1%提升到了 7%，也就是说宏观上看到了涌现现象，但是子任务效果其实是平滑增长的。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q362","src":"llm","srcName":"大模型 LLMs 八股文","no":362,"q":"为何现在的大模型大部分是Decoder only结构？","a":"因为decoder-only结构模型在没有任何微调数据的情况下，zero-shot的表现能力最好。而encoder-decoder则 需要在一定量的标注数据上做multitask-finetuning才能够激发最佳性能。目前的Large LM的训练范式还是在大规模语料shang做自监督学习，很显然zero-shot性能更好的decoder-only架构才能更好的利用这些无标注的数据。大模型使用decoder-only架构除了训练效率和工程实现上的优势外，在理论上因为Encoder的双向注意力会存在 低秩的问题，这可能会削弱模型的表达能力。就生成任务而言，引入双向注意力并无实质的好处。而Encoder-decoder模型架构之所以能够在某些场景下表现更好，大概是因为它多了一倍参数。所以在同等参数量、同等推理成本下，Decoder-only架构就是最优的选择了。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q363","src":"llm","srcName":"大模型 LLMs 八股文","no":363,"q":"简单介绍一下 大模型【LLMs】？","a":"大模型：一般指1亿以上参数的模型，但是这个标准一直在升级，目前万亿参数以上的模型也有了。大语言模型（Large Language Model，LLM）是针对语言的大模型。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q364","src":"llm","srcName":"大模型 LLMs 八股文","no":364,"q":"大模型【LLMs】后面跟的175B、60B、540B等指什么？","a":"175B、60B、540B等：这些一般指参数的个数，B是Billion/十亿的意思，175B是1750亿参数，这是ChatGPT大约的参数规模。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q365","src":"llm","srcName":"大模型 LLMs 八股文","no":365,"q":"大模型【LLMs】具有什么优点？","a":"1.可以利用大量的无标注数据来训练一个通用的模型，然后再用少量的有标注数据来微调模型，以适应特定的 任务。这种预训练和微调的方法可以减少数据标注的成本和时间，提高模型的泛化能力；\n\n2. 可以利用生成式人工智能技术来产生新颖和有价值的内容，例如图像、文本、音乐等。这种生成能力可以帮助用户在创意、娱乐、教育等领域获得更好的体验和效果；\n\n3. 可以利用涌现能力（Emergent Capabilities）来完成一些之前无法完成或者很难完成的任务，例如数学应用题、常识推理、符号操作等。这种涌现能力可以反映模型的智能水平和推理能力。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q366","src":"llm","srcName":"大模型 LLMs 八股文","no":366,"q":"大模型【LLMs】具有什么缺点？","a":"9 1.需要消耗大量的计算资源和存储资源来训练和运行，这会增加经济和环境的负担。据估计，训练一个GPT-3模型需要消耗约30万美元，并产生约284吨二氧化碳排放；\n\n2. 需要面对数据质量和安全性的问题，例如数据偏见、数据泄露、数据滥用等。这些问题可能会导致模型产生 不准确或不道德的输出，并影响用户或社会的利益；\n\n3. 需要考虑可解释性、可靠性、可持续性等方面的挑战，例如如何理解和控制模型的行为、如何保证模型的正确性和稳定性、如何平衡模型的效益和风险等。这些挑战需要多方面的研究和合作，以确保大模型能够健康 地发展。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"基础面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 基础面"},{"id":"q367","src":"llm","srcName":"大模型 LLMs 八股文","no":367,"q":"什么是生成式大模型？","a":"生成式大模型（一般简称大模型LLMs）是指能用于创作新内容，例如文本、图片、音频以及视频的一类深度学习模型。相比普通深度学习模型，主要有两点不同：\n\n（原文此处截断，后续内容未出现在截图中）","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q368","src":"llm","srcName":"大模型 LLMs 八股文","no":368,"q":"大模型是怎么让生成的文本丰富而不单调的呢？","a":"9 1. 模型参数量更大，参数量都在 Billion 级别；\n\n2. 可通过条件或上下文引导，产生生成式的内容（所谓的 prompt engineer 就是由此而来）。\n\n3. 从训练角度来看：a.基于 Transformer 的模型参数量巨大，有助于模型学习到多样化的语言模式与结构；\n\nb.各种模型微调技术的出现，例如P-Tuning、Lora，让大模型微调成本更低，也可以让模型在垂直领域有更强的生成能力；c.在训练过程中加入一些设计好的loss，也可以更好地抑制模型生成单调内容；\n\n4. 从推理角度来看：a. 基于Transformer的模型可以通过引入各种参数与策略，例如temperature，nucleussamlper来改变每次生成的内容。","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q369","src":"llm","srcName":"大模型 LLMs 八股文","no":369,"q":"LLMs复读机问题","a":"3.1 什么是LLMs复读机问题？LLMs复读机问题：\n\n9 1. 字符级别重复，指大模型针对一个字或一个词重复不断的生成例如在电商翻译场景上，会出现 “'steckdose steckdose steckdose steckdose steckdosesteckdose steckdosesteckdose..”；\n\n2. 语句级别重复，大模型针对一句话重复不断的生成例如在多模态大模型图片理解上，生成的结果可能会不断重复图片的部分内容，比如“这是一个杯子，这是一个杯子.”；\n\n3. 章节级别重复，多次相同的prompt输出完全相同或十分近似的内容，没有一点创新性的内容比如你让大模型给你写一篇关于春天的小作文，结果发现大模型的生成结果千篇一律，甚至近乎一摸一样。\n\n4. 大模型针对不同的prompt也可能会生成类似的内容，且有效信息很少、信息熵偏低\n\n3.2为什么会出现LLMs复读机问题？S.L万什么会出现LLMS复陕机问题：\n\n1. 数据偏差：大型语言模型通常是通过预训练阶段使用大规模无标签数据进行训练的。如果训练数据中存在大量的重复文本或者某些特定的句子或短语出现频率较高，模型在生成文本时可能会倾向于复制这些常见的模\n\n式\n\n2.训练目标的限制：大型语言模型的训练通常是基于自监督学习的方法，通过预测下一个词或掩盖词来学习语言模型。这样的训练目标可能使得模型更倾向于生成与输入相似的文本，导致复读机问题的出现。\n\n3. 缺乏多样性的训练数据：虽然大型语言模型可以处理大规模的数据，但如果训练数据中缺乏多样性的语言表达和语境，模型可能无法学习到足够的多样性和创造性，导致复读机问题的出现。\n\n4. 模型结构和参数设置：大型语言模型的结构和参数设置也可能对复读机问题产生影响。例如，模型的注意力机制和生成策略可能导致模型更倾向于复制输入的文本。\n\n5. 从 induction head［2］机制的影响角度：也就是模型会倾向于从前面已经预测的word里面挑选最匹配的词；在翻译上，由于input和output的天然差异性，你会发现容易出现重复的都是一些复杂度perplexity比较高的文本：也就是说input的句式越不常见，本身重复度越高，翻译结果重复的可能性也越高。注：我们分别以flores-101通用文本和电商标题文本做了尝试，后者出现重复的概率是前者的20倍以上。\n\n1. 从信息熵的角度分析。“在模型生成采样时，我们就应该只采样那些与条件熵对应概率接近的字符”［2］，但是我更理解为信息淹没；比如电商标题，作为一种语句连贯性很弱、基本是词序堆叠的文本，它的信息熵无疑是很高的，下一个词预测时，概率后验基本上很难预测出来，Softmax的分布也倾向于平稳，也就是说模型也预测不出来下一个词应该是什么。因此模型会倾向从前面的word里面挑选。无论是专业翻译大模型M2M、NLLB 还是通用语言模型ChatGPT，LLAMA等，\u003cHJIKL,HJIKLL, HJIKLL.＞的TSNE二维分布基本一致；也就是你添加了LLLL后，文本语义基本没有变化。另一点，就是为什么会一直是一个词L的反复重复？因为当前面t-1个词的分布趋于稳定，t以及t+1后直重复出现的L词的分布基本会沿着前面t-1个词的TSNE二维分布均匀铺开，也就是我们常说的各向异性，虽然生成的数量长了，但是\u003cHJIKL,HJIKLL,HJIKLL.＞的分布几乎不影响。这一点很值得探索，对应的解決方案也相当大力破巧。\n\n3. 3 如何缓解LLMs复读机问题？\n\n3.3.1 Unlikelihood Training•思路：在训练中加入对重复词的抑制来减少重复输出；\n\n•介绍式中集合C代表上文生成的token，本身likelihood training loss是要促使模型学习到原标签中自然的语言逻辑，而修改后的loss不仅要促进模型学习到真实标签的语言自然性，也要通过unlikelihood loss抑制模型，使其尽量不生成集合C中的token。一般对于生成式任务，只需要在原模型基础上加入unlikelihood training进行sentence级别finetune即可，不需要通过token级别的unlikelihood和likelihood loss叠加训练。加训练虽然会降低重复率，但是句子困惑度会升高，准确率会下降）\n\ntoken级unlikelihood training loss\n\nCtr （po（1a：\u003ct），C*）= 二10g（1-po（clx t））.\n\nsentence级unlikelihood training loss\n\nseg-rep-4 unig-seg\n\nCuLtoken\n\nCuL-segCuLtokentseg\n\n注：上图为论文中的结果，其中seq-rep-4代表4-gram重复率；uniq-seq代表总共出现的不同词的\n\n个数；ppl代表句子困惑度；acc代表句子准确性；rep代表前词重复率；wrep代表加权前词重复率。从这些指标中可以明显观察到，unlikelihood training能降低整体生成句子的重复度。unlikelihood training方法是一种表现不错的抑制重复方式，但其中集合C的设计比较困难。针对不同的任务，集合C都需要进行精心的设计，才能保证在生成精度基本不降的情况下抑制模型生成重复与单调的结果。（该方法仅能解决1.1节中阐述的前两种重复问题，无法解决输入多次相同prompt输出单调性的问题）参考：NEURAL TEXT DEGENERATION WITH UNLIKELIHOOD TRAINING\n\n3.3.2引入噪声在生成文本时，引入一些随机性或噪声，例如通过采样不同的词或短语，或者引入随机的变换操作，以增加生成文本的多样性。这可以通过在生成过程中对模型的输出进行采样或添加随机性来实现。\n\n3. 3.3 Repetition Penalty•思路：重复性惩罚方法通过在模型推理过程中加入重复惩罚因子，对原有softmax结果进行修正，降低重复生成的token被选中的概率\n\nexp（zi/（T . I（iEg））P- Z, exp（as/（T.I（jEg）\n\n注：其中T代表温度，温度越高，生成的句子随机性越强，模型效果越不显著；I就代表惩罚项，c代表我们保存的一个list，一般为1-gram之前出现过的单词，theta值一般设置为1.2，1.0代表沒有惩罚。重复性惩罚方法是一种简单有效的重复抑制手段，因为它通过提高I值，有效降低集合c中词再次被选中的概率。当然，类似与unlikelihood training，本方法也可以通过设置不同的c集合来改变惩罚的方向。（该方法仅能解决\n\n1.1节中阐述的前两种重复问题，无法解决输入多次相同prompt输出单调性的问题）\n\n参考：CTRL:A CONDITIONAL TRANSFORMER LANGUAGE MODEL FOR CONTROLLABLE\n\nHuggingface中，model.generate已经包含此参数，仅需设置repetition_penalty=p（p>1.0） 即可\n\n开启重复惩罚因子\n\n3.3.4 Contrastive Search\n\n•动机：Contrastive Search方法是为了解决原先解码方法，例如Beam Search，在采用最大化生成方式解码时出现解码退化的问题即生成的文本不自然的，并包含文本重复而提出的一种解决方案\n\n•思路：对比loss以及对比搜索两个创新点，从模型训练和模型推理层面缓解了生成式模型重复以及单调问题。其中对比loss通过在原loss基础上添加对比loss，即对比token间相似度的方式去解決生成式模型重复单调问题，公式如下：\n\n其中\n\n就是余弦相似度，下图给出了训练前后token间的相似度：对比训练前后token相似度\n\n从图上可以明显看出token间相似度降低了，token间相似度降低即不同token在高维空间表征分离能有效降低模型仅生成个别重复词或字的概率。而对比搜索方法就是在decode阶段限制相似token生成的概率，大大降低生成内容重复率和单调性。\n\n其中第一项就是原模型的概率，后面一项可以理解成一种惩罚，当前token与历史token相似度较高时，就降低当前token的概率。对比loss和对比search在训练和推理两个阶段限制生成token间的相似度，有效降低了模型对一些特别常见表达的依赖，让模型尝试生成不一样的表达，整体上提升模型的创造性。（该方法仅能解決1.1节中阐述的前两种重复问题，无法解决输入多次相同prompt输出单调性的问题）参考论文地址：A Contrastive Framework for Neural Text GenerationHuggingface中，model.generate已经包含此参数，仅需设置penalty_alpha=alpha（0\u003calpha\u003c1） 即可开启对比Search因子alpha\n\n3.3.5 Beam Search\n\n•思路：Beam Search是对贪心策略一种改进。思路简单，就是稍微放宽考察的范围。在每一个时间步，不再只保留当前分数最高的1个输出，而是保留num_beams个。当num_beams=1时集束搜索（BeamSearch）就退化成了贪心搜索。Beam Search虽然本质上并没有降低重复率的操作，但是该策略确实在结果上优化了部分生成结果，降低了一定的重复率。下图是一个实际的例子，每个时间步有ABCDE共5种可能的输出，图中的num_beams=2，也就是说每个时间步都会保留到当前步为止条件概率最优的2个序列。\n\nBeam Search搜索方式Beam search理论上仅是为了解决贪婪搜索给到的答案仅局部最优，而全局搜索又在时间复杂度上不可行而提出 的折中算法，并不能对大模型中的任何重复问题进行修正，甚至有可能增大重复概率。但从翻译的测试实验结果来看，它确实在一定程度上改变了模型Softmax后的分布情况，优化了输出的结果，所以在部分大模型任务上能抑制重复生成问题。注：Huggingface中，model.generate中已经包含此参数，仅需设置num_beams=2即可开启集束搜索\n\n3.3.6 TopK samplingTopK通过对Softmax的输出结果logit中最大的K个token采样来选择输出的token，该方法存在的问题是当概率分布很极端时，即模型很确定下一个token时，容易造成生成错误。以下图为例，TopK采样会选择最大的K个token，并通过logit值对K个token进行采样，相比于贪心搜索增添了随机性，相当于同样的输入，多次经过TopK采样生成的结果大概率不会一样。\n\nTopK采样是一种行之有效，能简单暴力的解决1.1节中提出所有重复单调问题的方案之一，当然它存在的最大问题是最后生成的句子存在狗屁不通现象，并不能保证句子的通顺度以及对prompt的忠诚度。Huggingface中，model.generate中已经包含此参数，需设置do_sample=True，开启采样模式，同时设置tOp_k值，top_k值默认为50\n\n3.3.7 Nucleus samplerNucleus sampler俗称TopP采样，一种用于解决TopK采样问题的新方法，该采样方式不限制K的数目，而是通Softmax后排序token的概率，当概率大于P时停止，相当于当模型很确定下一个token时，可采样的K也会很少，减少异常错误发生的概率。以下图为例，TopP采样会不断选择logit中最大概率的token，放入一个list中，直到list中计算的总概率大于设置的TopP值，后对list中的token概率进行重新计算，最终根据计算出来的概率值对list中的token进行采样。\n\nNucleus sampler是对简单暴力的TOpK采样修改后的方法，也能解决1.1节中提出所有重复单调问题，相比TopK，该方法生成的句子通顺度以及对prompt的忠诚度更佳，一般选择它，而不选择TopK。注：Huggingface中，model.generate中已经包含此参数，需设置do_sample=True，开启采样模式，同时设置t0P_P值，top_p值默认为1.0\n\n3.3.8 Temperature生成模型中抽样包含随机性，因此每次生成时，相同的prompt可能会产生不同的输出。温度是用于调整随机程度的数字。\n\nTemperature\n\nTemperature参数使用方法采样时如何选择温度？较低的温度意味着较少的随机性；温度为0将始终产生相同的输出。执行具有“正确” 答案的任务，对于总结类，\n\n翻译类等具有明确答案的任务，较低的温度（小于1）更合适。如果模型开始自我重复，则表明温度设置过低。高温意味着更多的随机性，这可以帮助模型给出更有创意的输出。如果模型开始偏离主题或给出无意义的输出，则表明温度过高。温度调整公式如下：\n\nexp（zi/（T. I（iEg））Z;exp（zj/（T.IliEg））\n\nTemperature参数就是前面介绍repetition penalty中的T参数。提高Temperature配合上文两种采样算法，可以达到生成更激进创新性回答的需求，但生成句子的稳定性不可控。Huggingface中，model.generate中已经包含此参数，仅需设置temperature，默认为1.0\n\n3.3.9 No repeat ngram size该方法是一种最暴力抑制重复的方法，通过限制设置的ngram不能出现重复，如果重复，就选概率次大的一个，来强制模型不生成重复的token。该功能一般都会开启，来保证生成的句子不犯很离谱的连续重复问题。（该方法仅能解决1.1节中阐述的前两种重复问题，无法解决输入多次相同prompt输出单调性的问题）Huggingface中，model.generate中已经包含此参数，仅需设置no_repeat_ngram_size=N即可\n\n3.3.10 重复率指标检测在2.1节的表中列出了常见重复率监测指标：seq-rep-N，uniq-seq，rep，wrep。通过这些指标的融合，可以对重复生成的结果进行一定程度的监测，并在监测到异常生成结果时，通过加入特殊字符，修改prompt表达等形式来重新生成结果。通过我们的测试，通过切分或加入特殊字符的方式确实能让本身异常的翻译结果恢复正常，但潜在风险是翻译的语序可能会出现一定的问题。（对其他领域生成结果的影响有待进一步探索）\n\n3.3.11 后处理和过滤\n\n对生成的文本进行后处理和过滤，去除重复的句子或短语，以提高生成文本的质量和多样性。可以使用文本相似度计算方法或规则来检测和去除重复的文本。\n\n3. 3.12人工干预和控制对于关键任务或敏感场景，可以引入人工干预和控制机制，对生成的文本进行审查和筛选，确保生成结果的准确性和多样性。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q370","src":"llm","srcName":"大模型 LLMs 八股文","no":370,"q":"llama 系列问题","a":"4.1 llama 输入句子长度理论上可以无限长吗？限制在训练数据。理论上rope的Iama可以处理无限长度，但实际上存在一些限制和挑战。下面是一些相关的考虑因素：\n\n9 1. 计算资源：生成长句子需要更多的计算资源，包括内存和计算时间。由于LLMs通常是基于神经网络的模型，计算长句子可能会导致内存不足或计算时间过长的问题。\n\n2. 模型训练和推理：训练和推理长句子可能会面临一些挑战。在训练阶段，处理长句子可能会导致梯度消失或梯度爆炸的问题，影响模型的收敛性和训练效果。在推理阶段，生成长句子可能会增加模型的错误率和生成时间。\n\n3. 上下文建模：LLMs是基于上下文建模的模型，长句子的上下文可能会更加复杂和深层。模型需要能够捕捉长句子中的语义和语法结构，以生成准确和连贯的文本。\n\n尽管存在这些挑战，研究人员和工程师们已经在不断努力改进和优化LLMS，以处理更长的句子。例如，可以采用分块的方式处理长句子，将其分成多个较短的片段进行处理。此外，还可以通过增加计算资源、优化模型结构和参数设置，以及使用更高效的推理算法来提高LLMs处理长句子的能力。","level":"高级","type":"概念解释","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q371","src":"llm","srcName":"大模型 LLMs 八股文","no":371,"q":"什么情况用Bert模型，什么情况用LLaMA、ChatGLM类大模型，咋选？","a":"Bert的模型由多层双向的Transformer编码器组成，由12层组成，768隐藏单元，12个head，总参数量110M，约\n\n1.15亿参数量。NLU（自然语言理解）任务效果很好，单卡GPU可以部署，速度快，V100GPU下1秒能处理2千\n\n条以上。ChatGLM-6B, LLaMA-7B模型分别是60亿参数量和70亿参数量的大模型，基本可以处理所有NLP任务，效果好，但大模型部署成本高，需要大显存的GPU，并且预测速度慢，V100都需要1秒一条。所以建议：\n\n1）NLU相关的任务，用BERT模型能处理的很好，如实体识别、信息抽取、文本分类，没必要上大模型；2） NLG任务，纯中文任务，用ChatGLM-6B，需要处理中英文任务，用chinese-alpaca-plus-7b-hf","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q372","src":"llm","srcName":"大模型 LLMs 八股文","no":372,"q":"各个专业领域是否需要各自的大模型来服务？","a":"各个专业领域通常需要各自的大模型来服务，原因如下：\n\n1. 领域特定知识：不同领域拥有各自特定的知识和术语，需要针对该领域进行训练的大模型才能更好地理解和处理相关文本。例如，在医学领域，需要训练具有医学知识的大模型，以更准确地理解和生成医学文本。\n\n2. 语言风格和惯用语：各个领域通常有自己独特的语言风格和惯用语，这些特点对于模型的训练和生成都很重要。专门针对某个领域进行训练的大模型可以更好地掌握该领域的语言特点，生成更符合该领域要求的文本。\n\n3. 领域需求的差异：不同领域对于文本处理的需求也有所差异。例如，金融领域可能更关注数字和统计数据的处理，而法律领域可能更关注法律条款和案例的解析。因此，为了更好地满足不同领域的需求，需要专门针对各个领域进行训练的大模型。\n\n4. 数据稀缺性：某些领域的数据可能相对较少，无法充分训练通用的大模型。针对特定领域进行训练的大模型可以更好地利用该领域的数据，提高模型的性能和效果。尽管需要各自的大模型来服务不同领域，但也可以共享一些通用的模型和技术。例如，通用的大模型可以用于处理通用的文本任务，而领域特定的模型可以在通用模型的基础上进行微调和定制，以适应特定领域的需求。这样\n\n可以在满足领域需求的同时，减少模型的重复训练和资源消耗。","level":"高级","type":"观点判断","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q373","src":"llm","srcName":"大模型 LLMs 八股文","no":373,"q":"如何让大模型处理更长的文本？","a":"•动机：目前绝大多数大模型支持的token最大长度为2048，因为序列长度直接影响Attention的计算复杂度，太长了会影响训练速度。\n\n•让大模型处理更长的文本 方法\n\n1. LongChat就两步：step1：将新的长度压缩到原来2048长度上，这样的好处是能复用原来的位置信息，增加长度并没有破坏position的权重。比如从2048扩展到16384，长度变为原来的8倍，那么值为10000的position_id，被压缩成\n\n代码只需要改一行：\n\n代码块1 #将position_ids按比例缩一下。\n\nstep2：用训练Vicuna的对话语料做微调，超过16k的文本被截断。\n\n2. position等比例缩放既然有用，那后续会不会有一种新的position构造的方式，无论多长都可以归一到同样的尺度下，只要position的相对位置保持不变就可以？其实ALiBi的方法就是一个比较简单优雅的方式，可以部分解决扩展长度的问题。商业模型比如ChatGPT和Claude到底是怎么做的？这个目前都没有公开。首先语料是不缺的，所以只能是结构上的变化。但是这两个商业模型规模都是100B这个量级的，这么大的参数，如果只增加序列长度而不做其他优化的话，很难训练起来。目前有证据的方法如下：\n\na. 稀疏化，GPT3的论文中曾提到有这方面的尝试。\n\nb.Google的周彦祺在一次分享中透露GPT-4用了MoE的技术（猜测是100B16E），所以应该有类似的方法来保证在序列变长的情况下，仍然能高效的训练模型。c. Multi-Query Attention。Google的PaLM，Falcon等模型都用到过，通过权重共享来提升性能。\n\n3. 真正的出路可能还是 Linear Attention，将Attention的复杂度从O（N2）降低为O（M）.比如Linear Transformer和RWKV。其实关于变长序列的问题，历史上现成的解决方案就是 RNN，通过信息传递来解决。Transformer的卖点就是 Attention is All your Need，去弃了RNN，RWKV敢于把RNN拿回来，还是很有勇气，非常好的一个工作。现在的Attention就有点像历史上的MLP，每个节点之间都要建立关联，而MLP之后涌现了大量新的结构，所以Transformer是起点，后续肯定会有更合理的结构来取代它。\n\n大模型（LLMs）微调面\n\n．1. 如果想要在某个模型基础上做全参数微调，究竟需要多少显存？\n\n•2.为什么SFT之后感觉LLM傻了？\n\n•3.SFT 指令微调数据 如何构建？\n\n． 4.领域模型Continue PreTrain 数据选取？\n\n．5.领域数据训练后，通用能力往往会有所下降，如何缓解模型遗忘通用能力？\n\n•6.领域模型Continue PreTrain，如何让模型在预训练过程中就学习到更多的知识？\n\n．7.进行SFT操作的时候，基座模型选用Chat还是Base？\n\n．8.领域模型微调指令&数据输入格式 要求？\n\n．9.领域模型微调领域评测集 构建？\n\n•10.领域模型词表扩增是不是有必要的？\n\n．11.如何训练自己的大模型？\n\n．12.训练中文大模型有啥经验？\n\n• 13.指令微调的好处？\n\n．14.预训练和微调哪个阶段注入知识的？\n\n•15.想让模型学习某个领域或行业的知识，是应该预训练还是应该微调？\n\n．16.多轮对话任务如何微调模型？\n\n．17.微调后的模型出现能力劣化，灾难性遗忘是怎么回事？\n\n•18.微调模型需要多大显存？\n\n．19.大模型LLM进行SFT操作的时候在学习什么？\n\n•20.预训练和SFT操作有什么不同\n\n•21.样本量规模增大，训练出现0OM错\n\n•22.大模型LLM进行SFT 如何对样本进行优化？\n\n• 23. 模型参数迭代实验\n\n•24.微调大模型的一些建议\n\n•25.微调大模型时，如果 batch size 设置太小 会出现什么问题？\n\n•26.微调大模型时，如果 batch size 设置太大 会出现什么问题？\n\n．27.微调大模型时，batch size 如何设置问题？\n\n．28.微调大模型时，优化器如何？\n\n．29.哪些因素会影响内存使用？\n\n•30.进行领域大模型预训练应用哪些数据集比较好？\n\n．31.用于大模型微调的数据集如何构建？\n\n•32. 大模型训练loss突刺原因和解决办法\n\n．32.1大模型训练loss突刺是什么？\n\n•32.2为什么大模型训练会出现loSS突刺？\n\n．32.3 大模型训练loss突刺 如何解决？","level":"高级","type":"方法流程","tags":["生成式 AI 与多模态","模型训练与评估"],"dims":[],"status":"","chapter":"","round":"","part":"进阶面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 进阶面"},{"id":"q374","src":"llm","srcName":"大模型 LLMs 八股文","no":374,"q":"如果想要在某个模型基础上做全参数微调，究竟需要多少显存？","a":"一般n B的模型，最低需要16-20n G的显存。（cpu offload基本不开的情况下）vicuna-7B为例，官方样例配置为4*A10040G，测试了一下确实能占满显存。（global batch size128，max length 2048） 当然训练时用了FSDP、梯度累积、梯度检查点等方式降显存。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q375","src":"llm","srcName":"大模型 LLMs 八股文","no":375,"q":"为什么SFT之后感觉LLM傻了？","a":"•原版答案：\n\nSFT的重点在于激发大模型的能力，SFT的数据量一般也就是万恶之源alpaca数据集的52k量级，相比于预训练的数据还是太少了。如果抱着灌注领域知识而不是激发能力的想法，去做SFT的话，可能确实容易把LLM弄傻。\n\n．新版答案：指令微调是为了增强（或解锁）大语言模型的能力。其真正作用：指令微调后，大语言模型展现出泛化到未见过任务的卓越能力，即使在多语言场景下也能有不错表现","level":"高级","type":"观点判断","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q376","src":"llm","srcName":"大模型 LLMs 八股文","no":376,"q":"SFT 指令微调数据如何构建？","a":"1.代表性。应该选择多个有代表性的任务；\n\n2. 数据量。每个任务实例数量不应太多（比如：数百个）否则可能会潜在地导致过拟合问题并影响模型性能；\n\n3. 不同任务数据量占比。应该平衡不同任务的比例，并且限制整个数据集的容量（通常几千或几万），防止较大的数据集压倒整个分布。","level":"高级","type":"方法流程","tags":["模型训练与评估","数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q377","src":"llm","srcName":"大模型 LLMs 八股文","no":377,"q":"领域模型Continue PreTrain 数据选取？","a":"技术标准文档或领域相关数据是领域模型Continue PreTrain的关键。因为领域相关的网站和资讯重 要性或者知识密度不如书籍和技术标准。","level":"高级","type":"概念解释","tags":["模型训练与评估","数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q378","src":"llm","srcName":"大模型 LLMs 八股文","no":378,"q":"领域数据训练后，通用能力往往会有所下降，如何缓解模型遗忘通用能力？","a":"•动机：仅仅使用领域数据集进行模型训练，模型很容易出现穴难性遗忘现象.\n\n•解决方法：通常在领域训练的过程中加入通用数据集 那么这个比例多少比较合适呢？目前还没有一个准确的答案。主要与领域数据量有关系，当数据量没有那么多时，一般领域数据与通用数据的比例在1:5到1:10之间是比较合适的。","level":"高级","type":"方法流程","tags":["模型训练与评估","数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q379","src":"llm","srcName":"大模型 LLMs 八股文","no":379,"q":"领域模型Continue PreTrain，如何 让模型在预训练过程中就学习到更多的知识？","a":"领域模型Continue PreTrain时可以同步加入SFT数据，即MIP，Multi-Task Instruction PreTraining。预训练过程中，可以加下游SFT的数据，可以让模型在预训练过程中就学习到更多的知识。","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q380","src":"llm","srcName":"大模型 LLMs 八股文","no":380,"q":"进行SFT操作的时候，基座模型选用Chat还是Base？","a":"仅用SFT做领域模型时，资源有限就用在Chat模型基础上训练，资源充足就在Base模型上训练。（资源=数据+显卡）资源充足时可以更好地拟合自己的数据，如果你只拥有小于10k数据，建议你选用Chat模型作为基座进行微调；如果你拥有100k的数据，建议你在Base模型上进行微调。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q381","src":"llm","srcName":"大模型 LLMs 八股文","no":381,"q":"领域模型微调 指令&数据输入格式 要求？","a":"在Chat模型上进行SFT时，请一定遵循Chat模型原有的系统指令&数据输入格式。建议不采用全量参数训练，否则模型原始能力会遗忘较多。","level":"高级","type":"概念解释","tags":["模型训练与评估","数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q382","src":"llm","srcName":"大模型 LLMs 八股文","no":382,"q":"领域模型微调领域评测集 构建？","a":"领域评测集时必要内容，建议有两份，一份选择题形式自动评测、一份开放形式人工评测。选择题形式可以自动评测，方便模型进行初筛；开放形式人工评测比较浪费时间，可以用作精筛，并且任务形式更贴近真实场景。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q383","src":"llm","srcName":"大模型 LLMs 八股文","no":383,"q":"领域模型词表扩增是不是有必要的？","a":"领域词表扩增真实解决的问题是解码效率的问题，给模型效果带来的提升可能不会有很大。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q384","src":"llm","srcName":"大模型 LLMs 八股文","no":384,"q":"如何训练自己的大模型？","a":"如果我现在做一个sota的中文GPT大模型，会分2步走：\n\n1. 基于中文文本数据在LLaMA-65B上二次 预训练；\n\n2. 加CoT和instruction数据，用FT +LORA SFT。提炼下方法，一般分为两个阶段训练：\n\n•第一阶段：扩充领域词表，比如金融领域词表，在海量领域文档数据上二次预训练LLaMA模型；\n\n•第二阶段：构造指令微调数据集，在第一阶段的预训练模型基础上做指令精调。还可以把指令微调数据集拼起来成文档格式放第一阶段里面增量预训练，让模型先理解下游任务信息。当然，有低成本方案，因为我们有LoRA利器，第一阶段和第二阶段都可以用LoRA训练，如果不用LORA，就全参微调，大概7B模型需要8卡A100，用了LoRA后，只需要单卡3090就可以了。","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q385","src":"llm","srcName":"大模型 LLMs 八股文","no":385,"q":"训练中文大模型有啥经验？","a":"链家技术报告《Towards Better Instruction Following Language Models for Chinese: Investigatingthelmpact of TrainingData and Evaluation》中，介绍了开源模型的训练和评估方法：\n\nTable 1: A simple overview of public available chat models. More details could be found in 2.3.ProjectTrainingStanfordParamcterfinetuning\n\nParameterfinetuning\n\nParamcterfinetuning\n\nparameterfinetuning\n\nparameterfinetuningPythia parameterfinetuningLI.AMA LORA\n\n还对比了各因素的消融实验：\n\n词表扩充LLaMA-7BLLaMA-7B-EXT数据质量LLaMA-7B-EXTLLaMA-7B-EXT\n\n数据语言分布LLaMA-7B-EXTLLaMA-7B-EXTLLaMA-7B-EXT数据规模LLaMA-7B-EXT\n\nChatGPT\n\n消融实验结论：\n\n•扩充中文词表后，可以增量模型对中文的理解能力，效果更好\n\n•数据质量越高越好，而且数据集质量提升可以改善模型效果\n\n•数据语言分布，加了中文的效果比不加的好\n\n•数据规模越大且质量越高，效果越好，大量高质量的微调数据集对模型效果提升最明显。解释下：数据量在训练数据量方面，数据量的增加已被证明可以显著提高性能。值得注意的是，如\n\n此巨大的改进可能部分来自belle-3.5和我们的评估数据之间的相似分布。评估数据的类别、主题和复杂性将对评估结果产生很大影响\n\n•扩充词表后的LLaMA-7B-EXT的评估表现达到了0.762/0.824=92%的水平他们的技术报告证明中文大模型的训练是可行的，虽然与ChatGPT还有差距。这里需要指出后续 RLHF也很重要，我罗列在这里，抛砖引玉。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q386","src":"llm","srcName":"大模型 LLMs 八股文","no":386,"q":"指令微调的好处？","a":"有以下好处：\n\n1. 对齐人类意图，能够理解自然语言对话（更有人情味）\n\n2. 经过微调 （fine-tuned），定制版的GPT-3在不同应用中的提升非常明显。OpenAI表示，它可以让不同应用的准确度能直接从83%提升到95%、错误率可降低50%。解小学数学题目的正确率也能提高2-4倍。（更准）踩在巨人的肩膀上、直接在1750亿参数的大模型上微调，不少研发人员都可以不用再重头训练自 己的Al模型了。（更高效）","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q387","src":"llm","srcName":"大模型 LLMs 八股文","no":387,"q":"预训练和微调哪个阶段注入知识的？","a":"预训练阶段注入知识的，微调是在特定任务训练，以使预训练模型的通用知识跟特定任务的要求结合，使模型在特定任务上表现更好。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q388","src":"llm","srcName":"大模型 LLMs 八股文","no":388,"q":"想让模型学习某个领域或行业的知识，是应该预训练还是应该微调？","a":"可以使用预训练和微调相结合的方式，先用篇章数据进行预训练以获取广泛的知识，再用问答对数据进行微调，使模型更好的学习到特定领域的知识。当然，GPT大模型的预训练和微调，从实现方式来讲是没有什么差别的，都是decoder only的语言 模型训练并更新参数，如果样本集小，没有大量的篇章文档数据，我认为只进行微调也能注入知识的，不必太纠结预训练。而且特定领域跟预训练模型的分布差别不大，也不用二次预训练。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q389","src":"llm","srcName":"大模型 LLMs 八股文","no":389,"q":"多轮对话任务如何微调模型？","a":"这里列举了 ChatGLM-6B 的生成对话的例子\n\n代码块\n\n5 >>> response,history = model.chat（tokenizer，\"你好\"，history=［］）\n\nresponse：你好！我是人工智能助手 ChatGLM-6B，很高兴见到你，欢迎问我任何问题。history：［\"你好\"，\"你好！我是人工智能助手 ChatGLM-6B，很高兴见到你，欢迎问我任 何问题。\"］\n\n•response 为 ChatGLM-6B 模型的当前反馈\n\n•history 为ChatGLM-6B 模型的历史记录的保存说白了，就是 ChatGLM-6B 模型简单的把上一轮对话扔进下一轮的input里，这种方法好处是简 单，缺点是随着轮数的增加，history 存储的对话会越来越多，导致 max_length 增加，从而 出现 爆显问题。\n\n•解决方法：\n\n•对历史对话做一层文本摘要，取其精华去其糟粕\n\n•将历史对话 做成一个 embedding\n\n•如果是 任务型对话，可以将用户意图和槽位作为上一轮信息传递给下一轮","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q390","src":"llm","srcName":"大模型 LLMs 八股文","no":390,"q":"微调后的模型出现能力劣化，灾难性遗忘是怎么回事？","a":"所谓的灾难性遗忘：即学习了新的知识之后，几乎彻底遗忘掉之前习得的内容。这在微调ChatGLM-6B模型时，有同学提出来的问题，表现为原始ChatGLM-6B模型在知识问答如“失眠怎么办”的回答上是正确的，但引入特定任务（如拼写纠错CSC）数据集微调后，再让模型预测“失眠怎么办”的结果就答非所问了。我理解ChatGLM-6B模型是走完“预训练-SFT-RLHF”过程训练后的模型，其SFT阶段已经有上千指令微调任务训练过，现在我们只是新增了一类指令数据，相对大模型而已，微调数据量少和微调任务类型单一，不会对其原有的能力造成大的影响，所以我认为是不会导致灾难性遗忘问题，我自己微调模型也没出现此问题。应该是微调训练参数调整导致的，微调初始学习率不要设置太高，Ir=2e-5或者更小，可以避免此问题，不要大于预训练时的学习率。","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q391","src":"llm","srcName":"大模型 LLMs 八股文","no":391,"q":"微调模型需要多大显存？","a":"模型版本\n\n原模型大小（FP16）\n\n量化后大小（8-bit）\n\n量化后大小（4-bit）","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q392","src":"llm","srcName":"大模型 LLMs 八股文","no":392,"q":"大模型LLM进行SFT操作的时候在学习什么？","a":"（1）预训练-＞在大量无监督数据上进行预训练，得到基础模型->将预训练模型作为SFT和RLHF 的起点。（2）SFT->在有监督的数据集上进行SFT训练，利用上下文信息等监督信号进一步优化模型->将SFT训练后的模型作为RLHF的起点。\n\n（3） RLHF-->利用人类反馈进行强化学习，优化模型以更好地适应人类意图和偏好->将RLHF训练 后的模型进行评估和验证，并进行必要的调整。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q393","src":"llm","srcName":"大模型 LLMs 八股文","no":393,"q":"预训练和SFT操作有什么不同下面使用一个具体的例子进行说明。","a":"问题：描述计算机主板的功能\n\n进行预训练的时候会把这句话连接起来，用前面的词来预测后面出现的词。在计算损失的时候，问句中的损失也会被计算进去。进行SFT操作则会构建下面这样一条训练语料。\n\n代码块1 输入：描述计算机主板的功能［BOS］计算机主板是计算机中的主要电路板。它是系统的支撑。［EOS］标签：［•••••.］［BOS］计算机主板是计算机中的主要电路板。它是系统的支撑。［EOS］\n\n其中［BOS］和［EOS］是一些特殊字符，在计算损失时，只计算答句的损失。在多轮对话中，也是一样的，所有的问句损失都会被忽略，而只计算答句的损失。因此SFT的逻辑和原来的预训练过程是一致的，但是通过构造一些人工的高质量问答语料，可以高效地教会大模型问答的技巧。","level":"高级","type":"对比分析","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q394","src":"llm","srcName":"大模型 LLMs 八股文","no":394,"q":"样本量规模增大，训练出现OOM错","a":"•问题描述：模型训练的样本数量从10万，增大300万，训练任务直接报0OM了。\n\n•解決方案，对数据并行处理，具体实现参考海量数据高效训练，核心思想自定义数据集本次的主要目标是使向量化耗时随着处理进程的增加线性下降，训练时数据的内存占用只和数据分段大小有关，可以根据数据特点，灵活配置化。核心功能分为以下几点：\n\n•均分完整数据集到所有进程（总的GPU卡数）\n\n•每个epoch训练时整体数据分片shuffle一次，在每个进程同一时间只加载单个分段大小数据集\n\n．重新训练时可以直接加载向量化后的数据。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q395","src":"llm","srcName":"大模型 LLMs 八股文","no":395,"q":"大模型LLM进行SFT 如何对样本进行优化？","a":"•对于输入历史对话数据进行左截断，保留最新的对话记录。\n\n•去掉样本中明显的语气词，如嗯嗯，啊啊之类的。\n\n•去掉样本中不合适的内容，如AI直卖，就不应出现转人工的对话内容。\n\n•样本中扩充用户特征标签，如年龄，性别，地域，人群等","level":"高级","type":"方法流程","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q396","src":"llm","srcName":"大模型 LLMs 八股文","no":396,"q":"模型参数迭代实验","a":"验证历史对话轮次是否越长越好，通过训练两个模型，控制变量max_source_lengthmax_target_length，对训练好之后的模型从LosS、Bleu指标、离线人工评估等角度进行对比分析。结论：从人工评估少量样本以及losS下降来看，历史对话长度1024比512长度好，后续如果训练可能上线模型，可以扩大到1024长度。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q397","src":"llm","srcName":"大模型 LLMs 八股文","no":397,"q":"微调大模型的一些建议","a":"•模型结构：\n\n•模型结构+训练目标：Causal Decoder +LM。有很好的zero-shot和few-shot能力，涌现 效应\n\n• layer normalization：使用Pre RMS Norm\n\n•激活函数：使用GeGLU或SwiGLU\n\n• embedding层后不添加layer normalization，否则会影响LLM的性能\n\n•位置编码：使用ROPE或ALiBi。ROPE应用更广泛\n\n•去除偏置项：去除dense层和layer norm的偏置项，有助于提升稳定性\n\n•训练配置：\n\n•batch：选用很大的batch size；动态地增加batch size的策略，GPT3逐渐从32K增加到3.2MtokenSo\n\n•学习率调度：先warmup再衰减。学习率先线性增长，再余弦衰减到最大值的10%。最大值一般在5e-5到1e-4之间。\n\n•梯度裁剪：通常将梯度裁剪为1.0\n\n•权重衰減：采用AdamW优化器，权重衰减系数设置为0.1Adamw相当于Adam加了一个L2正则项\n\n•混合精度训练：采用bfloat16，而不是foat16来训练。\n\n•训练崩溃挽救：\n\n•选择一个好的断点，跳过训练崩溃的数据段，进行断点重训。选择一个好的断点的标准：损失标度lossscale>0；梯度的L2范数\u003c一定值&&波动小","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q398","src":"llm","srcName":"大模型 LLMs 八股文","no":398,"q":"微调大模型时，如果 batch size 设置太小会出现什么问题？","a":"当 batch size 较小时，更新方向（即对真实梯度的近似）会具有很高的方差，导致的梯度更新主 要是噪声。经过一些更新后，方差会相互抵消，总体上推动模型朝着正确的方向前进，但个别更新可能不太有用，可以一次性应用（使用更大 batch size 进行更新）。","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q399","src":"llm","srcName":"大模型 LLMs 八股文","no":399,"q":"微调大模型时，如果 batch size 设置太大 会出现什么问题？","a":"当 batch size 非常大时，我们从训练数据中抽样的任何两组数据都会非常相似（因为它们几乎完 全匹配真实梯度）。因此，在这种情况下，增加 batch size 几乎不会改善性能，因为你无法改进真实的梯度预测。换句话说，你需要在每一步中处理更多的数据，但并不能减少整个训练过程中的步数，这表明总体训练时间几乎没有改善。但是更糟糕的是你增加了总体的FLOPS。\n\nSVHN （SGD） - Thining Speed\n\nLarge batches\n\n通过观察这些线性图，我们可以发现使用更大的batch size 通常需要较少的训练 step。然而，这 将相应地增加需要处理的数据。当 batch size 从 2048 翻倍时，达到同样性能所需要的step 几乎 没有任何改善，但你需要花费两倍的计算资源。Google 的经验研究也有类似的观察，即在在固定 的 epochbudget 下，当batch size 达到临界值时，模型的性能会 batch size 的增加而降低。可以如下说明：\n\n（n） \"Traansforaer on T.M1B with a tnining badgot of one epoeh\n\n（b） Thutsforner an T.MBS with a training lndaet of 25,000 strpw.","level":"高级","type":"概念解释","tags":["模型训练与评估","技术架构与选型"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q400","src":"llm","srcName":"大模型 LLMs 八股文","no":400,"q":"微调大模型时，batch size 如何设置问题？","a":"各种结果表明似乎存在着一个关于数据并行程度的临界点，通过找到这个临界点，我们可以有效的平衡训练的效率和模型的最终效果。OpenAl发现最优步长：\n\nEopt （B） = argmin.EL（0-GGest）l= i+8ow/日\n\n注：B为 batch size，Bnoise为 噪声尺度在采用最优 step size 时，从含有噪声的梯度中获得的损失的最优改进现在变为：\n\nALont（E）=1+Boaw/后；ALmat\n\n从这些公式中我们可以得出两个结论：\n\n3. 无论我们如何准确地估计真实梯度，总存在一个最大步长\n\n4. 批处理大小越大，我们优化模型的步长就越大（有一个上限）\n\n左侧的图表说明了为什么使用更大的批次模型可以取得更多提升。但是当 batch size 太大时，我们会遇到收益递减的问题（因为分母中的1开始占主导地位）。但是需要注意的事，这仅在学习率调整良好的情况下有效。因此，OpenAI建议将学习率调整到一个相对接近最优值的数值是理论能有 效的前提。\n\n1 Smaller batchLarger batch\n\n在进行一些其他数学计算后，OpenAl发现噪声尺度可以通过以下方式估计：\n\n其中，H是参数的真实 Hessian矩阵，C是相对于梯度的每个示例的协方差矩阵，g是 表性。\n\n8. 构建的prompt尽量多样化，提高模型的鲁棒性。\n\n9. 进行多任务同时进行训练的时候，要尽量使各个任务的数据量平衡。","level":"高级","type":"方法流程","tags":["模型训练与评估","数据驱动与指标"],"dims":[],"status":"","chapter":"","round":"","part":"微调面","topic":"","expNo":null,"expTitle":null,"origin":"《大厂大模型（LLMs）八股文》截图 · 微调面"},{"id":"q405","src":"llm","srcName":"大模型 LLMs 八股文","no":405,"q":"大模型训练loss突刺原因和解決办法","a":"参考：A Theory on Adam Instability in Large-Scale Machine Learning\n\n32.1大模型训练loss突刺是什么？loss spike指的是预训练过程中，尤其容易在大模型（100B以上）预训练过程中出现的loss突然暴 涨的情况\n\n如图所示模型训练过程中红框中突然上涨的losS尖峰loss spike的现象会导致一系列的问题发生，譬如模型需要很长时间才能再次回到spike之前的状态（论文中称为pre-explosion），或者更严重的就是loss再也无法drop back down，即模型再也无法收敛PaLM和GLM130b之前的解决办法是找到loss spike之前最近的checkpoint，更换之后的训练样本 来避免loss spike的出现。\n\n32. 2 为什么大模型训练会出现loss突刺？大模型训练使用的Adam优化器 会导致 loss突刺。\n\n首先回顾一下Adam优化器的结构（这里介绍的是较为传统的Adam优化器，现在nlp任务更偏向于使用带有正则化项的Adamw变体）：\n\n0 1-0 44其中BBaie均为超参数（A=B、防止除0），9表示第次更新的梯度，mu， 、的初始值 mp，t为0。\n\n首先对Adam的有效性做了论述，其本质在于证明了Adam优化过程是对牛顿下降法（二阶导）的一个有效逼近，因此在收敛速度上大幅度领先传统SGD（一阶导），证明过程不做赘述，可以参考本文和Adam系列相关论文Adam算法是牛顿下降法的一个迭代逼近\n\nThe qulity of such an apprusimntion wunld impact the couvergence of the Adam dyamics andd conldexplait the chupitical succss and popnlurity of tbe Ada algoritlos.\n\n一切显得十分完美，但是理想很丰满，现实很骨感，收敛过程并不是一帆风顺的 首先我们想象一下ut这个更新参数的变化趋势\n\n在 1的时候m=81的一好，1一主品+，441集中在士1附近。而在训练到最后，假没模型收敛到某个最优点，此时 th应该集中在0附近。也就是说，我们似乎可以把更新参数的变化过程想象成为一个从两端（非稳态）向中间（稳态）收拢的过程，实际的观察现象也是如此：\n\n进入正态分布的稳态之后，理想的更新参数变化趋势应该是方差越来越小，所有更新参数逐渐向0靠近。这应该是一个单向的过程，即稳定的单峰状态（unimodal）不会再次进入非稳定的双峰状态（bimodal），但事实并非如此，更新参数会再次进入非稳定的双峰状态本文在理论层面做了研究和解释，从中心极限定理（可以结合道尔顿板实验理解）出发，认为随机事件的叠加进入单峰的正态分布的必要条件之一是各个随机事件事件之间应该是相互独立的，但是\n\n梯度变化以及更新参数的变化并不能特别好的满足独立性这一条件，而这一点恰恰是导致更新参数振荡，loss spike出现以及loss 不收敛的重要原因之一\n\n4. The distribution of gii, tj for i e G becomes highly correlated acroes time domnin for two reasons：\n\n• The batch size for s large model is usually also very large, thus the gradiggy aicanose\n\n造成梯度变化不独立的原因（1、浅层参数长时间不更新2、batch太大，后期梯度更新趋于平稳）上述的理论有些晦涩，本文作者可能也了解这一点，之后开始直接点题，结合实验观察抛出了重要现象和结论即训练过程中loss spike的出现与：梯度更新幅度
