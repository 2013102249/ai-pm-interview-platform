<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 产品经理面试备考平台 · 新像素训练营</title>
<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --line:#e6e8f2; --line2:#eef0f7;
  --text:#1d2333; --muted:#6b7285; --faint:#9aa1b5;
  --purple:#7c3aed; --purple-deep:#5b21b6; --purple-soft:#f3effe;
  --blue:#2563eb; --blue-soft:#eef4ff;
  --green:#16a34a; --green-soft:#eaf7ef;
  --red:#dc2626; --red-soft:#fdf0f0;
  --amber:#b45309; --amber-soft:#fdf6e8;
  --radius:14px;
  --shadow:0 1px 2px rgba(23,26,46,.04),0 6px 20px -8px rgba(23,26,46,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1120px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;white-space:nowrap;min-width:0}
.logo>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 3px 8px -2px rgba(124,58,237,.45)
}
.logo small{font-weight:500;color:var(--muted);font-size:12px;margin-left:1px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{
  padding:7px 13px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap;font-weight:500;
  transition:all .15s;
}
.nav a:hover{color:var(--text);background:var(--line2)}
.nav a.on{color:var(--purple-deep);background:var(--purple-soft);font-weight:600}
.topbar .src-note{font-size:12px;color:var(--faint);white-space:nowrap}

/* ---------- 布局 ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- 术语词库 ---------- */
.terms-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.terms-shell{
  height:calc(100vh - 156px);min-height:540px;max-height:1150px;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.terms-shell iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:640px){ .terms-shell{height:calc(100vh - 132px);min-height:480px;border-radius:12px} }

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,#4c1d95 0%,var(--purple) 45%,var(--blue) 100%);
  border-radius:18px;padding:30px 28px;color:#fff;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.09);
}
.hero::before{
  content:"";position:absolute;right:60px;bottom:-90px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.hero h1{font-size:24px;font-weight:800;letter-spacing:.5px;position:relative}
.hero p{margin-top:8px;font-size:14px;opacity:.88;max-width:640px;position:relative}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.hstat{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:11px;
  padding:9px 16px;font-size:13px;backdrop-filter:blur(4px);
}
.hstat b{font-size:19px;font-weight:800;margin-right:5px}

.sec-title{font-size:16.5px;font-weight:700;margin:26px 0 13px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--purple),var(--blue))}
.sec-title small{font-size:12.5px;color:var(--muted);font-weight:400}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.src-card{padding:19px;display:block;transition:transform .15s,box-shadow .15s;cursor:pointer}
.src-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,26,46,.05),0 12px 28px -10px rgba(23,26,46,.16)}
.src-card .sc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.src-card h3{font-size:15.5px;font-weight:700}
.src-card .sc-count{font-size:12.5px;color:var(--purple-deep);background:var(--purple-soft);padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.src-card p{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.65}
.src-card .sc-tags{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.mini-tag{font-size:11.5px;color:var(--muted);background:var(--line2);padding:2px 8px;border-radius:6px}

.prog-card{padding:20px}
.prog-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}
.pg-item{background:var(--line2);border-radius:11px;padding:12px 8px;text-align:center}
.pg-item b{display:block;font-size:21px;font-weight:800}
.pg-item span{font-size:12px;color:var(--muted)}
.pg-item.k b{color:var(--green)} .pg-item.v b{color:var(--amber)} .pg-item.u b{color:var(--red)}
.pg-item.f b{color:#d97706}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--green)} .bar .v{background:#f59e0b} .bar .u{background:var(--red)}
.bar-legend{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.bar-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:all .15s;
  border:1px solid transparent;
}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;box-shadow:0 4px 12px -4px rgba(124,58,237,.5)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple-deep)}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:8px}

.note-card{padding:15px 18px;font-size:13px;color:var(--muted);line-height:1.8;background:#fbfbfe}
.note-card b{color:var(--text)}
.note-card code{background:var(--line2);padding:1px 7px;border-radius:6px;font-size:12px;color:var(--purple-deep)}

/* ---------- 题库页 ---------- */
.toolbar{padding:14px 16px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;background:var(--line2);color:var(--muted);
  border:1px solid transparent;transition:all .15s;
}
.tab:hover{color:var(--text)}
.tab.on{background:var(--purple-soft);color:var(--purple-deep);border-color:#ddd0fb;font-weight:600}
.tab .n{opacity:.65;font-size:12px;margin-left:2px}
.toolbar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-box{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:8px 13px;
}
.search-box:focus-within{border-color:var(--purple);background:#fff}
.search-box input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--text)}
.search-box .ic{color:var(--faint)}
.sel{
  border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:13.5px;
  color:var(--text);outline:none;
}
.filters{padding:4px 16px 14px;margin-bottom:14px;display:none}
.filters.show{display:block}
.f-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px dashed var(--line2)}
.f-row:first-child{border-top:none}
.f-label{font-size:13px;color:var(--muted);width:58px;flex-shrink:0;padding-top:5px;font-weight:500}
.f-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{
  padding:4px 12px;border-radius:16px;font-size:12.5px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);transition:all .13s;
}
.chip:hover{border-color:var(--purple);color:var(--purple-deep)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:500}
.chip .cn{font-size:11px;opacity:.6;margin-left:5px}
.chip.on .cn{opacity:.85}
.chip.more{border-style:dashed;color:var(--purple-deep)}
.result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}
.result-bar b{color:var(--purple-deep)}

/* ---------- 题卡 ---------- */
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.qcard:hover{border-color:#d3d8ea;box-shadow:var(--shadow)}
.qcard.open{border-color:#c9b8f5}
.qcard-head{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;cursor:pointer;user-select:none}
.qno{font-size:12px;color:var(--faint);font-weight:700;padding-top:3px;min-width:34px;font-variant-numeric:tabular-nums}
.qmain{flex:1;min-width:0}
.qtitle{font-size:14.5px;font-weight:600;line-height:1.55}
.qmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.fav-btn{font-size:17px;color:#d4d7e3;padding:2px 4px;line-height:1;transition:color .13s,transform .13s}
.fav-btn:hover{transform:scale(1.15)}
.fav-btn.on{color:#f59e0b}
.chev{color:var(--faint);font-size:12px;padding-top:4px;transition:transform .18s}
.qcard.open .chev{transform:rotate(180deg)}
.qcard-body{border-top:1px solid var(--line2);padding:15px 18px 14px;background:#fcfcfe}
.badge{
  display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:6px;
  background:var(--line2);color:var(--muted);white-space:nowrap;
}
.b-deep{background:var(--purple-soft);color:var(--purple-deep)}
.b-top{background:var(--blue-soft);color:var(--blue)}
.b-exp{background:#e8f6f3;color:#0f766e}
.b-pm{background:var(--amber-soft);color:var(--amber)}
.b-tx{background:#e6f7fb;color:#0e7490}
.b-llm{background:#eef0ff;color:#4338ca}
.b-topic{background:#fdeef4;color:#be185d}
.b-group{background:#f6f7fb;border:1px solid var(--line);color:#5b6178;font-weight:400}
.b-expno{background:#fef3c7;color:#92400e;font-weight:600}
.b-pending{background:var(--amber-soft);color:var(--amber)}
.lv-1{background:var(--green-soft);color:var(--green)}
.lv-2{background:var(--blue-soft);color:var(--blue)}
.lv-3{background:var(--red-soft);color:var(--red)}
.b-type{background:#f0f1f7;color:#4b5266}
.b-tag{background:transparent;border:1px solid var(--line);color:var(--faint);font-weight:400}
.pg-badge{font-weight:600}
.pg-badge.known{background:var(--green-soft);color:var(--green)}
.pg-badge.vague{background:var(--amber-soft);color:var(--amber)}
.pg-badge.unknown{background:var(--red-soft);color:var(--red)}

.ans{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.9;color:#39415a}
.ans .l-h{font-weight:700;color:var(--purple-deep)}
.ans .l-bracket{
  display:inline-block;background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:12.5px;
  padding:1px 9px;border-radius:6px;
}
.ans-empty{color:var(--faint);font-size:13px}
.qcard-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.act-label{font-size:12.5px;color:var(--muted)}
.rbtn{
  padding:5px 13px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--line);
  background:var(--card);color:var(--muted);transition:all .13s;
}
.rbtn:hover{border-color:var(--purple);color:var(--purple-deep)}
.rbtn.on-k{background:var(--green);border-color:var(--green);color:#fff}
.rbtn.on-v{background:#f59e0b;border-color:#f59e0b;color:#fff}
.rbtn.on-u{background:var(--red);border-color:var(--red);color:#fff}
.q-src-line{font-size:11.5px;color:var(--faint);margin-left:auto}
.load-more{display:block;margin:16px auto 0;padding:10px 34px}

/* ---------- 练习页 ---------- */
.practice-wrap{max-width:760px;margin:0 auto}
.setup-card{padding:24px}
.setup-card h2{font-size:18px;font-weight:700;margin-bottom:4px}
.setup-card .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.fld{margin-bottom:16px}
.fld-label{font-size:13.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fld-label small{color:var(--faint);font-weight:400}
.opt-row{display:flex;gap:8px;flex-wrap:wrap}
.opt{
  padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13.5px;
  color:var(--muted);transition:all .13s;
}
.opt:hover{border-color:var(--purple)}
.opt.on{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-deep);font-weight:600}
.opt .n{font-size:12px;opacity:.6;margin-left:3px}

.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.p-progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.p-progress b{color:var(--purple-deep);font-size:15px}
.p-bar{height:7px;background:var(--line2);border-radius:5px;overflow:hidden;margin-bottom:16px}
.p-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:5px;transition:width .25s}
.p-card{padding:26px 24px 20px;min-height:300px;display:flex;flex-direction:column}
.p-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.p-q{font-size:17.5px;font-weight:700;line-height:1.7;flex:1}
.p-hint{font-size:12px;color:var(--faint);margin-top:16px;text-align:center}
.p-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.p-actions .btn{flex:1;min-width:140px}
.p-ans{margin-top:16px;border-top:1px dashed var(--line);padding-top:15px}
.reveal-btn{width:100%;padding:13px;font-size:15px}
.kbd{
  display:inline-block;background:var(--line2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:0 6px;font-size:11px;color:var(--muted);font-family:inherit;
}
.p-done{padding:34px 24px;text-align:center}
.p-done .big{font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.p-done h3{font-size:18px;margin:8px 0 4px}
.p-done p{font-size:13.5px;color:var(--muted)}
.p-done .mini-stats{display:flex;justify-content:center;gap:26px;margin:18px 0 22px}
.ms b{display:block;font-size:22px;font-weight:800}
.ms span{font-size:12px;color:var(--muted)}

/* ---------- 模考页 ---------- */
.mock-wrap{max-width:760px;margin:0 auto}
.m-status{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin-bottom:14px;
}
.m-timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:76px}
.m-timer.warn{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.m-timer-bar{flex:1;height:7px;background:var(--line2);border-radius:5px;overflow:hidden}
.m-timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width 1s linear}
.m-timer-bar.warn i{background:var(--red)}
.m-step{font-size:12.5px;color:var(--muted);white-space:nowrap}
.m-card{padding:24px;min-height:280px;display:flex;flex-direction:column}
.m-q{font-size:17px;font-weight:700;line-height:1.7}
.m-timer-note{font-size:12.5px;color:var(--red);font-weight:600;margin-top:6px;display:none}
.m-timer-note.show{display:block}
.m-self{margin-top:18px;border-top:1px dashed var(--line);padding-top:15px}
.m-self .act-label{display:block;margin-bottom:9px;font-size:13px;font-weight:600;color:var(--text)}
.self-row{display:flex;gap:8px;flex-wrap:wrap}
.self-btn{
  flex:1;min-width:100px;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;font-weight:500;
  color:var(--muted);transition:all .13s;
}
.self-btn:hover{border-color:var(--purple);color:var(--purple-deep)}
.self-btn.on-smooth{background:var(--green);border-color:var(--green);color:#fff}
.self-btn.on-ok{background:#f59e0b;border-color:#f59e0b;color:#fff}
.self-btn.on-lost{background:var(--red);border-color:var(--red);color:#fff}

.report-card{padding:26px}
.report-card h2{font-size:19px;font-weight:800;margin-bottom:2px}
.report-card .sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.r-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.rg{background:var(--line2);border-radius:11px;padding:13px 8px;text-align:center}
.rg b{display:block;font-size:20px;font-weight:800}
.rg span{font-size:12px;color:var(--muted)}
.rg.g b{color:var(--green)} .rg.a b{color:#d97706} .rg.r b{color:var(--red)}
.r-sec{margin-bottom:16px}
.r-sec h4{font-size:14px;font-weight:700;margin-bottom:9px}
.r-bars{display:flex;flex-direction:column;gap:7px}
.rbar-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.rbar-row .nm{width:88px;color:var(--muted);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar-row .track{flex:1;height:9px;background:var(--line2);border-radius:5px;overflow:hidden}
.rbar-row .track i{display:block;height:100%;border-radius:5px}
.rbar-row .vl{width:44px;color:var(--faint);font-variant-numeric:tabular-nums}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px}
.weak-item .wq{font-weight:600;line-height:1.55}
.weak-item .wm{font-size:12px;color:var(--faint);margin-top:4px}

/* ---------- 面经页 ---------- */
.exp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.exp-card{padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.exp-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,26,46,.05),0 12px 28px -10px rgba(23,26,46,.16)}
.exp-card .eh{display:flex;align-items:center;gap:10px}
.exp-no{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--blue));flex-shrink:0;
}
.exp-card h3{font-size:14.5px;font-weight:700;line-height:1.4}
.exp-card .ep{font-size:12px;color:var(--muted);margin-top:2px}
.exp-card .ec{font-size:12.5px;color:var(--purple-deep);font-weight:600;margin-top:10px}
.exp-card .emini{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}

/* ==================== 本地进度存储（按账号隔离） ==================== */
let LS_KEY = "aipm_prep_v1";
function scopeKey(account){ return "aipm_prep_v1:" + (account || "guest"); }
function loadStore(key){
  try { const s = JSON.parse(localStorage.getItem(key)); return s && typeof s === "object" ? s : {}; }
  catch(e){ return {}; }
}
let store = loadStore(LS_KEY);
store.progress = store.progress || {};
store.settings = store.settings || {};
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){} }
function switchAccount(account){
  LS_KEY = scopeKey(account);
  store = loadStore(LS_KEY);
  store.progress = store.progress || {};
  store.settings = store.settings || {};
}

/* ==================== 登录与进度同步 ==================== */
const API_BASE = "https://ai-pm-interview-486.app.workbuddy.host".replace(/\/+$/, "");
const API_SHARECODE = "ML5MQW3TYD";   // WorkBuddy 托管网关的访问参数，非该环境时为空
function apiUrl(path){
  if (!API_SHARECODE) return API_BASE + path;
  return API_BASE + path + (path.includes("?") ? "&" : "?") + "sharecode=" + encodeURIComponent(API_SHARECODE);
}
const REMOTE_AUTH = /^https?:\/\//.test(API_BASE);      // 是否接入真实登录服务；否则为本地演示模式
const AUTH_KEY = "aipm_auth_v1";
const SYNC_DIRTY_KEY = "aipm_sync_dirty";

let AUTH = (() => {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if (a && a.account && a.expiresAt > Date.now()) return a;
  } catch(e){}
  return null;
})();

function saveAuth(a){ AUTH = a; try { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); } catch(e){} }
function clearAuth(){ AUTH = null; try { localStorage.removeItem(AUTH_KEY); } catch(e){} }

let syncTimer = null, syncing = false, lastSyncAt = 0;
let syncState = (() => { try { return localStorage.getItem(SYNC_DIRTY_KEY) === "1" ? "pending" : "idle"; } catch(e){ return "idle"; } })();

function renderSyncDot(){
  const d = document.getElementById("sync-dot");
  if (!d) return;
  const cls = syncState === "ok" ? "ok" : (syncState === "pending" || syncState === "syncing") ? "pending" : syncState === "error" ? "err" : "";
  d.className = "sync-dot " + cls;
  d.title = syncState === "ok"
    ? "已同步 · " + new Date(lastSyncAt || Date.now()).toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"})
    : syncState === "syncing" ? "正在同步…"
    : syncState === "error" ? "同步失败，稍后自动重试"
    : "进度会随练习自动同步";
}

function renderUserbox(){
  const box = document.getElementById("userbox");
  if (!box) return;
  if (!AUTH){ box.innerHTML = ""; return; }
  const nm = AUTH.name || AUTH.account;
  const initial = String(nm).slice(0, 1);
  box.innerHTML =
    '<span class="user-chip"><span class="av">' + esc(initial) + '</span>' +
      '<span class="nm"><b>' + esc(nm) + "</b>" + (AUTH.name ? " · " + esc(AUTH.account) : "") + "</span>" +
      '<span class="sync-dot" id="sync-dot"></span></span>' +
    '<button class="logout-btn" id="logout-btn">退出</button>';
  document.getElementById("logout-btn").addEventListener("click", () => {
    if (!confirm("退出登录？本机进度会保留，下次登录仍可继续。")) return;
    flushSync();
    clearAuth();
    document.body.classList.add("auth-mode");
    renderUserbox();
    renderLogin();
  });
  renderSyncDot();
}

function weakSummary(){
  const typeCnt = {}, tagCnt = {};
  for (const q of QS){
    const p = store.progress[q.id];
    if (!p || (p.s !== "vague" && p.s !== "unknown")) continue;
    if (q.type) typeCnt[q.type] = (typeCnt[q.type] || 0) + 1;
    for (const t of q.tags) tagCnt[t] = (tagCnt[t] || 0) + 1;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => k + " " + v).join("、");
  return { weakType: top(typeCnt), weakTag: top(tagCnt) };
}

function progressDetail(){
  const o = {};
  for (const id in store.progress){
    const p = store.progress[id];
    const s = p.s === "known" ? "k" : p.s === "vague" ? "v" : p.s === "unknown" ? "u" : "";
    if (!s && !p.fav) continue;
    o[id] = s ? (p.fav ? [s, 1] : s) : "f";
  }
  return JSON.stringify(o);
}

function scheduleSync(){
  if (!AUTH || !REMOTE_AUTH) return;
  syncState = "pending";
  try { localStorage.setItem(SYNC_DIRTY_KEY, "1"); } catch(e){}
  renderSyncDot();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushProgress(false), 5000);
}

async function pushProgress(keepalive){
  if (!AUTH || !REMOTE_AUTH || syncing) return;
  clearTimeout(syncTimer);
  syncing = true; syncState = "syncing"; renderSyncDot();
  const st = globalStats();
  const w = weakSummary();
  const stats = {
    seen: st.seen, known: st.known, vague: st.vague, unknown: st.unknown, fav: st.fav,
    total: st.total, rate: st.total ? Math.round(st.known / st.total * 1000) / 10 : 0,
    weakType: w.weakType, weakTag: w.weakTag,
  };
  try {
    const r = await fetch(apiUrl("/api/progress"), {
      method: "POST", keepalive: !!keepalive,
      headers: { "Content-Type": "application/json", "X-Session": AUTH.token },
      body: JSON.stringify({ stats, detail: progressDetail(), device: (navigator.userAgent || "").slice(0, 40) }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    syncState = "ok"; lastSyncAt = Date.now();
    try { localStorage.setItem(SYNC_DIRTY_KEY, "0"); } catch(e){}
  } catch(e){
    syncState = "error";
  } finally {
    syncing = false; renderSyncDot();
  }
}
function flushSync(){
  if (!AUTH || !REMOTE_AUTH) return;
  if (syncState === "pending" || syncState === "error") pushProgress(true);
}

function migrateLegacyStore(){
  try {
    const legacy = JSON.parse(localStorage.getItem("aipm_prep_v1") || "null");
    if (legacy && legacy.progress && Object.keys(legacy.progress).length && !Object.keys(store.progress).length){
      store.progress = legacy.progress;
      store.settings = store.settings || legacy.settings || {};
      saveStore();
    }
  } catch(e){}
}

async function restoreFromCloud(token){
  if (!REMOTE_AUTH || !token || token === "local") return;
  if (Object.keys(store.progress).length) return;      // 本机已有进度时以本机为准
  try {
    const r = await fetch(apiUrl("/api/progress"), { headers: { "X-Session": token } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j.found || !j.detail) return;
    const d = JSON.parse(j.detail);
    const map = { k: "known", v: "vague", u: "unknown" };
    for (const id in d){
      const v = d[id];
      if (Array.isArray(v)) store.progress[id] = { s: map[v[0]] || "", fav: v[1] ? 1 : 0, seen: 1, lastAt: Date.now() };
      else if (v === "f") store.progress[id] = { s: "", fav: 1, seen: 1, lastAt: Date.now() };
      else if (map[v]) store.progress[id] = { s: map[v], fav: 0, seen: 1, lastAt: Date.now() };
    }
    saveStore();
  } catch(e){}
}

function enterApp(){
  document.body.classList.remove("auth-mode");

  if (syncState === "pending" || syncState === "error") scheduleSync();
  location.hash = "#/home";
  renderNav();
  renderHome();
  window.scrollTo({ top: 0 });
}
function getProg(qid){ return store.progress[qid] || {s:"", fav:0, seen:0, lastAt:0}; }
function markSeen(qid){
  const p = getProg(qid);
  p.seen = (p.seen || 0) + 1; p.lastAt = Date.now();
  store.progress[qid] = p; saveStore();
  scheduleSync();
}
function setStatus(qid, s){
  const p = getProg(qid);
  p.s = s; p.lastAt = Date.now();
  if (!p.seen) p.seen = 1;
  store.progress[qid] = p; saveStore();
  scheduleSync();
}
function toggleFav(qid){
  const p = getProg(qid);
  p.fav = p.fav ? 0 : 1;
  store.progress[qid] = p; saveStore();
  scheduleSync();
  return !!p.fav;
}
function globalStats(){
  let seen = 0, known = 0, vague = 0, unknown = 0, fav = 0;
  for (const q of QS){
    const p = store.progress[q.id];
    if (!p) continue;
    if (p.seen) seen++;
    if (p.s === "known") known++;
    else if (p.s === "vague") vague++;
    else if (p.s === "unknown") unknown++;
    if (p.fav) fav++;
  }
  return {seen, known, vague, unknown, fav, total: QS.length};
}

/* ==================== 工具函数 ==================== */
const $app = document.getElementById("app");
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtAnswer(text){
  if (!text) return '<div class="ans-empty">本题暂无参考详解</div>';
  const lines = esc(text).split("\n");
  return lines.map(t => {
    let cls = "";
    if (/^\s*【[^】]*】/.test(t)) cls = "l-bracket";
    else if (/^\s*(第[一二三四五六七八九十]+[部分章节]|[一二三四五六七八九十]+、)/.test(t)) cls = "l-h";
    else if (/^\s*[·•]\s*/.test(t)) cls = "l-dot";
    else if (/^\s*\d+[.、)]\s*/.test(t)) cls = "l-num";
    return cls ? '<span class="' + cls + '">' + t + "</span>" : t;
  }).join("\n");
}
const LEVEL_CLS = {"初级":"lv-1", "中级":"lv-2", "高级":"lv-3"};
function levelBadge(l){ return l ? '<span class="badge ' + (LEVEL_CLS[l]||"") + '">' + esc(l) + "</span>" : ""; }
function typeBadge(t){ return t ? '<span class="badge b-type">' + esc(t) + "</span>" : ""; }
function srcBadge(q){
  const s = SRCMAP[q.src] || {};
  return '<span class="badge ' + (s.cls || "") + '">' + esc(q.srcName) + "</span>";
}
function groupBadge(q){
  const g = qGroup(q);
  return g ? '<span class="badge b-group">' + esc(g) + "</span>" : "";
}
function tagBadges(q){
  return q.tags.map(t => '<span class="badge b-tag">' + esc(t) + "</span>").join("");
}
function statusBadge(q){
  return q.status === "待补充答案" ? '<span class="badge b-pending">框架要点</span>' : "";
}
function progBadge(p){
  if (p.s === "known") return '<span class="badge pg-badge known">已掌握</span>';
  if (p.s === "vague") return '<span class="badge pg-badge vague">模糊</span>';
  if (p.s === "unknown") return '<span class="badge pg-badge unknown">重学</span>';
  return "";
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}
function fmtTime(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
}

  const cur = (location.hash || "#/home").replace("#/","").split("/")[0] || "home";

    '<a href="#/' + k + '" class="' + (cur === k ? "on" : "") + '">' + t + "</a>").join("");

function route(){
  if (!AUTH){ renderLogin(); return; }
  if (!DATA_READY){
    renderLoading();
    ensureBank().then(() => route()).catch(e => renderLoadError(e));
    return;
  }
  renderNav();
  // hash 形如 #/bank?src=pm：先剥离查询串再解析路径，否则 view 会带上 "?src=…" 而落到首页
  const raw = (location.hash || "#/home").slice(2);
  const h = raw.split("?")[0];
  const parts = h.split("/");
  const view = parts[0] || "home";
  let param = parts[1] || "";
  if (param) { try { param = decodeURIComponent(param); } catch(e){} }
  window.scrollTo({top:0});
  if (view === "terms") renderTerms();
  else if (view === "bank") renderBank();
  else if (view === "practice") renderPractice();
  else if (view === "mock") renderMock();
  else if (view === "exp") renderExp(param);
  else if (view === "course") renderCourse();
  else renderHome();
}
window.addEventListener("hashchange", route);

const bankState = {
  src: "all", level: "", type: "", tags: new Set(), exps: new Set(),
  chapter: "", round: "", part: "", topic: "", topicExpanded: false,
  q: "", sort: "no", shown: 24
};
function bankFilter(){
  return QS.filter(q => {
    if (bankState.src !== "all" && q.src !== bankState.src) return false;
    if (bankState.level && q.level !== bankState.level) return false;
    if (bankState.type && q.type !== bankState.type) return false;
    if (bankState.tags.size && !q.tags.some(t => bankState.tags.has(t))) return false;
    if (bankState.exps.size && (!q.expNo || !bankState.exps.has(q.expNo))) return false;
    if (bankState.chapter && q.chapter !== bankState.chapter) return false;
    if (bankState.round && q.round !== bankState.round) return false;
    if (bankState.part && q.part !== bankState.part) return false;
    if (bankState.topic && q.topic !== bankState.topic) return false;
    if (bankState.q){
      const kw = bankState.q.toLowerCase();
      const hay = (q.q + q.a + q.tags.join(" ") + q.type + q.level + (q.expTitle||"") + (q.expNo||"") + qGroup(q)).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}
function bankSort(list){
  const lv = {"初级":0,"中级":1,"高级":2};
  const arr = list.slice();
  if (bankState.sort === "levelAsc") arr.sort((a,b) => (lv[a.level]||0) - (lv[b.level]||0) || a.no - b.no);
  else if (bankState.sort === "levelDesc") arr.sort((a,b) => (lv[b.level]||0) - (lv[a.level]||0) || a.no - b.no);
  else if (bankState.sort === "rand") arr.sort(() => Math.random() - 0.5);
  else arr.sort((a,b) => a.no - b.no);
  return arr;
}
function renderBank(){
  // 支持 #/bank?src=pm&chapter=xxx 等入口参数（应用一次后清理 hash，避免覆盖用户后续切换的库）
  const param = (location.hash.split("?")[1] || "");
  const qp = new URLSearchParams(param);
  const urlSrc = qp.get("src");
  if (urlSrc && (urlSrc === "all" || SRCMAP[urlSrc]) && bankState.src !== urlSrc){
    bankState.src = urlSrc;
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.exps.clear();
    bankState.shown = 24;
  }
  ["chapter","round","part","topic"].forEach(k => {
    const v = qp.get(k);
    if (v) bankState[k] = v;
  });
  if (urlSrc || qp.get("chapter") || qp.get("round") || qp.get("part") || qp.get("topic")){
    history.replaceState(null, "", location.pathname + location.search + "#/bank");
  }
  const list = bankSort(bankFilter());
  const bs = DB.stats.bySrc;
  const F = DB.facets;

  const srcTabs = [["all","全部",DB.stats.total]].concat(SRCS.map(s => [s.k, s.short || s.name, s.count]));

  // 分册维度筛选：仅当前数据源有对应字段时出现（大厂八股→章节 / 鹅厂→轮次 / LLM→分部 / 专题→专题）
  const GROUP_FACET = {pm:["章节","chapter","chapters"], tx:["轮次","round","rounds"],
                       llm:["分部","part","parts"], topic:["专题","topic","topics"]};
  const gf = GROUP_FACET[bankState.src];
  let groupRow = "";
  if (gf){
    const all = F[gf[2]];
    const isTopic = gf[1] === "topic";
    const LIMIT = 12;
    const list = isTopic && !bankState.topicExpanded && all.length > LIMIT ? all.slice(0, LIMIT) : all;
    const chips = list.map(v =>
      '<button class="chip ' + (bankState[gf[1]] === v ? "on" : "") + '" data-group="' + gf[1] + '" data-val="' + esc(v) + '">' +
        esc(v) + (isTopic ? '<span class="cn">' + (F.counts.topics[v] || 0) + "</span>" : "") + "</button>").join("");
    const more = isTopic && all.length > LIMIT
      ? '<button class="chip more" data-group-more="1">' + (bankState.topicExpanded ? "收起 ⌃" : "更多 " + (all.length - LIMIT) + " 个 ⌄") + "</button>"
      : "";
    groupRow = fRow(gf[0], chips + more);
  }
  const showExpRow = bankState.src === "all" || bankState.src === "exp";

  $app.innerHTML =
    '<div class="card toolbar">' +
      '<div class="tabs">' +
        srcTabs.map(([k,t,n]) =>
          '<button class="tab ' + (bankState.src === k ? "on" : "") + '" data-src="' + k + '">' + t + '<span class="n">' + n + "</span></button>").join("") +
      "</div>" +
      '<div class="toolbar-row">' +
        '<div class="search-box"><span class="ic">⌕</span><input id="bank-search" placeholder="搜索题目 / 答案关键词 / 标签…" value="' + esc(bankState.q) + '"></div>' +
        '<select class="sel" id="bank-sort">' +
          '<option value="no"' + (bankState.sort==="no"?" selected":"") + ">按序号</option>" +
          '<option value="levelAsc"' + (bankState.sort==="levelAsc"?" selected":"") + ">难度：初级→高级</option>" +
          '<option value="levelDesc"' + (bankState.sort==="levelDesc"?" selected":"") + ">难度：高级→初级</option>" +
          '<option value="rand"' + (bankState.sort==="rand"?" selected":"") + ">随机排序</option>" +
        "</select>" +
        '<button class="btn btn-ghost btn-sm" id="filter-toggle">筛选' +
          (chipActive() ? " ●" : "") + "</button>" +
        (hasActiveFilter() ? '<button class="btn btn-ghost btn-sm" id="filter-reset">重置</button>' : "") +
      "</div>" +
    "</div>" +

    '<div class="card filters" id="filter-panel">' +
      fRow("难度", F.levels.map(l =>
        '<button class="chip ' + (bankState.level === l ? "on" : "") + '" data-level="' + esc(l) + '">' + l + "</button>").join("")) +
      fRow("题型", F.types.map(t =>
        '<button class="chip ' + (bankState.type === t ? "on" : "") + '" data-type="' + esc(t) + '">' + t + "</button>").join("")) +
      fRow("标签", F.tags.map(t =>
        '<button class="chip ' + (bankState.tags.has(t) ? "on" : "") + '" data-tag="' + esc(t) + '">' + t + "</button>").join("")) +
      groupRow +
      (showExpRow ? fRow("面经", Object.keys(F.expMeta).map(no =>
        F.expMeta[no].count ? '<button class="chip ' + (bankState.exps.has(no) ? "on" : "") + '" data-exp="' + no + '">' + no + " · " + F.expMeta[no].count + " 题</button>" : "").join("")) : "") +
    "</div>" +

    '<div class="result-bar"><span>共 <b>' + list.length + "</b> 题" +
      (list.length > bankState.shown ? "（已显示 " + bankState.shown + "）" : "") + "</span>" +
      '<span>点击题目展开参考详解 · ☆ 收藏 · 右下角标记掌握情况</span></div>' +

    '<div class="qlist" id="qlist">' +
      (list.length === 0
        ? '<div class="card empty"><div class="ei">🔍</div><p>没有符合条件的题目，试试放宽筛选条件</p></div>'
        : list.slice(0, bankState.shown).map(q => qCard(q)).join("")) +
    "</div>" +

    (list.length > bankState.shown
      ? '<button class="btn btn-ghost load-more" id="load-more">加载更多（还有 ' + (list.length - bankState.shown) + " 题）</button>"
      : "");

  bindBank();
}
function hasActiveFilter(){
  return !!(bankState.level || bankState.type || bankState.tags.size || bankState.exps.size ||
            bankState.chapter || bankState.round || bankState.part || bankState.topic || bankState.q);
}
function chipActive(){
  return !!(bankState.level || bankState.type || bankState.tags.size || bankState.exps.size ||
            bankState.chapter || bankState.round || bankState.part || bankState.topic);
}
function fRow(label, chips){
  return '<div class="f-row"><span class="f-label">' + label + '</span><div class="f-chips">' + chips + "</div></div>";
}
function qCard(q){
  const p = getProg(q.id);
  return '<div class="qcard" data-qid="' + q.id + '">' +
    '<div class="qcard-head">' +
      '<span class="qno">#' + q.no + "</span>" +
      '<div class="qmain">' +
        '<div class="qtitle">' + esc(q.q) + "</div>" +
        '<div class="qmeta">' + srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
          (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
          groupBadge(q) + statusBadge(q) + tagBadges(q) + progBadge(p) + "</div>" +
      "</div>" +
      '<button class="fav-btn ' + (p.fav ? "on" : "") + '" data-fav title="收藏">' + (p.fav ? "★" : "☆") + "</button>" +
      '<span class="chev">▾</span>' +
    "</div>" +
    '<div class="qcard-body" hidden>' +
      '<div class="ans">' + fmtAnswer(q.a) + "</div>" +
      '<div class="qcard-actions">' +
        '<span class="act-label">掌握情况</span>' +
        '<button class="rbtn ' + (p.s==="known"?"on-k":"") + '" data-rate="known">✓ 掌握了</button>' +
        '<button class="rbtn ' + (p.s==="vague"?"on-v":"") + '" data-rate="vague">～ 模糊</button>' +
        '<button class="rbtn ' + (p.s==="unknown"?"on-u":"") + '" data-rate="unknown">✗ 重学</button>' +
        '<span class="q-src-line">' + esc(q.origin) + "</span>" +
      "</div>" +
    "</div>" +
  "</div>";
}
function bindBank(){
  const panel = document.getElementById("filter-panel");
  if (chipActive()) panel.classList.add("show");
  document.getElementById("filter-toggle").addEventListener("click", () => panel.classList.toggle("show"));
  const resetBtn = document.getElementById("filter-reset");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    bankState.level = ""; bankState.type = ""; bankState.tags.clear(); bankState.exps.clear();
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.q = ""; bankState.shown = 24; renderBank();
  });
  document.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => {
    bankState.src = b.dataset.src;
    // 分册维度与面经筛选只对各自数据源有效，切换来源时一并清理
    bankState.chapter = ""; bankState.round = ""; bankState.part = ""; bankState.topic = "";
    bankState.topicExpanded = false;
    bankState.exps.clear();
    bankState.shown = 24; renderBank();
  }));
  const search = document.getElementById("bank-search");
  let deb = null;
  search.addEventListener("input", () => {
    clearTimeout(deb);
    deb = setTimeout(() => { bankState.q = search.value.trim(); bankState.shown = 24; renderBank(); }, 160);
  });
  document.getElementById("bank-sort").addEventListener("change", e => {
    bankState.sort = e.target.value; renderBank();
  });
  document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => {
    bankState.level = bankState.level === b.dataset.level ? "" : b.dataset.level;
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
    bankState.type = bankState.type === b.dataset.type ? "" : b.dataset.type;
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.tag;
    bankState.tags.has(t) ? bankState.tags.delete(t) : bankState.tags.add(t);
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-exp]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.exp;
    bankState.exps.has(t) ? bankState.exps.delete(t) : bankState.exps.add(t);
    bankState.shown = 24; renderBank();
  }));
  document.querySelectorAll("[data-group-more]").forEach(b => b.addEventListener("click", () => {
    bankState.topicExpanded = !bankState.topicExpanded;
    renderBank();
  }));
  document.querySelectorAll("[data-group]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.group, val = b.dataset.val;
    bankState[key] = bankState[key] === val ? "" : val;
    bankState.shown = 24; renderBank();
  }));
  const lm = document.getElementById("load-more");
  if (lm) lm.addEventListener("click", () => { bankState.shown += 24; renderBank(); });

  // 题卡交互（事件委托）
  document.getElementById("qlist").addEventListener("click", e => {
    const card = e.target.closest(".qcard");
    if (!card) return;
    const qid = card.dataset.qid;
    const q = QMAP[qid];
    if (e.target.closest("[data-fav]")){
      const on = toggleFav(qid);
      e.target.closest("[data-fav]").classList.toggle("on", on);
      e.target.closest("[data-fav]").textContent = on ? "★" : "☆";
      toast(on ? "已收藏" : "已取消收藏");
      return;
    }
    if (e.target.closest("[data-rate]")){
      const s = e.target.closest("[data-rate]").dataset.rate;
      setStatus(qid, s);
      markSeen(qid);
      card.querySelector(".qmeta").innerHTML =
        srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
        (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
        statusBadge(q) + tagBadges(q) + progBadge(getProg(qid));
      card.querySelectorAll("[data-rate]").forEach(b => {
        b.classList.remove("on-k","on-v","on-u");
        const m = {known:"on-k", vague:"on-v", unknown:"on-u"};
        if (b.dataset.rate === s) b.classList.add(m[s]);
      });
      toast(s === "known" ? "标记为已掌握" : s === "vague" ? "标记为模糊，需巩固" : "标记为待重学");
      return;
    }
    if (e.target.closest(".qcard-head")){
      const body = card.querySelector(".qcard-body");
      const open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      card.classList.toggle("open", open);
      if (open) markSeen(qid);
    }
  });
}

/* ==================== 视图：练习 ==================== */
const practice = { pool: [], idx: 0, revealed: false, started: false, onlyWeak: false, log: [] };
function buildPool(opts){
  let list = QS.slice();
  if (opts.src && opts.src !== "all") list = list.filter(q => q.src === opts.src);
  if (opts.onlyWeak) list = list.filter(q => { const s = getProg(q.id).s; return s === "vague" || s === "unknown" || !s; });
  if (opts.favOnly) list = list.filter(q => getProg(q.id).fav);
  if (opts.exp) list = list.filter(q => q.expNo === opts.exp);
  if (opts.chapter) list = list.filter(q => q.chapter === opts.chapter);
  if (opts.round) list = list.filter(q => q.round === opts.round);
  if (opts.part) list = list.filter(q => q.part === opts.part);
  if (opts.topic) list = list.filter(q => q.topic === opts.topic);
  if (opts.shuffle) list.sort(() => Math.random() - 0.5); else list.sort((a,b) => a.no - b.no);
  if (opts.limit && opts.limit > 0) list = list.slice(0, opts.limit);
  return list;
}
function renderPractice(){
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  if (params.get("mode") === "weak" && !practice.started){
    practice.pool = buildPool({onlyWeak:true, shuffle:false});
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    if (practice.pool.length === 0){ practice.started = false; }
    history.replaceState(null, "", location.pathname + location.search + "#/practice");
  }
  if (params.get("resume") === "1" && !practice.started && store.settings.lastPool){
    const lp = store.settings.lastPool;
    practice.pool = buildPool(lp);
    practice.idx = Math.min(lp.idx || 0, practice.pool.length - 1);
    practice.revealed = false; practice.started = true; practice.log = [];
    history.replaceState(null, "", location.pathname + location.search + "#/practice");
  }
  if (params.get("exp") && !practice.started){
    practice.pool = buildPool({exp: params.get("exp")});
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    history.replaceState(null, "", location.pathname + location.search + "#/practice");

  // 支持从题库 / 面经页带着「数据源 + 分册维度」直接开练，如 #/practice?src=tx&round=一面

    const opts = {src: params.get("src") || "all"};

    practice.pool = buildPool(opts);
    practice.idx = 0; practice.revealed = false; practice.started = true; practice.log = [];
    history.replaceState(null, "", location.pathname + location.search + "#/practice");

  if (!practice.started || practice.pool.length === 0){

        "</div></div>" +

          '<button class="opt" data-mode="fav">只看收藏<span class="n">' + st.fav + "</span></button>" +
        "</div></div>" +

  }

  $app.innerHTML =

        (practice.revealed
          ? '<div class="p-ans"><div class="ans">' + fmtAnswer(q.a) + "</div></div>"
          : '<button class="btn btn-primary reveal-btn" id="p-reveal">显示参考详解（空格）</button>') +
        '<div class="p-hint">' + (practice.revealed
          ? "自评后自动进入下一题 · <span class=\"kbd\">1</span> 掌握 <span class=\"kbd\">2</span> 模糊 <span class=\"kbd\">3</span> 重学"
          : "先口头作答，再按空格看答案") + "</div>" +

  document.getElementById("p-quit").addEventListener("click", endPractice);

function revealPractice(){
  practice.revealed = true;

function practiceNext(rating){

  practice.idx++;
  practice.revealed = false;
  renderPractice();

function endPractice(){
  const done = practice.log.filter(l => l.rating && l.rating !== "skip");

function startMockTimer(reset){

function renderMockReport(){
  const log = mock.log;
  const n = log.length;
  const totalSpent = log.reduce((s,l) => s + l.spent, 0);
  const avg = n ? Math.round(totalSpent / n) : 0;
  const smooth = log.filter(l => l.rating === "smooth").length;
  const ok = log.filter(l => l.rating === "ok").length;
  const lost = log.filter(l => l.rating === "lost").length;

  // 薄弱点：没思路 + 超时 的题，按题型 / 标签聚合
  const weakQs = log.filter(l => l.rating === "lost" || l.timedOut).map(l => QMAP[l.qid]);
  const byType = {}, byTag = {};
  weakQs.forEach(q => {
    if (q.type) byType[q.type] = (byType[q.type]||0) + 1;
    q.tags.forEach(t => byTag[t] = (byTag[t]||0) + 1);
  });
  const topType = Object.entries(byType).sort((a,b) => b[1]-a[1]).slice(0,5);
  const topTag = Object.entries(byTag).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxBar = Math.max(1, ...topType.map(x => x[1]), ...topTag.map(x => x[1]));

  function bars(entries, color){
    if (!entries.length) return '<div style="font-size:12.5px;color:var(--faint)">无明显薄弱点，保持住 👍</div>';
    return '<div class="r-bars">' + entries.map(([k,v]) =>
      '<div class="rbar-row"><span class="nm">' + esc(k) + '</span>' +
      '<div class="track"><i style="width:' + (v/maxBar*100) + "%;background:" + color + '"></i></div>' +
      '<span class="vl">' + v + " 题</span></div>").join("") + "</div>";
  }

  $app.innerHTML =
    '<div class="mock-wrap"><div class="card report-card">' +
      "<h2>面试复盘报告</h2>" +
      '<div class="sub">本场共 ' + n + " 题 · 总用时 " + fmtTime(totalSpent) + " · 平均每题 " + avg + " 秒</div>" +
      '<div class="r-grid">' +
        '<div class="rg g"><b>' + smooth + "</b><span>流畅作答</span></div>" +
        '<div class="rg a"><b>' + ok + "</b><span>基本答出</span></div>" +
        '<div class="rg r"><b>' + lost + "</b><span>没思路</span></div>" +
        '<div class="rg"><b>' + log.filter(l => l.timedOut).length + "</b><span>超时</span></div>" +
      "</div>" +
      '<div class="r-sec"><h4>薄弱题型</h4>' + bars(topType, "linear-gradient(90deg,#f59e0b,#ef4444)") + "</div>" +
      '<div class="r-sec"><h4>薄弱知识点</h4>' + bars(topTag, "linear-gradient(90deg,#8b5cf6,#ec4899)") + "</div>" +
      (weakQs.length ?
        '<div class="r-sec"><h4>待强化题目（' + weakQs.length + "）</h4>" +
          '<div class="weak-list">' + weakQs.map(q =>
            '<div class="weak-item"><div class="wq">#' + q.no + " " + esc(q.q) + "</div>" +
            '<div class="wm">' + esc(q.srcName) + " · " + esc(q.level) + " · " + esc(q.type) +
            (q.expNo ? " · " + esc(q.expNo) : "") + " · " + esc(q.tags.join(" / ")) + "</div></div>").join("") +
        "</div>" : "") +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">' +
        '<button class="btn btn-primary" id="r-again">再模拟一场</button>' +
        '<a class="btn btn-ghost" href="#/practice">去刷题巩固</a>' +
        '<a class="btn btn-ghost" href="#/bank">回题库</a>' +
      "</div>" +
    "</div></div>";

  document.getElementById("r-again").addEventListener("click", () => {
    mock.pool = []; mock.finished = false; mock.log = []; mock.idx = 0;
    renderMock();
  });
}

/* ==================== 视图：面经 ==================== */
function renderExp(param){
  const F = DB.facets;
  const groups = Object.keys(F.expMeta).filter(k => F.expMeta[k].count > 0);

  if (!param || !F.expMeta[param]){
    $app.innerHTML =
      '<div class="sec-title">面经实战 · ' + DB.stats.expGroups + ' 套真实面试记录 <small>按候选人背景对号入座</small></div>' +
      '<div class="exp-grid">' +
        groups.map(no => {
          const g = F.expMeta[no];
          const qs = QS.filter(q => q.expNo === no);
          const types = {};
          qs.forEach(q => { if (q.type) types[q.type] = (types[q.type]||0)+1; });
          const lv = {"初级":0,"中级":1,"高级":2};
          const topTypes = Object.entries(types).sort((a,b) => b[1]-a[1]).slice(0,3);
          const maxLv = qs.reduce((m,q) => Math.max(m, lv[q.level]||0), 0);
          const lvName = ["初级","中级","高级"][maxLv] || "中级";
          return '<div class="card exp-card" data-exp-card="' + no + '">' +
            '<div class="eh"><span class="exp-no">' + no.replace("面经","") + "</span>" +
              "<div><h3>" + esc(g.title) + "</h3>" +
              '<div class="ep">' + esc(g.persona) + "</div></div></div>" +
            '<div class="ec">' + g.count + " 道面试问答 · 难度覆盖至" + lvName + "</div>" +
            '<div class="emini">' + topTypes.map(([t,c]) => '<span class="badge b-type">' + esc(t) + " " + c + "</span>").join("") + "</div>" +
          "</div>";
        }).join("") +
      "</div>" +
      '<div class="sec-title">鹅厂 AI PM 三轮面经 <small>同一场面试，一面到三面如何层层加码</small></div>' +
      '<div class="grid-3">' +
        F.rounds.filter(r => (F.counts.rounds[r] || 0) > 0).map((r, i) => {
          const qs = QS.filter(q => q.round === r);
          const types = {};
          qs.forEach(q => { if (q.type) types[q.type] = (types[q.type]||0)+1; });
          const topTypes = Object.entries(types).sort((a,b) => b[1]-a[1]).slice(0,3);
          return '<div class="card exp-card" data-round-card="' + esc(r) + '">' +
            '<div class="eh"><span class="exp-no">' + (i + 1) + "</span>" +
              "<div><h3>第 " + esc(r) + "</h3>" +
              '<div class="ep">腾讯 AI 产品经理 · ' + qs.length + " 题</div></div></div>" +
            '<div class="ec">' + (i === 0 ? "基础筛选：背景、动机、产品基本功" : i === 1 ? "专业深挖：项目细节与方案设计" : "终面把关：业务判断与岗位匹配") + "</div>" +
            '<div class="emini">' + topTypes.map(([t,c]) => '<span class="badge b-type">' + esc(t) + " " + c + "</span>").join("") + "</div>" +
            '<div class="exp-acts">' +
              '<a class="mini-btn" href="#/bank?src=tx&round=' + encodeURIComponent(r) + '">浏览题目</a>' +
              '<a class="mini-btn pri" href="#/practice?src=tx&round=' + encodeURIComponent(r) + '">▶ 练这一轮</a>' +
            "</div>" +
          "</div>";
        }).join("") +
      "</div>" +
      '<div class="card note-card" style="margin-top:14px">' +
        "<b>使用方法：</b>先找到与自己背景最接近的一套面经通读全文，理解面试官的提问逻辑与高分答法；再用「练习这套」做输出训练；最后用「模考这套」做限时自测。各套面经的提问点重合度很高，吃透 2–3 套即可覆盖绝大多数真实面试场景。鹅厂三轮建议按一面 → 二面 → 三面顺序连刷，体会同一份简历被逐轮撬深的节奏。" +
      "</div>";
    $app.querySelectorAll("[data-exp-card]").forEach(el =>
      el.addEventListener("click", () => { location.hash = "#/exp/" + encodeURIComponent(el.dataset.expCard); }));
    $app.querySelectorAll("[data-round-card]").forEach(el =>
      el.addEventListener("click", e => {
        if (e.target.closest("a")) return;   // 让「浏览 / 练习」按钮走自己的链接
        location.hash = "#/bank?src=tx&round=" + encodeURIComponent(el.dataset.roundCard);
      }));
    return;
  }

  const no = param;
  const g = F.expMeta[no];
  const qs = QS.filter(q => q.expNo === no).sort((a,b) => a.no - b.no);

  $app.innerHTML =
    '<div class="card exp-detail-head">' +
      '<a class="back" href="#/exp">← 返回全部面经</a>' +
      "<h2>" + esc(no) + "：" + esc(g.title) + "</h2>" +
      '<div class="ep2">候选人画像：' + esc(g.persona) + " · 共 " + qs.length + " 题</div>" +
      '<div class="exp-advice">💡 讲师提示：' + esc(g.advice) + "</div>" +
      '<div class="exp-detail-actions">' +
        '<a class="btn btn-primary" href="#/practice?exp=' + encodeURIComponent(no) + '">▶ 练习这套（' + qs.length + " 题）</a>" +
        '<button class="btn btn-ghost" id="exp-mock">⏱ 用这套题模考</button>' +
      "</div>" +
    "</div>" +
    '<div class="qlist">' + qs.map(q => qCard(q)).join("") + "</div>";

  document.getElementById("exp-mock").addEventListener("click", () => {
    mock.pool = QS.filter(q => q.expNo === no).sort(() => Math.random() - 0.5).slice(0, 10);
    if (mock.pool.length === 0){ toast("该套题为空"); return; }
    mock.per = 90; mock.idx = 0; mock.revealed = false; mock.rated = null; mock.timedOut = false;
    mock.log = []; mock.finished = false; mock.t0 = Date.now(); mock.tq = Date.now();
    startMockTimer();
    location.hash = "#/mock";
  });

  // 题卡交互
  document.querySelector(".qlist").addEventListener("click", e => {
    const card = e.target.closest(".qcard");
    if (!card) return;
    const qid = card.dataset.qid;
    const q = QMAP[qid];
    if (e.target.closest("[data-fav]")){
      const on = toggleFav(qid);
      e.target.closest("[data-fav]").classList.toggle("on", on);
      e.target.closest("[data-fav]").textContent = on ? "★" : "☆";
      return;
    }
    if (e.target.closest("[data-rate]")){
      const s = e.target.closest("[data-rate]").dataset.rate;
      setStatus(qid, s); markSeen(qid);
      card.querySelector(".qmeta").innerHTML =
        srcBadge(q) + levelBadge(q.level) + typeBadge(q.type) +
        (q.expNo ? '<span class="badge b-expno">' + esc(q.expNo) + "</span>" : "") +
        statusBadge(q) + tagBadges(q) + progBadge(getProg(qid));
      card.querySelectorAll("[data-rate]").forEach(b => {
        b.classList.remove("on-k","on-v","on-u");
        const m = {known:"on-k", vague:"on-v", unknown:"on-u"};
        if (b.dataset.rate === s) b.classList.add(m[s]);
      });
      return;
    }
    if (e.target.closest(".qcard-head")){
      const body = card.querySelector(".qcard-body");
      const open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      card.classList.toggle("open", open);
      if (open) markSeen(qid);
    }
  });
}

      '<div class="align-row"><span class="k">📓 LLM 八股文</span><span>基础面 → 进阶面 → 微调面三部曲，对应 W2 训练与微调原理、W3 Agent/RAG 的技术追问。</span></div>' +

      '<div class="align-row"><span class="k">⏱ 模拟面试</span><span>建议在 W7 完成简历与作品集后启动，每周至少 1 场，重点复盘「没思路」与「超时」的题。</span></div>' +
    "</div>";
}

/* ==================== 键盘快捷键（练习视图） ==================== */
document.addEventListener("keydown", e => {
  const view = (location.hash || "#/home").replace("#/","").split("/")[0];
  if (view !== "practice" || !practice.started) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    if (!practice.revealed) revealPractice();
    else practiceNext(null);
  } else if (e.key === "1" && practice.revealed) practiceNext("known");
  else if (e.key === "2" && practice.revealed) practiceNext("vague");
  else if (e.key === "3" && practice.revealed) practiceNext("unknown");
});

/* ==================== 启动 ==================== */
switchAccount(AUTH ? AUTH.account : null);
document.getElementById("ft-date").textContent = DB.generatedAt;
if (!AUTH){
  document.body.classList.add("auth-mode");
  renderLogin();
  ensureBank().catch(() => {});      // 边登录边下题库
} else {
  renderUserbox();
  if (syncState === "pending" || syncState === "error") scheduleSync();
  if (!location.hash) location.hash = "#/home";
  route();
}
window.addEventListener("pagehide", flushSync);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSync();
});
</script>
